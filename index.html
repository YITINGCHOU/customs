<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的關務備考基地</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
            background-color: #f4f6f9;
            color: #1a1f2c;
            padding: 48px 20px 64px;
        }
        .wrap { max-width: 720px; margin: 0 auto; }
        h1 { text-align: center; color: #333; margin: 0 0 6px; }
        .lead { text-align: center; color: #5a6275; font-size: 14px; margin: 0 0 36px; }

        .level {
            background: #fff;
            border: 1px solid #dfe3ea;
            border-radius: 12px;
            padding: 20px 22px 22px;
            margin-bottom: 22px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .level h2 { margin: 0 0 4px; font-size: 20px; }
        .level .desc { margin: 0 0 16px; color: #5a6275; font-size: 13.5px; line-height: 1.6; }

        .btn-row { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
        .btn {
            display: block;
            padding: 14px 18px;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .btn:hover { transform: translateY(-3px); }
        .btn b { display: block; font-size: 17px; }
        .btn small { display: block; margin-top: 3px; font-size: 12.5px; opacity: .9; }

        /* 刷題系統按鈕顏色（藍色） */
        .btn-quiz { background-color: #007bff; }
        /* 詳解按鈕顏色（綠色） */
        .btn-solution { background-color: #28a745; }

        /* 三等：各科目的專屬色（與各科詳解頁內的科目標籤同色） */
        .btn-net { background-color: #b5651d; }
        .btn-mis { background-color: #4a5859; }
        .btn-ds  { background-color: #6a4c93; }
        .btn-db  { background-color: #1f5673; }
        .btn-soon.btn-net { border-left: 6px solid #b5651d; }
        .btn-soon.btn-mis { border-left: 6px solid #4a5859; }

        /* 尚未上線 */
        .btn-soon {
            background: #e6e9ef; color: #7b8498; box-shadow: none;
            cursor: default; pointer-events: none;
        }
        .tag-soon {
            display: inline-block; margin-left: 8px; padding: 1px 8px;
            font-size: 12px; font-weight: 500; border-radius: 999px;
            background: #fff3cd; color: #8a6d1d; vertical-align: middle;
        }
    </style>
</head>
<body>
<div class="wrap">

    <h1>📚 關務特考 準備中心</h1>
    <p class="lead">公務人員特種考試關務人員考試 ‧ 資訊處理</p>

    <section class="level">
        <h2>四等考試</h2>
        <p class="desc">計算機概要為選擇題，可刷題並記錄錯題；程式設計概要為申論題，提供逐題詳解與完整程式碼。</p>
        <div class="btn-row">
            <!-- 這裡的 href 必須和你的英文檔名一模一樣 -->
            <a href="quiz-system.html" class="btn btn-quiz">
                <b>🎯 計算機概要</b>
                <small>選擇題刷題系統</small>
            </a>
            <a href="solutions.html" class="btn btn-solution">
                <b>📝 程式設計概要</b>
                <small>申論題整合詳解</small>
            </a>
        </div>
    </section>

    <section class="level">
        <h2>三等考試</h2>
        <p class="desc">題型為計算題與申論題，提供逐題詳解。四個科目各自獨立一個頁面。</p>
        <div class="btn-row">
            <!-- 其他三科上線後：把 href 改成對應檔名，並移除 btn-soon 與 small 內的「整理中」 -->
            <a href="solutions-3-net.html" class="btn btn-net">
                <b>📝 資通網路</b>
                <small>97～115 年 ‧ 92 題詳解</small>
            </a>
            <a href="solutions-3-mis.html" class="btn btn-mis">
                <b>📝 資訊管理</b>
                <small>97～114 年 ‧ 71 題詳解</small>
            </a>
            <a href="solutions-3-ds.html" class="btn btn-ds">
                <b>📝 資料結構</b>
                <small>97～115 年 ‧ 86 題詳解</small>
            </a>
            <a href="solutions-3.html" class="btn btn-db">
                <b>📝 資料庫應用</b>
                <small>97～115 年 ‧ 81 題詳解</small>
            </a>
        </div>
    </section>

</div>
</body>
</html>
