      question: `3Com 創辦人，也是乙太網路（Ethernet）協定的設計者羅伯‧梅特卡夫提出數位經濟的「邊際報酬遞增法則」，一般稱為梅特卡夫定律（Metcalfe's Law）。請說明該定律的主要效應為何？其效應主要來自網路外部，請說明何謂網路外部性？何謂正反饋循環？（25 分）`,
      answer: `**(一) 梅特卡夫定律（Metcalfe's Law）及其主要效應**

**內容**：**一個網路的價值（效用）與「使用者數目 n 的平方」成正比，V ∝ n²**。因為 **n 個使用者之間可能的連線數為 n(n−1)/2 ≈ n²/2**，每增加一位使用者，新增的連線機會（價值）超過線性成長。

**主要效應**

| 效應 | 說明 |
|---|---|
| **1. 報酬遞增（邊際報酬遞增）** | **使用者愈多，每增加一位使用者所帶來的「額外價值」愈大**（與傳統經濟的**邊際報酬遞減**相反）；**網路價值呈「超線性（平方）」成長** |
| **2. 規模本身就是價值** | **企業要優先擴大使用者規模**，因為**規模決定價值** |
| **3. 臨界質量與爆發成長** | **使用者數超過「臨界質量」後，網路價值自我加速成長（S 型曲線）**；未達臨界質量前成長緩慢 |
| **4. 贏者通吃** | **大者恆大**，**傾向形成獨占或寡占**（如 Facebook、LINE、作業系統） |
| **5. 先佔優勢與鎖定** | **先進者優勢，轉換成本高** |
| **6. 影響策略** | **免費與補貼搶使用者**、重視**標準與相容性**、**平台與生態系**、**早期忍受虧損** |

**(二) 網路外部性（Network Externality）**

**某項產品或服務的價值（對每位使用者的效用），隨「同一網路中的其他使用者人數」增加而提高**；**每多一位使用者，「原有使用者」也受益**（**外溢到使用者以外的人的效果**，所以叫「外部性」）。

| 類型 | 說明 | 例子 |
|---|---|---|
| **直接網路外部性** | **使用者之間直接互動，人愈多愈有價值** | 電話、傳真機、LINE、Facebook |
| **間接網路外部性** | **使用者增加使互補品增加，間接提升價值** | 作業系統與應用程式、電商平台的買家與賣家、遊戲主機與遊戲 |
| **正（負）外部性** | 通常為正；若**壅塞與品質下降**則為**負外部性** | 網路壅塞、垃圾訊息 |

**與一般財貨的不同**：**一般財貨的效用只取決於自己的使用；網路財的效用還取決於「別人也使用」**。

**(三) 正反饋循環（Positive Feedback Loop）**

**使用者增加 → 網路價值提高 → 吸引更多使用者加入 → 使用者再增加 → 網路價值更高……**，**一個結果強化其原因，形成自我強化、加速成長的循環**；**反之也可能形成負向螺旋（使用者流失 → 價值下降 → 更多人離開）**。

\`\`\`
      使用者增加 ──→ 網路價值提高
         ↑                │
         └── 吸引更多人加入 ←┘        （正反饋，自我強化）
\`\`\`

| 項目 | 說明 |
|---|---|
| **特性** | **指數式的成長**，**一旦啟動難以阻止**（臨界質量之後） |
| **結果** | **市場傾向由一家勝出**（贏者通吃）、**標準之爭**、**形成進入障礙** |
| **例子** | LINE 的使用者愈多，朋友愈要用 LINE；**微軟 Windows**：使用者多 → 開發商寫更多軟體 → 更多人使用 |
| **管理意涵** | **早期搶佔臨界質量**（免費、補貼、邀請好友）、**降低用戶加入門檻**、**避免負向螺旋**（維持品質與信任） |

**(四) 三者的關係**：**網路外部性是現象與原因，梅特卡夫定律是量化的描述，正反饋循環是動態機制**。`

      answer: `**(一) 商業模式（Business Model）（約 7 分）**

**企業「如何創造價值、傳遞價值，並從中獲取利潤」的邏輯與方法**；描述**企業的目標顧客是誰、提供什麼價值、如何生產與配送、如何收費與獲利**。

**商業模式的構成要素（Osterwalder 九宮格）**：**客戶區隔、價值主張、通路、客戶關係、收益流、關鍵資源、關鍵活動、關鍵夥伴、成本結構**。

**電子商務的商業模式**：**運用網際網路等資訊科技，重新設計價值創造與獲利方式**。常見收益模式：**交易佣金、廣告、訂閱、銷售、授權、加值服務**。

**(二) 以企業「內外網路」區分（約 9 分）**

依**資訊系統與網路所涵蓋的範圍（誰能使用）**分為三類：

| 類型 | 英文 | **使用範圍與對象** | **內容與目的** | **例子** |
|---|---|---|---|---|
| **1. 企業內部網路（企業內部電子商務）** | **Intranet（Business to Employee，B2E／企業內部商務）** | **只限企業「內部員工」使用**（防火牆保護） | **內部資訊分享、協作、作業流程自動化**（電子公佈欄、請假、報支、公文、知識管理、員工教育訓練） | 企業入口網站、ERP、內部電子簽核 |
| **2. 企業間網路（外部網路）** | **Extranet（企業對企業，B2B）** | **企業與其「特定的外部夥伴」（供應商、經銷商、客戶）** 使用，以**授權與安全機制**開放內部系統的一部分 | **供應鏈協同、電子訂貨、電子資料交換（EDI）、協同設計、庫存共享** | 供應商入口網站、經銷商訂貨系統、VMI |
| **3. 網際網路（對外開放網路）** | **Internet（企業對消費者 B2C、消費者對消費者 C2C 等）** | **對一般大眾開放** | **面向顧客的行銷、銷售、客服**（網路商店、拍賣、社群） | 官方購物網站、博客來、蝦皮 |

| 類型 | 英文 | 交易對象 | **特色與例子** |
|---|---|---|---|
| **1. 企業對企業（B2B）** | Business to Business | **企業 ↔ 企業** | **交易金額大、量大、長期合作**；**電子採購、電子市集、供應鏈**（阿里巴巴 1688、Ariba） |
| **2. 企業對消費者（B2C）** | Business to Consumer | **企業 → 一般消費者** | **網路商店、直銷**（博客來、momo、Amazon、PChome） |
| **3. 消費者對消費者（C2C）** | Consumer to Consumer | **消費者 ↔ 消費者**（透過平台） | **拍賣、二手交易、分類廣告**（eBay、露天、蝦皮、Carousell） |
| **4. 消費者對企業（C2B）** | Consumer to Business | **消費者 → 企業**（個人提供產品或服務給企業，或集體議價） | **反向拍賣、徵才平台、團購、自由接案、內容創作者**（Upwork、Shutterstock） |
| **5. 企業對政府（B2G）** | Business to Government | **企業 ↔ 政府** | **電子報稅、電子投標與政府採購、報關**（政府電子採購網） |
| **6. 政府對民眾（G2C）／政府對企業（G2B）** | Government to Citizen／Business | **政府 → 民眾／企業** | **電子化政府**（線上申辦、繳稅、戶政） |
| **7. 企業對員工（B2E）** | Business to Employee | **企業 → 員工** | 內部入口網站、員工福利 |
| **8. 線上對線下（O2O）** | Online to Offline | 線上帶動線下消費 | 團購券、外送、行動支付 |
| **9. 對等網路（P2P）／協同商務** | Peer to Peer／Collaborative Commerce | **對等交易、協作** | 共享經濟（Uber、Airbnb） |

    {

      title: "波特的企業基本競爭策略類型（成本領導、差異化、集中化）簡述",
      score: 30,
      question: `有關事業策略之研究，較具代表性者首推波特（Michael E. Porter, 1980）提出之企業基本競爭策略類型，其策略為何？請簡述之。（30 分）`,
      answer: `**(一) 背景：波特的「五力」與「三種基本競爭策略」**

**波特（1980《競爭策略》）**認為，企業要在產業中獲得**持久的競爭優勢**，須面對**五種競爭力量**（**既有對手競爭、新進入者威脅、替代品威脅、供應商議價力、買方議價力**），並選擇下列**三種基本策略**（依**競爭優勢的來源**與**競爭範圍**劃分）：

| | **低成本** | **差異化** |
|---|---|---|
| **廣泛市場（整個產業）** | **① 成本領導策略** | **② 差異化策略** |
| **狹窄市場（特定區隔）** | **③-a 成本集中化** | **③-b 差異化集中化** |

**(二) 三種基本競爭策略**

**1. 成本領導策略（Cost Leadership）**

| 項目 | 說明 |
|---|---|
| **核心** | **成為產業中「總成本最低」的生產者**，**以低價取得競爭優勢**，或在**相同價格下取得較高利潤** |
| **作法** | **規模經濟與經驗曲線、嚴格的成本控制、高效率的生產與流程、低成本的原料來源、垂直整合、流程自動化、精簡人力與間接費用、善用資訊科技（ERP、SCM）** |
| **適用條件** | **產品標準化、價格敏感的市場、有規模經濟的產業** |
| **優點** | **可抵擋價格戰**、**提高進入障礙（新進者難以低成本競爭）**、**對供應商與買方議價力較強**、**不易被替代品取代** |
| **風險** | **技術變革使成本優勢消失**、**競爭者模仿或更低成本**、**過度重視成本而忽略顧客需求與品質**、**顧客價值（品牌）不足** |
| **例子** | **沃爾瑪（Walmart）、好市多、臺灣的全聯（低價）、宜家（IKEA）、廉價航空** |

**2. 差異化策略（Differentiation）**

| 項目 | 說明 |
|---|---|
| **核心** | **提供「獨特且被顧客重視」的產品或服務**，使顧客**願意付出較高價格**（溢價）；**以獨特性建立品牌忠誠** |
| **差異化來源** | **產品設計與功能、品質、技術創新、品牌形象、服務（售後、客服）、配銷通路、顧客體驗、客製化** |
| **適用條件** | **顧客重視特色、品牌與品質**，產品可差異化 |
| **優點** | **取得溢價與較高利潤**、**降低顧客對價格的敏感度**、**顧客忠誠度高（降低替代品與買方威脅）**、**提高進入障礙** |
| **風險** | **差異化成本過高以致價格超過顧客願付**、**被模仿而失去獨特性**、**顧客不再重視該差異**、**忽略成本控制** |
| **例子** | **蘋果（Apple）設計與生態系**、**BMW（駕駛體驗）**、**星巴克（體驗）**、**勞力士（品牌）** |

**3. 集中化策略（Focus，聚焦策略）**

| 項目 | 說明 |
|---|---|
| **核心** | **專注於特定的「目標市場區隔」**（特定族群、產品線或地理區域），**比廣泛競爭者更有效率地服務該區隔** |
| **兩種形式** | **成本集中化**：在特定區隔**以最低成本服務**；**差異化集中化**：在特定區隔**提供獨特的產品與服務** |

**(三) 「卡在中間（Stuck in the Middle）」的風險**

**波特警告：若企業沒有明確選擇上述任何一種策略（既不低成本、也沒有差異化、也不聚焦），就會「卡在中間」，缺乏競爭優勢，績效最差**。（後來學者也指出，**成本領導與差異化可以兼顧**的情形，如**大量客製化、數位科技**。）

**(四) 三種策略比較**

| **競爭優勢來源** | **低成本** | **獨特性** | **專注於特定區隔（低成本或差異化）** |

| **主要風險** | **被更低成本者取代** | **差異被模仿或不被重視** | **區隔縮小、大企業進入** |

**(五) 資訊科技的角色**：**IT 可支援三種策略**——**降低成本（ERP、自動化、電子商務）**、**差異化（CRM、個人化、創新服務）**、**聚焦（大數據精準分析）**；**IT 本身常成為競爭優勢的來源**。`

| **4. 專注核心業務** | 機關**專注於政策與核心業務**，**把非核心的資訊作業交給專業廠商** |
| **5. 縮短開發時程** | 廠商有**現成的團隊與資源**，加速系統上線 |

| **6. 喪失控制權與內部能力萎縮** | **機關資訊人員技能退化**，**失去對系統的掌握**，監督能力不足（**無法判斷廠商好壞**） | **保留核心人員與技術能力、設置專責的委外管理（合約管理）人員** |

      question: `何謂地理資訊系統（Geographic Information System，簡稱 GIS）？（5 分）GIS 至少應含有那些元件？（6 分）從資訊系統服務管理層級的角度分類，請問 GIS 是屬於那一類資訊系統？（3 分）請說明你認為宜發展何種 GIS 於政府單位？（3 分）並簡述其理由。（3 分）`,
      answer: `**(一) 地理資訊系統（GIS）（5 分）**

**GIS（Geographic Information System）**：**用來「蒐集、儲存、管理、分析、顯示」與「空間位置（地理座標）有關的資料」的電腦資訊系統**，**把「位置」與「屬性資料」結合，並以「地圖」呈現**。

| 特性 | 說明 |
|---|---|
| **核心** | **空間資料（位置、形狀）＋屬性資料（描述）** |
| **空間資料模型** | **向量（點、線、面）** 與 **網格（Raster，影像）** |
| **功能** | **空間查詢、疊圖分析（Overlay）、緩衝區分析（Buffer）、路徑分析、網路分析、地圖製作與視覺化** |
| **例子** | **Google Maps、ArcGIS、QGIS、國土資訊系統（NGIS）、防災地圖** |

**(二) GIS 的元件（6 分）**

**GIS 至少包含 5 個元件（人、硬體、軟體、資料、方法／程序）**：

| 元件 | 說明 |
|---|---|
| **1. 硬體（Hardware）** | **電腦、伺服器、輸入設備（數化板、**GPS**、掃描器、空拍機與衛星遙測）、輸出設備（繪圖機、顯示器）、儲存與網路** |
| **2. 軟體（Software）** | **GIS 軟體**（資料輸入、資料庫管理、空間分析、地圖顯示）：ArcGIS、QGIS、**空間資料庫（PostGIS）** |
| **3. 資料（Data）** | **空間資料（地圖、衛星影像、地形）＋ 屬性資料**；**GIS 最昂貴且最重要的部分**；來源：測量、遙測、GPS、政府圖資 |
| **4. 人員（People）** | **GIS 專業人員（分析、開發、維護）與使用者** |
| **5. 方法／程序（Methods）** | **分析方法、作業流程、資料標準與品質管理、政策與規範** |

**(三) 從「資訊系統服務管理層級」分類：GIS 屬於「決策支援系統（DSS）」，服務「管理階層（中階與策略層）」，支援空間性的半結構化決策（也可支援作業層）**

| 管理層級（金字塔） | 對應的系統 | GIS 的定位 |
|---|---|---|
| 作業層 | 交易處理系統（TPS） | GIS 可支援作業（如地籍資料查詢、派遣） |
| **管理層** | **管理資訊系統（MIS）、決策支援系統（DSS）** | **GIS 主要定位：空間決策支援系統（SDSS）**，透過**空間分析與視覺化**支援**規劃與管理決策** |
| 策略層 | 主管資訊系統（EIS） | GIS 的**空間儀表板**支援策略規劃 |

> **答案：GIS 屬於「決策支援系統（DSS）」類，服務管理層的決策。**（若教科書另有分類，如「專業系統／知識層級系統」，作答時可註明。）

**(四) 政府適合發展的 GIS 與理由（各 3 分）**

> **宜發展：「防救災與災害應變 GIS」（災害風險與緊急應變地理資訊系統）。**（亦可依機關業務選擇，例如關務機關的「貨物與港口查緝 GIS」。）

**理由**

| 理由 | 說明 |
|---|---|
| **1. 災害具有強烈的空間性** | **地震、颱風、淹水、土石流**都發生在特定地點，**空間分析（疊圖：人口、設施、淹水潛勢）能判斷受災範圍與影響人口** |
| **2. 生命財產與公共安全的重要性高** | **提前預警、疏散路線規劃、救災資源（醫院、避難所、消防）調度**，**即時決策可挽救生命** |
| **3. 整合多機關資料** | **氣象、水利、消防、警政、醫療**資料在地圖上整合，**促進跨機關協作** |
| **4. 效益明顯、民眾有感** | 可**對民眾公開（災害地圖、避難指引）**，提升**政府服務與透明度** |
| **5. 技術與資料基礎已具備** | 國土測繪圖資、衛星影像、**開放資料**、GPS 與 **IoT 感測器**已相當成熟 |

**其他適合的政府 GIS**：**地政與地籍 GIS、交通與道路 GIS、都市計畫與國土規劃 GIS、環境監測 GIS、治安與犯罪熱點 GIS、公共設施與管線 GIS、公共衛生（疫情地圖）GIS、海關與港口物流 GIS**。`

      answer: `**(一) RFID 與悠遊卡**

      answer: `**(一) 什麼是知識管理（Knowledge Management，KM）**

**組織「有系統地創造、擷取、儲存、分享、應用與更新知識」，以提升組織績效與競爭力的管理活動**，**目的是使「對的知識，在對的時間，傳給對的人」**。

**知識的類型**

| 類型 | 說明 | 例子 |
|---|---|---|
| **外顯知識（Explicit）** | **可用文字、圖表、數字記錄、容易傳遞的知識** | 手冊、SOP、報告、資料庫 |
| **內隱知識（Tacit）** | **存在個人的經驗、直覺、技巧中，不易言傳** | 老師傅的技藝、專家的判斷 |

**SECI 模型（Nonaka 與 Takeuchi）**：**社會化（內隱→內隱）、外化（內隱→外顯）、組合化（外顯→外顯）、內化（外顯→內隱）**。

**知識管理的流程**：**知識的創造／取得 → 編碼與儲存 → 分享與傳播 → 應用 → 更新**。**支援技術**：**知識庫、文件管理、企業入口網站、搜尋引擎、協作工具（Wiki、論壇）、專家黃頁、資料探勘、社群平台、AI**。

**(二) 推動知識管理時會遭遇的困難**

| 類別 | 困難 | 說明 |
|---|---|---|
| **人員與文化** | **知識擁有者不願分享（「知識就是權力」）** | 擔心**失去獨特性與競爭力**、**怕被取代**、**缺乏分享動機** |
| | **缺乏信任與分享的文化** | **部門本位主義、內部競爭**，**怕犯錯被責備**，不敢公開經驗 |
| | **使用者缺乏時間與意願** | **視為額外工作負擔**，**工作忙碌無暇整理與輸入知識** |
| | **對新系統的抗拒** | **不熟悉工具、習慣舊方式** |
| **知識本身** | **內隱知識難以表達與擷取** | 經驗與直覺**很難文件化** |
| | **知識品質與過時** | **知識庫內容過時、不正確、重複，使用者喪失信任** |
| | **資訊過載與難以找到** | **分類不佳、檢索困難** |
| **管理與制度** | **高階主管的支持不足** | **缺乏明確策略與投入資源** |
| | **缺乏明確的目標與衡量指標** | **知識管理的效益難以量化**，**難以證明投資價值** |
| | **缺少激勵與考核制度** | 分享沒有回報，**不分享也沒有懲罰** |
| | **缺乏專責組織與角色（知識長 CKO）** | |
| **技術** | **系統不好用或與工作流程脫節** | **知識管理系統與日常工作分離**，使用麻煩 |
| | **資訊安全與智慧財產權顧慮** | **機密外洩、權限控管** |
| **其他** | **人員流動大（知識流失）**、**預算有限**、**組織結構僵化（層級多）** | |

**(三) 人力資源部門需要做的配合動作**

人力資源部門（HR）負責**人員的招募、訓練、考核、獎酬與組織文化**，是**知識管理的人的因素**的關鍵：

| 配合動作 | 說明與例子 |
|---|---|
| **1. 建立分享與學習的組織文化** | **宣導知識分享的價值**、**鼓勵開放與信任、容許犯錯與公開檢討（經驗學習）**、**高階主管以身作則**；**舉辦知識分享會、讀書會、經驗交流** |
| **2. 設計激勵與獎酬制度** | **把「知識分享與貢獻」納入績效考核與升遷條件**；**提供獎金、獎勵、表揚（知識貢獻之星）**；**以點數、榮譽激勵**；**避免「知識就是權力」的觀念** |
| **3. 教育訓練與能力發展** | **培養員工的資訊素養與知識管理工具的使用能力**；**訓練知識的記錄、整理、分享與運用的技能**；**導入「師徒制」、輪調、在職訓練**，**促進內隱知識的傳承** |
| **4. 招募與選才** | **招募具有學習意願、團隊合作與分享精神的人才**；**招募時評估「知識分享傾向」** |
| **5. 設置專責角色與組織** | **設置知識長（CKO）、知識管理專員、社群版主（社群經營者）**；**建立實務社群（Community of Practice）** |
| **6. 知識傳承與人員離職管理** | **重要人員離職、退休前進行「知識移轉」與經驗記錄（口述歷史、文件化）**；**建立專家資料庫（專家黃頁）** |
| **7. 職涯與工作設計** | **在職務說明中納入知識分享責任**、**提供時間與資源（工時）**去撰寫與分享知識 |
| **8. 團隊與跨部門合作** | **跨部門專案團隊、輪調**，**打破部門藩籬**；**以團隊績效取代個人績效** |
| **9. 組織溝通與變革管理** | **溝通知識管理的目的與好處**、**處理員工的疑慮與抗拒** |
| **10. 評估與回饋** | **衡量知識分享的參與率與貢獻**、**調查員工滿意度並持續改善** |
| **11. 保障員工權益** | **明確智慧財產權歸屬與署名**，**保護分享者權益** |

**(四) 結論**：**知識管理的成功，「人與文化」比「技術」更關鍵**；**高階主管支持＋激勵制度＋文化（HR 主導）＋合適技術**缺一不可。`

      answer: `**(一) 供應鏈管理（SCM）**

**供應鏈（Supply Chain）**：**由原料供應商、製造商、配銷商、零售商到最終顧客，為了把產品與服務送到顧客手中所形成的「上下游網路」**，涵蓋**物流、資訊流、金流**。

**供應鏈管理（SCM）**：**整合與協調供應鏈上所有成員的活動與資源，以最低總成本，在正確的時間、地點，把正確的產品與數量交給顧客，提升顧客滿意與整體競爭力**。**目標**：**降低庫存與成本、縮短前置時間、提升服務水準、降低風險**。

    {

      question: `為什麼組織在引進新的資訊系統時會引發組織再造？很高百分比的資訊系統專案受到挫折，是因為圍繞在系統建置的組織變革流程沒有適當的處理，請問在引進新的資訊系統時所需的變革管理（change management）負有那些任務？（25 分）`,
      answer: `**(一) 為什麼導入新資訊系統會引發組織再造**

**資訊系統不只是技術工具，而是會改變「組織的流程、結構、工作方式、權責與文化」的「社會技術系統」**（技術與組織互相影響）。主要原因：

| 原因 | 說明 | 例子 |
|---|---|---|
| **1. 新系統改變作業流程** | **自動化、整合與即時資訊**使**舊流程變得多餘或可以簡化**，必須**重新設計流程（BPR，企業流程再造）** 才能發揮效益；**若只把舊流程「電腦化」，效益有限** | **ERP 導入需將各部門流程標準化**；**電子公文取代多層簽核** |
| **2. 改變工作內容與角色** | **重複性工作被自動化**，工作性質轉為**分析、決策、服務** | **櫃員轉為理財顧問**；**資料輸入人員減少** |
| **3. 改變組織結構與權責** | 資訊**透明化與共享**使**中間層級的「資訊傳遞」功能減少**，**組織趨於扁平**；**權力與資訊掌握者改變**，**部門界線被打破、跨部門整合** | 管理階層減少、**決策權下放**、**虛擬團隊** |
| **4. 改變人際關係與政治結構** | **重新分配權力、資源與地位**，**影響既得利益者**，引發**抗拒** | 資訊掌握權轉移 |
| **5. 改變決策方式與管理控制** | **即時資料使決策更依據事實，績效透明可監控** | **儀表板、即時績效管理** |
| **6. 改變技能需求與人力配置** | **需要新技能（資料分析、系統使用）**，**人員調整、訓練與重新配置** | |
| **7. 改變組織文化與價值觀** | **從「憑經驗」到「憑資料」**、**開放分享**、**創新** | |
| **8. 與外部關係改變** | **與供應商、顧客的互動方式改變** | **電子商務、供應鏈整合** |
| **9. 為了取得策略性競爭優勢** | 資訊科技促成**新的商業模式** | 網路銀行、電商 |

**重點**：**「技術要成功，組織必須跟著改變」**。**變革（組織再造）是導入資訊系統必然的後果**，若**不處理，「人與流程」不配合，系統即使技術完美也會失敗**。

**(二) 為什麼很多專案失敗？**

**「只管技術，忽略組織與人」**：**使用者抗拒、流程沒有調整、教育訓練不足、高階主管不支持、溝通不足、權責不明**——**這些是組織變革面向的問題，而非技術問題**。

**(三) 變革管理（Change Management）負有的任務**

**變革管理**：**有計畫、有系統地管理「組織、流程與人員」從現況轉移到未來狀態的過程**，**降低抗拒、確保新系統被接受並發揮效益**。（可參考 **Lewin 的三階段：解凍 → 變革 → 再凍結**，與 **Kotter 的八步驟**。）

| 任務 | 說明 | 具體作法 |
|---|---|---|
| **1. 獲得高階主管的承諾與支持（Sponsorship）** | **變革需要由上而下的領導與資源** | **高階主管明確表態、親自參與、分配資源、解決衝突**；設立**專案指導委員會** |
| **2. 明確願景與目標，並說服組織「為什麼要變」** | **讓員工理解變革的必要性與效益**（建立**急迫感**） | **清楚說明願景、問題與好處**，**回答「對我有何影響？」** |
| **3. 利害關係人分析與參與** | **找出受影響的人（使用者、主管、部門）與其關切、可能的支持者與抗拒者** | **使用者代表參與需求與設計**（參與式開發）、**建立變革推動團隊與「變革代理人」（Change Agents）** |
| **4. 溝通（Communication）** | **持續、雙向、透明地溝通變革內容、時程與影響** | **說明會、公告、FAQ、意見反映管道**；**消除謠言與焦慮** |
| **5. 處理抗拒（Resistance）** | **預期並了解抗拒的原因**（害怕失業、技能不足、權力改變、習慣）並**對症下藥** | **傾聽、教育、協商、獎勵、提供支援；必要時調整方案** |
| **6. 教育訓練與支持（Training and Support）** | **使人員具備使用新系統與新流程的能力** | **分角色訓練、操作手冊、模擬環境、服務台與到點支援、種子教師** |
| **7. 流程再造與組織調整** | **設計新的作業流程、組織結構、職務與權責** | **流程設計（BPR）**、**修訂 SOP 與制度**、**調整職務說明與績效指標（KPI）** |
| **8. 規劃上線與轉換策略並降低衝擊** | **選擇適當的轉換方式，降低營運風險** | **平行轉換、直接轉換、試辦（Pilot）、分階段推廣**；**備援與應變計畫** |
| **9. 激勵與獎勵** | **鼓勵採用新系統、肯定早期成功** | **把使用新系統納入績效與獎酬**、**小勝利（Quick Wins）** |
| **10. 監控、評估與回饋** | **追蹤變革進度與成效，持續調整** | **使用率、滿意度、績效指標**；**收集回饋並改善** |
| **11. 鞏固成果與制度化（再凍結）** | **使新方式成為組織常態** | **修訂制度、持續訓練、文化塑造** |
| **12. 風險管理** | **辨識與因應變革風險** | 變革風險評估 |

**(四) 結論**：**資訊系統的成功＝「好的技術」＋「好的變革管理」**；**變革管理關注「人」與「組織」的面向，使人員接受、使用、並發揮新系統的價值**。`

      title: "比較關聯式資料庫管理系統（RDBMS）與物件導向資料庫管理系統（OODBMS）的優缺點",

      answer: `**(一) 兩種系統簡介**

| 系統 | 資料模型 |
|---|---|
| **關聯式 DBMS（RDBMS）** | **以「二維表格（關聯）」儲存資料**：列（元組）、欄（屬性）、**主鍵與外來鍵**；以 **SQL** 查詢；基於**關聯代數與集合論**，需**正規化** |
| **物件導向 DBMS（OODBMS，ODBMS）** | **以「物件」儲存資料**：物件含**屬性（資料）與方法（行為）**，支援**類別、繼承、封裝、多型、複雜物件與物件識別（OID）**；以**物件查詢語言（OQL）** 或**程式語言**直接存取 |

**(二) 優缺點比較**

| 比較項目 | **關聯式（RDBMS）** | **物件導向（OODBMS）** |
|---|---|---|
| **成熟度與標準** | **非常成熟**，**標準（SQL）統一**，**廣泛使用**（Oracle、MySQL、SQL Server） | **較不成熟**，**缺乏統一標準**（OQL／ODMG），**產品與市占少** |
| **資料表示** | **簡單的表格，直覺易懂**；**只能表示「簡單的資料型態」**；**複雜結構（多媒體、CAD、階層）需拆成多個表格，連接複雜** | **能直接表示複雜物件與關係（巢狀、繼承、多媒體、CAD、GIS）**，**更貼近真實世界** |
| **與程式語言的搭配** | **有「阻抗不匹配（Impedance Mismatch）」**：**物件導向程式（Java、C++）與關聯表格之間要轉換（ORM：Hibernate）** | **與物件導向程式語言「無縫整合」**，**資料與程式使用相同的物件模型，不需轉換** |
| **查詢能力** | **SQL 強大、宣告式、支援臨時查詢（ad hoc）、最佳化器成熟** | **查詢功能較弱**，**多為「導航式」存取（沿著物件參考）**；臨時查詢與最佳化不及 |
| **資料完整性與正規化** | **完整性限制完整（主鍵、外來鍵、檢查）**，**正規化降低冗餘** | 完整性機制較少，**以物件的方法確保** |
| **交易、並行控制、復原** | **成熟（ACID）、支援大量交易（OLTP）** | **較弱**，**長交易與版本管理較強（設計類應用）** |
| **效能** | **一般交易與簡單查詢性能優異**；**複雜物件需要多次連接（Join），效能較差** | **處理複雜物件與導航式存取速度快（不必 Join）**；**一般大量資料查詢較差** |
| **擴充性與重用性** | **擴充新型態有限**（需使用者定義型態）；**不易重用** | **繼承、封裝、多型使程式碼與資料模型易於重用與擴充** |

| **安全性** | **成熟的權限管理** | 較少 |
| **適用** | **事務處理、企業資料處理、報表與分析（銀行、訂單、ERP）** | **複雜資料與設計應用：CAD／CAM、多媒體、GIS、工程與科學資料、即時系統** |

**(三) 折衷：物件關聯式資料庫（ORDBMS）**

**在關聯式模型中加入物件導向特性**（使用者自訂型態、繼承、方法、巢狀表），如 **PostgreSQL、Oracle、SQL:1999 以後標準**，**兼顧關聯式的成熟性與物件導向的表達力**；**目前市場上多用 RDBMS 搭配 ORM，或 ORDBMS**。

      answer: `**(一) 系統分析與設計的方法論**

**開發資訊系統的方法論**：**結構化的 SDLC（系統發展生命週期，瀑布式）**、**雛型法（Prototyping）**、**螺旋式**、**快速應用開發（RAD）**、**敏捷法（Agile）**、**使用者自行開發**等。

**(二) 雛型法（Prototyping）的內容**

**先快速建立「雛型（原型）」——系統的簡化、可執行的工作模型（常先做使用者介面、輸出入畫面與主要功能），讓使用者實際操作與評價，依回饋反覆修改，直到確認需求，再發展為正式系統**。

| 概念 | 說明 |
|---|---|
| **為什麼用** | **使用者往往無法一開始就清楚說明需求**（「看到了才知道要什麼」），傳統文件很難溝通 |
| **雛型的類型** | **拋棄式雛型（Throwaway）**：確認需求後丟棄，正式系統重新開發；**演進式雛型（Evolutionary）**：雛型逐步修改成為最後的系統 |
| **特性** | **迭代、使用者高度參與、快速、重視介面** |

**(三) 優缺點**

| | **優點** | **缺點** |
|---|---|---|
| **雛型法** | ① **使用者早期參與，需求更明確**，**減少需求誤解與認知落差**；② **及早發現問題與錯誤**，**降低後期修改成本與失敗風險**；③ **提高使用者滿意度與接受度**（降低抗拒）；④ **溝通容易（看得到、用得到）**；⑤ **適合需求不明確、變動大的系統**；⑥ **縮短開發時間（快速取得可用成果）** | ① **容易變成「無止境的修改」，拖延時程、增加成本**（缺乏控制）；② **使用者誤把雛型當成品，期望過高**（雛型缺少安全、效能、完整性）；③ **文件常不完整，後續維護困難**；④ **系統設計與架構考慮不周**，**品質與效能不足**；⑤ **不適合大型、複雜、需嚴謹規格的系統**；⑥ **需要使用者與開發者投入大量時間** |

**(四) 以雛型法開發企業應用系統的典型程序（範例：「訂單管理系統」）**

\`\`\`
 ① 初步需求      ② 建立初步雛型     ③ 使用者試用與評估     ④ 修改雛型（迭代）
 （基本需求）  →  （主要畫面與功能） →  （提供意見）      →  （改良）
                                              ↑                  │
                                              └──── 不滿意 ←──────┘
                                                      │ 滿意
                                                      ↓
                              ⑤ 確認需求規格 → ⑥ 發展正式系統（設計、編碼、測試）→ ⑦ 上線與維護
\`\`\`

| 步驟 | 活動 | **例子（訂單管理系統）** |
|---|---|---|
| **1. 識別基本需求** | 與使用者訪談，了解**主要功能與資料**（不必求詳盡） | 業務人員需要**建立訂單、查詢庫存、列印出貨單** |
| **2. 開發初始雛型** | **用快速開發工具（低程式碼工具、視覺化工具、4GL）** 建立**畫面、選單與主要功能**（可用假資料） | 製作**訂單輸入畫面、客戶查詢畫面** |
| **3. 使用者試用與評估** | **讓使用者操作並提供意見**（**是否符合需求、好不好用**） | 業務員反映「**欄位順序不合作業習慣**」「**需要自動帶出客戶信用額度**」 |
| **4. 修改與精進雛型（迭代）** | **依意見修改**，再次試用；**重複 3、4 步直到使用者滿意** | 調整欄位、增加信用額度檢查，**共迭代 3～5 次** |
| **5. 確認需求並產生規格** | **根據最終雛型整理成需求規格文件**（資料流程、資料字典） | 產出正式的功能與畫面規格 |
| **6. 開發正式系統** | **拋棄式雛型**：**重新設計與開發**（完整的資料庫、安全、效能）；**演進式雛型**：**在雛型基礎上加強** | 設計資料庫、建立交易邏輯、完整測試 |
| **7. 測試、導入與維護** | 系統測試、使用者驗收、教育訓練、上線與維護 | 切換與維護 |

**(五) 適用情況**：**使用者介面重要、需求不明確、使用者互動多的系統**（網站、決策支援系統、行動 App）；**不適合**：**即時控制、安全關鍵、運算複雜、需精確規格的系統**。`

    {
      id: "cs3-mis-98-3", no: "三", topic: "mis", topicName: "資訊管理",
      title: "電子商務、採購系統、供應鏈管理與企業內外網路（Intranet、Extranet、Internet）如何結合以營造企業優勢",
      score: 20,
      question: `請說明電子商務、採購系統、供應鏈管理與企業內外網路應如何結合以營造企業優勢。（20 分）`,
      answer: `**(一) 各元素的角色**

| 元素 | 角色 |
|---|---|
| **企業內部網路（Intranet）** | **企業內部**使用的網路，**整合內部資訊系統（ERP、財務、生產、人資）**，**員工共享資訊與協作** |
| **企業間網路／外部網路（Extranet）** | **對「特定外部夥伴」（供應商、經銷商、客戶）** 開放**部分內部系統**，**授權與安全控制** |
| **網際網路（Internet）** | **對一般大眾開放**，**面向顧客與市場** |
| **採購系統（e-Procurement）** | **以電子方式處理採購流程**：**請購、詢價、比價、訂購、收貨、付款** |
| **供應鏈管理（SCM）** | **整合供應商到顧客的物流、資訊流、金流** |
| **電子商務（EC）** | **以網路進行買賣交易與商業活動**（B2B、B2C） |

**(二) 如何結合（整體架構）**

\`\`\`
  供應商 ←──[Extranet：電子採購、EDI、協同]──→ 【企業】 ←──[Internet：電子商務網站]──→ 顧客
                                                 ↑
                              [Intranet：ERP、SCM、CRM、內部協作與資料整合]
\`\`\`

| 結合層面 | **作法** | **效益（優勢）** |
|---|---|---|
| **1. 以 Intranet 為核心整合內部（ERP）** | **用 ERP 整合採購、生產、庫存、財務、銷售的資料與流程**，**單一資料來源**；**員工以入口網站共享資訊** | **內部效率提升、資訊即時一致、決策品質提高** |
| **2. 以 Extranet 連結供應商（採購與供應鏈）** | **供應商入口網站與電子採購系統**：**請購單自動轉訂單、電子詢價與比價、EDI 傳送訂單與出貨通知、供應商查看庫存與預測**；**VMI（供應商管理庫存）** | **縮短採購週期、降低採購成本與錯誤、降低庫存、增進與供應商的夥伴關係、降低長鞭效應** |
| **3. 以 Internet 連結顧客（電子商務）** | **官網與電商平台接單**，**訂單自動進入 ERP**，**即時查詢庫存、交期、訂單狀態**，**CRM 蒐集顧客資料** | **擴大市場、24 小時營業、降低行銷與交易成本、提升顧客服務、個人化行銷** |
| **4. 「訂單到交貨」的端到端整合** | **顧客在網站下單 → ERP 確認庫存 → 若缺貨，電子採購系統自動向供應商下單（Extranet）→ 供應商出貨資訊（EDI）→ 倉儲與運輸系統配送 → 顧客可線上追蹤** | **整條價值鏈自動化，縮短交貨時間、降低庫存** |
| **5. 供應鏈協同（需求預測共享）** | **將顧客需求（來自電商與 POS）即時共享給供應商**；**協同規劃、預測與補貨（CPFR）** | **降低長鞭效應、庫存最佳化、準時交貨** |
| **6. 資料整合與分析** | **電商與供應鏈資料匯入資料倉儲與 BI**，**分析需求與績效** | **決策支援、預測與持續改善** |
| **7. 資訊安全與標準** | **各網路分層控管：Intranet 嚴格、Extranet 授權與加密（VPN、PKI）、Internet 防火牆與 DMZ**；**採用統一標準（EDI、XML、GS1）** | **確保資料安全與互通** |

**(三) 營造的企業優勢**

| 優勢 | 說明 |
|---|---|
| **成本優勢** | **降低採購、庫存、交易與營運成本** |
| **速度與彈性優勢** | **縮短採購、生產與交貨的週期**，**快速回應市場變化** |
| **顧客服務與差異化優勢** | **即時、透明、個人化的服務**，**提高顧客滿意與忠誠** |
| **夥伴關係與鎖定優勢** | **與供應商與客戶形成緊密連結，提高轉換成本** |
| **決策與創新優勢** | **整合資料驅動決策，創造新商業模式** |
| **整體供應鏈的競爭力** | **「供應鏈與供應鏈的競爭」** |

**(四) 例子**：**戴爾（Dell）**：官網**接單（Internet）** → **ERP 與生產排程（Intranet）** → **供應商依 Dell 的需求預測，自行補貨到工廠旁的倉庫（Extranet、VMI）** → **幾乎零庫存**、**直銷客製化**。

**(五) 結論**：**Intranet 整合內部、Extranet 連結夥伴、Internet 面向顧客；電子商務負責「前端接單」，採購系統與 SCM 負責「後端供應」，三者結合形成「從顧客到供應商」的即時、整合、低成本的價值網路**，成為企業競爭優勢。`

    {
      id: "cs3-mis-98-4", no: "四", topic: "mis", topicName: "資訊管理",
      title: "資訊系統道德問題的五個向度；政府網站的服務品質如何提升以符合資訊系統的道德問題",
      score: 25,
      question: `請說明資訊系統道德問題的五個向度，而政府網站之服務品質又該如何提升以符合資訊系統之道德問題？（25 分）`,
      answer: `**(一) 資訊系統道德問題的五個向度（Laudon 的五個道德面向，約 12 分）**

資訊科技帶來新的倫理、社會與政治問題，歸納為**五個道德向度（Moral Dimensions）**：

| 向度 | **內容** | **主要問題與例子** |
|---|---|---|
| **1. 資訊的權利與義務（Information Rights and Obligations）** | **個人與組織對「自己的資訊」擁有什麼權利？有什麼義務保護？** | **隱私權**（個人資料蒐集、使用、監控）、**自由表達權**；**個資外洩、網路追蹤（Cookie）、員工電子郵件監控、個人資料被濫用**；**個資法** |
| **2. 財產權（Property Rights）：智慧財產權** | **如何保障智慧財產（軟體、著作、專利、商標、營業秘密）？** | **軟體盜版、數位內容非法下載與複製、侵權**；**資訊的所有權與智慧財產權（著作權法）**；**很容易複製與散布** |
| **3. 責任與控制（Accountability and Control）** | **誰應為資訊系統造成的傷害負責？如何補償受害者？** | **系統錯誤造成損害的責任歸屬（開發者、使用者、管理者、供應商）**；**資料錯誤或系統當機**；**AI 決策的責任** |
| **4. 系統品質（System Quality）：資料與系統的品質標準** | **系統應達到什麼品質標準（正確性、可靠性、安全）才可以上線？** | **軟體錯誤（Bug）**、**資料品質差、系統故障、資訊安全**；**「夠好」的標準** |
| **5. 生活品質（Quality of Life）** | **社會應維護怎樣的價值與生活品質？** | **數位落差**、**工作與生活界線模糊**、**電腦犯罪**、**網路成癮**、**對就業的衝擊（自動化）**、**依賴與健康**、**權力集中** |

（亦可說：**隱私、準確性、財產權、可及性（Mason 的 PAPA：Privacy、Accuracy、Property、Accessibility）**。）

**(二) 政府網站服務品質的提升，以符合資訊系統道德要求（約 13 分）**

**政府網站（電子化政府）**服務**全民**，掌握**大量個資**，**公共性與責任重**，更需**落實道德要求**。依五個向度提出作法：

| 向度 | **政府網站應如何提升服務品質（落實道德）** |
|---|---|
| **1. 資訊的權利與義務（隱私與資訊自由）** | ① **遵守個資法**：**蒐集目的明確、最小蒐集、取得同意、告知權利（隱私權政策）**；② **個資安全**：**加密、存取控制、稽核日誌、資安通報**；③ **資料保存與銷毀規範**；④ **提供民眾查詢、更正與刪除個資的管道**；⑤ **政府資訊公開**（**政府資料開放、資訊公開法**）促進**透明與知的權利**；⑥ **MyData** 讓民眾**自主控制個人資料** |
| **2. 財產權** | ① **尊重智慧財產權**，**使用合法軟體**；② **明確標示政府網站內容的授權與使用條款（如政府資料開放授權）**；③ **避免侵害第三方著作** |
| **3. 責任與控制** | ① **明確的責任歸屬與管理制度（資安長、個資保護聯絡窗口）**；② **資安事件通報與應變機制**；③ **提供申訴、更正與救濟管道**；④ **稽核與問責（日誌、定期稽核）**；⑤ **對錯誤資訊負責，及時更正並公告** |
| **4. 系統品質（資料與服務品質）** | ① **內容正確、即時、完整**（資料品質管理、更新機制）；② **系統穩定、可用性高、效能佳（備援）**；③ **資訊安全防護（防火牆、弱點掃描、滲透測試、ISO 27001）**；④ **符合網站標準（無障礙規範、行動版）**；⑤ **使用者介面易用、搜尋方便、符合使用者導向（UX）**；⑥ **定期服務品質評估**（準確性、完整性、及時性、可用性、易用性、安全） |
| **5. 生活品質（公平與可及性）** | ① **無障礙網頁（Web Accessibility，AA 等級）**：**視障者、聽障者、行動不便者皆可使用**；② **縮小數位落差**：**多元管道（臨櫃、電話、行動）、多語言、對年長者友善**；③ **簡化申辦流程、一站式服務**；④ **公平對待所有民眾，不歧視**；⑤ **避免過度蒐集與監控** |

**(三) 具體的提升措施彙整**

| 措施 | 說明 |
|---|---|
| **制度與政策** | **訂定隱私權政策、資安政策、倫理守則**；**導入 ISO 27001、個資管理制度** |
| **技術** | **加密、驗證（自然人憑證）、存取控制、日誌稽核、備援** |
| **透明與參與** | **公開服務標準與績效指標**、**民眾意見回饋**、**滿意度調查** |
| **教育訓練** | **公務員資安與個資倫理教育** |
| **評估與改善** | **定期稽核與評量網站服務品質（如網站無障礙檢測標章、資安與個資稽核）** |

**結論**：**政府網站的服務品質不只是「系統好用」，更要「負責任地處理人民的資料與權益」——隱私、財產、責任、品質、公平**；落實五個道德向度才能**取得民眾信任**。`

    {

      title: "以專案負責人立場，以實例說明推動政府某一資訊系統的使用者、不同使用者的困難與挑戰，與可能的解決方案",

      answer: `**(一) 選定的實例：「電子公文系統（公文電子化）」**（亦可選擇「電子報稅」「戶政線上申辦」「關務電子通關（Single Window）」等；以下以**電子公文系統**說明）。

**(三) 不同使用者的困難與挑戰，及解決方案**

      score: 25,
      question: `解釋何謂「電腦素養」（Computer Literacy）。（8 分）解釋何謂「電腦自我效能」（Computer Self-efficacy）。（8 分）說明「電腦素養」與「電腦自我效能」之差異。（9 分）`,
      answer: `**(一) 電腦素養（Computer Literacy）（8 分）**

**使用電腦所需的「知識與技能」**：**了解電腦的基本概念（硬體、軟體、網路、資料），並具備有效操作與運用電腦及應用軟體（文書處理、試算表、電子郵件、網路搜尋）以完成工作與解決問題的能力**。

| 組成 | 說明 |
|---|---|
| **知識面** | 電腦的組成、作業系統、網路與資訊安全的基本概念 |
| **技能面** | 操作常用軟體、使用網路與搜尋、檔案管理 |
| **態度與倫理** | **資訊倫理、資安意識、隱私** |
| **特性** | **屬於「客觀的能力」**，**可用測驗或實作評量**；**具體、可學習** |
| **相關概念** | **資訊素養、數位素養** |

**(二) 電腦自我效能（Computer Self-Efficacy）（8 分）**

**來自社會認知理論（Bandura 的自我效能）**：**個人「相信自己有能力運用電腦完成特定工作」的信心或判斷**。

| 組成 | 說明 |
|---|---|
| **核心** | **不是「你實際會多少」，而是「你認為自己能做到多少」**（**主觀信念**） |
| **特性** | **屬於「主觀的信念與信心」**，可**因任務而異（如操作 Excel 的信心與寫程式的信心不同）** |
| **影響因素（Bandura）** | **成功的親身經驗（最重要）**、**他人示範（替代經驗）**、**言語說服（鼓勵）**、**生理與情緒狀態（焦慮）** |
| **影響** | **影響使用意願、努力程度、遇到困難時的堅持、學習成效、對資訊科技的接受度（TAM）與使用績效** |

**(三) 兩者的差異（9 分）**

| 比較項目 | **電腦素養（Computer Literacy）** | **電腦自我效能（Computer Self-Efficacy）** |
|---|---|---|
| **本質** | **「能力」本身**：實際擁有的**知識與技能** | **「信念」**：**對自己能力的「自我評估與信心」** |
| **性質** | **客觀**（可測量實際水準） | **主觀**（個人的認知與感受） |
| **回答的問題** | **「你會不會？」（what you can do）** | **「你覺得自己做得到嗎？」（what you believe you can do）** |
| **衡量方式** | **知識測驗、實作測驗** | **自我報告量表（如「我有信心能使用……」）** |
| **來源** | **教育、訓練、學習、經驗累積** | **成功經驗、觀察他人、鼓勵、情緒狀態** |
| **對行為的影響** | 決定**「能做到什麼」** | 決定**「是否願意嘗試、努力與堅持」** |
| **範圍** | **一般性、廣泛的電腦知識與技能** | **針對特定任務或情境的信心** |
| **兩者的關係** | **素養是自我效能的重要基礎（有能力，較有信心）** | **自我效能會影響學習素養的意願與成效**（有信心才會學） |
| **不一致的情形** | **素養高但自我效能低**（有能力但缺乏自信）；**素養低但自我效能高**（過度自信） | |

**(四) 管理意涵**：資訊系統導入時，**除了提供教育訓練提升電腦素養，也要設計「成功經驗」、示範與鼓勵，提升自我效能**，以降低使用者的抗拒、提高接受度與使用成效。`

    {
      id: "cs3-mis-97-3", no: "三", topic: "mis", topicName: "資訊管理",
      title: "同儕計算（Peer-to-Peer Computing）的運作精神與特色；在政府公務電腦使用 P2P 可能產生的問題",
      score: 25,
      question: `請說明「同儕計算」（Peer-to-Peer Computing）之運作精神與特色。（10 分）若你日後在政府內之公務電腦使用「同儕計算」，有可能會有那幾方面的問題，請詳述之。（15 分）`,
      answer: `**(一) 同儕計算（P2P）的運作精神與特色（10 分）**

**P2P（Peer-to-Peer，對等式運算）**：**網路上的每個節點（電腦）地位對等（Peer），「同時既是服務的使用者（Client），也是服務的提供者（Server）」，節點之間直接交換資源（檔案、運算能力、頻寬、儲存），不必依賴中央伺服器**。

| 比較 | **用戶端／伺服器（Client/Server）** | **對等式（P2P）** |
|---|---|---|
| 結構 | **集中式**：少數伺服器提供服務 | **分散式**：每個節點平等 |
| 資源 | 集中在伺服器 | **分散在各節點** |
| 瓶頸 | **伺服器是瓶頸與單點失敗** | **無單點失敗，使用者越多資源越多** |

**運作精神**：**「共享、對等、分散、自治」**——**每位參與者都貢獻資源（頻寬、儲存、運算），也享用其他人的資源，集體形成強大能力**。

**特色**

| 特色 | 說明 |
|---|---|
| **1. 去中心化（分散式）** | **沒有或不依賴中央伺服器**，**節點直接連線** |
| **2. 對等（Peers 平等）** | **每個節點兼具用戶端與伺服器** |
| **3. 資源共享與聚合** | **聚合眾多個人電腦的閒置資源**（檔案、儲存、CPU、頻寬） |
| **4. 可擴充性高** | **節點越多，總資源越多、下載越快**（BitTorrent） |
| **5. 容錯性與強韌性高** | **沒有單點失敗**，**部分節點離線不影響整體** |
| **6. 成本低** | **不需要昂貴的中央伺服器與頻寬** |
| **7. 節點可以隨時加入與離開（動態性）** | **自我組織網路（Overlay Network）** |
| **8. 自治與匿名性** | **控制權分散**，部分系統提供匿名 |

**種類與例子**：**純 P2P（Gnutella，完全無中心）**、**混合式 P2P（Napster，有中央索引伺服器）**、**結構化 P2P（DHT：Chord、Kademlia）**；**應用**：**檔案分享（BitTorrent、eMule）、即時通訊（早期 Skype）、分散式運算（SETI@home、Folding@home）、區塊鏈與加密貨幣（比特幣）、內容傳遞**。

**(二) 在政府公務電腦使用 P2P 可能產生的問題（15 分）**

| 面向 | **問題** | **說明** |
|---|---|---|
| **1. 資訊安全風險** | **惡意程式與病毒入侵** | **從不明來源下載的檔案**可能夾帶**病毒、木馬、勒索軟體、間諜軟體**，**經由公務電腦進入政府內網** |
| | **開啟後門與增加攻擊面** | P2P 軟體**需要開放連接埠、接受外部連線**，**破壞防火牆的保護**，**成為入侵管道** |
| | **軟體本身的漏洞** | P2P 軟體常有漏洞 |

<script>/* ===== 關務三等考古題複習系統 — 應用邏輯 ===== */

const ALL_YEARS = [
  ...EXAM_DATA_CUSTOMS_3
];

const TOPIC_INFO = {
  net:  { name: '資通網路',   cls: 't-net'  },
  mis:  { name: '資訊管理',   cls: 't-mis'  },
  ds:   { name: '資料結構',   cls: 't-ds'   },
  db:   { name: '資料庫應用', cls: 't-db'   },
};

// 攤平成題目陣列
const ALL_Q = [];
ALL_YEARS.forEach(y => {
  y.questions.forEach(q => {
    ALL_Q.push({ ...q, year: y.year, subject: y.subject,
                 yearNote: y.note || '', timeLimit: y.timeLimit });
  });
});

let state = { mode: 'year', topic: 'all', search: '', terms: [] };
const openIds = new Set();   // 使用者展開的題目卡（重新渲染後仍保留）


/* ============================================================
   搜尋 / 跳轉 / 換行 共用工具（新增）
   ============================================================ */
const BREAK_AT_PERIOD = true;   // 解析遇到「。」自動換行；不想要就改成 false

/* 全形→半形、英文轉小寫；逐字處理，確保處理後長度不變（highlight 才對得準） */
function normText(s) {
  let out = '';
  for (const ch of String(s)) {
    const n = ch.normalize('NFKC').toLowerCase();
    out += (n.length === ch.length) ? n : ch;
  }
  return out;
}
function parseTerms(raw) {
  return [...new Set(normText(raw).split(/\s+/).filter(Boolean))];
}
/* 去掉資料裡用來排版的 HTML 標籤，避免搜 "br"、"code"、"strong" 時誤中 */
function stripTags(s) {
  return String(s == null ? '' : s)
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/?(?:strong|code|sub|sup|u|em|b|i|pre)(?:\s[^>]*)?>/gi, '')
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
}
/* 每個關鍵字都必須出現（AND）；總分 = 各關鍵字命中的最高權重欄位之和 */
function scoreFields(terms, fields) {
  let total = 0;
  for (const term of terms) {
    let best = 0;
    for (const f of fields) if (f.w > best && f.t.includes(term)) best = f.w;
    if (!best) return 0;
    total += best;
  }
  return total;
}
/* 在已渲染的 DOM 文字節點上標黃（不動 HTML 結構） */
function highlightIn(root, terms) {
  if (!root || !terms.length) return;
  const nodes = [];
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = walker.nextNode())) {
    if (!n.nodeValue.trim()) continue;
    const p = n.parentNode;
    if (p && p.closest && p.closest('svg, button, mark')) continue;
    nodes.push(n);
  }
  nodes.forEach(node => {
    const text = node.nodeValue, low = normText(text);
    const ranges = [];
    terms.forEach(t => {
      let i = low.indexOf(t);
      while (i !== -1) { ranges.push([i, i + t.length]); i = low.indexOf(t, i + t.length); }
    });
    if (!ranges.length) return;
    ranges.sort((a, b) => a[0] - b[0]);
    const merged = [ranges[0].slice()];
    for (let k = 1; k < ranges.length; k++) {
      const last = merged[merged.length - 1];
      if (ranges[k][0] <= last[1]) last[1] = Math.max(last[1], ranges[k][1]);
      else merged.push(ranges[k].slice());
    }
    const frag = document.createDocumentFragment();
    let pos = 0;
    merged.forEach(([s, e]) => {
      if (s > pos) frag.appendChild(document.createTextNode(text.slice(pos, s)));
      const m = document.createElement('mark');
      m.className = 'hl';
      m.textContent = text.slice(s, e);
      frag.appendChild(m);
      pos = e;
    });
    if (pos < text.length) frag.appendChild(document.createTextNode(text.slice(pos)));
    node.parentNode.replaceChild(frag, node);
  });
}

/* 解析換行：遇到「。」就換行（已有 <br>、句尾、或後面接」』）” 的不重複換） */
function breakSentences(s) {
  if (!BREAK_AT_PERIOD) return s;
  return String(s).replace(
    /。(?!(?:<\/[a-z]+>)*(?:\s*<br\s*\/?>|\s*$|[」』）)”"']))/gi,
    '。<br>'
  );
}

/* ---------- 搜尋框綁定（支援中文輸入法，組字中不觸發搜尋） ---------- */
function applySearch() {
  const input = document.getElementById('searchInput');
  state.search = input.value.trim();
  state.terms = parseTerms(state.search);
  render();
}
function clearSearch() {
  const input = document.getElementById('searchInput');
  input.value = '';
  document.getElementById('searchClear').classList.remove('show');
  applySearch();
  input.focus();
}
function bindSearch() {
  const input = document.getElementById('searchInput');
  const clearBtn = document.getElementById('searchClear');
  let timer, composing = false;
  const schedule = () => { clearTimeout(timer); timer = setTimeout(applySearch, 150); };
  input.addEventListener('compositionstart', () => { composing = true; });
  input.addEventListener('compositionend', () => { composing = false; schedule(); });
  input.addEventListener('input', () => {
    clearBtn.classList.toggle('show', input.value.length > 0);
    if (!composing) schedule();
  });
  input.addEventListener('keydown', e => { if (e.key === 'Escape') clearSearch(); });
  clearBtn.addEventListener('click', clearSearch);
}

/* ---------- 跳轉面板 ---------- */
let JUMP_ITEMS = [];
let JUMP_TITLE = '跳到年度';
function buildJump() {
  const fab = document.getElementById('jumpFab');
  const grid = document.getElementById('jumpGrid');
  document.getElementById('jumpTitle').textContent = JUMP_TITLE;
  fab.classList.toggle('show', JUMP_ITEMS.length > 0);

    `<button class="jump-item${it.done ? ' done' : ''}${it.open ? ' on' : ''}" onclick="jumpTo('${it.key}')">
       <b>${it.label}</b><small>${it.sub || ''}</small></button>`
  ).join('');
  if (!JUMP_ITEMS.length) toggleJump(false);
}
function toggleJump(force) {
  const p = document.getElementById('jumpPanel');
  p.hidden = (typeof force === 'boolean') ? !force : !p.hidden;
}
function scrollToGroup(key) {
  const el = document.getElementById('g-' + key);
  if (!el) return;
  const ctrl = document.querySelector('.controls');
  const top = el.getBoundingClientRect().top + window.scrollY - (ctrl ? ctrl.offsetHeight : 0) - 10;
  const root = document.documentElement;
  root.style.scrollBehavior = 'auto';          // 跳轉用瞬間定位，避免長距離捲動動畫
  window.scrollTo(0, Math.max(0, top));
  root.style.scrollBehavior = '';
}
document.addEventListener('click', e => {
  const p = document.getElementById('jumpPanel');
  if (p && !p.hidden && !p.contains(e.target) && !e.target.closest('#jumpFab')) p.hidden = true;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') toggleJump(false); });

/* ---------- 搜尋欄位索引 ---------- */
function plainAnswer(md) {
  return String(md || '')
    .replace(/```(?:htmldiagram|tree)\n[\s\S]*?```/g, ' ')   // 圖表/樹狀圖的 HTML、JSON 不列入搜尋
    .replace(/^#{1,4}\s+/gm, '')
    .replace(/\*\*|`/g, '')
    .replace(/\|/g, ' ')
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/?(?:strong|code|sub|sup|u|em|b|i)\s*>/gi, '');
}
function searchIndex(q) {
  return q._ix || (q._ix = {
    title: normText(stripTags(q.title)),
    ques:  normText(stripTags(q.question)),
    ans:   normText(plainAnswer(q.answer)),
    code:  normText(q.code ? q.code.text : ''),
    meta:  normText(q.year + ' ' + q.year + '年 第' + q.no + '題 ' +
                    ((TOPIC_INFO[q.topic] || {}).name || '') + ' ' + (q.part || ''))
  });
}
function searchFields(q) {
  const ix = searchIndex(q);
  return [{ t: ix.title, w: 10 }, { t: ix.ques, w: 6 }, { t: ix.ans, w: 3 },
          { t: ix.code, w: 2 }, { t: ix.meta, w: 1 }];
}
function bodyHit(q) {
  const ix = searchIndex(q);
  return state.terms.some(t => ix.ques.includes(t) || ix.ans.includes(t) || ix.code.includes(t));
}

/* ---------- 輕量 Markdown 渲染 ---------- */
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderMarkdown(md) {
  // 先抽出 ``` 程式碼/ASCII 區塊
  const blocks = [];
  md = md.replace(/```(\w*)\n([\s\S]*?)```/g, (m, lang, code) => {
    blocks.push({ lang, code });
    return `\u0000BLOCK${blocks.length - 1}\u0000`;
  });

  const lines = md.split('\n');
  let html = '', i = 0;

  while (i < lines.length) {
    let line = lines[i];

    // 區塊佔位
    if (/^\u0000BLOCK\d+\u0000$/.test(line.trim())) {
      const idx = parseInt(line.trim().match(/\d+/)[0]);
      const b = blocks[idx];
      // html-diagram 圍欄：直接輸出 HTML（用於圖表），不做跳脫
      if (b.lang === 'htmldiagram') {
        html += `<div class="html-diagram">${b.code}</div>`;
      } else if (b.lang === 'sql' || b.lang === 'json' || b.lang === 'javascript' || b.lang === 'xml') {
        // sql 圍欄：套用深色程式碼區塊與 SQL 語法高亮
        html += codeBlockHtml({ lang: b.lang, text: b.code.replace(/\n$/, '') });
      } else if (b.lang === 'tree') {
        // tree 圍欄：JSON 樹資料 → 自動產生對齊的 SVG 樹狀圖
        html += `<div class="html-diagram">${renderTreeSVG(b.code)}</div>`;
      } else {
        html += `<pre><code>${escapeHtml(b.code.replace(/\n$/,''))}</code></pre>`;
      }
      i++; continue;
    }

    // 表格
    if (line.includes('|') && i + 1 < lines.length &&
        /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1])) {
      const headers = line.split('|').map(c => c.trim()).filter(c => c !== '');
      i += 2;
      let rows = [];
      while (i < lines.length && lines[i].includes('|')) {
        const cells = lines[i].split('|').map(c => c.trim());
        // 去除頭尾空白格
        if (cells[0] === '') cells.shift();
        if (cells[cells.length-1] === '') cells.pop();
        rows.push(cells);
        i++;
      }
      html += '<table><thead><tr>' +
        headers.map(h => `<th>${inline(h)}</th>`).join('') +
        '</tr></thead><tbody>' +
        rows.map(r => '<tr>' +
          r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') +
        '</tbody></table>';
      continue;
    }

    // 標題
    let m;
    if ((m = line.match(/^####\s+(.*)/))) { html += `<h4>${inline(m[1])}</h4>`; i++; continue; }
    if ((m = line.match(/^###\s+(.*)/)))  { html += `<h4>${inline(m[1])}</h4>`; i++; continue; }

    // 無序清單
    if (/^\s*[-*]\s+/.test(line)) {
      let items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*[-*]\s+/, ''));
        i++;
      }
      html += '<ul>' + items.map(it => `<li>${breakSentences(inline(it))}</li>`).join('') + '</ul>';
      continue;
    }
    // 有序清單
    if (/^\s*\d+\.\s+/.test(line)) {
      let items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*\d+\.\s+/, ''));
        i++;
      }
      html += '<ol>' + items.map(it => `<li>${breakSentences(inline(it))}</li>`).join('') + '</ol>';
      continue;
    }

    // 空行
    if (line.trim() === '') { i++; continue; }

    // 一般段落（合併連續非空行）
    let para = [line];
    i++;
    while (i < lines.length && lines[i].trim() !== '' &&
           !/^\s*[-*]\s+/.test(lines[i]) && !/^\s*\d+\.\s+/.test(lines[i]) &&
           !/^#{3,4}\s/.test(lines[i]) &&
           !/^\u0000BLOCK\d+\u0000$/.test(lines[i].trim()) &&
           !(lines[i].includes('|') && i+1 < lines.length &&
             /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1]))) {
      para.push(lines[i]); i++;
    }
    html += `<p>${para.map(l => breakSentences(inline(l))).join('<br>')}</p>`;
  }
  return html;
}

// 行內語法：**粗體**、`code`、<u>底線</u>
function inline(s) {
  // 先抽出 `code` 片段保護起來，其餘文字才做標籤還原與粗體
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return '\u0001' + (codes.length - 1) + '\u0001'; });
  s = escapeHtml(s);
  // 還原資料中直接寫的白名單標籤（<u> 用於標示主鍵）
  s = s.replace(/&lt;(\/?)(strong|code|sub|sup|u)&gt;/g, '<$1$2>');
  s = s.replace(/&lt;br\s*\/?&gt;/g, '<br>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\u0001(\d+)\u0001/g, (m, i) => '<code>' + escapeHtml(codes[+i]) + '</code>');
  return s;
}

/* ---------- 二元樹 SVG 產生器 ---------- */
// 輸入 JSON：{ "v":"根值", "l":{子樹}, "r":{子樹} }
// l/r 可省略；空子樹可用 null。採對稱佈局：節點置於左右子樹正中央，
// 單子節點向左/右偏移固定距離，使左右視覺平衡。
function renderTreeSVG(json) {
  let root;
  try { root = JSON.parse(json.trim()); }
  catch (e) { return `<pre><code>樹資料格式錯誤</code></pre>`; }

  const NODE_R  = 21;       // 節點圓半徑
  const H_UNIT  = 32;       // 水平基本單位
  const V_GAP   = 76;       // 層與層垂直間距
  const PAD     = 30;       // 邊界留白

  // ── 遞迴佈局：回傳該子樹的 {width, rootX}（皆以 H_UNIT 為單位）──
  // 做法：左子樹先排好佔據 [0, lw)，右子樹排在 [lw+gap, ...)，
  //       父節點 x = 左右子根的中點；單子節點則讓父在子的對側偏移一格，
  //       使整棵子樹仍保有對稱的視覺重心。
  function layout(node, depth) {
    node._d = depth;
    const L = node.l, R = node.r;

    // 葉節點：寬度 1，根在 0
    if (!L && !R) {
      node._w = 1;
      node._x = 0;
      return;
    }

    // 雙子：左右子樹各自佈局，並排放置
    if (L && R) {
      layout(L, depth + 1);
      layout(R, depth + 1);
      const gap = 1;                         // 左右子樹之間留 1 單位
      // 左子樹佔 [0, L._w)，右子樹整體右移 L._w + gap
      const shift = L._w + gap;
      offset(R, shift);
      node._w = L._w + gap + R._w;
      node._x = (L._x + R._x) / 2;           // 父 = 左右子根中點
      return;
    }

    // 單左子：左子樹佈局後，父放在「左子根右側一格」
    if (L) {
      layout(L, depth + 1);
      node._x = L._x + 1;                    // 父在左子根右邊一格
      // 整棵子樹寬度 = 左子樹寬度，但要確保涵蓋父節點 x
      node._w = Math.max(L._w, node._x + 1);
      return;
    }

    // 單右子：右子樹佈局後，父放在「右子根左側一格」
    {
      layout(R, depth + 1);
      // 父在右子根左邊一格；若會 < 0 則整體右移
      let px = R._x - 1;
      if (px < 0) { offset(R, -px); px = 0; }
      node._x = px;
      node._w = Math.max(R._w + (px < 0 ? -px : 0), node._x + 1,
                         R._x + 1);
      return;
    }
  }
  // 把以 node 為根的整棵子樹所有 _x 平移 dx
  function offset(node, dx) {
    if (!node) return;
    node._x += dx;
    offset(node.l, dx);
    offset(node.r, dx);
  }
  layout(root, 0);

  // 收集座標範圍
  let minX = Infinity, maxX = -Infinity, maxDepth = 0;
  (function scan(node) {
    if (!node) return;
    minX = Math.min(minX, node._x);
    maxX = Math.max(maxX, node._x);
    maxDepth = Math.max(maxDepth, node._d);
    scan(node.l); scan(node.r);
  })(root);

  const width  = (maxX - minX) * H_UNIT + PAD * 2 + NODE_R * 2;
  const height = maxDepth * V_GAP + PAD * 2 + NODE_R * 2;

  function cx(node) { return PAD + NODE_R + (node._x - minX) * H_UNIT; }
  function cy(node) { return PAD + NODE_R + node._d * V_GAP; }

  // 第三遍：產生連線與節點
  let edges = '', nodes = '';
  function draw(node) {
    if (!node) return;
    const x = cx(node), y = cy(node);
    ['l', 'r'].forEach(side => {
      const child = node[side];
      if (child) {
        edges += `<line x1="${x}" y1="${y}" x2="${cx(child)}" y2="${cy(child)}" `
               + `stroke="#3d4456" stroke-width="2"/>`;
        draw(child);
      }
    });
    const palette = {
      accent: ['#fbf3f0', '#8a3324', '#8a3324'],
      blue:   ['#eef4f7', '#1f5673', '#1f5673'],
      gold:   ['#faf5e6', '#a07e2c', '#7a5d1e'],
      dim:    ['#e8e3d6', '#b3a98f', '#8a8266'],
      ink:    ['#1a1f2c', '#1a1f2c', '#ffffff'],
    };
    const [fill, stroke, txt] = palette[node.t] || palette.ink;
    nodes += `<circle cx="${x}" cy="${y}" r="${NODE_R}" `
           + `fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>`
           + `<text x="${x}" y="${y + 5}" text-anchor="middle" `
           + `font-size="15" font-weight="700" fill="${txt}">`
           + escapeHtml(String(node.v)) + `</text>`;
  }
  draw(root);

  return `<svg viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg" `
       + `style="max-width:${width}px;width:100%;font-family:'Noto Sans TC',sans-serif;">`
       + edges + nodes + `</svg>`;
}

/* ---------- 程式碼語法highlight（逐字元 tokenizer，不在 HTML 上做 regex）---------- */
function highlightCode(code, lang) {
  const kw = {
    c: ['int','char','void','return','if','else','for','while','do','struct','typedef','bool','long','double','float','define','include','sizeof','static','const','unsigned','break','continue','switch','case','NULL','true','false'],
    java: ['public','private','protected','class','int','void','return','if','else','for','while','do','new','static','final','abstract','extends','implements','import','package','this','super','boolean','double','String','char','long','float','try','catch','throw','throws','interface','null','true','false','break','continue'],
    python: ['def','return','if','elif','else','for','while','import','from','as','with','try','except','finally','class','None','True','False','and','or','not','in','is','lambda','break','continue','global','print'],
    javascript: ['function','return','if','else','for','while','let','const','var','new','class','this','try','catch','import','export','from','null','true','false','typeof','break','continue','console'],
    php: ['function','return','if','else','elseif','for','while','foreach','as','class','new','public','private','echo','true','false','null','require','include'],
    json: ['true','false','null'],
    xml: [],
    sql: ['SELECT','FROM','WHERE','GROUP','BY','HAVING','ORDER','AS','AND','OR','NOT','IN','IS','NULL','LIKE','BETWEEN','EXISTS','DISTINCT','JOIN','INNER','LEFT','RIGHT','OUTER','FULL','CROSS','ON','USING','UNION','INTERSECT','EXCEPT','ALL','ANY','CREATE','ALTER','DROP','TABLE','VIEW','INDEX','INSERT','INTO','VALUES','UPDATE','SET','DELETE','PRIMARY','KEY','FOREIGN','REFERENCES','CHECK','UNIQUE','DEFAULT','CONSTRAINT','GRANT','REVOKE','COUNT','SUM','AVG','MAX','MIN','CASE','WHEN','THEN','ELSE','END','ASC','DESC','LIMIT','WITH','TRIGGER','BEGIN','COMMIT','ROLLBACK']
  };
  const list = new Set(kw[lang] || kw.c);

  let out = '';
  let i = 0;
  const n = code.length;
  // 包一段文字成指定 token 樣式（內容先 escape）
  const wrap = (cls, text) => `<span class="${cls}">${escapeHtml(text)}</span>`;

  const isWordChar = c => /[A-Za-z0-9_@]/.test(c);
  const isDigit = c => c >= '0' && c <= '9';

  while (i < n) {
    const c = code[i];
    const two = code.substr(i, 2);

    // 區塊註解 /* ... */
    if (two === '/*') {
      let j = code.indexOf('*/', i + 2);
      if (j === -1) j = n; else j += 2;
      out += wrap('tok-com', code.slice(i, j));
      i = j; continue;
    }
    // SQL 行註解 -- ...
    if (lang === 'sql' && two === '--') {
      let j = code.indexOf('\n', i);
      if (j === -1) j = n;
      out += wrap('tok-com', code.slice(i, j));
      i = j; continue;
    }
    // 行註解 //...
    if (two === '//') {
      let j = code.indexOf('\n', i);
      if (j === -1) j = n;
      out += wrap('tok-com', code.slice(i, j));
      i = j; continue;
    }
    // 行註解 #...（Python；PHP 也用，C 的 #include 也歸此類顯示為註解色以外——改用關鍵字處理）
    if (c === '#' && (lang === 'python' || lang === 'php')) {
      let j = code.indexOf('\n', i);
      if (j === -1) j = n;
      out += wrap('tok-com', code.slice(i, j));
      i = j; continue;
    }
    // 字串 "..." 或 '...'（含跳脫 \）
    if (c === '"' || c === "'") {
      let j = i + 1;
      while (j < n && code[j] !== c) {
        if (code[j] === '\\') j++;   // 跳過跳脫字元
        j++;
      }
      j = Math.min(j + 1, n);
      out += wrap('tok-str', code.slice(i, j));
      i = j; continue;
    }
    // 數字
    if (isDigit(c)) {
      let j = i;
      while (j < n && /[0-9.]/.test(code[j])) j++;
      out += wrap('tok-num', code.slice(i, j));
      i = j; continue;
    }
    // 識別字（可能是關鍵字）
    if (isWordChar(c) && !isDigit(c)) {
      let j = i;
      while (j < n && isWordChar(code[j])) j++;
      const word = code.slice(i, j);
      if (list.has(word) || (lang === 'sql' && list.has(word.toUpperCase()))) out += wrap('tok-kw', word);
      else out += escapeHtml(word);
      i = j; continue;
    }
    // 其他單一字元
    out += escapeHtml(c);
    i++;
  }
  return out;
}

function codeBlockHtml(codeObj) {
  if (!codeObj) return '';
  const langLabel = {
    c: 'C', java: 'Java', python: 'Python',
    javascript: 'JavaScript', php: 'PHP', sql: 'SQL', json: 'JSON', xml: 'XML'
  }[codeObj.lang] || codeObj.lang;
  return `<div class="code-block">
    <div class="code-head">
      <span class="dots"><span></span><span></span><span></span></span>
      <span>${langLabel}</span>
    </div>
    <pre><code>${highlightCode(codeObj.text, codeObj.lang)}</code></pre>
  </div>`;
}

/* ---------- 渲染題目卡 ---------- */
function bodyHtml(q) {
  return `      <span class="section-label q">考題</span>
      <div class="q-question">${escapeHtml(q.question).replace(/&lt;u&gt;([\s\S]*?)&lt;\/u&gt;/g, '<u>$1</u>')}</div>
      ${q.figure ? `<div class="q-figure" style="margin:.7rem 0">${q.figure}</div>` : ''}
      <span class="section-label a">詳解</span>
      <div class="q-answer">${renderMarkdown(q.answer)}</div>
      ${q.code ? codeBlockHtml(q.code) : ''}`;
}

function fillBody(card) {
  if (card.dataset.filled) return;
  const q = ALL_Q.find(x => x.id === card.dataset.id);
  if (!q) return;
  const box = card.querySelector('.q-body');
  box.innerHTML = bodyHtml(q);
  card.dataset.filled = '1';
  if (state.terms.length) highlightIn(box, state.terms);
}

function questionCard(q, forceOpen) {
  const t = TOPIC_INFO[q.topic] || { name: q.topicName, cls: '' };
  const isOpen = openIds.has(q.id) || !!forceOpen;
  return `<div class="q-card ${t.cls}${isOpen ? ' open' : ''}" data-id="${q.id}"${isOpen ? ' data-filled="1"' : ''}>
    <div class="q-header" onclick="toggleCard(this)">
      <div class="q-no">${q.no}</div>
      <div class="q-headmain">
        <div class="q-title">${escapeHtml(q.title)}</div>
        <div class="q-tags">
          <span class="tag tag-topic">${t.name}</span>
          <span class="tag tag-year">${q.year}年</span>
          ${q.part ? `<span class="tag tag-part">${escapeHtml(q.part)}　第${q.no}題</span>` : ''}
          <span class="tag tag-score">${q.score}分</span>
        </div>
      </div>
      <div class="q-toggle">+</div>
    </div>
    <div class="q-body">${isOpen ? bodyHtml(q) : ''}</div>
  </div>`;
}

/* ---------- 篩選 ---------- */
function filterQuestions() {
  let list = ALL_Q.filter(q => state.topic === 'all' || q.topic === state.topic);
  if (state.terms.length) {
    // 多關鍵字 AND、全形半形統一、依相關度排序（標題 > 考題 > 詳解 > 程式碼）
    list = list
      .map((q, i) => ({ q, i, s: scoreFields(state.terms, searchFields(q)) }))
      .filter(x => x.s > 0)
      .sort((a, b) => b.s - a.s || a.i - b.i)
      .map(x => x.q);
  }
  return list;
}

/* ---------- 渲染主內容 ---------- */
function updateSearchInfo(count, autoOpen) {
  const el = document.getElementById('searchInfo');
  if (!state.terms.length) { el.classList.remove('show'); el.innerHTML = ''; return; }
  let h = `找到 <b>${count}</b> 題 ‧ 依相關度排序`;
  if (count > 30) h += ' ‧ 結果較多，已不自動展開詳解，可再加關鍵字縮小範圍';
  else h += ' ‧ 詳解中有符合的題目已自動展開並標黃';
  el.innerHTML = h;
  el.classList.add('show');
}

function render() {
  const list = filterQuestions();
  const wrap = document.getElementById('content');
  const searching = state.terms.length > 0;
  const autoOpen = searching && list.length <= 30;
  JUMP_ITEMS = [];
  updateSearchInfo(list.length, autoOpen);

  if (list.length === 0) {
    const msg = searching
      ? `找不到符合「${escapeHtml(state.search)}」的題目。可改用較短的關鍵字；多個關鍵字請用空格分開。`
      : '找不到符合條件的題目';
    wrap.innerHTML = `<div class="empty">
      <div class="big">📭</div>
      <p>${msg}</p>
    </div>`;
    buildJump();
    syncExpandBtn();
    return;
  }

  let html = '';

  if (searching) {
    html += `<div class="group">
      <div class="group-head">
        <span class="g-badge">搜尋</span>
        <span class="g-title">依相關度排序</span>
        <span class="g-meta">共 ${list.length} 題</span>
      </div>
      ${list.map(q => questionCard(q, autoOpen && bodyHit(q))).join('')}
    </div>`;
  } else if (state.mode === 'year') {
    JUMP_TITLE = '跳到年度';
    // 依「年度＋科目」分組（三等每年有多個科目）
    const byYear = {};
    list.forEach(q => { const k = q.year + '|' + q.topic; (byYear[k] = byYear[k] || []).push(q); });
    const topicOrder = Object.keys(TOPIC_INFO);
    const keys = Object.keys(byYear).sort((a, b) => {
      const [ya, ta] = a.split('|'), [yb, tb] = b.split('|');
      return (Number(yb) - Number(ya)) || (topicOrder.indexOf(ta) - topicOrder.indexOf(tb));
    });
    keys.forEach(k => {
      const [yr, tk] = k.split('|');
      const qs = byYear[k];
      const yObj = ALL_YEARS.find(y => y.year === yr && y.topic === tk);
      const totalScore = qs.reduce((s, q) => s + q.score, 0);
      const gid = yr + '-' + tk;
      JUMP_ITEMS.push({ key: 'y' + gid, label: yr, sub: TOPIC_INFO[tk].name });
      html += `<div class="group" id="g-y${gid}">
        <div class="group-head">
          <span class="g-badge">${yr} 年</span>
          <span class="g-title">${escapeHtml(yObj.subject)}</span>
          <span class="g-meta">
            ${yObj.timeLimit ? '考試時間 ' + yObj.timeLimit + '<br>' : ''}
            本頁 ${qs.length} 題 / ${totalScore} 分
          </span>
        </div>
        ${yObj.note ? `<div class="group-note">※ ${escapeHtml(yObj.note)}</div>` : ''}
        ${qs.map(q => questionCard(q)).join('')}
      </div>`;
    });
  } else {
    JUMP_TITLE = '跳到科目';
    // 依主題分組
    const byTopic = {};
    list.forEach(q => { (byTopic[q.topic] = byTopic[q.topic] || []).push(q); });
    Object.keys(TOPIC_INFO).forEach(tk => {
      const qs = byTopic[tk];
      if (!qs || qs.length === 0) return;
      // 同主題內依年度新到舊、再依題號
      qs.sort((a, b) => Number(b.year) - Number(a.year));
      const t = TOPIC_INFO[tk];
      JUMP_ITEMS.push({ key: 't' + tk, label: t.name, sub: `${qs.length} 題` });
      html += `<div class="group" id="g-t${tk}">
        <div class="group-head">
          <span class="g-badge">${t.name}</span>
          <span class="g-title">歷年考題彙整</span>
          <span class="g-meta">共 ${qs.length} 題<br>跨 ${new Set(qs.map(q=>q.year)).size} 個年度</span>
        </div>
        ${qs.map(q => questionCard(q)).join('')}
      </div>`;
    });
  }

  wrap.innerHTML = html;
  if (searching) highlightIn(wrap, state.terms);
  buildJump();
  syncExpandBtn();
}

function jumpTo(key) {
  toggleJump(false);
  scrollToGroup(key);
}

/* ---------- 互動 ---------- */
function toggleCard(headerEl) {
  const card = headerEl.parentElement;
  const open = card.classList.toggle('open');
  if (open) fillBody(card);
  if (open) openIds.add(card.dataset.id); else openIds.delete(card.dataset.id);
  syncExpandBtn();
}

function setMode(mode) {
  state.mode = mode;
  document.querySelectorAll('.mode-switch button').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  render();
}

function updateStatBar() {
  const scope = ALL_Q;
  const yearSet = new Set(scope.map(q => q.year));
  document.getElementById('statYear').textContent = yearSet.size;
  document.getElementById('statQ').textContent = scope.length;
  document.getElementById('statTopic').textContent = new Set(scope.map(q => q.topic)).size;
}

function rebuildTopicChips() {
  const scope = ALL_Q;
  const topicCount = {};
  scope.forEach(q => topicCount[q.topic] = (topicCount[q.topic]||0)+1);
  const filterRow = document.getElementById('filterRow');
  let chips = `<button class="chip ${state.topic === 'all' ? 'active' : ''}" data-topic="all"
    onclick="setTopic('all')">全部<span class="c-count">${scope.length}</span></button>`;
  Object.keys(TOPIC_INFO).forEach(tk => {
    const cnt = topicCount[tk] || 0;
    if (cnt === 0) return;
    chips += `<button class="chip ${state.topic === tk ? 'active' : ''}" data-topic="${tk}"
      onclick="setTopic('${tk}')">${TOPIC_INFO[tk].name}<span class="c-count">${cnt}</span></button>`;
  });
  filterRow.innerHTML = chips;
}

function setTopic(topic) {
  state.topic = topic;
  document.querySelectorAll('.chip').forEach(c => {
    c.classList.toggle('active', c.dataset.topic === topic);
  });
  render();
}

/* 按鈕文字依「目前畫面上的卡片是否都已展開」決定，不再用獨立旗標 */
function syncExpandBtn() {
  const cards = [...document.querySelectorAll('.q-card')];
  const allOpen = cards.length > 0 && cards.every(c => c.classList.contains('open'));
  document.getElementById('btnExpand').textContent = allOpen ? '全部收合' : '全部展開';
}
function toggleExpandAll() {
  const cards = [...document.querySelectorAll('.q-card')];
  const allOpen = cards.length > 0 && cards.every(c => c.classList.contains('open'));
  cards.forEach(c => {
    c.classList.toggle('open', !allOpen);
    if (!allOpen) fillBody(c);
    if (allOpen) openIds.delete(c.dataset.id); else openIds.add(c.dataset.id);
  });
  syncExpandBtn();
}

/* ---------- 初始化 ---------- */
function updateHeaderTexts() {
  const ys = ALL_YEARS.map(y => Number(y.year));
  const lo = Math.min(...ys), hi = Math.max(...ys);
  const range = lo === hi ? `${hi} 年` : `${lo} 年 ～ ${hi} 年`;
  const subs = [...new Set(ALL_YEARS.map(y => y.subject))].join('、');
  document.getElementById('subLine').textContent = `${range} ‧ ${subs} ‧ 逐題解析`;
  document.getElementById('footLine').textContent =
    `本系統目前收錄 ${range}${subs}非選擇題共 ${ALL_Q.length} 題，所有詳解為依專業知識編寫之參考解答，非官方標準答案。`;
}

function init() {
  updateHeaderTexts();
  updateStatBar();
  rebuildTopicChips();

  bindSearch();

  // 回頂部
  const toTop = document.getElementById('toTop');
  window.addEventListener('scroll', () => {
    toTop.classList.toggle('show', window.scrollY > 600);
  });

  render();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
