      id: "cs3-db-105-3", no: "三", topic: "db", topicName: "資料庫應用",
      title: "找候選鍵的兩個要點為何成立（從未出現在右手邊／僅出現在右手邊的屬性）",
      score: 20,
      question: `若已知一個關聯綱目（Relation Schema）R 及其功能相依性（Functional Dependencies）之集合 F，欲找出 R 所有的鍵（Keys）之方法有二個要點如下：
㈠R 中某一屬性若從未在 F 中任一個功能相依性的右手邊出現過，則此屬性必為鍵（Key）之一部分。
㈡R 中某一屬性若僅在 F 中之功能相依性的右手邊出現，則此屬性必不為鍵（Key）之一部分。
一個功能相依性 X → Y，X 代表左手邊，Y 代表右手邊，請說明此二個要點成立之原因為何？（20 分）`,
      answer: `**先備知識**

- **鍵（候選鍵）K**：滿足 (1) **K⁺ = R**（K 的屬性封閉集合包含所有屬性），且 (2) **最小性**：拿掉 K 的任何屬性，封閉集合就不再是 R。
- **屬性封閉集合 K⁺** 的計算：從 K 開始，只要某個函數相依 X → Y 的左邊 X 已在目前集合內，就把右邊 Y 加入，重複直到不再增加。換句話說，**除了 K 本身的屬性之外，一個屬性只能因為「它出現在某個函數相依的右手邊」而被加入。**

**(一) 要點一：從未在右手邊出現的屬性，必為鍵的一部分**

**要證明**：若屬性 A 不在 F 中任何函數相依的右手邊，則 A 必屬於 R 的每一個鍵。

**證明**：

1. 設 K 是 R 的任一個鍵，則 K⁺ = R，所以 A ∈ K⁺。
2. 由封閉集合的計算方式，A 要被放進 K⁺，只有兩種可能：A 本來就在 K 中，或 A 出現在某個函數相依的右手邊而被加入。
3. 依假設 A **從未出現在任何右手邊**，所以第二種可能不存在。
4. 因此 A 只能「本來就在 K 中」，即 **A ∈ K**。

因為 K 是任意的鍵，所以 A 屬於每一個鍵。**白話**：沒有任何其他屬性能決定它，只能靠自己（把它放進鍵裡）才能得到它。

**例**：R(A, B, C)，F = { A → B }。C 從未在右手邊 → C 必在鍵中。A 也從未在右手邊 → A 必在鍵中。(AC)⁺ = ABC，所以鍵為 AC。

**(二) 要點二：僅在右手邊出現的屬性，必不為鍵的一部分**

「僅在右手邊出現」是指：A 至少在一個函數相依的右手邊出現，但**從未出現在任何函數相依的左手邊**。

**要證明**：這樣的 A 不會屬於任何鍵。

**證明（反證法）**：

1. 假設 A 屬於某個鍵 K，令 K' = K − {A}。要證明 K' 仍然能決定所有屬性（K'⁺ = R），這與「K 是最小的」矛盾。
2. **A 從未出現在任何左手邊**，所以計算封閉集合時，A 永遠不會成為「觸發某個函數相依」的條件。也就是說，在 K⁺ 的計算過程中，A 的存在不會多推出任何其他屬性。因此 K'⁺（沒有 A）仍然能推出 R 中**除了 A 以外**的所有屬性：K'⁺ ⊇ R − {A}。
3. 另一方面，A 出現在某個函數相依 X → Y 的右手邊（A ∈ Y）。由於 A 不在任何左手邊，所以 A ∉ X，即 X ⊆ R − {A} ⊆ K'⁺。於是 X 已在 K'⁺ 內，函數相依 X → Y 被觸發，**A 也被加入 K'⁺**。
4. 因此 K'⁺ = R，即 K' = K − {A} 也是一個能決定全部屬性的集合，而 K'比 K 小，與「K 是最小的（鍵）」矛盾。
5. 所以假設不成立，**A 不屬於任何鍵**。

**白話**：這種屬性是「被別人決定、但自己不決定任何人」的終端屬性。它既然能被其他屬性推出來，就不需要放進鍵中；放進去只會讓鍵不夠最小。

**例**：R(A, B, C)，F = { A → B, B → C }。C 只在右手邊出現 → C 不在任何鍵中。A 從未在右手邊 → A 在鍵中，(A)⁺ = ABC，所以鍵是 A。

**(三) 兩個要點的用途與整理**

| 屬性類型 | 在 F 中的出現情形 | 與鍵的關係 | 原因 |
|---|---|---|---|
| 只出現在左手邊（或完全沒出現過） | 從未在右手邊 | **一定在每個鍵中** | 沒有其他屬性能推出它 |
| 只出現在右手邊 | 從未在左手邊 | **一定不在任何鍵中** | 它不影響其他屬性的推導，卻能被推出，放入鍵只會讓鍵不最小 |
| 兩邊都出現 | 左右手邊皆有 | **不確定**，需用封閉集合檢驗 | 可能被推出，也可能用於推出其他屬性 |

**用途**：找候選鍵時，先把「一定在鍵中」的屬性組成起點 N，「一定不在鍵中」的屬性排除，只需對剩下的「兩邊都出現」的屬性做試探，大幅縮小搜尋範圍；若 N⁺ = R，N 就是唯一的候選鍵。`
    },
    {
      id: "cs3-db-105-4", no: "四", topic: "db", topicName: "資料庫應用",
      title: "R(A,B,C,D,E)、F={AC→E, AC→D, BC→D, ACD→BE}：最高正規型式與最小覆蓋（Minimal Cover）",
      score: 25,
      question: `已知關聯綱目（Relation Schema）R = {A，B，C，D，E}，其功能相依性（Functional Dependencies）之集合 F = {AC → E，AC → D，BC → D，ACD → BE}
㈠試問 R 所滿足之最高正規型式（Normal Form）為何？請說明原因。（10 分）
㈡試問 F 之最小集合（Minimal Set）為何？請解釋每一步驟。（15 分）`,
      answer: `**(一) R 滿足的最高正規型式：第二正規型式（2NF）**

**步驟 1：找候選鍵**

- A、C 從未在任何函數相依的右手邊出現，所以 **A、C 必在每個鍵中**。
- (AC)⁺：AC → E、D，得 ACDE；ACD → BE，得 B。所以 (AC)⁺ = ABCDE。
- 所以 **AC 是唯一的候選鍵**（A、C 缺一不可，且任何鍵必含 AC）。主屬性：A、C；非主屬性：B、D、E。

**步驟 2：檢查各正規型式**

| 函數相依 | 左邊是超鍵？ | 右邊是主屬性？ | 結果 |
|---|---|---|---|
| AC → E | 是（AC） | — | 符合 |
| AC → D | 是 | — | 符合 |
| ACD → BE | 是（含 AC） | — | 符合 |
| **BC → D** | **否**（BC 不含 A，不是超鍵） | **否**（D 是非主屬性） | **違反 3NF 與 BCNF** |

| 正規型式 | 判斷 | 理由 |
|---|---|---|
| 1NF | 符合 | 屬性皆為單一值 |
| **2NF** | **符合** | 唯一的候選鍵 AC 的真子集是 A、C；沒有任何非主屬性只相依於 A 或只相依於 C（BC → D 的左邊 BC 不是鍵的真子集） |
| 3NF | **不符合** | BC → D：BC 不是超鍵，D 不是主屬性。實際上形成傳遞相依：AC → B（由 AC → D 與 ACD → B 得到），B 與 C 共同決定 D，即 AC → BC → D |
| BCNF | 不符合 | BC → D 的決定者 BC 不是超鍵 |

**結論**：R 符合 2NF，但不符合 3NF，故**最高正規型式為第二正規型式（2NF）**。

**(二) 求 F 的最小覆蓋（Minimal Cover）**

最小覆蓋 Fc 必須滿足：(1) 每個函數相依的右邊只有**一個屬性**；(2) 左邊沒有**多餘（extraneous）**的屬性；(3) 沒有**多餘（可由其他推得）**的函數相依；且與 F 等價。

**步驟 1：把右邊拆成單一屬性**

F = {AC → E, AC → D, BC → D, ACD → B, ACD → E}

**步驟 2：消除左邊多餘的屬性**

| 函數相依 | 檢查 | 結果 |
|---|---|---|
| AC → E、AC → D、BC → D | 單一屬性 A、C、B 的封閉集合都不含右邊（A⁺ = A，C⁺ = C，B⁺ = B），左邊都沒有多餘屬性 | 保留 |
| **ACD → B** | 檢查 D 是否多餘：計算 (AC)⁺ ＝ ACDE（由 AC → D、E），再因 ACD → B 得 B，所以 AC → B 成立 → **D 多餘** | 改為 **AC → B** |
| **ACD → E** | 檢查 D 是否多餘：AC → E 已在 F 中 → **D 多餘** | 改為 AC → E（與已有的重複，可刪） |

得到 F' = {AC → E, AC → D, BC → D, AC → B}（重複的 AC → E 只留一個）。

**步驟 3：消除多餘的函數相依**（逐一移除後檢查是否仍可推得）

| 嘗試移除 | 用其餘函數相依計算左邊的封閉集合 | 能否推得 | 結論 |
|---|---|---|---|
| AC → E | 其餘 {AC → D, BC → D, AC → B}：(AC)⁺ = ACDB，**沒有 E** | 否 | **必要，保留** |
| **AC → D** | 其餘 {AC → E, BC → D, AC → B}：(AC)⁺ = AC → E、B → ACEB；有 B 與 C，BC → D 得 **D** | **能** | **多餘，刪除** |
| AC → B | 其餘 {AC → E, BC → D}：(AC)⁺ = ACE，**沒有 B** | 否 | **必要，保留** |
| BC → D | 其餘 {AC → E, AC → B}：(BC)⁺ = BC，**沒有 D** | 否 | **必要，保留** |

刪除 AC → D 後，其餘相依仍能推得它（AC → B，再與 C 得 BC，由 BC → D 得 D），所以 F 與新集合等價。

**最小覆蓋**

> **Fc = { AC → B, AC → E, BC → D }**（亦可合併寫成 { AC → BE, BC → D }）

**驗證**：(AC)⁺ = ACBE，再由 BC → D 得 D → ABCDE，與原 F 等價；每個右邊都是單一屬性、左邊沒有多餘屬性、沒有可刪除的函數相依。

**延伸**：以最小覆蓋做 3NF 合成分解，可得 R1(<u>A</u>, <u>C</u>, B, E)、R2(<u>B</u>, <u>C</u>, D)，皆符合 3NF，並保持函數相依。`

**(三) 舉例說明資訊的遺失**

假設三元關係 SUPPLY(供應商, 零件, 專案) 實際記錄了 3 筆事實：

| 供應商 | 零件 | 專案 |
|---|---|---|
| S1 | P1 | J1 |
| S1 | P2 | J2 |
| S2 | P1 | J2 |

意思是：S1 供應 P1 給 J1；S1 供應 P2 給 J2；S2 供應 P1 給 J2。

**步驟 1：拆成三個二元關係（各取兩個欄位投影）**

| CAN_SUPPLY（供應商, 零件） | USES（零件, 專案） | SERVES（供應商, 專案） |
|---|---|---|
| (S1, P1)<br>(S1, P2)<br>(S2, P1) | (P1, J1)<br>(P2, J2)<br>(P1, J2) | (S1, J1)<br>(S1, J2)<br>(S2, J2) |

**步驟 2：把三個二元關係再連接回去**，檢查 (供應商, 零件, 專案) 的組合是否同時被三個關係支持：

| 組合 | CAN_SUPPLY | USES | SERVES | 原三元關係中有嗎？ |
|---|---|---|---|---|
| (S1, P1, J1) | ✓ | ✓ | ✓ | 有 |
| (S1, P2, J2) | ✓ | ✓ | ✓ | 有 |
| (S2, P1, J2) | ✓ | ✓ | ✓ | 有 |
| **(S1, P1, J2)** | ✓ (S1,P1) | ✓ (P1,J2) | ✓ (S1,J2) | **沒有** |

結果多出一筆 **(S1, P1, J2)**：它被三個二元關係「同時支持」，但**原本並不存在**，S1 其實從未供應 P1 給 J2。這個假資料列稱為**虛假組合（spurious tuple）**，也就是連接陷阱（connection trap）。

**原因**：三個二元關係只知道「S1 能供應 P1」、「J2 用到 P1」、「S1 服務 J2」，卻無法知道 **「S1 是否正是以 P1 供應給 J2」** 這個三方共同的事實。

**(四) 重點整理**

| 比較項目 | 三元關係 | 三個二元關係 |
|---|---|---|
| 記錄的事實 | 三個實體**同時**參與的一個事實 | 兩兩之間各自成立的事實 |
| 能否回答「S1 是否以 P1 供應給 J2？」 | 能，直接查是否有 (S1, P1, J2) | **不能**，只能知道三組兩兩關係都成立 |
| 還原原資料 | 本身就是原資料 | 連接後可能產生**虛假列**，不能無損還原 |
| 關聯的屬性（如供應數量） | 屬於「三者的組合」，可放在三元關係上 | 無法表示是哪一個三方組合的數量 |

**例外**：若有額外的語意限制（例如「只要 S 供應 P、P 被 J 使用、S 服務 J，就一定表示 S 供應 P 給 J」，即連接相依性），三元關係才能無損地拆成三個二元關係。一般情形下沒有這種限制，所以**不能把三元關係當作三個二元關係的結合**。`

**(一) 交集（Intersection）**

R、S 必須聯集相容（欄位數與型態相同）。

> **R ∩ S = R − (R − S)**　（或 R ∩ S = S − (S − R)）

**說明**：R − S 是「只在 R、不在 S」的元組；再從 R 中去掉這些，剩下的就是 R 與 S 共有的元組。

**例**：R = {1, 2, 3}，S = {2, 3, 4}。R − S = {1}；R − (R − S) = {1, 2, 3} − {1} = {2, 3} = R ∩ S。

**(二) 自然合併（Natural Join）**

設 R(A, B)、S(B, C)，兩者共同的屬性是 B。自然合併 R ⋈ S 的結果是：在共同屬性 B 上**值相等**的元組配對，且共同屬性只保留一份。

寫成標準的步驟：

1. **更名**：把 S 的共同屬性改名以避免與 R 重複，S' = ρ S'(B', C)(S)。
2. **卡氏積**：R × S'，得到所有可能的配對。
3. **選擇**：σ B = B' (R × S')，只保留共同屬性值相等的配對。
4. **投影**：π A, B, C，去掉重複的共同屬性（B'），得到結果。

> **R ⋈ S = π A, B, C ( σ B = B' ( R × ρ S'(B', C)(S) ) )**

**一般式**：R 與 S 的共同屬性為 X₁…Xₙ，則

> R ⋈ S = π (R 的屬性 ∪ S 的非共同屬性) ( σ R.X₁ = S'.X₁' ∧ … ∧ R.Xₙ = S'.Xₙ' ( R × ρ S'(S 的屬性，共同屬性改名) ) )

- σ 學號 = 學號' 只留 (S1, 小明, S1, DB)。
- π 學號, 姓名, 課程 得到 (S1, 小明, DB)，即 R ⋈ S。

|---|---|

      question: `基於關聯式模式（relational model）的理論，請列出關聯表（relation）的四大特性（property），並說明之。（20 分）`,
      answer: `**關聯表（relation）的四大特性**

| 編號 | 特性 | 說明 | 若違反會怎樣 |
|---|---|---|---|
| 1 | **屬性值不可再分（原子性，Atomic）** | 表格中每個格子（元組在某屬性上的值）都只能是**單一、不可再分割的值**，不能是陣列、集合或另一個表格（即符合第一正規化，不允許多值屬性與重複群組） | 無法用標準的關聯運算與 SQL 處理；須拆成另一個表格 |
| 2 | **同一屬性的值屬於同一定義域（Domain）** | 同一個欄位的所有值必須來自**同一個定義域**（相同的資料型態與意義），不同列的同一欄不能混放不同類型的資料 | 資料無法比較、運算，也無法套用型態與範圍的限制 |
| 3 | **屬性（欄位）名稱不重複，且屬性的順序不重要** | 同一個關聯表中，**每個屬性名稱唯一**；屬性之間**沒有先後次序**，以名稱（而非位置）識別 | 查詢與連接會有歧義 |
| 4 | **元組（列）不重複，且元組的順序不重要** | 關聯表是元組的**集合**：**不會有兩個完全相同的元組**（因此每個元組可由主鍵唯一識別）；元組之間**沒有先後次序** | 無法唯一識別資料；結果受排列順序影響 |

**舉例**（學生表）

| 學號 | 姓名 | 電話 |
|---|---|---|
| S01 | 王小明 | 0912-345-678 |
| S02 | 李小華 | 0922-456-789 |

| 特性 | 符合的情形 | 違反的情形 |
|---|---|---|
| 1 原子性 | 一個電話一欄 | 電話欄位放「0912-…, 02-…」兩個電話 |
| 2 同一定義域 | 「學號」欄都是字串 S01、S02 | 「學號」欄中混放 S01 與數字 3.14 |
| 3 屬性名稱唯一、順序無關 | 學號、姓名、電話三個名稱各不相同；把「姓名」與「電話」對調順序，仍是同一個表格 | 同一表格出現兩個名稱都是「姓名」的欄位 |
| 4 元組不重複、順序無關 | 每位學生一列，列的排列順序不影響意義 | 兩列內容完全相同的 (S01, 王小明, 0912-345-678) |

**補充**：這四項特性使關聯表在數學上對應於「定義域笛卡兒積的子集」，是關聯代數與 SQL 能正確運作的基礎。實務上的 SQL 資料表允許重複列（以多重集合處理），但在關聯模型中以主鍵來保證元組不重複。`

      answer: `**資料庫設計的三個階段**

需求分析 → **概念設計**（ER／EER 模型）→ **邏輯設計** → **實體設計** → 實作與維護。

**(一) 邏輯資料庫設計（Logical Database Design）**

**定義**：把概念設計（如 ER 圖）轉換成**特定資料模型**（通常是關聯模型）的綱要，**只關心「資料如何組織與關聯」，不涉及資料實際如何儲存在磁碟上**。

主要工作：

1. 將 ER／EER 圖轉成**關聯表**（實體、關聯、子類型、多值屬性的對應）。
2. 決定每個表格的**屬性、資料型態、主鍵、外來鍵**。
3. 進行**正規化**（1NF～BCNF），消除冗餘與異常。
4. 定義**完整性限制**（參照完整性、域限制）與**視界（View）**、使用者權限。

特點：**與具體 DBMS 的儲存細節無關**，注重資料的正確性與一致性。

**(二) 實體資料庫設計（Physical Database Design）**

**定義**：根據邏輯綱要與**特定 DBMS 及硬體環境**，決定資料在儲存媒體上的**實際組織方式**，目標是**滿足效能、儲存空間與維護的需求**。

主要工作：

1. 選擇**檔案組織方式**與儲存結構（堆積檔、排序檔、雜湊檔、叢集 clustering）。
2. 設計**索引**（在哪些欄位建立、索引種類，如 B+ 樹、雜湊、點陣圖）。
3. 決定**資料表分割（partition）**、表格空間、磁碟配置與緩衝區大小。
4. 依查詢效能需求進行**反正規化**、建立彙總表或實體化視界。
5. 決定欄位的實際儲存型態與長度、備份與回復策略。

**(三) 比較**

| 比較項目 | 邏輯資料庫設計 | 實體資料庫設計 |
|---|---|---|
| 關注重點 | 資料的結構與關係（**是什麼**） | 資料的儲存與存取效率（**怎麼存**） |
| 輸入／輸出 | 輸入：概念模型（ER 圖）；輸出：關聯綱要（表格、鍵、限制） | 輸入：邏輯綱要、查詢負載、DBMS 與硬體特性；輸出：儲存結構、索引、分割等 |
| 與 DBMS 的關係 | 與特定 DBMS 無關（只與資料模型有關） | **與特定 DBMS 及硬體高度相關** |
| 主要技術 | ER 轉關聯表、正規化、完整性限制 | 索引、叢集、分割、檔案組織、反正規化、緩衝區調校 |
| 目標 | 正確性、一致性、無冗餘 | 效能、空間使用率、可維護性 |
| 變更的影響 | 變更綱要會影響應用程式 | 變更儲存結構**不影響**邏輯綱要與應用程式（實體資料獨立） |

**重點**：邏輯設計決定「表格長什麼樣子」，實體設計決定「這些表格在磁碟上怎麼放，才能又快又省空間」。兩者分離使資料庫具有**實體資料獨立性**。`

    {

      title: "R{A,B,C,D,E,F,G}、F={A→B, BC→DE, AEF→G}：封閉集合 {A,C}⁺ 與 ACF→DG 的推導",
      score: 20,
      question: `關聯表 R{A,B,C,D,E,F,G} 其所有功能相依性（functional dependence）如下所示：
A → B, BC → DE, AEF → G
㈠以上述三條功能相依性，請算出集合 {A,C} 的封閉性（即 closure {A,C}⁺）。（10 分）
㈡功能相依性 ACF → DG 可否由上述三條功能相依性推導出來？如果可以，請列出推導過程。（10 分）`,
      answer: `**(一) 計算 {A, C}⁺（10 分）**

**演算法**：從 {A, C} 開始，只要某個函數相依的左邊已全部在目前的集合內，就把它的右邊加入，重複到不再增加為止。

| 步驟 | 目前集合 | 檢查的函數相依 | 左邊是否都在集合中 | 動作 |
|---|---|---|---|---|
| 0 | {A, C} | — | — | 起點 |
| 1 | {A, C} | A → B | A ∈ 集合 ✓ | 加入 B → {A, B, C} |
| 2 | {A, B, C} | BC → DE | B、C ∈ 集合 ✓ | 加入 D、E → {A, B, C, D, E} |
| 3 | {A, B, C, D, E} | AEF → G | F ∉ 集合 ✗ | 不能使用 |
| 4 | {A, B, C, D, E} | 所有函數相依都已檢查 | — | 集合不再增加，結束 |

> **{A, C}⁺ = {A, B, C, D, E}**

由於沒有 F、G，所以 AC 不是 R 的鍵。

**(二) ACF → DG 是否可由 F 推導出來：可以（10 分）**

**方法一：以封閉集合檢驗**

計算 {A, C, F}⁺：

1. {A, C, F} 起點。
2. A → B：加入 B → {A, B, C, F}。
3. BC → DE：加入 D、E → {A, B, C, D, E, F}。
4. AEF → G：A、E、F 都在集合中，加入 G → {A, B, C, D, E, F, G}。

所以 (ACF)⁺ = ABCDEFG，包含 D 與 G，故 **ACF → DG 可以推導出來**，且 ACF 其實是 R 的一個鍵。

**方法二：以 Armstrong 公理逐步推導**

| 步驟 | 結果 | 依據 |
|---|---|---|
| 1 | A → B | 已知 |
| 2 | AC → BC | 對 1 加上 C（增補律，Augmentation） |
| 3 | BC → DE | 已知 |
| 4 | AC → DE | 對 2、3 使用遞移律（Transitivity） |
| 5 | AC → D | 對 4 使用分解律（Decomposition） |

| 特性（property） | 3NF | BCNF | 4NF |
|---|---|---|---|
| 消除因功能相依性的冗餘（FD redundancy） | N | Y | Y |
| 消除因多重值相依性的冗餘（MVD redundancy） | N | N | Y |
| 保存功能相依性 | Y | N | N |
| 保存多重值相依性 | N | N | N |

（題目已給兩格：4NF 消除 FD 冗餘 ＝ Y；3NF 保存 MVD ＝ N；其餘依下列說明填寫。）

**說明（以各正規型式的定義逐列判斷）**

**① 消除因功能相依性的冗餘（FD redundancy）**

| 正規型式 | 判定 | 原因 |
|---|---|---|
| 3NF | **N** | 3NF 允許「決定者不是超鍵、但被決定的是主屬性」的函數相依（如 R(A,B,C)，AB→C，C→B）。這種相依仍會造成冗餘，所以 3NF **不能完全消除** FD 冗餘（只能消除大部分） |
| BCNF | **Y** | 要求所有非平凡 FD 的決定者都是超鍵，因此函數相依造成的冗餘**已完全消除** |
| 4NF | **Y** | 4NF 包含 BCNF 的要求（4NF ⊂ BCNF），同樣完全消除 FD 冗餘（題目已給） |

**② 消除因多重值相依性的冗餘（MVD redundancy）**

| 正規型式 | 判定 | 原因 |
|---|---|---|
| 3NF、BCNF | **N** | 兩者都只依據函數相依定義，**不處理多值相依**。如 (課程, 教師, 課本) 的表可以符合 BCNF，卻仍有 MVD 冗餘 |
| 4NF | **Y** | 4NF 要求每個非平凡 MVD 的決定者都是超鍵，把 MVD 冗餘也消除 |

**③ 保存功能相依性（分解後所有 FD 都能在各子表中直接檢查）**

| 正規型式 | 判定 | 原因 |
|---|---|---|
| 3NF | **Y** | 3NF 的**合成演算法**一定能產生「無損連接且保持相依」的分解 |
| BCNF | **N** | BCNF 分解**不一定能保存**所有函數相依（如 R(A,B,C)，AB→C，C→B，分解成 BCNF 後 AB→C 無法在單一表格中檢查）；不保證，因此填 N |
| 4NF | **N** | 4NF 的分解同樣不保證保存函數相依（它是 BCNF 的加強），填 N |

**④ 保存多重值相依性**

| 正規型式 | 判定 | 原因 |
|---|---|---|
| 3NF | **N**（題目已給） | 3NF 的分解不考慮 MVD，不保證保存 |
| BCNF | **N** | 同上，不處理多值相依 |
| 4NF | **N** | 4NF 的分解可保證無損，但保存全部多值相依並非其保證，故填 N |

**說明**：教科書對「保存相依性」常以「是（Yes）／不一定（Maybe）」表示，本表依題目只能填 Y 或 N，因此把「不保證（Maybe）」視為 N，「保證」視為 Y。重點結論：

- **3NF**：保證無損且**保存 FD**，但可能仍有 FD 冗餘。
- **BCNF**：完全消除 FD 冗餘，但**可能無法保存 FD**。
- **4NF**：再消除 **MVD 冗餘**，是三者中冗餘最少的。
- 越高階的正規型式冗餘越少，但保存相依性的能力不一定更好（取捨）。`

**2NF 的定義**：表格符合 1NF，且每個**非主屬性**都**完全函數相依**於候選鍵（沒有「部分相依」：非主屬性只相依於複合鍵的一部分）。

因此符合 2NF 的表格**不會有「部分相依」所造成的資料狀態**，也就是下列問題：

| 不會出現的狀態 | 說明 |
|---|---|
| **資料冗餘（redundancy）** | 只相依於鍵的一部分的屬性，會在鍵的另一部分不同的多列中重複出現（如複合鍵 (學號, 課號) 的表中，學生姓名會因每修一門課而重複） |
| **更新異常（update anomaly）** | 要修改該屬性時，必須同時改多列；漏改就產生不一致 |
| **新增異常（insertion anomaly）** | 缺少鍵的另一部分時，無法單獨新增只相依於鍵一部分的資料（如尚未選課的新學生無法新增） |
| **刪除異常（deletion anomaly）** | 刪除某一列時，連帶失去只相依於鍵一部分的資料（如刪除某生唯一一筆選課紀錄，連他的姓名也消失） |

| 5a | 第 5、6 列 | A12、A12（相同） | **543、212（不同）** | 13315、13315（相同） |

|---|---|---|

對應關係（對應基數，mapping cardinality）指「一個實體的實例，最多可以對應到另一個實體的幾個實例」，必須**雙向**說明。

| 對應關係 | A 對應 B | B 對應 A | 例子 |
|---|---|---|---|
| **一對一（1:1）** | A 中的**一個**實體最多對應 B 中的**一個**實體 | B 中的一個實體最多對應 A 中的**一個**實體 | A＝國家、B＝首都（一個國家只有一個首都，一個首都只屬於一個國家）；A＝員工、B＝員工證 |
| **一對多（1:N）** | A 中的**一個**實體可對應 B 中的**多個**實體 | B 中的**一個**實體最多只對應 A 中的**一個**實體 | A＝系所、B＝學生（一個系所有多位學生；一位學生只屬於一個系所） |
| **多對多（M:N）** | A 中的一個實體可對應 B 中的**多個**實體 | B 中的一個實體也可對應 A 中的**多個**實體 | A＝學生、B＝課程（一位學生修多門課；一門課有多位學生修） |

1. **多對一（N:1）** 是一對一多的反方向：A 的多個實體對應 B 的一個實體（如 A＝學生、B＝系所），只是把兩個實體對調後的 1:N。

      score: 15,
      question: `有關資料庫復原（recovery），在 transaction log 內含有 "before value" 的資料，
㈠請說明該 "before value" 是甚麼資料？（5 分）
㈡請說明該 "before value" 是在進行何種 recovery activity 時被使用？（5 分）
㈢承之 recovery activity 的進行，說明先後產生之 "before value" 被使用的順序？（5 分）`,
      answer: `**(一) before value 是什麼（5 分）**

before value（又稱 **before image、舊值**）是交易**修改某個資料項目之前，該資料項目原本的值**。交易每次更新資料時，log 會記錄一筆更新紀錄：

> \`<T, 資料項 X, before value（舊值）, after value（新值）>\`

例：交易 T1 把帳戶 A 的餘額由 1000 改為 800，log 記錄 \`<T1, A, 1000, 800>\`，其中 **1000 就是 before value**，800 是 after value。

**(二) 使用時機：進行「復原（Undo／Rollback，向後復原）」時（5 分）**

before value 用在 **UNDO（撤銷）** 這個 recovery activity：

| 情境 | 說明 |
|---|---|
| 交易失敗或被使用者取消（rollback） | 把該交易已做的修改**還原**為舊值 |
| 系統故障時，**尚未提交（commit）** 的交易 | 它的修改可能已寫入資料庫，必須用 before value **撤銷**，使資料庫回到交易開始前的一致狀態（保證原子性） |

相對地，**after value（新值）** 用於 **REDO（重做）**：把已提交的交易結果重新寫入，保證持久性。

**(三) 多個 before value 被使用的先後順序：與產生順序「相反」（5 分）**

Undo 必須**由後往前**，也就是**後產生的 before value 先使用，最早產生的最後使用**（後進先出，LIFO）。

**例**：交易 T 依序執行（X 的初始值為 10）：

| 順序 | 動作 | log 紀錄 | X 的值 |
|---|---|---|---|
| 1 | X 由 10 改為 20 | \`<T, X, 10, 20>\`（before value ＝ 10） | 20 |
| 2 | X 由 20 改為 30 | \`<T, X, 20, 30>\`（before value ＝ 20） | 30 |
| 3 | 發生故障，T 未提交，開始 Undo | | |

| Undo 步驟 | 使用的 before value | 結果 |
|---|---|---|
| ① 先處理**最後**一筆紀錄 | 20（第 2 筆產生的） | X 還原為 20 |
| ② 再處理**較早**的一筆紀錄 | 10（第 1 筆產生的） | X 還原為 10（交易開始前的值） |

**為什麼要反向？** 資料項可能被同一交易多次修改。要回到交易開始前的狀態，必須把每次修改「一步步倒退回去」，最後一次修改要最先被撤銷；若由前往後還原，最後留在資料庫的會是中間的值（如 20），而不是原始值 10。

**重點**：before value ＝ 舊值；用於 Undo；使用順序與產生順序相反（由後往前）。`

| 元件 | 類別 | 功能 |
|---|---|---|
| 站台的電腦（硬體） | 硬體 | 每個站台有自己的處理器、記憶體與磁碟，彼此可以異質（不同機型、作業系統） |
| 通訊網路（LAN／WAN） | 硬體＋軟體 | 連接各站台，傳送查詢、資料與控制訊息 |
| 本地 DBMS 與本地資料庫 | 軟體＋資料 | 管理該站台的資料，負責**本地**的儲存、查詢處理與交易控制 |
| **分散式 DBMS（DDBMS）軟體** | 軟體 | 接受全域查詢，決定資料位置，把查詢**分解成各站台的子查詢**並整合結果；負責**分散式交易控制（如兩階段提交）、並行控制、復原** |
| 資料通訊軟體 | 軟體 | 站台之間的訊息傳送與管理 |
| **全域資料目錄（Global Directory）** | 資料 | 記錄資料如何分割（fragmentation）、複製（replication）與配置在哪些站台，供 DDBMS 查閱 |
| 使用者／應用程式 | 軟體 | 向任一站台提出查詢與更新，不必知道資料實際位置 |

**運作**：使用者在任一站台提出查詢 → DDBMS 查閱全域目錄 → 把查詢分解並送到擁有資料的站台 → 各站台由本地 DBMS 執行 → 結果傳回並整合 → 回傳給使用者。

**(二) 分散式資料庫的透通性（Transparency）（5 分）**

**透通性**指**對使用者隱藏分散式系統的複雜性**，使使用者與應用程式「**像在使用單一、集中式的資料庫**」。主要種類：

| 透通性 | 對使用者隱藏什麼 | 例子 |
|---|---|---|
| **位置透通性（Location）** | 資料實際存放在哪個站台 | 查詢「員工」資料時不必指明在台北或高雄的伺服器 |
| **分割（片段）透通性（Fragmentation）** | 一個表格被水平或垂直分割成多個片段，存放在不同站台 | 使用者查詢整個「訂單」表，不必知道它被依地區分成多段 |
| **複製透通性（Replication）** | 同一份資料有多個副本，存放在不同站台 | 更新一筆資料，系統自動同步更新所有副本 |
| **並行（交易）透通性（Concurrency）** | 多個使用者同時存取分散資料時的衝突控制 | 使用者感覺自己的交易獨占資料庫 |
| **失敗透通性（Failure）** | 某個站台或網路發生故障時，系統自動以其他副本或方式維持服務 | 一個站台當機，查詢仍可由副本完成 |
| 另有：**DBMS／異質性透通性** | 各站台使用不同廠牌的 DBMS 或不同資料模型 | 使用者用同一種 SQL 存取不同廠牌的資料庫 |

**好處**：使用者與應用程式**與資料的實體配置獨立**，資料重新分配、增加副本或搬移站台時，不需修改應用程式。`

      answer: `**(一) 何謂緩慢改變維度（SCD）問題**

在資料倉儲中，**維度表**描述事實的背景（顧客、商品、門市）。維度屬性**並非永遠不變**，會**隨時間緩慢地改變**（如顧客搬家、員工轉調部門、商品改屬別的類別）。問題是：**維度資料改變後，過去的事實應該對應「改變前」還是「改變後」的維度值？** 若處理不當，歷史報表會出現錯誤的歸屬，使分析失真。

**(二) 舉例：顧客搬家**

顧客維度表中，王小明原本住在**臺北**，2023 年 7 月搬到**高雄**。

| 顧客編號 | 姓名 | 居住城市 |
|---|---|---|
| C001 | 王小明 | 臺北（搬家前） → 高雄（搬家後） |

事實表（銷售）中，他搬家前買了 5 次、搬家後買了 3 次。

**問題**：若直接把城市改成高雄，則「各城市的歷年銷售額」報表會把搬家前在臺北的 5 次購買也算成**高雄**的銷售，**臺北的歷史銷售額被少算、高雄被多算**，過去的報表結果與當時實際情形不符。

**(三) 三種常見的處理方式**

| 類型 | 作法 | 結果（王小明搬家） | 優點 | 缺點 |
|---|---|---|---|---|
| **Type 1：覆蓋** | 直接用新值**覆蓋**舊值，不保留歷史 | 城市＝高雄；舊紀錄也變成高雄 | 簡單，不佔空間 | **失去歷史**，過去的分析被改變 |
| **Type 2：新增列** | 保留舊列，**新增一列**（新的代理鍵），並記錄生效與失效日期、目前標記 | 兩列：(C001, 臺北, 2020-01-01～2023-06-30)、(C001, 高雄, 2023-07-01～) | **完整保留歷史**，過去事實對應舊列、新事實對應新列 | 維度表持續變大；ETL 較複雜 |
| **Type 3：新增欄位** | 在同一列新增「原城市」欄位，保存**前一個值** | (C001, 目前城市＝高雄, 原城市＝臺北) | 簡單，可比較新舊 | 只能保留有限次的歷史（通常只有前一版） |

**Type 2 的範例資料**

| 代理鍵 | 顧客編號 | 姓名 | 城市 | 生效日 | 失效日 | 是否目前 |
|---|---|---|---|---|---|---|

      title: "資料庫的刪除異常（Delete Anomaly）舉例",
      score: 10,
      question: `請舉例說明何謂資料庫的 Delete Anomaly。（10 分）`,
      answer: `**(一) 定義**

**刪除異常（Deletion Anomaly）**：在**沒有正規化**（資料表中混合了多個主題的資料）的表格中，**刪除某一筆資料時，會連帶永久失去其他並不想刪除的資訊**。

**(二) 舉例**

學生選課表（未正規化，主鍵為 (學號, 課號)）：

| 學號 | 學生姓名 | 課號 | 課名 | 學分 | 授課教授 |
|---|---|---|---|---|---|
| S01 | 王小明 | C101 | 資料庫應用 | 3 | 林教授 |
| S02 | 李小華 | C101 | 資料庫應用 | 3 | 林教授 |
| S02 | 李小華 | C205 | 作業系統 | 3 | 張教授 |
| S03 | 陳小美 | C310 | 密碼學 | 2 | 周教授 |

**情境**：陳小美退選了「密碼學」，需要刪除 (S03, C310) 這一列。

**異常**：這是 C310 這門課**唯一**的一列，刪掉之後：

1. 「密碼學、2 學分、周教授」這些**課程資料也跟著消失**，雖然這門課仍然存在。
2. 陳小美的**學生資料也消失**（她可能還想修別的課）。

**原因**：一張表同時放了「學生」、「課程」與「選課」三種主題的資料；課程資料依賴於選課紀錄才存在。

**(三) 解決方法：正規化（拆表）**

| 資料表 | 欄位（<u>底線</u>＝主鍵） | 外來鍵 |
|---|---|---|
| 學生 STUDENT | <u>學號</u>, 學生姓名 | — |
| 課程 COURSE | <u>課號</u>, 課名, 學分, 授課教授 | — |
| 選課 ENROLL | <u>學號</u>, <u>課號</u> | 學號 → STUDENT；課號 → COURSE |

拆開後，刪除 ENROLL 的 (S03, C310) 只刪除「選課關係」，學生資料與課程資料仍保留，不再有刪除異常。

**(四) 與其他異常的比較**

| 異常 | 說明 | 本例 |
|---|---|---|
| 新增異常 | 無法單獨新增某部分的資料 | 新開的課還沒有學生選修，無法在表中新增這門課 |
| 更新異常 | 同一資訊在多列重複，修改時須同時改多列 | 修改 C101 的授課教授，要改 2 列 |
| **刪除異常** | **刪除一筆資料連帶失去其他資訊** | **刪除唯一選課紀錄，課程資料也消失** |`
    },
    {
      id: "cs3-db-102-3", no: "三", topic: "db", topicName: "資料庫應用",
      title: "資料庫標準 IDEF1 與 IDEF1X 兩者的主要差異",
      score: 10,
      question: `請說明資料庫標準 IDEF1 與 IDEF1X 兩者的主要差異。（10 分）`,
      answer: `**背景**：IDEF（Integration DEFinition）是一系列系統建模方法，其中 **IDEF1** 與 **IDEF1X** 都用於**資料（資訊）建模**。IDEF1X 是在 IDEF1 的基礎上延伸、改良而成（"X" 代表 Extended），後來成為美國聯邦標準的資料建模語言。

**(一) 兩者簡介**

| 項目 | IDEF1 | IDEF1X |
|---|---|---|
| 名稱 | Information Modeling（資訊建模） | Extended IDEF1（IDEF1 的擴充，即資料建模） |
| 定位 | 偏向**概念性**，描述企業**資訊環境**：存在哪些重要的資訊、資訊之間的關聯、資訊如何被管理 | 偏向**邏輯資料庫設計**，描述**資料結構與關係**，可直接轉成關聯式資料庫的綱要 |
| 來源 | 美國空軍 ICAM 計畫的一部分，源自實體—關係與關聯模型的概念 | 以 IDEF1 與實體—關係（ER）、關聯模型為基礎，語法更嚴謹，成為標準 |

**(二) 主要差異**

| 比較項目 | IDEF1 | IDEF1X |
|---|---|---|
| 目的與抽象層次 | 分析企業的**資訊需求與資訊流動**，強調**真實世界資訊的語意**（較概念性） | 設計**資料庫的邏輯結構**，強調**可實作性**（較接近關聯式資料庫） |
| 鍵（Key）的表示 | 較寬鬆，不強調外來鍵 | **明確定義主鍵、候選鍵、外來鍵**，並規定外來鍵會**往下「遷移」**到子實體 |
| 實體的種類 | 一般實體的概念 | 區分**獨立實體**（直角方框）與**依賴實體**（圓角方框，其識別需靠父實體的鍵），符合關聯式的「弱實體」概念 |
| 關係的表示 | 較一般性，可包含多對多關係 | 分為**識別關係（實線）**與**非識別關係（虛線）**；一般的**多對多關係需拆解為關聯實體**（IDEF1X 的基本關係是一對多），使結構可直接映射成關聯表 |
| 子類型（分類） | 描述較簡單 | 有明確的**分類（category）／泛化階層**語法（完整與不完整的子類型群） |
| 語法與規則 | 彈性較大，規則較少 | **語法嚴謹、規則明確、圖形符號標準化**，不同人繪製的模型較一致 |
| 標準化 | 為早期的建模方法 | 已成為美國標準（FIPS 184），被廣泛用於政府與軍事專案 |

**重點整理**：**IDEF1** 偏概念層，用於描述企業的資訊需求；**IDEF1X** 是它的擴充，加入了鍵、依賴實體、識別／非識別關係等嚴謹規則，用於**邏輯資料庫設計**，產生的模型能直接轉成關聯式資料庫的資料表。`

er:1px solid #d8d0bf;padding:.28rem .8rem">50</td><td style="border:1px solid #d8d0bf;padding:.28rem .8rem">100</td></tr></tbody></table>`,
      question: `請寫出下列 SQL 語法的答案：
㈠SELECT * FROM ORDER_ITEM WHERE ExtendedPrice BETWEEN 100 AND 200 ORDER BY OrderNumber DESC;（10 分）

（ORDER_ITEM 表見下方）`,
      answer: `**(一) \`WHERE ExtendedPrice BETWEEN 100 AND 200 ORDER BY OrderNumber DESC\`（10 分）**

**步驟 1：WHERE 過濾**。\`BETWEEN 100 AND 200\` 包含**兩端的值**（≥ 100 且 ≤ 200）：

| OrderNumber | SKU | Quantity | Price | ExtendedPrice | 是否符合 |
|---|---|---|---|---|---|
| 1000 | 201000 | 1 | 300 | 300 | 否（300 > 200） |
| 1000 | 202000 | 1 | 130 | 130 | **是** |
| 2000 | 101100 | 4 | 50 | 200 | **是**（等於上界 200） |
| 2000 | 101200 | 2 | 50 | 100 | **是**（等於下界 100） |

**步驟 2：依 OrderNumber 由大到小排序（DESC）**：OrderNumber 2000 的兩列排在前面，1000 排在最後。

**執行結果**

| OrderNumber | SKU | Quantity | Price | ExtendedPrice |
|---|---|---|---|---|
| 2000 | 101100 | 4 | 50 | 200 |
| 2000 | 101200 | 2 | 50 | 100 |
| 1000 | 202000 | 1 | 130 | 130 |

（OrderNumber 相同的兩列，彼此的先後順序沒有被指定，可能互換。）

**(二) \`GROUP BY SKU HAVING SUM(Price) = 50\`（10 分）**

**步驟 1：依 SKU 分組。** 表中 4 個 SKU 都**各只出現一次**，所以共有 4 組，每組 1 列：

| SKU | 組內列數 COUNT(*) | SUM(Price) | 是否滿足 HAVING SUM(Price) = 50 |
|---|---|---|---|
| 201000 | 1 | 300 | 否 |
| 202000 | 1 | 130 | 否 |
| 101100 | 1 | 50 | **是** |
| 101200 | 1 | 50 | **是** |

**步驟 2：HAVING 篩選**分組後的結果，只留下 SUM(Price) = 50 的組。

**執行結果**

| SKU_Count | TotalRev | SKU |
|---|---|---|
| 1 | 50 | 101100 |
| 1 | 50 | 101200 |

**注意**：\`HAVING\` 用於**分組後**的條件（可使用聚合函數），\`WHERE\` 用於分組前逐列過濾。本題 \`SUM(Price) = 50\` 是對各組總和的條件，必須用 HAVING。\`Price\` 是單價（不是 Price × Quantity），所以 101100 與 101200 的 SUM(Price) 都是 50。`

      answer: `**(一) 作答表格**

| 比較 | 優點 | 缺點 |
|---|---|---|
| **正規化（Normalization）** | 1. **減少資料冗餘**，節省儲存空間。<br>2. **避免新增、更新、刪除異常**，資料一致性高。<br>3. 資料結構清楚，**易於維護與擴充**。<br>4. 更新時只需修改一處，**寫入（新增、修改）效能佳**。 | 1. 資料分散在多個表格，查詢需要**多次連接（JOIN）**，**讀取與查詢效能較差**。<br>2. 查詢語句與綱要較複雜。<br>3. 表格數量多，設計與理解的難度增加。 |
| **去正規化（Denormalization）** | 1. **減少連接**，**查詢速度快**（適合讀取密集、報表與分析）。<br>2. 查詢語句**簡單**。<br>3. 可預先彙總資料，提升分析效能。 | 1. **資料冗餘**，占用較多儲存空間。<br>2. 容易產生**更新、新增、刪除異常**，**資料一致性**難以維持（同一資訊要同時修改多處）。<br>3. **寫入較慢**，維護成本高。 |

**(二) 說明**

- **正規化**把資料依主題拆成多個表格，以**外來鍵**關聯，優先確保**資料正確與一致**，適合**交易處理（OLTP）**系統。
- **去正規化**是在正規化之後，**有意地加入冗餘**（合併表格、重複儲存欄位、預先彙總），以**換取查詢效能**，常用於**資料倉儲（OLAP）**與讀取量遠大於寫入量的系統。
- 兩者是**取捨**：沒有絕對的好壞，要依應用需求選擇。常見作法是先正規化設計，再針對效能瓶頸有選擇地去正規化。`

      answer: `**(零) 先找出整張表的候選鍵**

屬性共 9 個：學號、生日、年紀、課號、授課教授、開課系名、主修系名、選課指導教授、成績。

- 加入選課指導教授：(學號, 課號, 選課指導教授)⁺ ＝ 上述 ＋ 選課指導教授→主修系名 ＝ **全部屬性**。

> **兩個候選鍵：(學號, 課號, 主修系名) 與 (學號, 課號, 選課指導教授)**，取前者為主鍵。

**(一) 第一正規化（1NF）：每個欄位都是單一值**

原表每個欄位都是不可再分的單一值，**符合 1NF**，主鍵為 **(學號, 課號, 主修系名)**。但表中有大量冗餘（如 112233 的生日、年紀、課程資料重複），原因是存在以下相依：

| 部分相依（相依於鍵的一部分） | 學號→生日；課號→授課教授；(學號, 課號)→成績；(學號, 主修系名)→選課指導教授 |
| 傳遞相依 | 學號→生日→年紀；課號→授課教授→開課系名 |
| 決定者不是超鍵 | 選課指導教授→主修系名 |

**(二) 第二正規化（2NF）：消除部分相依**

把依賴於鍵的一部分的屬性，各自拆成表格：

| 資料表 | 屬性 | 主鍵 | 依據 |
|---|---|---|---|
| STUDENT | 學號, 生日, 年紀 | 學號 | 學號→生日；生日→年紀 |
| COURSE | 課號, 授課教授, 開課系名 | 課號 | 課號→授課教授；授課教授→開課系名 |
| GRADE | 學號, 課號, 成績 | (學號, 課號) | (學號, 課號)→成績 |
| ADVISE | 學號, 主修系名, 選課指導教授 | (學號, 主修系名) | (學號, 主修系名)→選課指導教授；選課指導教授→主修系名 |

此時每個非主屬性都完全相依於其表格的鍵，符合 2NF（STUDENT、COURSE 仍有傳遞相依）。

**(三) 第三正規化（3NF）：消除傳遞相依**

| 資料表 | 處理 | 結果 |
|---|---|---|
| STUDENT | 學號→生日→年紀（年紀透過生日傳遞相依） | 拆成 STUDENT(<u>學號</u>, 生日) 與 BIRTH_AGE(<u>生日</u>, 年紀) |
| COURSE | 課號→授課教授→開課系名 | 拆成 COURSE(<u>課號</u>, 授課教授) 與 PROF_DEPT(<u>授課教授</u>, 開課系名) |
| GRADE | 無傳遞相依 | 不變 |
| ADVISE | 選課指導教授→主修系名：決定者「選課指導教授」不是超鍵，但**被決定的「主修系名」是主屬性**（屬於候選鍵 (學號, 主修系名)） | **符合 3NF**，不需再拆（3NF 允許主屬性被非超鍵決定） |

**(四) BCNF：決定者必須是超鍵**

ADVISE(學號, 主修系名, 選課指導教授) 中的「選課指導教授 → 主修系名」決定者不是超鍵，**違反 BCNF**，依此相依分解：

| 資料表 | 屬性 | 主鍵 | 說明 |
|---|---|---|---|
| ADVISOR_MAJOR | 選課指導教授, 主修系名 | 選課指導教授 | 每位選課指導教授屬於哪個系 |
| STUDENT_ADVISOR | 學號, 選課指導教授 | (學號, 選課指導教授) | 每位學生由哪位教授指導 |

**注意**：BCNF 分解**無法保存**函數相依 (學號, 主修系名) → 選課指導教授（需連接兩個表才能檢驗）。這是 BCNF 可能的代價；若須保存相依，可停在 3NF 的 ADVISE。

| BIRTH_AGE | 生日, 年紀 | **生日** | — |
| COURSE | 課號, 授課教授 | **課號** | 授課教授 → PROF_DEPT（選用） |
| PROF_DEPT | 授課教授, 開課系名 | **授課教授** | — |
| GRADE | 學號, 課號, 成績 | **(學號, 課號)** | 學號 → STUDENT；課號 → COURSE |
| ADVISOR_MAJOR | 選課指導教授, 主修系名 | **選課指導教授** | — |
| STUDENT_ADVISOR | 學號, 選課指導教授 | **(學號, 選課指導教授)** | 學號 → STUDENT；選課指導教授 → ADVISOR_MAJOR |

      question: `為維持資料庫的正常運作，交易資料的同步控制與復原裡常常希望交易資料能具有單元性（Atomicity）、一致性（Consistency）、隔離性（Isolation）、永久性（Durability）四大性質。請解釋此四大性質的意義。（16 分）`,
      answer: `**交易（Transaction）**：資料庫中一個**不可分割的工作單位**，包含一個或多個操作（如「轉帳」＝從 A 扣款＋對 B 入帳）。ACID 是確保交易正確執行的四大性質。

| 性質 | 中文 | 意義 | 例子（A 轉 1000 元給 B） | 主要的實作機制 |
|---|---|---|---|---|
| **A（Atomicity）** | **單元性（原子性）** | 交易的所有操作**要嘛全部完成，要嘛全部不做**，不會只做一部分 | 扣款與入帳必須一起成功；若入帳前當機，扣款也要撤銷 | 交易記錄（log）與復原（undo） |
| **C（Consistency）** | **一致性** | 交易執行前後，資料庫都必須處於**一致的狀態**，符合所有完整性限制與業務規則 | 轉帳前後 A＋B 的總額不變，餘額不為負 | 完整性限制、應用程式邏輯，及 A、I、D 共同保證 |
| **I（Isolation）** | **隔離性** | 多個交易**同時執行**時，每個交易都感覺不到其他交易的存在，結果等同於它們**一個接一個（循序）**執行；某交易**未提交前**的中間結果，其他交易不應看到 | 他人在轉帳進行中查詢，看不到「A 已扣款、B 尚未入帳」的中間狀態 | 並行控制：鎖定（2PL）、時間標記、多版本（MVCC） |
| **D（Durability）** | **永久性（持久性）** | 交易一旦**提交（commit）**，其結果就是**永久的**，即使之後系統故障、斷電也不會遺失 | 轉帳成功後，即使機器當機，重啟後兩個帳戶的新餘額仍在 | 預寫日誌（WAL）、redo 重做、備份 |

**若違反各性質會怎樣**

| 性質 | 違反的後果 |
|---|---|
| 單元性 | 只做了一半，如 A 被扣款但 B 沒有收到 |
| 一致性 | 資料違反規則，如帳目對不起來、出現負餘額 |
| 隔離性 | 讀到不一致的中間資料，或兩個交易的更新互相覆蓋（遺失更新） |
| 永久性 | 已經成功的交易，在故障後憑空消失 |

      question: `請說明為何線上交易處理（On-Line Transaction Processing, OLTP）常用資料庫儲存正規化資料，而線上分析處理（On-Line Analytical Processing, OLAP）常用資料倉儲儲存去正規化資料。（10 分）`,
      answer: `**核心原因**：兩者的**工作負載不同**。OLTP 以**大量小型的寫入與更新**為主，重視**正確與一致**，所以適合正規化；OLAP 以**少量但複雜的讀取與彙總**為主，重視**查詢速度**，所以適合去正規化。

**(一) OLTP 為何使用正規化資料**

| 原因 | 說明 |
|---|---|
| 以**新增、修改、刪除**為主 | 每次交易只存取少數幾列。正規化讓**同一筆資料只存一處**，更新只要改一個地方，**寫入快** |
| 重視**資料一致性與正確性** | 沒有冗餘就不會有更新、新增、刪除異常；如銀行、訂單系統不能出現不一致的資料 |
| 節省儲存空間與鎖定範圍 | 表格小、資料不重複；交易鎖定的範圍小，**並行度高** |
| 查詢簡單 | 多半依主鍵查詢少數資料列，多表連接的成本很低 |

**(二) OLAP 為何使用去正規化資料（資料倉儲）**

| 原因 | 說明 |
|---|---|
| 以**讀取、彙總**為主 | 一次掃描並彙總大量歷史資料（如各地區、各月份的銷售額）。若資料高度正規化，需要連接很多表，**成本極高、速度慢** |
| **去正規化減少連接** | 星狀綱要把維度屬性合併在少數寬表中，事實表只需連接幾個維度表，**查詢速度快、語句簡單** |
| 資料**很少修改** | 倉儲資料以批次（ETL）載入，之後幾乎只讀取，**冗餘不會造成更新異常**，資料一致性的問題小 |
| 儲存成本相對低 | 以多一點空間換取分析的時間 |
| 方便使用者理解 | 維度與事實的結構直觀，分析人員與 BI 工具容易使用 |

**(三) 比較**

| 比較項目 | OLTP（正規化） | OLAP／資料倉儲（去正規化） |
|---|---|---|
| 主要操作 | 新增、修改、刪除、單筆查詢 | 大量掃描、連接、彙總 |
| 每次存取量 | 少量資料列 | 大量歷史資料 |
| 資料特性 | 最新、明細 | 歷史、整合、含彙總 |
| 綱要設計重點 | **一致性、寫入效率** | **查詢效率** |
| 冗餘 | 盡量消除 | 刻意保留 |
| 連接 | 多，但每次只涉及少量資料 | 少（預先合併） |

**結論**：正規化把成本放在「讀取時要連接」，去正規化把成本放在「寫入與儲存較多」。OLTP 寫入頻繁、讀取量小，選前者；OLAP 讀取龐大、寫入很少，選後者。`

| **Dp_num** | 表 D | 表 P 的 **P_num** | 生產線紀錄中的產品必須存在於產品表 |

\`\`\`sql
ALTER TABLE D ADD FOREIGN KEY (De_num) REFERENCES E (E_num);
ALTER TABLE D ADD FOREIGN KEY (Dp_num) REFERENCES P (P_num);
\`\`\`

表 E 與表 P 沒有指向其他表的外來鍵（生產線代號 D_num 只在 D 表中，沒有獨立的生產線表可參照）。

**(二) 員工 John 所參與製造的產品代號與名稱（8 分）**

> **π P_num, P_name ( σ E_name = 'John' (E) ⋈ E_num = De_num D ⋈ Dp_num = P_num P )**

**逐步說明**

| 步驟 | 運算 | 意義 |
|---|---|---|
| 1 | σ E_name = 'John' (E) | 選出員工 John |
| 2 | ⋈ E_num = De_num D | 與生產線表連接，得到 John 參與的所有生產紀錄 |
| 3 | ⋈ Dp_num = P_num P | 與產品表連接，取得產品名稱 |
| 4 | π P_num, P_name | 只保留產品代號與名稱（投影自動去除重複） |

**(三) 曾參與 P 表中「所有」產品製造的員工（8 分）**

「**所有**」的查詢要用**除法運算（÷）**。

> **π E_num, E_name ( E ⋈ E_num = De_num ( π De_num, Dp_num (D) ÷ ρ Dp_num←P_num ( π P_num (P) ) ) )**

**逐步說明**

| 步驟 | 運算 | 結果 |
|---|---|---|
| 1 | A = π De_num, Dp_num (D) | 「員工—產品」的參與配對：每個員工參與製造哪些產品 |
| 2 | B = ρ Dp_num←P_num ( π P_num (P) ) | 所有產品的代號（把欄位更名為 Dp_num，使 A 與 B 的欄位名稱對得起來） |
| 3 | C = A ÷ B | 找出 De_num，其對應的產品集合**包含 B 的全部產品**，也就是參與了所有產品的員工編號 |
| 4 | E ⋈ E_num = De_num C，再 π E_num, E_name | 取得這些員工的編號與姓名 |

**除法的直覺**：A(員工, 產品) ÷ B(產品) 得到的是「與 B 中**每一個**產品都有配對的員工」。若某員工漏掉任何一項產品，就不會出現在結果中。

**等價寫法（不用除法）**：π De_num (A) − π De_num ( (π De_num (A) × B) − A )，再與 E 連接。`

      question: `假設在一資料庫系統中有 6 筆 transactions 其執行狀態如下圖，其中 tc1 與 tc2 表示 checkpoint 的時間，tf 表示發生 system failure 的時間。為了達成資料庫系統的 recovery，請說明要用何種機制？並請詳細說明此機制在每一 checkpoint 時的訊息紀錄，以及說明每一筆 transaction 在發生 system failure（tf）後，該進行何種動作？（25 分）`,
      answer: `**(一) 使用的機制：交易記錄（Log）搭配檢查點（Checkpoint）的回復機制**

**原理**：系統執行交易時，依**預寫日誌（WAL）** 把每次更新（舊值與新值）、\`start\`、\`commit\` 寫入穩定儲存的 log。為了不必在故障後從 log 的開頭重新處理，系統定期建立**檢查點**。故障後只需處理「最近一次檢查點前後」的交易：已提交的 **redo（重做）**、未提交的 **undo（復原）**。

**(二) 每個檢查點時記錄的訊息**

做檢查點時，系統：(1) 暫停接受新的交易；(2) 把 log 緩衝區的內容強制寫入磁碟；(3) 把已修改的資料頁（dirty pages）強制寫入資料庫；(4) 在 log 中寫入 **\`<checkpoint, 此刻所有活動中（尚未結束）交易的清單>\`**，再恢復執行。

**判讀圖形**（見題目下方的圖）：棒狀線表示交易的存活期間，起點為 start，終點菱形為 commit，延伸到 tf 者表示故障時**尚未完成**。

| 交易 | 開始時間 | 結束情形 | 在 tc1 是否活動中 | 在 tc2 是否活動中 |
|---|---|---|---|---|
| T1 | tc1 之前 | **tc1 與 tc2 之間提交** | 是 | 否（已提交） |
| T2 | tc1 之前 | **tc2 之後、tf 之前提交** | 是 | 是 |
| T3 | tc2 之後 | tf 時**未完成** | 尚未開始 | 尚未開始 |
| T4 | tc1 與 tc2 之間 | tf 時**未完成** | 尚未開始 | 是 |
| T5 | tc1 之前 | tf 時**未完成** | 是 | 是 |
| T6 | tc1 與 tc2 之間 | **tc2 之後、tf 之前提交** | 尚未開始 | 是 |

**各檢查點所記錄的訊息**

| 檢查點 | 記錄的內容 | 說明 |
|---|---|---|
| **tc1** | \`<checkpoint, {T1, T2, T5}>\` | 此時活動中的交易是 T1、T2、T5；T1、T2、T5 在 tc1 以前的更新已寫入磁碟 |
| **tc2** | \`<checkpoint, {T2, T4, T5, T6}>\` | T1 已提交，不在清單中；T3 尚未開始；T2、T4、T5、T6 仍在執行 |

**(三) 故障（tf）後的回復步驟**

1. 從 log **找到最近的檢查點 tc2**，讀取其中的活動交易清單 {T2, T4, T5, T6}，建立 **undo-list = {T2, T4, T5, T6}**，**redo-list = {}**。
2. 從 tc2 之後**順著 log 往後讀**：
   - 遇到 \`<Ti, start>\`（新開始的交易，如 T3）→ 加入 undo-list。
   - 遇到 \`<Ti, commit>\`（如 T2、T6 在 tc2 之後提交）→ 從 undo-list **移到 redo-list**。
3. 讀完後：**redo-list = {T2, T6}**；**undo-list = {T3, T4, T5}**。
4. **Undo**：從 log 結尾**由後往前**，用**舊值（before value）** 撤銷 undo-list 中交易的更新。因為 T5 在 tc1 之前就開始，往回讀到 **T5 的 start 紀錄**為止（可能要回到 tc1 之前）。
5. **Redo**：從 tc2 位置開始**由前往後**，用**新值（after value）** 重做 redo-list 交易在 tc2 之後的更新。

**(四) 每一筆交易在 tf 後的動作**

| 交易 | 狀態 | 動作 | 原因 |
|---|---|---|---|
| **T1** | 在 tc1 與 tc2 之間提交 | **不需處理** | 它在 tc2 之前提交，其更新已在 tc2 做檢查點時寫入磁碟（檢查點之前已完成的交易不需重做） |
| **T2** | tc1 前開始，tc2 後 tf 前提交 | **Redo（重做）** | 已提交；但其在 tc2 之後的更新可能還沒寫回磁碟，必須重做以保證持久性 |
| **T3** | tc2 後開始，tf 時未完成 | **Undo（撤銷）** | 未提交，其修改可能已寫入資料庫，必須撤銷（保證原子性）；之後可重新執行 |
| **T4** | tc1、tc2 之間開始，tf 時未完成 | **Undo（撤銷）** | 同上 |
| **T5** | tc1 前開始，tf 時未完成 | **Undo（撤銷）** | 同上；且需往回讀到它的開始處 |
| **T6** | tc1、tc2 之間開始，tc2 後 tf 前提交 | **Redo（重做）** | 已提交；其在 tc2 之後的更新必須重做 |

**重點整理**

| 類別 | 交易 | 處理 |
|---|---|---|
| 已在最近檢查點（tc2）之前提交 | T1 | 忽略 |
| tf 前已提交，且在 tc2 時仍在執行或之後才開始 | T2、T6 | **Redo** |
| tf 時尚未提交 | T3、T4、T5 | **Undo** |

**檢查點的好處**：不必處理 tc2 之前已提交的交易（如 T1），縮短回復時間。`

      answer: `**(一) t = 2（8 分）**

**候選鍵**：E# → Addr，E# → Postcode，所以 (E#)⁺ ＝ {E#, Addr, Postcode} ＝ R，**E# 是唯一的候選鍵**。非主屬性：Addr、Postcode。

| 正規型式 | 判斷 | 理由 |
|---|---|---|
| 1NF | 符合 | 每個屬性都是單一值 |
| **2NF** | **符合** | 候選鍵 E# 只有**單一屬性**，不可能有「相依於鍵的一部分」的部分相依；所有非主屬性都完全相依於 E# |
| **3NF** | **不符合** | **Addr → Postcode**：Addr 不是超鍵，Postcode 又是非主屬性。因此 **E# → Addr → Postcode** 形成**傳遞相依**（Postcode 透過非主屬性 Addr 傳遞相依於 E#） |

R 符合 **第 2 正規型式（t = 2）**，不符合**第 3 正規型式（t + 1 = 3）**。

**造成的問題**：同一個地址的郵遞區號會在多人的紀錄中**重複儲存**；修改某地址的郵遞區號要改多列（更新異常）；沒有人居住的地址的郵遞區號無法單獨新增（新增異常）；刪除某地址的最後一位居民，郵遞區號資訊也跟著消失（刪除異常）。

**(二) 使 R 符合 3NF：消除傳遞相依，做無損分解（12 分）**

依造成傳遞相依的 **Addr → Postcode** 分解：

| 資料表 | 欄位（<u>底線</u>＝主鍵） | 外來鍵 | 函數相依 |
|---|---|---|---|
| **R1** | <u>E#</u>, Addr | Addr → R2(Addr) | E# → Addr |
| **R2** | <u>Addr</u>, Postcode | — | Addr → Postcode |

**範例**

原表 R：

| E# | Addr | Postcode |
|---|---|---|
| E01 | 臺北市中正區忠孝西路一段 | 100 |
| E02 | 臺北市中正區忠孝西路一段 | 100 |
| E03 | 新北市板橋區文化路一段 | 220 |

分解後：

| R1：E# | Addr |
|---|---|
| E01 | 臺北市中正區忠孝西路一段 |
| E02 | 臺北市中正區忠孝西路一段 |
| E03 | 新北市板橋區文化路一段 |

| R2：Addr | Postcode |
|---|---|
| 臺北市中正區忠孝西路一段 | 100 |
| 新北市板橋區文化路一段 | 220 |

**驗證**

1. **無損連接**：R1 ∩ R2 = {Addr}，而 Addr 是 R2 的主鍵，所以 R1 ⋈ R2 可完整還原 R。
2. **保持函數相依**：E# → Addr 在 R1，Addr → Postcode 在 R2，E# → Postcode 可由兩者推得（遞移律）。
3. R1 的決定者 E# 是主鍵、R2 的決定者 Addr 是主鍵，兩者皆符合 3NF，也符合 BCNF。
4. **異常消除**：每個地址的郵遞區號只存一次；更新只需改 R2 的一列。`

      answer: `**(一) 何謂 KDD（5 分）**

**KDD（Knowledge Discovery in Databases，資料庫知識發掘）** 是指**從大量資料中，找出有效的、新穎的、潛在有用的、並且可被理解的模式（知識）的整個非瑣碎過程**（Fayyad 等人的定義）。

- KDD 是**完整的流程**；**資料探勘（Data Mining）只是其中套用演算法找出模式的一個步驟**（一般人常把兩者混用）。
- 目標：把原始資料轉化為可以協助決策的**知識**，如客戶分群、購物籃關聯規則、詐欺偵測。

| 階段 | 名稱 | 做什麼 | 例子 |
|---|---|---|---|
| **1** | **選取（Selection）** | 了解應用領域與目標，從資料庫（或倉儲）中**選出與分析目標相關的資料**與屬性，形成目標資料集 | 從銷售資料庫選出近兩年的顧客購買紀錄 |
| **2** | **前處理（Preprocessing／資料清理）** | 處理**雜訊、遺漏值、重複與不一致**的資料，整合多個來源 | 補齊缺漏的年齡、修正錯誤的金額、移除重複的訂單 |
| **3** | **轉換（Transformation）** | 把資料轉成適合探勘的形式：**正規化、離散化、彙總、屬性選擇與降維、衍生新屬性** | 年齡分成年齡層、把每日銷售彙總成每月 |
| **4** | **資料探勘（Data Mining）** | 依目標選擇演算法（分類、分群、關聯規則、預測、異常偵測），**從轉換後的資料找出模式** | 以 Apriori 找出「買尿布也買啤酒」的關聯規則 |
| **5** | **解釋與評估（Interpretation／Evaluation）** | **評估**所發現模式的有效性與有用性，去除冗餘或無意義的模式，**視覺化並解釋**，轉成**知識**，用於決策 | 判斷規則的支持度與信賴度是否有意義，據此調整商品陳列 |

**說明**

1. 前面 1～3 階段合稱「資料準備」，通常占整個專案最多的時間（約七到八成）。
2. KDD 是**反覆（iterative）**的過程：若評估結果不理想，可以回到先前任何階段重新選取資料、重新清理、換用其他演算法。
3. 發現的知識可回饋到營運系統，或儲存於知識庫，供後續使用。`

      answer: `**(一) 資料配置與重複配置策略及其優缺點（15 分）**

**資料配置（Data Allocation）**：決定資料（整個表格或其片段）要**放在哪些站台**。依「**每份資料放幾份副本**」可分為四種策略：

| 策略 | 做法 | 優點 | 缺點 |
|---|---|---|---|
| **1. 集中式（Centralized）** | 所有資料**只放在一個站台**，無複製，其他站台遠端存取 | 最簡單；沒有副本，**更新容易、一致性好**；成本低 | 其他站台**存取慢**（網路延遲）；**單點故障**；中心站台成為**瓶頸**；可用性低 |
| **2. 分割式（Partitioned／Fragmented）** | 資料**切成片段**，每個片段**只放在一個站台**，**不重複** | 資料放在最常使用的站台，**本地存取快**；**沒有副本**，更新簡單；儲存空間不浪費；各站台負載分散 | 跨站台查詢要**連接與傳輸**，較慢；**某站台故障時，該片段無法使用**；可用性不高 |
| **3. 完全複製式（Fully Replicated）** | **每個站台**都存放**完整的資料庫副本** | **查詢最快**（都在本地）；**可用性與可靠度最高**（任一站台故障仍可服務）；查詢負載可分散 | **更新成本最高**，要同步所有副本，維持一致性複雜；**儲存空間浪費**；更新量大時效能差 |
| **4. 部分複製式（Partially Replicated）** | **有些資料有複製、有些沒有**；依使用情況決定哪些資料放在哪幾個站台 | **折衷**：常讀取的資料複製到多處以加快查詢、增加可用性；常更新的資料少複製以降低更新成本 | **設計複雜**，需分析各站台的存取模式；仍要處理副本一致性 |

**選擇的依據**：各站台對資料的**查詢頻率**與**更新頻率**、對**可用性**的要求、**儲存成本**與**網路成本**。

| 情況 | 較適合的策略 |
|---|---|
| 查詢多、更新很少，要求高可用 | 完全複製或部分複製 |
| 更新很頻繁 | 少複製：集中式或分割式 |
| 資料使用有明顯的區域性 | 分割式（放在使用最多的站台） |
| 各資料的使用型態不同 | 部分複製 |

**(二) 以三個據點（1、2、3）與三種資料（A、B、C）為例（10 分）**

下表為假設的各據點使用情形（Q＝查詢、U＝更新，頻率高／中／低），以此說明各策略如何選擇：

| 據點／資料 | A | B | C |
|---|---|---|---|
| 據點 1 | 查詢多 (Q 高) | 查詢少 (Q 低) | 更新多 (U 高) |
| 據點 2 | 查詢多 (Q 高) | 更新多 (U 高) | 查詢少 (Q 低) |
| 據點 3 | 查詢多 (Q 高) | 查詢少 (Q 低) | 查詢少 (Q 低) |

**各策略在本例的配置與適用情況**

| 策略 | 配置方式（資料位於哪些據點） | 適用情況與評估 |
|---|---|---|
| **集中式** | A、B、C 全放在據點 1（或其他單一據點） | 適用於**小型機構、使用量低、各據點分布不遠**；本例據點 2、3 都需頻繁存取 A，若集中就都要遠端存取，不佳 |
| **分割式** | A 放據點 3（或 1）、B 放據點 2、C 放據點 1 | 適用於**各據點使用的資料不同**（區域性強）；B 被據點 2 大量更新、C 被據點 1 大量更新，**放在最常更新的據點**。但 A 被三個據點都大量查詢，只有一份副本時其他據點都要遠端查詢 |
| **完全複製** | 三個據點各存 A、B、C 的完整副本 | 適用於**查詢為主、更新很少、要求高可用**；本例 B、C 更新頻繁，要同步 3 份副本，**更新成本過高**，不適合 |
| **部分複製（本例最合適）** | **A**：三個據點都存一份（讀多，複製到各處，查詢都在本地）；**B**：只放據點 2（據點 2 大量更新，據點 1、3 偶爾遠端查詢）；**C**：只放據點 1（據點 1 大量更新，其他據點偶爾遠端查詢） | **A 讀多更新少** → 完全複製；**B、C 更新多** → 不複製，放在最常使用的據點。在**查詢效能、更新成本與可用性**之間取得最佳平衡 |

**結論**：本例中「資料 A 被三據點大量查詢」適合複製到各據點；「資料 B、C 被單一據點大量更新」適合只放在該據點，因此採用**部分複製**策略最恰當。實際設計還需考慮成本、容錯（如重要資料增加備援副本）與資料量。`

    {
      id: "cs3-db-100-2", no: "二", topic: "db", topicName: "資料庫應用",
      title: "EER 模型相對於 ER 模型的重要擴充，以及這些擴充轉換為關聯式資料表時的處理方式",
      score: 25,
      question: `EER（Enhanced Entity Relationship）模型為 ER（Entity Relationship）模型的擴充，
㈠請簡述 EER 做了那些重要的擴充？（10 分）
㈡而這些擴充部分在轉換為關聯式資料表時，將如何處理？（15 分）`,
      answer: `**(一) EER 模型的重要擴充（10 分）**

ER 模型只有實體、屬性與關聯，難以表示「分類與繼承」等語意。EER 加入**物件導向**的概念：

| 擴充 | 說明 | 例子 |
|---|---|---|
| **子類別／超類別（Subclass／Superclass）** | 超類別是一般性的實體類型，子類別是它的**特殊化**；子類別的每個實體必屬於超類別 | EMPLOYEE（超類別）→ SECRETARY、ENGINEER（子類別） |
| **特殊化（Specialization）與一般化（Generalization）** | **特殊化**：由上而下，把一個類別依特性分成較特殊的子類別；**一般化**：由下而上，把共同特性抽出為超類別 | 把 CAR、TRUCK 一般化成 VEHICLE |
| **屬性繼承（Attribute Inheritance）** | 子類別**繼承**超類別所有屬性與關聯，並可有自己專屬的屬性與關聯 | SECRETARY 繼承員工的姓名、薪水，另有「打字速度」 |
| **特殊化的限制** | **互斥（Disjoint, d）／重疊（Overlapping, o）**：實體可否同時屬於多個子類別；**完全（Total）／部分（Partial）**：超類別的每個實體是否都必須屬於某個子類別 | 員工可同時是工程師與經理（重疊） |
| **聯合類型／類別（Union Type／Category）** | 一個子類別是**多個不同超類別的聯集**，其成員來自其中任一個超類別 | 車輛擁有者（OWNER）可以是個人、公司或銀行 |
| **聚合（Aggregation）／複合（Composition）** | 把「實體與關聯」視為一個整體，再與其他實體建立關聯（整體—部分） | 把「學生選課」整體再與「教師評分」建立關聯 |

**(二) EER 轉換成關聯式資料表的處理方式（15 分）**

先依 ER 的一般規則（實體→表格、1:N 放外來鍵、M:N 新增關聯表）處理，再處理 EER 的擴充部分。

**1. 特殊化／一般化（子類別—超類別）的四種對應方式**

| 方式 | 作法 | 適用情況 | 優缺點 |
|---|---|---|---|
| **A. 超類別與每個子類別各一個表** | 超類別一張表（含共同屬性、主鍵）；**每個子類別一張表**，包含子類別專屬屬性，其**主鍵同時是外來鍵（參照超類別主鍵）** | **任何情形**（互斥、重疊、完全、部分皆可）。最通用 | 彈性最大；查詢子類別完整資料需連接 |
| **B. 只有子類別各一個表** | **不建超類別表**，每個子類別一張表，包含**超類別屬性＋專屬屬性** | 必須是**完全且互斥**（每個實體恰屬於一個子類別） | 查詢單一子類別快；超類別查詢要 UNION；重疊時資料重複 |
| **C. 單一表＋類型屬性** | **所有屬性放在同一張表**，加一個**類型欄位**（如 JobType）表示屬於哪個子類別，不適用的欄位為 NULL | **互斥**的子類別，專屬屬性不多 | 查詢最簡單、不需連接；有**大量 NULL**，空間浪費 |
| **D. 單一表＋多個布林類型欄位** | 同一張表，每個子類別一個**布林（是／否）欄位**，標示是否屬於該子類別 | **重疊**的子類別 | 可表示重疊；NULL 多 |

**例（EMPLOYEE 特殊化成 SECRETARY 與 ENGINEER，方式 A）**

| 資料表 | 欄位（<u>底線</u>＝主鍵） | 外來鍵 |
|---|---|---|
| EMPLOYEE | <u>Ssn</u>, Name, Salary | — |
| SECRETARY | <u>Ssn</u>, TypingSpeed | Ssn → EMPLOYEE |
| ENGINEER | <u>Ssn</u>, EngType | Ssn → EMPLOYEE |

**2. 聯合類型（Union Type／Category）**：因為成員來自不同超類別，各超類別的主鍵不同，**新增一個代理鍵（Surrogate Key）** 作為聯合類型表的主鍵，並在各超類別表中加入該代理鍵作為外來鍵。

| 資料表 | 欄位 | 說明 |
|---|---|---|
| OWNER | <u>OwnerId</u>（代理鍵）, 共同屬性 | 聯合類型 |
| PERSON | <u>Ssn</u>, Name, **OwnerId** | OwnerId → OWNER |
| COMPANY | <u>CName</u>, Address, **OwnerId** | OwnerId → OWNER |

**3. 聚合（Aggregation）**：把被聚合的「關聯」轉成一張表（其主鍵為各參與者的主鍵組合），再以該表的主鍵作為外來鍵，與其他實體建立關聯。

**4. 約束的處理**：互斥、完全等限制在關聯式模型中沒有直接的語法，需以 **CHECK、觸發器（trigger）或應用程式**維護。

**重點**：EER 的「分類與繼承」在關聯式模型中沒有對應的結構，需以**外來鍵共用主鍵**（方式 A）或**類型欄位**（方式 C、D）等方式模擬。`
    },
    {
      id: "cs3-db-100-3", no: "三", topic: "db", topicName: "資料庫應用",
      title: "Data Base、Knowledge Base、Data Warehouse、Data Mart 的定義，並以地震預報與救災為例說明應用",
      score: 25,
      question: `請簡述 Data Base、Knowledge Base、Data Warehouse 以及 Data Mart 等四種系統之定義。（10 分）另外，請以地震為例，說明政府機關如何運用此四種系統於地震預報或救災等工作上。（15 分）`,
      answer: `**(一) 四種系統的定義（10 分）**

| 系統 | 定義 | 儲存的內容 | 主要用途 |
|---|---|---|---|
| **Data Base（資料庫）** | 為特定應用而組織的、**相互關聯的資料集合**，由 DBMS 管理 | **事實資料**（交易與營運資料），內容最新、明細 | 支援**日常營運（OLTP）**：新增、修改、查詢 |
| **Knowledge Base（知識庫）** | 儲存**某領域的知識**的系統，包含**規則、事實、概念與關係**，可被**推論引擎**用來推理 | **知識**：IF-THEN 規則、專家經驗、本體論（ontology） | 支援**專家系統與決策推論**，由已知事實推出結論或建議 |
| **Data Warehouse（資料倉儲）** | **整合多個來源、主題導向、包含歷史、不易變動（非揮發）** 的資料集合（Inmon 定義），用於支援決策 | **整合後的歷史資料**，常含彙總 | 支援**分析與決策（OLAP、資料探勘）** |
| **Data Mart（資料市集）** | **資料倉儲的子集合**，針對**特定部門或主題**（如財務、行銷）建立的小型倉儲 | 某一主題或部門所需的**部分**整合資料 | 讓特定部門**快速、方便**地做分析；成本與建置時間較低 |

**關係**：資料庫（營運資料）→ ETL → 資料倉儲（整合歷史資料）→ 資料市集（部門子集）；從資料倉儲探勘出的規則與模式可存入**知識庫**，供推論使用。

**(二) 以地震為例：政府機關如何運用四種系統（15 分）**

| 系統 | 在地震工作中的內容 | 運用方式 |
|---|---|---|
| **資料庫（Data Base）** | **即時的營運資料**：各地震測站（地震儀）的**即時測值**、最新地震的**時間、震央、規模、深度**、各地**避難所與救災物資的現況**、受災通報與傷亡紀錄、道路與救援隊位置 | 地震發生時，系統**即時記錄與查詢**，提供速報（如地震規模、各縣市震度）與救災調度所需的最新資料 |
| **資料倉儲（Data Warehouse）** | **整合的歷史資料**：數十年的地震紀錄、各斷層與地質資料、各地建築物結構與耐震等級、人口與基礎設施分布、歷次災害損失 | 把分散在氣象、地質、建管、人口等單位的資料**整合（ETL）**，供**長期分析**：如地震趨勢、哪些地區最易受災、損失評估（OLAP 多維度分析、資料探勘） |
| **資料市集（Data Mart）** | **部門專用的子集合**：如 **預報單位**需要的測站與地震波形主題資料、**救災單位**需要的受災人口與物資配送資料、**建管單位**需要的建築耐震資料 | 各單位只存取與自己業務相關的子集合，**查詢快、使用方便**，如救災單位分析各地區物資需求 |
| **知識庫（Knowledge Base）** | **由專家與探勘得出的規則**：如「規模 ≥ 6 且震源深度 < 30 公里且震央在近海 → 發布海嘯警報」、「某斷層帶的震度 ≥ 5 → 老舊建築可能倒塌，優先搜救」、救災標準作業流程與決策規則 | **推論引擎**依即時資料（來自資料庫）套用規則，**自動建議警報等級、疏散範圍、搜救順序**，輔助決策 |

**整體運作流程**

1. **即時資料進入資料庫**：測站資料與災情通報進入資料庫。
2. **知識庫推論**：以資料庫的即時事實為輸入，由知識庫的規則推論出預報與警報（如是否發布警報、影響範圍）。

4. **各單位使用資料市集**：預報、救災、重建單位各取所需的主題資料。

      question: `在考量資料庫安全時，可以在 SQL 指令中使用 GRANT OPTION 來設定權限。今假設有一個表格如下：
Employee（No, Name, Sex, Bdate, Address, Salary），其中 No（編號）為主鍵。
請以 SQL 指令分別完成下列安全要求：
㈠編號 123 之員工可新增及刪除此表格。（5 分）
㈡編號 222 之員工可查詢此表格，但僅能修改 Address 及 Salary 資料。（8 分）
㈢編號 456 之員工可查詢此表格中所有薪水高於 50000 元的員工資料。（12 分）`,
      answer: `**先備知識**

**GRANT** 用來把權限授予使用者：

\`\`\`sql
GRANT 權限1, 權限2 [(欄位清單)] ON 表格或視界 TO 使用者 [WITH GRANT OPTION];
\`\`\`

| 項目 | 說明 |
|---|---|
| 權限種類 | SELECT（查詢）、INSERT（新增列）、DELETE（刪除列）、UPDATE（修改，可限定欄位） |
| \`WITH GRANT OPTION\` | 受授權者可**再把這項權限轉授**給其他使用者；題目沒有要求轉授，故預設**不加** |
| 使用者 | 以員工編號代表，如 \`U123\`（員工 123 的資料庫帳號） |

**(一) 編號 123 可新增及刪除此表格（5 分）**

\`\`\`sql
GRANT INSERT, DELETE ON Employee TO U123;
\`\`\`

- INSERT 允許新增員工資料列；DELETE 允許刪除資料列。
- 沒有授予 SELECT 與 UPDATE，所以他不能查詢或修改（若實務上需要確認新增結果，另行授予 SELECT）。
- 若題意是「建立與刪除整張表」，則是 \`CREATE TABLE\`／\`DROP TABLE\` 的系統權限。

**(二) 編號 222 可查詢此表格，但僅能修改 Address 及 Salary（8 分）**

\`\`\`sql
GRANT SELECT ON Employee TO U222;
GRANT UPDATE (Address, Salary) ON Employee TO U222;
\`\`\`

| 指令 | 作用 |
|---|---|
| \`GRANT SELECT ON Employee TO U222\` | 可查詢整張表的所有欄位 |
| \`GRANT UPDATE (Address, Salary) ON Employee TO U222\` | **欄位層級的更新權限**：只能修改 Address 與 Salary；修改 Name、Sex、Bdate、No 會被拒絕 |

**(三) 編號 456 可查詢此表中所有薪水高於 50000 元的員工資料（12 分）**

GRANT 只能針對**整張表或欄位**授權，**不能直接指定「哪幾列」**。要限制可看到的列，要先建立一個**視界（View）**，把符合條件的列定義出來，再對視界授權。

\`\`\`sql
CREATE VIEW HighSalaryEmployee AS
SELECT *
FROM Employee
WHERE Salary > 50000;

GRANT SELECT ON HighSalaryEmployee TO U456;
\`\`\`

| 步驟 | 說明 |
|---|---|
| 1. 建立視界 \`HighSalaryEmployee\` | 視界只包含薪水高於 50000 的員工資料列（可含所有欄位） |
| 2. 對視界授予 SELECT | U456 只能查詢視界，**看不到薪水 ≤ 50000 的員工**，也沒有 Employee 表本身的權限 |

**重點**：視界是 SQL 實現**列層級存取控制**的標準方法；也可只選出部分欄位，同時達到列與欄位兩方面的限制。薪水改變時，視界會**自動反映**最新的結果。

**補充：使用 WITH GRANT OPTION**

若要讓 U456 能把這項權限再授予他人：

\`\`\`sql
GRANT SELECT ON HighSalaryEmployee TO U456 WITH GRANT OPTION;
\`\`\`

要收回權限用 \`REVOKE\`，若要連同其轉授一併收回，加上 \`CASCADE\`：

\`\`\`sql
REVOKE SELECT ON HighSalaryEmployee FROM U456 CASCADE;
\`\`\``

      question: `請描述資料庫安全管理存取控制策略（Access Control Policy）中之各種機制：
㈠自由選擇存取控制（Discretionary Access Control, DAC）。（7 分）
㈡強制存取控制（Mandatory Access Control, MAC）。（7 分）
㈢角色基礎存取控制（Role-Based Access Control）。（6 分）`,
      answer: `**存取控制的目的**：決定「**誰（主體）**可以對**哪些資料（客體）**做**什麼操作**」，防止未授權的存取。

**(一) 自由選擇存取控制（DAC）（7 分）**

- **定義**：資料的**擁有者（owner）自行決定**要把哪些權限授予哪些使用者，且可進一步讓受權者再轉授（GRANT OPTION）。權限是「**自由裁量**」的，由擁有者決定。
- **機制**：以**存取矩陣**（主體 × 客體 → 權限）或存取控制清單（ACL）記錄；SQL 的 \`GRANT\`、\`REVOKE\` 即屬此類。
- **例**：\`GRANT SELECT, UPDATE ON Student TO user1 WITH GRANT OPTION;\`
- **優點**：**彈性高、容易管理、使用方便**，大多數商用 DBMS 採用。
- **缺點**：安全性較弱；使用者可把自己有權看的資料**轉交給未授權者**（資訊洩漏），無法防止**木馬程式**透過合法使用者外洩資料。

**(二) 強制存取控制（MAC）（7 分）**

- **定義**：由**系統（安全政策）統一強制規定**存取權限，**擁有者也無法更改**。每個**主體**被指定一個**安全等級（許可等級，clearance）**，每個**客體**被指定一個**機密等級（classification）**，如：**絕對機密（TS）> 機密（S）> 秘密（C）> 未分級（U）**。
- **Bell-LaPadula 模型的兩條規則**：
  1. **不可向上讀（Simple Security Property）**：主體只能讀取等級**小於或等於**自己等級的資料。
  2. **不可向下寫（Star Property）**：主體只能寫入等級**大於或等於**自己等級的資料，防止高機密資料被寫到低等級而洩漏。
- **例**：持「機密」許可的使用者，可讀「秘密」文件，但不能讀「絕對機密」；也不能把機密資料寫入「未分級」的檔案。
- **優點**：**安全性高**，可防止資訊洩漏與木馬程式；適用於軍事、政府等**高機密環境**。
- **缺點**：**彈性低**，需分級與標示，管理與實作較複雜。

**(三) 角色基礎存取控制（RBAC）（6 分）**

- **定義**：權限不直接授予個別使用者，而是授予**角色（Role）**（依組織中的職務或職責定義），再把**使用者指派到角色**，使用者因而取得該角色的權限。
- **關係**：使用者 ── 角色 ── 權限；一個使用者可有多個角色，一個角色可有多位使用者。
- **例**：角色「**會計**」有權查詢與修改薪資表；角色「**人事**」可修改員工基本資料；員工調職時只需更換其角色，不必逐一改權限。

\`\`\`sql
CREATE ROLE accountant;
GRANT SELECT, UPDATE ON Salary TO accountant;
GRANT accountant TO user_amy;
\`\`\`

- **優點**：**簡化管理**（使用者異動只改角色）；符合組織結構；易於實施**最小權限原則**與**職責分離**；是目前企業最常用的機制。
- **缺點**：角色設計需要事先分析；角色過多會造成管理負擔。

**(四) 三者比較**

| 項目 | DAC | MAC | RBAC |
|---|---|---|---|
| 誰決定權限 | **資料擁有者** | **系統安全政策**（等級） | **管理者**依職務角色 |
| 授權單位 | 個別使用者 | 安全等級（許可等級 vs 機密等級） | 角色 |
| 彈性 | 高 | 低 | 中 |
| 安全性 | 較低 | 最高 | 中高 |
| 適用場合 | 一般商用系統 | 軍事、政府機密 | 企業組織 |`

\`\`\`

| 層級 | 說明 | 描述對象 |
|---|---|---|
| **外部層（External Level）／視界層** | 各使用者或應用程式**各自看到的資料子集合與呈現方式** | 外部綱要（視界 View），可有多個 |
| **概念層（Conceptual Level）** | **整個資料庫的邏輯結構**：有哪些資料表、屬性、關聯與完整性限制，**不涉及儲存細節** | 概念綱要，**只有一個** |
| **內部層（Internal Level）／實體層** | 資料在儲存媒體上的**實際儲存方式**：檔案結構、索引、資料壓縮、存取路徑 | 內部綱要，**只有一個** |

層與層之間以**對應（mapping）**連接：**外部／概念對應**與**概念／內部對應**。

**(二) 資料獨立（Data Independence）**

**定義**：**修改某一層的綱要，不需要修改高一層的綱要與應用程式**的能力。三層架構提供兩種資料獨立：

| 類型 | 意義 | 圖中位置 | 例子 |
|---|---|---|---|
| **邏輯資料獨立（Logical Data Independence）** | **修改概念綱要**（如新增欄位、新增表格、拆分或合併表格）時，**不必修改外部綱要與應用程式** | 概念層與外部層之間 | 在員工表**新增**「電子郵件」欄位，原有的應用程式與視界不必修改，仍可正常運作 |
| **實體資料獨立（Physical Data Independence）** | **修改內部綱要**（如更改檔案組織、新增索引、搬移磁碟、改變儲存裝置）時，**不必修改概念綱要**（以及外部綱要與應用程式） | 內部層與概念層之間 | 為提升效能而對「姓名」欄位**建立索引**，或把資料搬到新磁碟，邏輯結構與應用程式完全不變 |

**(三) 為什麼可以達成資料獨立：因為層與層之間有「對應」，由 DBMS 負責轉換**

1. **各層只看自己的抽象，彼此隔離**：應用程式只依賴**外部綱要**，不直接依賴儲存細節或整個資料庫的結構。
2. **外部／概念對應吸收概念層的變化（→ 邏輯獨立）**：概念綱要改變時，只要**修改外部／概念之間的對應定義**（如視界的定義），就能讓外部層維持原樣。
3. **概念／內部對應吸收儲存層的變化（→ 實體獨立）**：儲存結構改變時，只要**修改概念／內部之間的對應**，概念綱要就不必變動。
4. **DBMS 自動完成轉換**：查詢提出時，DBMS 依對應把**外部查詢 → 概念查詢 → 實際的儲存存取**，並把結果逆向轉回，使用者與程式完全不需要知道資料實際怎麼存。

**重點**：兩種獨立性的**實現難度不同**：**實體資料獨立**較容易達成（多數 DBMS 都有）；**邏輯資料獨立**較難，因為若修改破壞了視界所依賴的資料（如刪除被視界使用的欄位），仍需要調整。

**好處**：降低程式維護成本、使資料庫可以持續**演進與調校**（效能優化、功能擴充）而不影響既有應用。`

    {
      id: "cs3-db-99-3", no: "三", topic: "db", topicName: "資料庫應用",
      title: "關聯式資料庫與物件導向資料庫在資料模型、查詢與處理上的差異",
      score: 20,
      question: `請說明關聯式資料庫與物件導向資料庫在資料模型上的差異？以及兩者在資料查詢與處理上的主要差別。（20 分）`,
      answer: `**(一) 資料模型上的差異（10 分）**

| 比較項目 | 關聯式資料庫（RDB） | 物件導向資料庫（OODB） |
|---|---|---|
| 基本結構 | **關聯表（relation／table）**：由列（元組）與欄（屬性）組成 | **物件（object）**與**類別（class）**：物件封裝**資料（屬性）與行為（方法）** |
| 資料型態 | 簡單的**內建型態**（整數、字串、日期），屬性值必須是**單一的原子值**（1NF） | 支援**複雜型態**：集合、陣列、巢狀、**使用者自定型態（ADT）** |
| 識別方式 | 以**主鍵值**（使用者定義的屬性值）識別 | 每個物件有系統產生、不變的**物件識別碼（OID）**，與屬性值無關 |
| 關係的表示 | 以**外來鍵**（值的比對）表示表格間的關聯 | 以**物件之間的參照（指標、OID）**直接表示關聯 |
| 封裝與行為 | **資料與程式分離**，資料表只有資料（預存程序、觸發器有限） | **封裝**：資料與方法結合為物件，外部透過方法存取 |
| 繼承與多型 | **不支援**（需以多個表格模擬） | **支援類別繼承、多型、方法覆寫** |
| 理論基礎 | **集合論與關聯代數**，有嚴謹數學基礎 | 物件導向概念，沒有統一的數學基礎（ODMG 標準） |
| 與程式語言的關係 | 與程式語言的資料型態**不匹配**（**阻抗不匹配**，需要物件—關聯對應 ORM） | 與物件導向程式語言（Java、C++）**緊密整合**，資料型態一致 |

**(二) 資料查詢與處理上的差別（10 分）**

| 比較項目 | 關聯式資料庫 | 物件導向資料庫 |
|---|---|---|
| 查詢語言 | **SQL**（標準化、宣告式） | **OQL**（Object Query Language，類似 SQL）或**以程式語言直接存取物件** |
| 資料存取方式 | **以值為基礎的連接（JOIN）** 找出相關資料，需要比對鍵值 | **導覽式存取**：沿著物件參照（OID）**逐步走訪**相關物件，不需連接 |
| 複雜結構的處理 | 複雜物件需拆成多個表格，**查詢時要多次連接**，效能較低 | 複雜物件（如巢狀、階層、圖形結構）**整個存取**，**效能高** |
| 資料處理邏輯 | 邏輯**寫在應用程式**中，或預存程序 | 邏輯寫在**物件的方法**中，隨資料封裝；可重用 |
| 適用場合 | **商業資料處理**（結構簡單、資料量大、需要 ad hoc 查詢）：銀行、訂單、人事 | **複雜資料**：CAD／CAM、多媒體、地理資訊系統（GIS）、工程設計 |
| 成熟度與標準化 | **非常成熟**，標準化高（SQL），工具豐富 | 較不成熟，標準化較少，市場占有率低 |
| 並行與交易 | 完整的交易管理（ACID）、成熟的並行控制 | 支援交易，但長時間的交易較複雜 |

**(三) 總結與發展**

| 項目 | 說明 |
|---|---|
| 核心差異 | RDB 以**「值」與表格**組織資料；OODB 以**「物件」與參照**組織資料 |
| 折衷方案 | **物件關聯式資料庫（Object-Relational DB, ORDB）**：在關聯式基礎上加入**使用者自定型態、巢狀表格、繼承、方法**，支援 SQL:1999 以後的物件功能（如 PostgreSQL、Oracle）。兼顧成熟度與複雜資料的處理能力 |`
    },
    {
      id: "cs3-db-99-4", no: "四", topic: "db", topicName: "資料庫應用",
      title: "正規化的目的與前三階步驟（1NF、2NF、3NF），並以 R=(A,B,C,D,E) 舉例",
      score: 20,
      question: `請說明正規化的目的、前三階步驟（即 1NF、2NF 與 3NF）及其內容。並以表格 R＝(<u>A</u>, <u>B</u>, C, D, E) 舉例說明。（20 分）`,
      answer: `**(一) 正規化的目的**

**正規化（Normalization）** 是依據**函數相依**，把表格逐步分解為較小、結構較良好的表格的過程。目的：

1. **減少資料冗餘**，節省儲存空間。
2. **避免新增、更新、刪除異常**，維持資料一致性。
3. 使資料結構清楚、**易於維護與擴充**。
4. 分解必須是**無損連接**的（不丟失資訊），並盡量**保持函數相依**。

**(二) 前三階正規型式的內容與步驟**

| 正規型式 | 條件 | 消除的問題 | 作法 |
|---|---|---|---|
| **1NF** | 每個欄位都是**單一、不可再分的值**（無重複群組與多值屬性） | 重複群組與多值欄位 | 把重複群組**展開成多列**（或拆成另一個表格），並定義主鍵 |
| **2NF** | 符合 1NF，且每個**非主屬性**都**完全函數相依**於主鍵（無部分相依） | **部分相依**（只相依於複合鍵的一部分） | 把部分相依的屬性連同其決定者**拆成新表** |
| **3NF** | 符合 2NF，且非主屬性之間**沒有傳遞相依**（非主屬性不可相依於另一個非主屬性） | **傳遞相依**（A→B，B→C） | 把傳遞相依的屬性連同其決定者**拆成新表** |

**(三) 以 R＝(<u>A</u>, <u>B</u>, C, D, E) 舉例**

**設定語意**（A、B 為複合主鍵，題目以底線標示）：

| 屬性 | 代表 | 函數相依 |
|---|---|---|
| A | 學號 | **A → C**（學號決定系所）— 部分相依（只相依於主鍵的一部分 A） |
| B | 課號 | **C → D**（系所決定系主任）— 傳遞相依（非主屬性決定非主屬性） |
| C | 系所 | **AB → E**（學號與課號決定成績）— 完全相依 |
| D | 系主任 | |
| E | 成績 | |

**步驟 0：未正規化（含重複群組）**

| 學號 A | 系所 C | 系主任 D | 課號 B、成績 E（重複群組） |
|---|---|---|---|
| S01 | 資工系 | 林主任 | (DB, 90)、(OS, 85) |
| S02 | 資工系 | 林主任 | (DB, 80) |
| S03 | 電機系 | 張主任 | (OS, 70) |

**步驟 1：第一正規化（1NF）**：把重複群組展開成多列，每格皆為單一值，主鍵 **(A, B)**。

| A（學號） | B（課號） | C（系所） | D（系主任） | E（成績） |
|---|---|---|---|---|
| S01 | DB | 資工系 | 林主任 | 90 |
| S01 | OS | 資工系 | 林主任 | 85 |
| S02 | DB | 資工系 | 林主任 | 80 |
| S03 | OS | 電機系 | 張主任 | 70 |

**問題**：S01 的系所、系主任重複儲存（部分相依 A → C）；資工系的系主任也重複（傳遞相依）。

**步驟 2：第二正規化（2NF）**：消除**部分相依 A → C**。把依賴 A 的屬性（C，以及透過 C 的 D）拆成新表：

| R1（<u>A</u>, C, D） | | | R2（<u>A</u>, <u>B</u>, E） | | |
|---|---|---|---|---|---|
| **A** | **C** | **D** | **A** | **B** | **E** |
| S01 | 資工系 | 林主任 | S01 | DB | 90 |
| S02 | 資工系 | 林主任 | S01 | OS | 85 |
| S03 | 電機系 | 張主任 | S02 | DB | 80 |
| | | | S03 | OS | 70 |

此時 E 完全相依於 (A, B)；R1 中 C 與 D 完全相依於 A（單一主鍵），符合 2NF。但 R1 仍有**傳遞相依 A → C → D**。

**步驟 3：第三正規化（3NF）**：消除**傳遞相依 A → C → D**，把 C → D 拆出：

| R1a（<u>A</u>, C） | | R1b（<u>C</u>, D） | | R2（<u>A</u>, <u>B</u>, E） | | |
|---|---|---|---|---|---|---|
| **A** | **C** | **C** | **D** | **A** | **B** | **E** |
| S01 | 資工系 | 資工系 | 林主任 | S01 | DB | 90 |
| S02 | 資工系 | 電機系 | 張主任 | S01 | OS | 85 |
| S03 | 電機系 | | | S02 | DB | 80 |
| | | | | S03 | OS | 70 |

**結果**：R 最終分解成 **R1a(A, C)、R1b(C, D)、R2(A, B, E)**，每個非主屬性都「**完全相依於主鍵、且只相依於主鍵**」（口訣：*the key, the whole key, and nothing but the key*）。

**驗證**：(1) 無損連接：R1a ⋈ R1b ⋈ R2 可還原原表；(2) 保持函數相依：A→C 在 R1a，C→D 在 R1b，AB→E 在 R2；(3) 系主任只存一次，更改系主任只需改 R1b 的一列。`
    },
    {
      id: "cs3-db-99-5", no: "五", topic: "db", topicName: "資料庫應用",
      title: "租車公司 ER 圖轉換成關聯表格（製造商、汽車、維修事件、客戶與租借）",
      score: 20,
      question: `請將租車公司 ER 圖（Entity-Relationship Diagram）（如圖所示）轉換成為關聯表格。製造商（MANUFACTURER）表格共有 4 個欄位（Manufacturer Name, Manufacturer Country, Sales Rep Name, Sales Rep Telephone）。汽車（CAR）表格共有 4 個欄位（Car Serial Number, Model, Year, Class）。維修事件（MAINTENANCE EVENT）表格共有 5 個欄位（Repair Number, Date, Procedure, Mileage, Repair Time）。客戶（CUSTOMER）表格共有 4 個欄位（Customer Number, Customer Name, Customer Address, Customer Telephone）。其中客戶租車必須記錄 3 個欄位（Rental Date, Return Date, Total Cost）資料。（20 分）
（ER 圖的原圖：MANUFACTURER —Manufactured— CAR —Rented— CUSTOMER，CAR —Repaired— MAINTENANCE EVENT，其中 Rented 關聯帶有 Rental Date、Return Date、Total Cost 三個屬性。）`,
      answer: `**(一) 先讀懂 ER 圖：各關聯的基數**

圖中以**鳥爪記號（crow's foot）** 表示基數，圖上的星號（*）標示各實體的識別屬性（主鍵）：

| 實體 | 主鍵（圖中標星號） |
|---|---|
| MANUFACTURER | Manufacturer Name |
| CAR | Car Serial Number |
| MAINTENANCE EVENT | Repair Number |
| CUSTOMER | Customer Number |

| 關聯 | 兩端的基數（依圖形） | 型態 | 轉換規則 |
|---|---|---|---|
| **Manufactured**（MANUFACTURER—CAR） | 製造商端：**恰好一個**（雙短線）；汽車端：**一個或多個**（鳥爪＋短線） | **1:N**，汽車必定有一個製造商 | 把製造商的主鍵放進 **CAR** 作為外來鍵（**NOT NULL**） |
| **Repaired**（CAR—MAINTENANCE EVENT） | 汽車端：**恰好一個**；維修端：**零個或多個**（鳥爪＋圓圈） | **1:N**，每筆維修必屬於一部車；車可以沒有維修紀錄 | 把汽車的主鍵放進 **MAINTENANCE EVENT** 作為外來鍵（**NOT NULL**） |
| **Rented**（CAR—CUSTOMER） | 汽車端：**一個或多個**；客戶端：**零個或多個**（兩端皆為鳥爪） | **M:N**，且關聯有 3 個屬性 | 新增一個**關聯表 RENTAL**，包含兩端主鍵與關聯屬性 |

**轉換規則**：每個實體轉成一個表格；**1:N 關聯**把「1」方的主鍵放到「N」方當外來鍵；**M:N 關聯**必須另建關聯表，其主鍵由兩邊的主鍵（加上必要的區別屬性）組成，關聯上的屬性放在該表中。

**(二) 轉換後的關聯表**

| 資料表 | 欄位（<u>底線</u>＝主鍵） | 外來鍵 |
|---|---|---|
| **MANUFACTURER** | <u>Manufacturer_Name</u>, Manufacturer_Country, Sales_Rep_Name, Sales_Rep_Telephone | — |
| **CAR** | <u>Car_Serial_Number</u>, Model, Year, Class, **Manufacturer_Name**（NOT NULL） | Manufacturer_Name → MANUFACTURER |
| **MAINTENANCE_EVENT** | <u>Repair_Number</u>, Date, Procedure, Mileage, Repair_Time, **Car_Serial_Number**（NOT NULL） | Car_Serial_Number → CAR |
| **CUSTOMER** | <u>Customer_Number</u>, Customer_Name, Customer_Address, Customer_Telephone | — |
| **RENTAL**（由 M:N 關聯 Rented 轉成） | <u>Car_Serial_Number</u>, <u>Customer_Number</u>, <u>Rental_Date</u>, Return_Date, Total_Cost | Car_Serial_Number → CAR；Customer_Number → CUSTOMER |

**RENTAL 主鍵說明**：同一位客戶可以在不同日期重複租同一部車，所以把 **Rental_Date 也納入主鍵**，主鍵為 (Car_Serial_Number, Customer_Number, Rental_Date)。Return_Date 與 Total_Cost 是這次租借的屬性。

**(三) SQL 定義（驗證用）**

\`\`\`sql
CREATE TABLE MANUFACTURER (
  Manufacturer_Name     VARCHAR(50) PRIMARY KEY,
  Manufacturer_Country  VARCHAR(30),
  Sales_Rep_Name        VARCHAR(50),
  Sales_Rep_Telephone   VARCHAR(20)
);

CREATE TABLE CAR (
  Car_Serial_Number  VARCHAR(20) PRIMARY KEY,
  Model              VARCHAR(30),
  Year               INT,
  Class              VARCHAR(20),
  Manufacturer_Name  VARCHAR(50) NOT NULL,
  FOREIGN KEY (Manufacturer_Name) REFERENCES MANUFACTURER (Manufacturer_Name)
);

CREATE TABLE MAINTENANCE_EVENT (
  Repair_Number      VARCHAR(20) PRIMARY KEY,
  Repair_Date        DATE,
  Procedure_Desc     VARCHAR(100),
  Mileage            INT,
  Repair_Time        DECIMAL(5,1),
  Car_Serial_Number  VARCHAR(20) NOT NULL,
  FOREIGN KEY (Car_Serial_Number) REFERENCES CAR (Car_Serial_Number)
);

CREATE TABLE CUSTOMER (
  Customer_Number     VARCHAR(20) PRIMARY KEY,
  Customer_Name       VARCHAR(50),
  Customer_Address    VARCHAR(100),
  Customer_Telephone  VARCHAR(20)
);

CREATE TABLE RENTAL (
  Car_Serial_Number  VARCHAR(20),
  Customer_Number    VARCHAR(20),
  Rental_Date        DATE,
  Return_Date        DATE,
  Total_Cost         DECIMAL(10,2),
  PRIMARY KEY (Car_Serial_Number, Customer_Number, Rental_Date),
  FOREIGN KEY (Car_Serial_Number) REFERENCES CAR (Car_Serial_Number),
  FOREIGN KEY (Customer_Number) REFERENCES CUSTOMER (Customer_Number)
);
\`\`\`

（\`Date\`、\`Procedure\`、\`Year\` 等為資料庫保留字或常用字，實作時改名為 \`Repair_Date\`、\`Procedure_Desc\` 等，意義與題目的欄位相同。）

**重點**：1:N 關聯不另建表，只在「多」的一方加外來鍵；M:N 關聯必須建立關聯表，關聯上的屬性（租借日期、歸還日期、總費用）放在該表中。`
    }
  ]
},

{
  year: "98", exam: "customs3", topic: "db",
  subject: "資料庫應用", totalScore: 100, timeLimit: "2小時",
  note: "三等關務人員考試｜類科：資訊處理｜代號 63330",
  questions: [
    {
      id: "cs3-db-98-1", no: "一", topic: "db", topicName: "資料庫應用",
      title: "教師／學系資料庫 — 兩題 SQL 查詢（連接篩選、分組加總）",
      score: 30,
      figure: `<div style="font-size:.95rem;line-height:1.9">教師（<u>教師編號</u>、姓名、學系名稱、月薪）　　FK：學系名稱 → 學系（學系名稱）<br>學系（<u>學系名稱</u>、學院名稱、年度預算）</div>`,
      question: `某一所大學的關聯式資料庫包含下列兩個表格：
教師（<u>教師編號</u>、姓名、學系名稱、月薪）
學系（<u>學系名稱</u>、學院名稱、年度預算）
有底線之屬性（Attribute）為該表格之主鍵（Primary Key），「教師」表格有一個外來鍵（Foreign Key）「學系名稱」，參照「學系」表格的主鍵。
針對下列兩個查詢問題，請各寫出一個 SQL 敘述（Statement）來進行查詢。
㈠列出學院名稱為「資訊學院」所有教師的教師編號、姓名及學系名稱。（15 分）
㈡列出所有年度預算大於 2,000,000 元學系之學系名稱及該學系所有教師的月薪總和。（15 分）`,
      answer: `**表格關係**：「教師.學系名稱」是外來鍵，參照「學系.學系名稱」，所以兩表以 **學系名稱** 連接。「學院名稱」與「年度預算」在學系表，教師的資料在教師表。

**(一) 資訊學院所有教師的教師編號、姓名及學系名稱（15 分）**

\`\`\`sql
SELECT T.教師編號, T.姓名, T.學系名稱
FROM 教師 T
JOIN 學系 D ON T.學系名稱 = D.學系名稱
WHERE D.學院名稱 = '資訊學院';
\`\`\`

| 說明 | |
|---|---|
| 連接 | 教師與學系以學系名稱相等連接，才能知道每位教師所屬學院 |
| 條件 | \`WHERE D.學院名稱 = '資訊學院'\` 只留下資訊學院的教師 |
| 輸出 | 教師編號、姓名、學系名稱（取自教師表） |

等價的子查詢寫法：

\`\`\`sql
SELECT 教師編號, 姓名, 學系名稱
FROM 教師
WHERE 學系名稱 IN (SELECT 學系名稱 FROM 學系 WHERE 學院名稱 = '資訊學院');
\`\`\`

**(二) 年度預算大於 2,000,000 元的學系名稱及其所有教師的月薪總和（15 分）**

\`\`\`sql
SELECT D.學系名稱, SUM(T.月薪) AS 月薪總和
FROM 學系 D
JOIN 教師 T ON D.學系名稱 = T.學系名稱
WHERE D.年度預算 > 2000000
GROUP BY D.學系名稱;
\`\`\`

| 說明 | |
|---|---|
| WHERE | 先過濾年度預算 > 2,000,000 的學系（**分組之前的列條件**） |
| 連接 | 取得該學系每位教師的月薪 |
| GROUP BY | 依學系名稱分組，每個學系一列 |
| SUM | 對每個學系內所有教師的月薪加總 |

**說明**

1. 年度預算是**學系層級**的資料，不是聚合的結果，所以條件放在 \`WHERE\`（不是 HAVING）。
2. 若某個預算高於 2,000,000 的學系**沒有任何教師**，上述內連接不會列出該系。若要列出並顯示總和 0，改用 \`LEFT JOIN\` 並用 \`COALESCE(SUM(T.月薪), 0)\`：

\`\`\`sql
SELECT D.學系名稱, COALESCE(SUM(T.月薪), 0) AS 月薪總和
FROM 學系 D

**主屬性與非主屬性**：候選鍵 {A, B} 與 {A, C} 共包含 A、B、C，所以**主屬性＝A、B、C**；**非主屬性＝D**。

| 函數相依 | 左邊是超鍵？ | 右邊是主屬性？ | 結果 |
|---|---|---|---|
| {A, B} → {D} | 是（候選鍵） | — | 符合 3NF 與 BCNF |
| {A, C} → {D} | 是（候選鍵） | — | 符合 3NF 與 BCNF |
| {B} → {C} | **否**（B 不是超鍵） | **是**（C 是主屬性） | **符合 3NF**，但**違反 BCNF** |
| {C} → {B} | **否**（C 不是超鍵） | **是**（B 是主屬性） | **符合 3NF**，但**違反 BCNF** |

| 正規型式 | 判斷 | 理由 |
|---|---|---|
| 1NF | 符合 | 屬性皆為單一值 |
| 2NF | 符合 | 唯一的非主屬性 D 完全相依於各候選鍵（{A, B}、{A, C}），沒有部分相依（D 不由 A、B、C 單獨決定） |
| **3NF** | **符合** | 每個非平凡相依，要嘛左邊是超鍵，要嘛右邊是主屬性（B→C 的 C、C→B 的 B 都是主屬性） |
| BCNF | **不符合** | B→C、C→B 的決定者 B、C 都不是超鍵 |

**結論**：R 屬於**第三正規型式（3NF）**，不屬於 BCNF。

**會有什麼問題（BCNF 違反的後果）**：B 與 C 一對一對應（B→C 且 C→B），這個對應關係在表中**隨著不同的 A 而重複出現**，造成冗餘與更新異常。

**(二) 正規化為 BCNF（10 分）**

**依違反 BCNF 的相依 B → C 分解**：

| 表格 | 屬性 | 主鍵 | 外來鍵 |
|---|---|---|---|
| **R1**（B_C） | B, C | **B**（C 也是候選鍵，因 C→B） | — |
| **R2**（A_B_D） | A, B, D | **{A, B}** | **B → R1(B)** |

**驗證**

1. **無損連接**：R1 ∩ R2 = {B}，B 是 R1 的鍵，所以 R1 ⋈ R2 可還原 R。
2. **BCNF**：R1(B, C) 的相依 B→C、C→B，決定者都是鍵 ✓；R2(A, B, D) 的相依 AB→D，決定者是鍵 ✓。
3. **保持函數相依**：
   - B → C、C → B 在 R1。
   - {A, B} → D 在 R2。
   - {A, C} → D：可由 C → B 與 {A, B} → D 推導（AC → AB → D），所以**沒有遺失**。
4. 同樣，也可以改為保留 C：R1'(B, C)（相同），R2'(A, C, D)，主鍵 {A, C}，外來鍵 C → R1'(C)。兩種分解等價。

**範例**

原表 R：

| A | B | C | D |
|---|---|---|---|
| a1 | b1 | c1 | d1 |
| a2 | b1 | c1 | d2 |
| a1 | b2 | c2 | d3 |

R1(B, C)：(b1, c1)、(b2, c2)（B 與 C 的對應只存一次）；R2(A, B, D)：(a1, b1, d1)、(a2, b1, d2)、(a1, b2, d3)。`

**(二) 各層級的目的**

| 層級 | 對應的綱要 | 說明 | 目的 |
|---|---|---|---|
| **外部層（External Level）／視界層** | **外部綱要**（External Schema），又稱**使用者視界（User View）**，可有**多個** | 每個使用者或應用程式**只看到自己需要的資料部分**，以及自己習慣的呈現方式 | 1. 讓不同使用者以**不同角度**看同一個資料庫，使用方便。<br>2. **隱藏**與使用者無關的資料，提供**安全性**（只能存取授權的部分）。<br>3. 提供**邏輯資料獨立性** |
| **概念層（Conceptual Level）**／邏輯層 | **概念綱要**（Conceptual Schema），**只有一個** | 描述**整個資料庫的整體邏輯結構**：有哪些實體（資料表）、屬性、關聯、完整性限制與語意；**不涉及儲存細節** | 1. 提供**全體使用者共同的、完整的資料庫整體描述**。<br>2. **隱藏實體儲存細節**，只關心「儲存什麼資料、資料間的關係」。<br>3. 是**資料庫管理者（DBA）** 管理資料庫的主要層級 |
| **內部層（Internal Level）**／實體層 | **內部綱要**（Internal Schema），**只有一個** | 描述資料**在儲存媒體上的實際儲存方式**：檔案結構、記錄格式、索引、存取路徑、資料壓縮與加密 | 1. 決定資料**如何儲存、如何有效率存取**，以滿足**效能與空間**需求。<br>2. 提供**實體資料獨立性**：儲存結構改變不影響概念層 |

**(三) 層與層之間的對應（Mapping）**

| 對應 | 作用 | 達成的資料獨立 |
|---|---|---|
| 外部／概念對應 | 把使用者的視界轉換到概念層的結構 | **邏輯資料獨立**：概念綱要改變時，只需修改這個對應，外部綱要與應用程式不變 |
| 概念／內部對應 | 把概念層的結構轉換到實際的儲存結構 | **實體資料獨立**：內部儲存改變時，只需修改這個對應，概念綱要不變 |

**重點**：三層架構的主要目的是達成**資料獨立性**，使各層可以獨立修改、使用者彼此隔離、並由 DBMS 負責層與層之間的轉換。`

      question: `名詞解釋：請儘可能舉例說明。（30 分）
㈠磁碟陣列等級 5（RAID 5）
㈡雜湊法（Hashing）
㈢資料探勘（Data Mining）

㈤觸發程序（Triggers）
㈥關聯式代數（Relational Algebra）`,
      answer: `**(一) 磁碟陣列等級 5（RAID 5）**

**RAID（Redundant Array of Independent Disks）** 把多顆磁碟組合成一個邏輯磁碟，以提升**效能**與**可靠度**。

**RAID 5**：**資料分段（striping）並加上分散式同位檢查（distributed parity）**。

- 至少需要 **3 顆磁碟**。資料以**區塊**為單位輪流寫入各顆磁碟，同位檢查（parity）資訊**也輪流分散**存放在不同磁碟（不是固定在某一顆）。
- **容錯能力**：**任一顆磁碟損壞**，都能以其他磁碟的資料與同位檢查**計算出**損壞磁碟的內容（同位檢查是各磁碟對應區塊的 XOR），資料不遺失。
- **可用容量**：N 顆磁碟的可用空間為 **(N − 1)** 顆。

| 優點 | 缺點 |
|---|---|
| 讀取效能佳；儲存效率高（損失一顆的容量）；可容許一顆磁碟故障 | 寫入需要重新計算同位檢查，**寫入效能較差**；重建（rebuild）期間效能下降；**同時壞兩顆磁碟則資料全部遺失** |

**例**：4 顆各 1 TB 的磁碟組成 RAID 5，可用容量 3 TB；壞掉一顆時，換上新碟後系統可由其他三顆重建資料。

**(二) 雜湊法（Hashing）**

**定義**：以**雜湊函數 h(k)** 把**鍵值 k 直接轉換成儲存位置（桶，bucket）** 的檔案組織與存取方法，**不必搜尋**即可找到資料，**存取時間接近 O(1)**。

**運作**：寫入時以 h(key) 計算出**桶編號**，把資料存放在該桶；查詢時用同一個函數算出位置，直接讀取。

**例**：h(k) = k mod 7。學號 25 → 25 mod 7 = 4，存放在第 4 號桶；查詢 25 時同樣算出 4，直接到第 4 號桶取得。

**衝突（Collision）**：不同的鍵值雜湊到同一個桶（如 25 與 32 都對應 4）。處理方式：**開放定址（線性探測）**、**鏈結（chaining）**、**溢位區**。

| 優點 | 缺點 |
|---|---|
| **等值查詢**（key = 值）非常快 | **不適合範圍查詢**（BETWEEN）與排序；需處理衝突；桶數固定時資料增長會降低效能（可用動態雜湊、可擴充雜湊改善） |

**(三) 資料探勘（Data Mining）**

**定義**：以統計、機器學習與資料庫技術，**從大量資料中自動找出隱藏的、未知的、有用的模式與規則**的過程，是 **KDD（資料庫知識發掘）流程中的核心步驟**。

**主要任務與例子**

| 任務 | 說明 | 例子 |
|---|---|---|
| **關聯規則（Association）** | 找出同時出現的項目 | 購物籃分析：買尿布的顧客也常買啤酒 |
| **分類（Classification）** | 依已知類別建立模型，預測新資料的類別 | 預測貸款申請人是否會違約 |
| **分群（Clustering）** | 把相似的資料分成群組（事先不知道類別） | 依消費行為把顧客分群 |
| **預測／迴歸（Prediction）** | 預測連續數值 | 預測下月銷售額 |
| **異常偵測（Anomaly Detection）** | 找出異常資料 | 信用卡盜刷偵測 |

**(四) 外來鍵（Foreign Key）**

**定義**：某個表格中的**一個或一組屬性**，其值必須是**另一個表格主鍵（或候選鍵）的已存在值**（或 NULL）。外來鍵用來建立表格間的關聯，並維持**參照完整性**。

**例**：

\`\`\`sql
CREATE TABLE Dept (DeptNo INT PRIMARY KEY, DeptName VARCHAR(30));
CREATE TABLE Emp (
  EmpNo  INT PRIMARY KEY,
  Name   VARCHAR(30),
  DeptNo INT,
  FOREIGN KEY (DeptNo) REFERENCES Dept (DeptNo)
    ON DELETE SET NULL ON UPDATE CASCADE
);
\`\`\`

Emp.DeptNo 是外來鍵，其值必須是 Dept 中已存在的 DeptNo。刪除被參照的資料時，可選擇：\`RESTRICT\`（拒絕）、\`CASCADE\`（連帶刪除）、\`SET NULL\`（設為空值）。

**(五) 觸發程序（Triggers）**

**定義**：**當資料表發生特定事件（INSERT、UPDATE、DELETE）時，由資料庫自動執行的預存程序**。常以 **事件—條件—動作（ECA）** 的規則表示。用途：維護複雜的完整性限制、稽核紀錄、自動計算、通知。

**例**：員工薪水被修改時，自動記錄到稽核表。

\`\`\`sql
CREATE TRIGGER trg_salary_audit
AFTER UPDATE OF Salary ON Employee
FOR EACH ROW
WHEN (NEW.Salary <> OLD.Salary)
BEGIN
  INSERT INTO SalaryLog (EmpNo, OldSalary, NewSalary, ChangeTime)
  VALUES (OLD.EmpNo, OLD.Salary, NEW.Salary, CURRENT_TIMESTAMP);
END;
\`\`\`

| 要素 | 說明 |
|---|---|
| 事件 | UPDATE OF Salary |
| 條件 | 新舊薪水不同 |
| 動作 | 寫入 SalaryLog 一筆紀錄 |

**(六) 關聯式代數（Relational Algebra）**

**定義**：以**關聯表為運算對象**、輸入與輸出都是關聯表的一組**程序式查詢語言**運算，是關聯式資料庫理論與 SQL 的數學基礎。

| 運算 | 符號 | 說明 | 例子 |
|---|---|---|---|
| 選擇 Select | σ | 挑選符合條件的列 | σ 薪水>50000 (員工) |
| 投影 Project | π | 挑選指定的欄（並去除重複） | π 姓名, 部門 (員工) |
| 聯集 Union | ∪ | 兩表的所有列 | R ∪ S |
| 差集 Difference | − | 在 R 不在 S 的列 | R − S |
| 卡氏積 Cartesian Product | × | 兩表所有列的配對 | R × S |
| 連接 Join | ⋈ | 以條件連接兩表 | 員工 ⋈ 部門 |
| 交集、除法、更名 | ∩、÷、ρ | 衍生運算與更名 | R ∩ S |

**例**：「找出資訊系學生的姓名」→ **π 姓名 ( σ 系別 = '資訊系' (學生) )**，對應 SQL：\`SELECT 姓名 FROM 學生 WHERE 系別='資訊系'\`。`

      answer: `**(一) 何謂中介軟體（Middleware）**

**中介軟體**是位於**應用程式與作業系統（或網路、資料庫）之間**的**軟體層**，提供**標準化的介面與共同服務**，隱藏底層不同系統的差異，使不同的應用程式、硬體平台、資料庫能夠**互相連接與溝通**。

**資料庫中介軟體**：位於應用程式與各種資料庫管理系統之間，讓應用程式以**統一的方式**存取**不同廠牌**的資料庫。

**常用的資料庫中介軟體**：**ODBC**（Open Database Connectivity，微軟）、**JDBC**（Java Database Connectivity，Java 平台）、OLE DB／ADO.NET 等。以下以 **ODBC** 為例。

**(二) 目的**

| 目的 | 說明 |
|---|---|
| **與資料庫廠牌無關** | 應用程式只要使用標準的 ODBC 介面與 SQL，**不必針對每種資料庫重寫存取程式** |
| **異質資料庫整合** | 同一個應用程式可以同時存取 Oracle、SQL Server、MySQL 等不同的資料庫 |
| **易於更換資料庫** | 更換後端資料庫，只需更換驅動程式與連線設定，程式幾乎不用修改 |
| **降低開發與維護成本** | 標準化的存取方式，開發人員不用學習各家專有 API |

| 元件 | 功能 |
|---|---|
| **應用程式** | 呼叫標準的 ODBC 函式（如 \`SQLConnect\`、\`SQLExecDirect\`、\`SQLFetch\`），並送出 SQL |
| **驅動程式管理員（Driver Manager）** | 依**資料來源名稱（DSN）** 載入對應的驅動程式，並傳遞呼叫 |
| **ODBC 驅動程式（Driver）** | 由各資料庫廠商提供；把標準的 ODBC 呼叫與 SQL **轉換成該資料庫專屬的協定與 SQL 方言**，傳送給資料庫，並把結果轉成標準格式傳回 |
| **資料來源（Data Source）** | 實際的資料庫與其連線資訊（伺服器、帳號） |

**執行流程**：

1. 應用程式透過 DSN **連線**。
2. 驅動程式管理員載入對應資料庫的驅動程式。
3. 應用程式送出 SQL（如 \`SELECT * FROM Student\`）。
4. 驅動程式把它轉換成該資料庫能理解的形式，送交資料庫執行。
5. 資料庫回傳結果集，驅動程式轉成標準格式，應用程式**逐列取回**（\`SQLFetch\`）。
6. 結束後**釋放資源並中斷連線**。

**好處與限制**：應用程式與資料庫解耦、可攜性高；缺點是多了一層轉換，**效能略低**，且只能使用各資料庫都支援的**標準功能**（專有功能無法直接使用）。`

      answer: `**(一) 發生的問題：並行控制失敗（Concurrency Control Problem）— 遺失更新（Lost Update）**

兩部 ATM 對**同一帳戶**的兩個交易**同時**執行，且沒有適當的並行控制，造成交錯執行，違反**隔離性（Isolation）**。

| 時間 | 交易 T1（ATM 1，領 100 萬） | 交易 T2（ATM 2，領 100 萬） | 帳戶餘額（資料庫） |
|---|---|---|---|
| t1 | Read(餘額) → 讀到 100 萬 | | 100 萬 |
| t2 | | Read(餘額) → 讀到 100 萬 | 100 萬 |
| t3 | 檢查：100 萬 ≥ 100 萬 ✓ | 檢查：100 萬 ≥ 100 萬 ✓ | 100 萬 |
| t4 | 餘額 = 100 − 100 = 0；Write(0) | | **0** |
| t5 | 出鈔 100 萬 | 餘額 = 100 − 100 = 0；Write(0) | **0** |
| t6 | | 出鈔 100 萬 | **0** |

- 兩個交易都在對方寫入前就讀到 100 萬，各自算出 0 並寫回，**第二次寫入覆蓋了第一次的結果**，其中一次扣款「遺失」（資料庫只扣了一次）。
- 結果：**帳戶只被扣了 100 萬，卻提走了 200 萬**，銀行損失 100 萬。這也稱為**「讀取—修改—寫入」的競爭條件（race condition）**，屬於**交易不可序列化**。

**(二) 銀行系統的防範方式**

**1. 以「交易」包裝提款流程，並使用並行控制（核心做法）**

把「檢查餘額 → 扣款」**放在同一個交易內**，使用**鎖定**讓同一帳戶的交易**排隊循序執行**：

| 方法 | 說明 |
|---|---|
| **鎖定（Locking，二階段鎖定 2PL）** | 讀取餘額時就取得該帳戶的**互斥鎖（X-lock）**，直到交易結束才釋放。第二部 ATM 必須等第一部完成後，才能讀到**已更新後的餘額 0**，檢查失敗而拒絕提款 |
| **SELECT … FOR UPDATE** | 在 SQL 中讀取餘額時就鎖定該列，防止其他交易同時修改 |
| **採用高隔離等級** | 將隔離等級設為 **SERIALIZABLE**（可序列化）或使用快照隔離加上寫入衝突檢查，保證結果等同於循序執行 |

\`\`\`sql
BEGIN TRANSACTION;
SELECT balance FROM Account WHERE acct_no = 'A001' FOR UPDATE;  -- 鎖定該帳戶
-- 檢查餘額足夠
UPDATE Account SET balance = balance - 1000000 WHERE acct_no = 'A001';
COMMIT;
\`\`\`

**2. 使用「原子性的條件式更新」，把檢查與扣款合為一個敘述**

\`\`\`sql
UPDATE Account
SET balance = balance - 1000000
WHERE acct_no = 'A001' AND balance >= 1000000;
-- 若影響列數為 0，表示餘額不足，拒絕提款
\`\`\`

資料庫在執行這個敘述時會自動對該列加鎖，所以兩個同時的請求只有一個會成功。

**3. 樂觀並行控制**：每筆帳戶紀錄有**版本號**；更新時檢查版本是否仍是讀取時的值（\`WHERE version = ?\`），若已被別人改過就**失敗並重試**。

**4. 其他輔助機制**

| 機制 | 說明 |
|---|---|
| **完整性限制** | 以 \`CHECK (balance >= 0)\` 禁止餘額為負，作為最後防線 |
| **單一帳戶的請求序列化** | 銀行主機將同一帳戶的請求排入佇列依序處理 |
| **交易記錄與稽核** | 記錄所有交易，異常時可追查；對短時間內多部 ATM 的連續提款設定警示 |

**重點**：問題的根源是**兩個交易交錯地「讀—改—寫」同一筆資料**；解法是由資料庫的**並行控制（鎖定、隔離等級）** 確保交易具有**隔離性**，使最後結果與依序執行相同，後面的提款會因餘額不足而被拒絕。`

<script>/* ===== 關務三等考古題複習系統 — 應用邏輯 ===== */

// 合併所有資料（依年度由新到舊）
const ALL_YEARS = [
  ...EXAM_DATA_CUSTOMS_3
];

const TOPIC_INFO = {
  net:  { name: '資通網路',   cls: 't-net'  },
  mis:  { name: '資訊管理',   cls: 't-mis'  },
  ds:   { name: '資料結構',   cls: 't-ds'   },
  db:   { name: '資料庫應用', cls: 't-db'   },
};

// 攤平成題目陣列
const ALL_Q = [];
ALL_YEARS.forEach(y => {
  y.questions.forEach(q => {
    ALL_Q.push({ ...q, year: y.year, subject: y.subject,
                 yearNote: y.note || '', timeLimit: y.timeLimit });
  });
});

let state = { mode: 'year', topic: 'all', search: '', terms: [] };
const openIds = new Set();   // 使用者展開的題目卡（重新渲染後仍保留）


/* ============================================================
   搜尋 / 跳轉 / 換行 共用工具（新增）
   ============================================================ */
const BREAK_AT_PERIOD = true;   // 解析遇到「。」自動換行；不想要就改成 false

/* 全形→半形、英文轉小寫；逐字處理，確保處理後長度不變（highlight 才對得準） */
function normText(s) {
  let out = '';
  for (const ch of String(s)) {
    const n = ch.normalize('NFKC').toLowerCase();
    out += (n.length === ch.length) ? n : ch;
  }
  return out;
}
function parseTerms(raw) {
  return [...new Set(normText(raw).split(/\s+/).filter(Boolean))];
}
/* 去掉資料裡用來排版的 HTML 標籤，避免搜 "br"、"code"、"strong" 時誤中 */
function stripTags(s) {
  return String(s == null ? '' : s)
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/?(?:strong|code|sub|sup|u|em|b|i|pre)(?:\s[^>]*)?>/gi, '')
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
}
/* 每個關鍵字都必須出現（AND）；總分 = 各關鍵字命中的最高權重欄位之和 */
function scoreFields(terms, fields) {
  let total = 0;
  for (const term of terms) {
    let best = 0;
    for (const f of fields) if (f.w > best && f.t.includes(term)) best = f.w;
    if (!best) return 0;
    total += best;
  }
  return total;
}
/* 在已渲染的 DOM 文字節點上標黃（不動 HTML 結構） */
function highlightIn(root, terms) {
  if (!root || !terms.length) return;
  const nodes = [];
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = walker.nextNode())) {
    if (!n.nodeValue.trim()) continue;
    const p = n.parentNode;
    if (p && p.closest && p.closest('svg, button, mark')) continue;
    nodes.push(n);
  }
  nodes.forEach(node => {
    const text = node.nodeValue, low = normText(text);
    const ranges = [];
    terms.forEach(t => {
      let i = low.indexOf(t);
      while (i !== -1) { ranges.push([i, i + t.length]); i = low.indexOf(t, i + t.length); }
    });
    if (!ranges.length) return;
    ranges.sort((a, b) => a[0] - b[0]);
    const merged = [ranges[0].slice()];
    for (let k = 1; k < ranges.length; k++) {
      const last = merged[merged.length - 1];
      if (ranges[k][0] <= last[1]) last[1] = Math.max(last[1], ranges[k][1]);
      else merged.push(ranges[k].slice());
    }
    const frag = document.createDocumentFragment();
    let pos = 0;
    merged.forEach(([s, e]) => {
      if (s > pos) frag.appendChild(document.createTextNode(text.slice(pos, s)));
      const m = document.createElement('mark');
      m.className = 'hl';
      m.textContent = text.slice(s, e);
      frag.appendChild(m);
      pos = e;
    });
    if (pos < text.length) frag.appendChild(document.createTextNode(text.slice(pos)));
    node.parentNode.replaceChild(frag, node);
  });
}

/* 解析換行：遇到「。」就換行（已有 <br>、句尾、或後面接」』）” 的不重複換） */
function breakSentences(s) {
  if (!BREAK_AT_PERIOD) return s;
  return String(s).replace(
    /。(?!(?:<\/[a-z]+>)*(?:\s*<br\s*\/?>|\s*$|[」』）)”"']))/gi,
    '。<br>'
  );
}

/* ---------- 搜尋框綁定（支援中文輸入法，組字中不觸發搜尋） ---------- */
function applySearch() {
  const input = document.getElementById('searchInput');
  state.search = input.value.trim();
  state.terms = parseTerms(state.search);
  render();
}
function clearSearch() {
  const input = document.getElementById('searchInput');
  input.value = '';
  document.getElementById('searchClear').classList.remove('show');
  applySearch();
  input.focus();
}
function bindSearch() {
  const input = document.getElementById('searchInput');
  const clearBtn = document.getElementById('searchClear');
  let timer, composing = false;
  const schedule = () => { clearTimeout(timer); timer = setTimeout(applySearch, 150); };
  input.addEventListener('compositionstart', () => { composing = true; });
  input.addEventListener('compositionend', () => { composing = false; schedule(); });
  input.addEventListener('input', () => {
    clearBtn.classList.toggle('show', input.value.length > 0);
    if (!composing) schedule();
  });
  input.addEventListener('keydown', e => { if (e.key === 'Escape') clearSearch(); });
  clearBtn.addEventListener('click', clearSearch);
}

/* ---------- 跳轉面板 ---------- */
let JUMP_ITEMS = [];
let JUMP_TITLE = '跳到年度';
function buildJump() {

function toggleJump(force) {

}
function scrollToGroup(key) {
  const el = document.getElementById('g-' + key);
  if (!el) return;
  const ctrl = document.querySelector('.controls');
  const top = el.getBoundingClientRect().top + window.scrollY - (ctrl ? ctrl.offsetHeight : 0) - 10;
  const root = document.documentElement;
  root.style.scrollBehavior = 'auto';          // 跳轉用瞬間定位，避免長距離捲動動畫
  window.scrollTo(0, Math.max(0, top));
  root.style.scrollBehavior = '';
}
document.addEventListener('click', e => {
  const p = document.getElementById('jumpPanel');
  if (p && !p.hidden && !p.contains(e.target) && !e.target.closest('#jumpFab')) p.hidden = true;
