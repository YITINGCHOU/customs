<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>關務人員三等考試｜資訊處理・非選擇題 考古題詳解</title>
<style>/* ===== 關務三等考古題複習系統 — 樣式 ===== */

@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --ink:        #1a1f2c;
  --ink-soft:   #3d4456;
  --paper:      #f4f1ea;
  --paper-warm: #ece6d8;
  --card:       #fffdf8;
  --line:       #d8d0bf;
  --accent:     #8a3324;   /* 朱紅 — 印章色 */
  --accent-2:   #1f5673;   /* 靛藍 */
  --gold:       #a07e2c;
  --shadow:     rgba(40,32,20,0.13);

  /* 主題分類色 */
  --t-db:   #1f5673;
  --t-ds:   #6a4c93;
  --t-prog: #2d6a4f;
  --t-sec:  #8a3324;
  --t-net-c:#b5651d;
  --t-mis:  #4a5859;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--paper);
  color: var(--ink);
  line-height: 1.85;
  -webkit-font-smoothing: antialiased;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(138,51,36,0.025) 31px, rgba(138,51,36,0.025) 32px);
}

/* ===== 頁首 ===== */
.site-header {
  background: var(--ink);
  color: var(--paper);
  padding: 2.4rem 1.5rem 2rem;
  text-align: center;
  border-bottom: 4px solid var(--accent);
  position: relative;
}
.site-header::after {
  content: '';
  position: absolute; left: 0; right: 0; bottom: -4px; height: 4px;
  background: repeating-linear-gradient(90deg, var(--accent) 0 18px, transparent 18px 36px);
}
.site-header .kicker {
  font-size: .78rem; letter-spacing: .55em; text-indent: .55em;
  color: var(--gold); font-weight: 700; margin-bottom: .7rem;
}
.site-header h1 {
  font-family: 'Noto Serif TC', serif;
  font-weight: 900; font-size: clamp(1.6rem, 4.4vw, 2.7rem);
  letter-spacing: .06em; line-height: 1.3;
}
.site-header h1 .stamp {
  display: inline-block; border: 2.5px solid var(--accent);
  color: var(--accent); padding: .05em .3em; border-radius: 6px;
  transform: rotate(-4deg); margin: 0 .15em;
  font-size: .82em; background: rgba(244,241,234,0.06);
}
.site-header .sub {
  margin-top: .8rem; font-size: .9rem; color: #b8bcca; font-weight: 400;
  letter-spacing: .04em;
}

/* ===== 統計列 ===== */
.stat-bar {
  display: flex; justify-content: center; gap: 2.5rem; flex-wrap: wrap;
  background: var(--paper-warm); padding: 1rem 1.5rem;
  border-bottom: 1px solid var(--line);
}
.stat-bar .stat { text-align: center; }
.stat-bar .num {
  font-family: 'Noto Serif TC', serif; font-weight: 900;
  font-size: 1.7rem; color: var(--accent); line-height: 1;
}
.stat-bar .lbl {
  font-size: .72rem; color: var(--ink-soft); letter-spacing: .15em;
  margin-top: .25rem;
}

/* ===== 控制列 ===== */
.controls {
  position: sticky; top: 0; z-index: 50;
  background: rgba(244,241,234,0.97);
  backdrop-filter: blur(8px);
  border-bottom: 1.5px solid var(--line);
  padding: .9rem 1.5rem;
  box-shadow: 0 3px 14px var(--shadow);
}
.controls-inner {
  max-width: 1080px; margin: 0 auto;
  display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
}
.mode-switch {
  display: flex; border: 2px solid var(--ink); border-radius: 8px;
  overflow: hidden;
}
.mode-switch button {
  font-family: 'Noto Sans TC', sans-serif;
  border: none; background: transparent; cursor: pointer;
  padding: .5rem 1.1rem; font-size: .88rem; font-weight: 700;
  color: var(--ink); transition: all .18s;
}
.mode-switch button.active { background: var(--ink); color: var(--paper); }

.search-box {
  flex: 1; min-width: 180px; position: relative;
}
.search-box input {
  width: 100%; font-family: 'Noto Sans TC', sans-serif;
  padding: .55rem .9rem .55rem 2.2rem; font-size: .9rem;
  border: 1.5px solid var(--line); border-radius: 8px;
  background: var(--card); color: var(--ink);
}
.search-box input:focus { outline: 2px solid var(--accent-2); border-color: transparent; }
.search-box::before {
  content: '🔍'; position: absolute; left: .7rem; top: 50%;
  transform: translateY(-50%); font-size: .85rem; opacity: .5;
}
.btn-expand {
  font-family: 'Noto Sans TC', sans-serif;
  border: 1.5px solid var(--ink-soft); background: var(--card);
  color: var(--ink-soft); cursor: pointer; border-radius: 8px;
  padding: .5rem .9rem; font-size: .82rem; font-weight: 500;
  white-space: nowrap; transition: all .15s;
}
.btn-expand:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* ===== 篩選晶片 ===== */
.filter-row {
  max-width: 1080px; margin: .7rem auto 0;
  display: flex; gap: .45rem; flex-wrap: wrap;
}
.chip {
  font-family: 'Noto Sans TC', sans-serif;
  border: 1.5px solid var(--line); background: var(--card);
  color: var(--ink-soft); cursor: pointer; border-radius: 20px;
  padding: .3rem .85rem; font-size: .8rem; font-weight: 500;
  transition: all .15s;
}
.chip:hover { border-color: var(--ink-soft); }
.chip.active {
  background: var(--ink); color: var(--paper); border-color: var(--ink);
}
.chip .c-count { opacity: .6; font-size: .92em; margin-left: .2em; }

/* ===== 主內容 ===== */
.wrap { max-width: 1080px; margin: 0 auto; padding: 2rem 1.5rem 5rem; }

/* 群組標題（年度 / 主題） */
.group {
  margin-bottom: 2.6rem;
}
.group-head {
  display: flex; align-items: center; gap: .9rem;
  margin-bottom: 1.1rem; padding-bottom: .6rem;
  border-bottom: 2.5px solid var(--ink);
}
.group-head .g-badge {
  font-family: 'Noto Serif TC', serif; font-weight: 900;
  background: var(--ink); color: var(--paper);
  padding: .35rem .8rem; border-radius: 6px; font-size: 1.05rem;
  white-space: nowrap;
}
.group-head .g-title {
  font-family: 'Noto Serif TC', serif; font-weight: 700;
  font-size: 1.15rem; color: var(--ink);
}
.group-head .g-meta {
  margin-left: auto; font-size: .76rem; color: var(--ink-soft);
  text-align: right; line-height: 1.5;
}
.group-note {
  font-size: .8rem; color: var(--accent-2); font-style: italic;
  margin: -.5rem 0 1rem; padding-left: .2rem;
}

/* ===== 題目卡 ===== */
.q-card {
  background: var(--card); border: 1.5px solid var(--line);
  border-radius: 10px; margin-bottom: .9rem;
  box-shadow: 0 2px 8px var(--shadow);
  overflow: hidden; transition: box-shadow .2s;
}
.q-card:hover { box-shadow: 0 4px 16px var(--shadow); }

.q-header {
  display: flex; align-items: flex-start; gap: .8rem;
  padding: 1rem 1.2rem; cursor: pointer;
  border-left: 5px solid var(--line);
  transition: background .15s;
}
.q-card.t-db   .q-header { border-left-color: var(--t-db); }
.q-card.t-ds   .q-header { border-left-color: var(--t-ds); }
.q-card.t-prog .q-header { border-left-color: var(--t-prog); }
.q-card.t-sec  .q-header { border-left-color: var(--t-sec); }
.q-card.t-net  .q-header { border-left-color: var(--t-net-c); }
.q-card.t-mis  .q-header { border-left-color: var(--t-mis); }
.q-header:hover { background: var(--paper-warm); }

.q-no {
  font-family: 'Noto Serif TC', serif; font-weight: 900;
  font-size: 1rem; color: var(--paper); background: var(--ink-soft);
  min-width: 2.4rem; height: 2.4rem; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.q-headmain { flex: 1; min-width: 0; }
.q-title {
  font-family: 'Noto Serif TC', serif; font-weight: 700;
  font-size: 1.02rem; color: var(--ink); line-height: 1.5;
}
.q-tags {
  display: flex; gap: .45rem; flex-wrap: wrap; margin-top: .4rem;
  align-items: center;
}
.tag {
  font-size: .7rem; font-weight: 700; padding: .12rem .55rem;
  border-radius: 4px; letter-spacing: .03em;
}
.tag-topic { color: #fff; }
.t-db   .tag-topic, .tag.topic-db   { background: var(--t-db); }
.t-ds   .tag-topic, .tag.topic-ds   { background: var(--t-ds); }
.t-prog .tag-topic, .tag.topic-prog { background: var(--t-prog); }
.t-sec  .tag-topic, .tag.topic-sec  { background: var(--t-sec); }
.t-net  .tag-topic, .tag.topic-net  { background: var(--t-net-c); }
.t-mis  .tag-topic, .tag.topic-mis  { background: var(--t-mis); }
.tag-year {
  background: var(--paper-warm); color: var(--ink-soft);
  border: 1px solid var(--line);
}
.tag-score {
  background: transparent; color: var(--gold);
  border: 1px solid var(--gold);
}
.tag-part {
  background: var(--accent-2); color: #fff;
  font-weight: 500;
}
.q-toggle {
  flex-shrink: 0; font-size: 1.3rem; color: var(--ink-soft);
  transition: transform .25s; line-height: 1; margin-top: .4rem;
}
.q-card.open .q-toggle { transform: rotate(45deg); }

/* ===== 題目展開內容 ===== */
.q-body { display: none; padding: 0 1.2rem 1.4rem; }
.q-card.open .q-body { display: block; animation: fadeIn .25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

.section-label {
  display: inline-block; font-family: 'Noto Serif TC', serif;
  font-weight: 700; font-size: .82rem; letter-spacing: .1em;
  padding: .25rem .8rem; border-radius: 4px; margin: 1.1rem 0 .6rem;
}
.section-label.q { background: var(--ink); color: var(--paper); }
.section-label.a { background: var(--accent); color: var(--paper); }

.q-question {
  background: var(--paper-warm); border-left: 3px solid var(--ink-soft);
  padding: .9rem 1.1rem; border-radius: 0 6px 6px 0;
  font-size: .93rem; white-space: pre-wrap; color: var(--ink-soft);
  font-feature-settings: "tnum";
}
.q-answer {
  font-size: .95rem; color: var(--ink);
}
.q-answer h4 {
  font-family: 'Noto Serif TC', serif; color: var(--accent);
  font-size: 1rem; margin: 1.1rem 0 .4rem;
  border-bottom: 1px dashed var(--line); padding-bottom: .2rem;
}
.q-answer p { margin: .55rem 0; }
.q-answer ul, .q-answer ol { margin: .5rem 0 .5rem 1.4rem; }
.q-answer li { margin: .3rem 0; }
.q-answer strong { color: var(--accent-2); font-weight: 700; }
.q-answer code {
  font-family: 'JetBrains Mono', monospace; font-size: .86em;
  background: var(--paper-warm); padding: .1em .35em;
  border-radius: 3px; color: var(--accent);
}
.q-answer table {
  border-collapse: collapse; width: 100%; margin: .8rem 0;
  font-size: .86rem;
}
.q-answer th, .q-answer td {
  border: 1px solid var(--line); padding: .4rem .6rem;
  text-align: left;
}
.q-answer th {
  background: var(--ink); color: var(--paper); font-weight: 700;
}
.q-answer tr:nth-child(even) td { background: var(--paper-warm); }

/* 程式碼/ASCII 區塊 */
.q-answer pre {
  background: #2b303b; color: #f2f0e9;
  font-family: 'JetBrains Mono', monospace; font-size: .85rem;
  line-height: 1.7; padding: 1rem 1.2rem; border-radius: 8px;
  overflow-x: auto; margin: .8rem 0;
  border-left: 3px solid var(--gold);
}
.q-answer pre code { background: none; color: inherit; padding: 0; }

/* 獨立程式碼區（code 欄位） */
.code-block {
  margin: 1rem 0; border-radius: 8px; overflow: hidden;
  border: 1px solid var(--ink);
}
.code-head {
  background: var(--ink); color: var(--gold);
  font-family: 'JetBrains Mono', monospace; font-size: .76rem;
  padding: .4rem .9rem; font-weight: 500;
  display: flex; justify-content: space-between; align-items: center;
}
.code-head .dots { display: flex; gap: .3rem; }
.code-head .dots span {
  width: .6rem; height: .6rem; border-radius: 50%; display: block;
}
.code-head .dots span:nth-child(1) { background: #d4554a; }
.code-head .dots span:nth-child(2) { background: #d9a441; }
.code-head .dots span:nth-child(3) { background: #5a9e6f; }
.code-block pre {
  margin: 0; border-radius: 0; border-left: none;
  background: #2b303b;            /* 提亮背景，降低與文字的明度落差刺眼感 */
  color: #f2f0e9;                 /* 預設文字（變數、標點）改為近白，清楚可見 */
  font-size: .86rem; line-height: 1.7;
  padding: 1.1rem 1.3rem 1.1rem 1.7rem;   /* 左側多留白，程式碼不貼邊、不壓迫 */
}
/* 語法highlight — 高對比配色，深背景下皆清晰 */
.tok-kw  { color: #ff9d6f; font-weight: 700; }   /* 關鍵字：亮橘，最醒目 */
.tok-str { color: #b8e986; }                      /* 字串：亮綠 */
.tok-com { color: #9aa6b8; font-style: italic; }  /* 註解：提亮的灰藍，不再灰到看不見 */
.tok-num { color: #f7d56e; }                      /* 數字：亮黃 */
.tok-fn  { color: #82c8ff; }                      /* 函式：亮藍 */
.tok-typ { color: #ffd166; }                      /* 型別：金黃 */

/* ===== HTML 圖表（取代易跑版的 ASCII 圖）===== */
.html-diagram {
  margin: 1.1rem 0; padding: 1.3rem 1rem;
  background: var(--paper-warm);
  border: 1.5px solid var(--line); border-radius: 10px;
  overflow-x: auto;
}
/* 通用方框節點 */
.dg-box {
  display: inline-flex; flex-direction: column; align-items: center;
  justify-content: center; text-align: center;
  border: 2px solid var(--ink); border-radius: 8px;
  background: var(--card); padding: .55rem .9rem;
  font-size: .86rem; line-height: 1.5; font-weight: 500;
  min-width: 5.5rem;
}
.dg-box .dg-sub { font-size: .73rem; color: var(--ink-soft); font-weight: 400; }
.dg-box.accent { border-color: var(--accent); background: #fbf3f0; }
.dg-box.blue   { border-color: var(--accent-2); background: #eef4f7; }
.dg-box.gold   { border-color: var(--gold); background: #faf5e6; }
.dg-box.ink    { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.dg-box.ink .dg-sub { color: #b8bcca; }

/* 排列容器 */
.dg-row { display: flex; align-items: center; justify-content: center;
  gap: .5rem; flex-wrap: wrap; }
.dg-col { display: flex; flex-direction: column; align-items: center;
  gap: .5rem; }
.dg-center { justify-content: center; }

/* 箭頭 */
.dg-arrow { font-size: 1.3rem; color: var(--accent); font-weight: 700;
  line-height: 1; padding: 0 .15rem; }
.dg-arrow.v { transform: rotate(90deg); margin: .1rem 0; }
.dg-arrow.bi::before { content: '◀▶'; }
.dg-arrow.down::before { content: '▼'; }
.dg-arrow.right::before { content: '▶'; }

/* 流程圖專用 */
.flow { display: flex; flex-direction: column; align-items: center; gap: 0; }
.flow-node {
  border: 2px solid var(--ink); background: var(--card);
  padding: .55rem 1.1rem; font-size: .86rem; text-align: center;
  font-weight: 500; max-width: 32rem; line-height: 1.55;
}
.flow-node.start, .flow-node.end {
  border-radius: 22px; background: var(--ink); color: var(--paper);
  font-weight: 700;
}
.flow-node.process { border-radius: 6px; }
.flow-node.io {
  border-radius: 6px; background: var(--paper-warm);
  border-style: dashed;
}
.flow-node.decision {
  background: #faf5e6; border-color: var(--gold);
  border-radius: 6px; font-weight: 700;
}
/* 連接線（直線 + 箭頭） */
.flow-conn { width: 2px; height: 1.6rem; background: var(--ink-soft);
  position: relative; }
.flow-conn::after {
  content: '▼'; position: absolute; bottom: -.3rem; left: 50%;
  transform: translateX(-50%); color: var(--ink-soft); font-size: .68rem;
}
/* 連接線旁的小標籤（如「否」「未出貨訂單」） */
.flow-edge {
  display: flex; flex-direction: column; align-items: center; gap: 0;
}
.flow-edge .lbl {
  font-size: .74rem; font-weight: 700; padding: .08rem .55rem;
  border-radius: 4px; position: relative; z-index: 1;
}
.flow-edge .lbl.yes { background: #2d6a4f; color: #fff; }
.flow-edge .lbl.no  { background: var(--accent); color: #fff; }
.flow-edge .lbl.plain {
  background: var(--card); color: var(--accent-2);
  border: 1px solid var(--line);
}
.flow-conn.short { height: .7rem; }
.flow-conn.short::after { display: none; }

/* 迴圈返回標記 —— 掛在決策節點下方，明確標示「往回」 */
.flow-loop {
  display: inline-flex; align-items: center; gap: .4rem;
  font-size: .76rem; font-weight: 700;
  background: #eef4f7; color: var(--accent-2);
  border: 1.5px dashed var(--accent-2); border-radius: 20px;
  padding: .25rem .8rem; margin: .35rem 0;
}
.flow-loop::before { content: '⟲'; font-size: 1.05rem; }

.flow-label {
  font-size: .73rem; color: var(--accent-2); font-weight: 600;
  background: var(--card); padding: 0 .4rem; margin: .15rem 0;
}
/* 舊版分支樣式（保留相容，僅用於少數真正左右並排的場景） */
.flow-branch { display: flex; align-items: flex-start; gap: 2.5rem;
  justify-content: center; }
.flow-branch-arm { display: flex; flex-direction: column;
  align-items: center; gap: 0; }
.flow-yes, .flow-no {
  font-size: .76rem; font-weight: 700; padding: .1rem .5rem;
  border-radius: 4px; margin: .2rem 0;
}
.flow-yes { background: #2d6a4f; color: #fff; }
.flow-no  { background: var(--accent); color: #fff; }

/* ERD 專用形狀 */
.erd-entity {
  border: 2px solid var(--ink); background: var(--card);
  padding: .5rem 1.1rem; font-weight: 700; font-size: .9rem;
  border-radius: 4px; text-align: center;
}
.erd-rel {
  display: inline-flex; align-items: center; justify-content: center;
  width: 7rem; height: 4rem; background: #faf5e6;
  border: 2px solid var(--gold);
  transform: rotate(45deg); margin: 1rem;
}
.erd-rel > span {
  transform: rotate(-45deg); font-size: .8rem; font-weight: 700;
  text-align: center; line-height: 1.3;
}
.erd-attr {
  display: inline-block; border: 1.5px solid var(--accent-2);
  background: #eef4f7; border-radius: 50%;
  padding: .35rem .8rem; font-size: .76rem; text-align: center;
  color: var(--accent-2);
}
.empty .big { font-size: 2.5rem; margin-bottom: .5rem; }

/* 回頂部 */
.to-top {
  position: fixed; right: 1.5rem; bottom: 1.5rem;
  width: 3rem; height: 3rem; border-radius: 50%;
  background: var(--accent); color: #fff; border: none;
  font-size: 1.2rem; cursor: pointer; box-shadow: 0 4px 14px var(--shadow);
  opacity: 0; pointer-events: none; transition: opacity .25s;
  z-index: 60;
}
.to-top.show { opacity: 1; pointer-events: auto; }

/* 頁尾 */
.site-footer {
  background: var(--ink); color: #9aa0b0;
  text-align: center; padding: 2rem 1.5rem;
  font-size: .8rem; line-height: 1.8;
}
.site-footer strong { color: var(--gold); }

/* 手機 */
@media (max-width: 640px) {
  .stat-bar { gap: 1.4rem; }
  .controls-inner { gap: .6rem; }
  .search-box { order: 3; flex-basis: 100%; }
  .group-head { flex-wrap: wrap; }
  .group-head .g-meta { margin-left: 0; flex-basis: 100%; text-align: left; }
  .q-answer table { font-size: .78rem; }
  .q-answer pre, .code-block pre { font-size: .74rem; }
}

/* ===== 搜尋強化 / 跳轉面板（新增） ===== */
.search-box input { padding-right: 2.2rem; }
.search-clear {
  position: absolute; right: .35rem; top: 50%; transform: translateY(-50%);
  border: none; background: transparent; color: var(--ink-soft);
  font-size: 1.05rem; line-height: 1; cursor: pointer;
  padding: .25rem .45rem; border-radius: 50%; display: none;
}
.search-clear.show { display: block; }
.search-clear:hover { background: var(--paper-warm); }
.search-info {
  max-width: 1100px; margin: .55rem auto 0;
  font-size: .8rem; color: var(--ink-soft); display: none;
}
.search-info.show { display: block; }

<script>// 公務人員特種考試關務人員三等考試 - 資訊處理 非選擇題 考古題詳解
// 科目代碼：net=資通網路 mis=資訊管理 ds=資料結構 db=資料庫應用
// 新增題目：在 EXAM_DATA_CUSTOMS_3 陣列中加入「年度＋科目」物件即可

/* ===== 關務三等資訊處理 — 非選擇題 ===== */
const EXAM_DATA_CUSTOMS_3 = [
{
  year: "115", exam: "customs3", topic: "db",
  subject: "資料庫應用", totalScore: 100, timeLimit: "2小時",
  note: "類科：資訊處理（選試英文）｜代號 10730",
  questions: [
    {
      id: "cs3-db-115-1", no: "一", topic: "db", topicName: "資料庫應用",
      title: "SQL 視觀表 CustSummary — 聚合視觀表的建立、查詢，以及為何不能新增資料",
      score: 30,
      question: `假設某家銀行定義了一個借貸表格（BORROWER）管理顧客借款的資料，包含借款顧客（ID）、借款編號（LoanNO）和金額（Amount）等三個屬性。請利用 SQL 語法，首先在資料庫系統中定義一個叫做 CustSummary 的視觀表（View），表達每一個顧客的借款總數量和借款總金額。其次，利用此視觀表和 SQL 查詢句，輸出身分證字號為「A123456789」的借款總金額。最後，請說明為何此視觀表只適用於查詢資料，而不適用於建立新的資料。（30 分）`,
      answer: `**(一) 建立視觀表 CustSummary**

視觀表要「每一個顧客」一列，所以對 BORROWER 依顧客 ID 分組（\`GROUP BY ID\`），再用 \`COUNT\` 算借款數量、\`SUM\` 算借款總金額。

\`\`\`sql
CREATE VIEW CustSummary (ID, LoanCount, TotalAmount) AS
SELECT ID, COUNT(LoanNO), SUM(Amount)
FROM BORROWER
GROUP BY ID;
\`\`\`

- \`COUNT(LoanNO)\`：每位顧客的借款筆數，也就是借款總數量。
- \`SUM(Amount)\`：每位顧客的借款金額加總，也就是借款總金額。
- 聚合函數算出來的欄位沒有天然名稱，所以在 \`CREATE VIEW\` 後面用欄位清單 \`(ID, LoanCount, TotalAmount)\` 明確命名；也可以改寫成 \`COUNT(LoanNO) AS LoanCount\`、\`SUM(Amount) AS TotalAmount\`。

**(二) 利用視觀表查詢 A123456789 的借款總金額**

\`\`\`sql
SELECT TotalAmount
FROM CustSummary
WHERE ID = 'A123456789';
\`\`\`

視觀表已經把「分組＋加總」的邏輯包好，查詢時只要當成一般表格、加上 \`WHERE\` 條件即可。

**範例**（假設 BORROWER 內容如下）：

| ID | LoanNO | Amount |
|---|---|---|
| A123456789 | L001 | 500000 |
| A123456789 | L002 | 300000 |
| B234567890 | L003 | 200000 |

CustSummary 的內容（由系統查詢時即時算出）：

| ID | LoanCount | TotalAmount |
|---|---|---|
| A123456789 | 2 | 800000 |
| B234567890 | 1 | 200000 |

所以第 (二) 小題的查詢結果是 **800000**。

**(三) 為什麼只適用於查詢，不適用於建立新資料**

視觀表是「虛擬表格」，本身不存資料，資料都在底層的 BORROWER。對視觀表做 INSERT，DBMS 必須能把它**唯一地翻譯成**對 BORROWER 的 INSERT；CustSummary 做不到，原因如下：

1. **每一列都是彙總出來的衍生值**：CustSummary 含有 \`GROUP BY\` 與聚合函數（\`COUNT\`、\`SUM\`），視觀表的一列對應 BORROWER 的「多列」（一對多），不是一對一。
2. **缺少底層必要的資訊**：BORROWER 需要每一筆借款的 \`LoanNO\` 與 \`Amount\`，但視觀表只提供總筆數與總金額。
3. **無法反推出唯一的原始資料**：DBMS 不知道該在 BORROWER 新增哪些列、每列的金額怎麼分（見下方範例）。
4. **即使硬寫也會不一致**：總數量與總金額本來就應由底層資料算出來，若能直接寫入，會讓衍生值與底層明細不一致。

**以實際的 INSERT 為例**：

\`\`\`sql
INSERT INTO CustSummary VALUES ('C345678901', 2, 600000);
\`\`\`

| BORROWER 需要的資訊 | 這句 INSERT 提供了嗎 |
|---|---|
| ID | 有（C345678901） |
| 每筆借款的 LoanNO | 沒有 |
| 每筆借款的 Amount | 沒有，只有總和 600000 |
| 要新增幾列、金額怎麼分 | 只知道 2 筆；600000 可拆成 300000＋300000、100000＋500000 等無限多種 |

DBMS 無從決定該在 BORROWER 新增哪些列，因此這類含聚合／分組的視觀表在 SQL 中屬於**不可更新視觀表（non-updatable view）**，INSERT、UPDATE、DELETE 都會被拒絕並回報錯誤。


**補充**

- 一般而言，視觀表要可更新，須符合：只來自單一表格、不含 \`GROUP BY\`／\`HAVING\`／\`DISTINCT\`／聚合函數／集合運算，並且包含底層表格所有不可為 NULL 且無預設值的欄位。
- 正確做法是直接對底層的 BORROWER 新增借款資料（\`INSERT INTO BORROWER ...\`），CustSummary 在下次查詢時會自動反映結果。`
    },
    {
      id: "cs3-db-115-2", no: "二", topic: "db", topicName: "資料庫應用",
      title: "BCNF 的判斷方式與違反 BCNF 的問題 — R(A,B,C,D)、F={AB→CD, C→B}",
      score: 30,
      figure: `<table style="border-collapse:collapse;font-size:.92rem;font-family:'JetBrains Mono',monospace;text-align:center;background:#fffdf8"><thead><tr><th style="border:1px solid #d8d0bf;padding:.35rem 1.2rem;background:#1a1f2c;color:#f4f1ea">A</th><th style="border:1px solid #d8d0bf;padding:.35rem 1.2rem;background:#1a1f2c;color:#f4f1ea">B</th><th style="border:1px solid #d8d0bf;padding:.35rem 1.2rem;background:#1a1f2c;color:#f4f1ea">C</th><th style="border:1px solid #d8d0bf;padding:.35rem 1.2rem;background:#1a1f2c;color:#f4f1ea">D</th></tr></thead><tbody><tr><td style="border:1px solid #d8d0bf;padding:.3rem 1.2rem">a1</td><td style="border:1px solid #d8d0bf;padding:.3rem 1.2rem">b1</td><td style="border:1px solid #d8d0bf;padding:.3rem 1.2rem">c1</td><td style="border:1px solid #d8d0bf;padding:.3rem 1.2rem">d1</td></tr><tr><td style="border:1px solid #d8d0bf;padding:.3rem 1.2rem">a1</td><td style="border:1px solid #d8d0bf;padding:.3rem 1.2rem">b2</td><td style="border:1px solid #d8d0bf;padding:.3rem 1.2rem">c1</td><td style="border:1px solid #d8d0bf;padding:.3rem 1.2rem">d2</td></tr><tr><td style="border:1px solid #d8d0bf;padding:.3rem 1.2rem">a2</td><td style="border:1px solid #d8d0bf;padding:.3rem 1.2rem">b1</td><td style="border:1px solid #d8d0bf;padding:.3rem 1.2rem">c1</td><td style="border:1px solid #d8d0bf;padding:.3rem 1.2rem">d3</td></tr></tbody></table>`,
      question: `BCNF（Boyce-Codd Normal Form）是設計關聯式資料庫綱要時常遵守的形式，請說明如何判斷一個表格是否符合 BCNF 的規定？若不符合會帶來何種問題？下列定義表格 R 的綱要、函數相依性和三筆範例資料：
R = (A, B, C, D)；
F = {AB → CD, C → B}；
（範例資料表見下方）
請根據上述資訊詳加解釋為何該表格不符合 BCNF？並以範例資料明確指出此表格可能產生的問題。（30 分）`,
      answer: `**(一) 如何判斷表格是否符合 BCNF**

**定義**：關聯表 R 符合 BCNF，若且唯若對 R 上**每一個非平凡（nontrivial）的函數相依 X → Y**（Y 不是 X 的子集），X 都是 R 的**超鍵（superkey）**。

**判斷步驟**：

1. 列出 R 的所有函數相依（本題直接給 F）。
2. 用**屬性封閉集合（attribute closure）X⁺** 求出超鍵與候選鍵：X⁺ 包含 R 的全部屬性，X 就是超鍵。
3. 逐一檢查每個非平凡函數相依 X → Y 的左邊 X 是否為超鍵：全部是，R 為 BCNF；只要有一個不是，R 就違反 BCNF。

**(二) 不符合 BCNF 會帶來的問題**

根本原因：X → Y 的左邊 X 不是鍵，同一個 X 值會在多列重複出現，使得與它綁定的 Y 值也重複儲存，造成**資料冗餘（redundancy）**，進而引發三種異常：

1. **更新異常（update anomaly）**：要修改 X 對應的 Y，必須改掉所有重複的列；漏改任何一列就產生不一致。
2. **新增異常（insertion anomaly）**：想記錄「X 對應 Y」這項事實，卻因為缺少其他屬性（如鍵的一部分）而無法單獨新增。
3. **刪除異常（deletion anomaly）**：刪除某筆資料時，連帶失去「X 對應 Y」這項資訊。

**(三) 本題 R 為何不符合 BCNF**

**步驟 1：求候選鍵**。A 沒有出現在任何函數相依的右邊，所以 A 必定在每個候選鍵中。

| 屬性集合 | 封閉集合 X⁺ | 是否為超鍵 |
|---|---|---|
| A | A | 否 |
| C | C → B，得 CB | 否 |
| AB | AB → CD，得 ABCD | 是，候選鍵 |
| AC | C → B 得 ACB，再由 AB → CD 得 ABCD | 是，候選鍵 |

候選鍵為 **AB** 與 **AC**；主屬性為 A、B、C，非主屬性為 D。

**步驟 2：逐一檢查函數相依**

| 函數相依 | 左邊 X | X⁺ | X 是超鍵嗎 | 是否違反 BCNF |
|---|---|---|---|---|
| AB → CD | AB | ABCD | 是 | 否 |
| C → B | C | CB | **否** | **是**（非平凡，且 C 不是超鍵） |

**結論**：C → B 的左邊 C 不是超鍵，所以 R **不符合 BCNF**。

另外，C → B 的右邊 B 是主屬性（屬於候選鍵 AB），符合 3NF 的例外條件，因此 R **是 3NF，但不是 BCNF**。

**(四) 以範例資料說明可能產生的問題**

| 列 | A | B | C | D |
|---|---|---|---|---|
| 1 | a1 | b1 | c1 | d1 |
| 2 | a1 | b2 | c1 | d2 |
| 3 | a2 | b1 | c1 | d3 |

1. **冗餘**：第 1、3 列都儲存了「C = c1 對應 B = b1」這項事實，同一件事被重複記錄；含 c1 的列越多，重複越多。
2. **更新異常**：若 c1 對應的 B 要由 b1 改成別的值，必須同時修改第 1、3 列（所有 C = c1 的列）；漏改一列，就會出現同一個 c1 對應到兩個不同 B 的不一致。
3. **新增異常**：想記錄新的對應「c2 對應 b3」，但此時還沒有任何 A、D 的資料；而候選鍵 AB、AC 都含有 A，A 不能是 NULL，所以這項資訊無法單獨新增。
4. **刪除異常**：「C 對應 B」這項資訊只存在於含該 C 值的資料列中；若某個 C 值只剩一列，刪掉那一列（例如為了撤銷它的 D 資料）時，這個對應關係也一起消失。

**提醒**：範例資料的第 1、2 列 C 同為 c1，B 卻分別是 b1、b2，嚴格來說已經與 F 中的 C → B 互相矛盾。這剛好示範了：C 不是鍵時，表格本身（鍵值約束）無法阻止違反 C → B 的資料出現，答題時可直接拿它當作更新異常（不一致）的實例。

**(五) 補充：分解成 BCNF（題目未要求，可作為加分補充）**

依違反的相依 C → B 分解：

| 關聯 | 屬性 | 鍵 | 成立的函數相依 |
|---|---|---|---|
| R1 | (<u>C</u>, B) | C | C → B |
| R2 | (<u>A</u>, <u>C</u>, D) | AC | AC → D |

- **無損分解**：R1 ∩ R2 = {C}，而 C 是 R1 的鍵，所以連接後可還原 R。
- **相依性不保持**：AB → CD 無法在 R1 或 R2 單獨檢查（需要先連接才能驗證）。這是 BCNF 分解可能的代價；若重視保持相依，因為 R 本身已是 3NF，可以選擇保留 R 不分解。`
    },
    {
      id: "cs3-db-115-3", no: "三", topic: "db", topicName: "資料庫應用",
      title: "資料倉儲 ETL 的功用，以及同步與非同步資料收集的差別與優缺點",
      score: 20,
      question: `資料倉儲（Data Warehouse）架構常被用來整合多種資料來源以進行資料分析，而建立資料倉儲的其中一個重要步驟是進行 ETL（Extract, Transform, Load）。首先，請詳述該步驟的功用。其次，收集資料的時機有同步（Synchronous）和非同步（asynchronous）兩種，請詳述此兩種做法的差別和優缺點。（20 分）`,
      answer: `**(一) ETL 的功用**

ETL 是把分散在各處、格式與品質不一的來源資料，經過擷取、轉換，變成「一致、乾淨、適合分析」的資料後，再載入資料倉儲的流程。它是建置資料倉儲時工作量最大、也最影響資料品質的步驟。

| 階段 | 做什麼 | 常見工作 |
|---|---|---|
| Extract（擷取） | 從多個來源取出需要的資料 | 來源包含營運資料庫（OLTP）、ERP／CRM、Excel／CSV、日誌、外部資料；可全量擷取，或只擷取有異動的增量資料 |
| Transform（轉換） | 清理、整合並重塑成倉儲需要的格式 | 去除重複、補缺值、修正錯誤；統一格式、編碼、單位與代碼（例如性別 M／男 統一為「男」）；型態轉換；計算衍生欄位與彙總；依維度模型切成事實表與維度表；產生代理鍵（surrogate key） |
| Load（載入） | 把轉換後的資料寫入資料倉儲 | 首次全量載入、之後增量更新；建立索引、維護彙總表；記錄載入歷程與錯誤 |

**ETL 的功用整理**：

1. **整合異質來源**：解決不同系統在格式、編碼、命名與語意上的不一致，形成單一、一致的資料視圖。
2. **提升資料品質**：透過清理與驗證，讓分析結果可信，避免「垃圾進、垃圾出」。
3. **分離分析與營運負載**：分析所需的大量查詢在倉儲進行，不會拖慢日常交易系統。
4. **符合分析模型並保存歷史**：把資料整形成適合多維分析的結構，並保留不同時間點的歷史資料。
5. **可自動化、可重複**：以排程自動執行，持續更新資料倉儲。

**(二) 同步與非同步資料收集**

收集資料的「時機」指：來源資料異動後，多久、以什麼方式送進資料倉儲。

- **同步（Synchronous）**：來源資料一有新增、修改、刪除，就**即時（或近即時）**傳送並更新到資料倉儲。常見手段有資料庫觸發器（trigger）、讀取交易日誌的變更資料擷取（CDC）、訊息佇列與串流處理。
- **非同步（Asynchronous）**：資料收集**不與來源交易綁在一起**，而是事後依排程批次進行（例如每晚、每週），或累積到一定量、發生特定事件時才收集。

| 比較項目 | 同步 | 非同步 |
|---|---|---|
| 收集時機 | 異動發生時立即進行 | 依排程或事後批次進行 |
| 資料新鮮度 | 高，延遲幾乎為零 | 較低，延遲取決於排程週期 |
| 對來源系統的負擔 | 較重，每筆異動都要即時處理，可能拖慢交易 | 較輕，可排在離峰時段（批次視窗）執行 |
| 轉換複雜度 | 受即時性限制，只適合簡單轉換 | 可進行大量、複雜的清理與彙總 |
| 耦合與可靠性 | 耦合度高，倉儲或網路故障可能影響來源 | 鬆耦合，失敗可整批重跑 |
| 實作與成本 | 較複雜、成本較高 | 較簡單、成熟、成本較低 |

**優缺點整理**：

- **同步的優點**：資料即時，可支援即時決策與營運分析；逐筆捕捉異動，不易遺漏。
- **同步的缺點**：增加來源系統負擔與交易回應時間；系統間耦合高；難以進行複雜轉換；架構複雜、維運成本高；倉儲頻繁小量寫入，也可能影響查詢效能與索引維護。
- **非同步的優點**：離峰執行，對營運系統影響小；可做完整的資料清理、驗證與大量彙總；實作簡單、容易除錯與重跑；來源與倉儲解耦。
- **非同步的缺點**：資料有延遲，不是最新狀態；批次視窗可能不夠用；整批失敗需要重跑；若以快照比對收集，兩次擷取之間的中間異動可能只留下最後結果。

**適用情境與折衷**：

1. 報表、歷史趨勢分析等對即時性要求不高的場景，採**非同步批次**即可，也是最常見的做法。
2. 詐欺偵測、即時儀表板等需要最新資料的場景，才採**同步（近即時）**。
3. 實務上也常用「微批次」（每幾分鐘一批）作為折衷。`

      answer: `**(一) 資料字典存放什麼**

資料字典（又稱**系統目錄**，System Catalog）存放的是「**關於資料的資料**」，也就是後設資料（metadata），用來描述資料庫本身有哪些物件、長什麼樣子、誰能使用。DBMS 在解析 SQL、檢查權限、最佳化查詢時都要查閱它。

| 類別 | 存放的內容 | 例子 |
|---|---|---|
| 綱要／結構資訊 | 資料庫、表格、欄位名稱、資料型態、長度、預設值、是否可為 NULL | BORROWER 表格有 ID、LoanNO、Amount 三欄，各自的型態 |
| 完整性限制 | 主鍵、外來鍵、UNIQUE、CHECK、NOT NULL 等規則 | BORROWER 的主鍵為 (ID, LoanNO) |
| 索引資訊 | 索引名稱、建立在哪個表格與欄位、索引種類（如 B+ 樹）、是否唯一 | MEMBER.Name 上的 B+ 樹索引 |
| 視觀表與程式物件 | 視觀表的查詢定義、預存程序、函式、觸發器的內容 | CustSummary 視觀表的 SELECT 敘述 |
| 使用者與權限 | 使用者帳號、角色，以及被授與（GRANT）的權限 | 某使用者可以 SELECT 哪些表格 |
| 實體儲存資訊 | 資料檔與表格空間的位置、區塊（page）配置、檔案大小 | 某表格存放在哪個資料檔 |
| 統計資訊 | 列數、頁數、欄位相異值數量、值的分佈（直方圖） | 供查詢最佳化器估算執行成本 |

**(二) 關聯式資料庫通常如何實作資料字典**

1. **資料字典本身也是一組表格**：關聯式資料庫把它存成一組「系統表格（catalog tables）」，使用和一般資料相同的關聯模型與儲存引擎，所以可以用 SQL 來查詢。例如有一張記錄所有表格的系統表，以及一張記錄所有欄位（欄位名稱、型態、所屬表格）的系統表。
2. **由 DBMS 自動維護**：執行 \`CREATE\`、\`ALTER\`、\`DROP\`、\`GRANT\` 等 DDL 時，DBMS 會自動新增、修改、刪除系統表中的資料；使用者不能直接 \`INSERT\`／\`UPDATE\` 系統表，通常以**唯讀視觀表**開放查詢。
3. **常見的對外介面**：SQL 標準的 \`INFORMATION_SCHEMA\`；MySQL 的 \`information_schema\`；PostgreSQL 的 \`pg_catalog\`；Oracle 的 \`USER_TABLES\`、\`ALL_TABLES\`、\`DBA_TABLES\` 等視觀表；SQL Server 的 \`sys.tables\`、\`sys.columns\`。
4. **自我描述**：系統表格本身的定義也記錄在資料字典中，由 DBMS 啟動時載入。
5. **常駐記憶體快取**：由於每次解析 SQL、權限檢查、查詢最佳化都要用到，資料字典常被快取在記憶體（dictionary cache／catalog cache）中以提升效能。

**查詢範例**：列出 BORROWER 表格的所有欄位與資料型態：

\`\`\`sql
SELECT column_name, data_type
FROM information_schema.columns
WHERE table_name = 'BORROWER';
\`\`\``

請利用 SQL 查詢指令，分別回答下列問題：（每小題 10 分，共 30 分）

㈡找出每家分行的最大借款金額。
㈢找出住在臺北市且借款超過 3 次以上的顧客身分證字號。`,
      answer: `**先看三個表格的關係**

| 表格 | 主鍵 | 與其他表格的連接 |
|---|---|---|
| CUSTOMER | ID | 以 ID 連到 BORROWER.ID |
| LOAN | LoanNO | 以 LoanNO 連到 BORROWER.LoanNO |
| BORROWER | (ID, LoanNO) | 連接 CUSTOMER 與 LOAN，一列代表「某顧客借了某筆借款」 |

**(一) 曾在「忠孝東路」分行辦理借款的顧客（10 分）**

分行名稱在 LOAN、顧客 ID 在 BORROWER，兩者以 LoanNO 連接即可，不需要用到 CUSTOMER。

\`\`\`sql
SELECT B.ID, L.LoanNO, L.Amount
FROM BORROWER B
JOIN LOAN L ON B.LoanNO = L.LoanNO
WHERE L.Branch = '忠孝東路';
\`\`\`

- \`JOIN ... ON B.LoanNO = L.LoanNO\`：把「誰借的」與「借款內容」接起來。
- \`WHERE L.Branch = '忠孝東路'\`：只留下該分行的借款。
- 輸出的每一列是不同的 (ID, LoanNO) 組合，不會重複，所以不需要 \`DISTINCT\`。
- 若分行名稱在資料中存成「忠孝東路分行」，條件改為 \`L.Branch = '忠孝東路分行'\`，或用 \`LIKE '忠孝東路%'\`。
- 等價的舊式寫法：\`FROM BORROWER B, LOAN L WHERE B.LoanNO = L.LoanNO AND L.Branch = '忠孝東路'\`。

**(二) 每家分行的最大借款金額（10 分）**

只用到 LOAN，依分行分組後取最大值。

\`\`\`sql
SELECT Branch, MAX(Amount) AS MaxAmount
FROM LOAN
GROUP BY Branch;
\`\`\`

- \`GROUP BY Branch\`：每家分行自成一組。
- \`MAX(Amount)\`：在各組內取最大的借款金額。
- SELECT 中除了聚合函數外，出現的欄位（Branch）必須列在 \`GROUP BY\` 中。

**範例**

| LoanNO | Amount | Branch |
|---|---|---|
| L001 | 500000 | 忠孝東路 |
| L002 | 300000 | 忠孝東路 |
| L003 | 800000 | 信義 |

| Branch | MaxAmount |
|---|---|
| 忠孝東路 | 500000 |
| 信義 | 800000 |

**(三) 住在臺北市且借款超過 3 次的顧客（10 分）**

地址在 CUSTOMER、借款次數要由 BORROWER 計算，所以兩表以 ID 連接，依顧客分組後用 \`HAVING\` 篩選次數。

\`\`\`sql
SELECT C.ID
FROM CUSTOMER C
JOIN BORROWER B ON C.ID = B.ID
WHERE C.Address LIKE '臺北市%'
GROUP BY C.ID
HAVING COUNT(*) > 3;
\`\`\`

1. **住在臺北市**：地址以縣市名開頭，故用 \`LIKE '臺北市%'\`。若資料也可能寫成「台北市」，可改為 \`(C.Address LIKE '臺北市%' OR C.Address LIKE '台北市%')\`。
2. **借款次數**：BORROWER 的主鍵是 (ID, LoanNO)，一筆借款對應一列，所以某顧客的列數就是他的借款次數，用 \`COUNT(*)\` 計算。
3. **WHERE 與 HAVING 的分工**：\`WHERE\` 在分組「之前」過濾列（地址條件）；\`HAVING\` 在分組「之後」過濾群組（次數是聚合結果，不能寫在 \`WHERE\`）。

\`\`\`sql
SELECT ID
FROM CUSTOMER
WHERE Address LIKE '臺北市%'
  AND ID IN (SELECT ID
             FROM BORROWER
             GROUP BY ID
             HAVING COUNT(*) > 3);
\`\`\``

      answer: `**(一) 應該替哪個屬性建立索引：Name**

索引要建在**查詢條件（WHERE）中用來搜尋的屬性**上。

| 屬性 | 在查詢中的角色 | 是否建立索引 |
|---|---|---|
| Name | \`WHERE Name = 'Wu'\` 的搜尋條件 | **是** |
| Telephone | 只出現在 SELECT，是「取出的結果」，不是搜尋條件 | 否 |
| ID | 查詢中完全沒用到（多數 DBMS 會因主鍵而自動建索引，但與此查詢無關） | 否 |

\`\`\`sql
CREATE INDEX idx_member_name ON MEMBER (Name);
\`\`\`

| 步驟 | 動作 | 說明 |
|---|---|---|
| 1 | 讀取根節點 | 'Wu' ≥ 'Wang'，走最右邊的指標 |

總共只讀 2 個索引節點加 1 筆資料列。沒有索引時，需要掃描全部 8 筆資料。資料量越大，差距越明顯。

**(四) B+ 樹的特性及其如何提升效率**

1. **高度平衡**：所有葉節點位於同一層，從根節點走到任何一個葉節點的路徑長度都相同，因此任何查詢的成本穩定可預期。
2. **高扇出（fan-out）、樹很矮**：每個節點對應磁碟的一個區塊，可存放數十到數百個鍵值，所以樹的高度很低。例如每節點約 300 個指標時，3 層就能索引數千萬筆資料，查詢最多只需讀 3～4 個區塊。查詢成本約為 O(log_f N)，遠小於全表掃描的 O(N)。磁碟 I/O 次數是資料庫效能的主要瓶頸，樹矮就能大幅減少 I/O。
3. **鍵值有序**：葉節點中的鍵值依順序排列，所以每一層都可以用二分式比較快速決定往哪走。
4. **所有資料指標只放在葉節點**：內部節點只存分隔鍵值，因此同樣大小的節點能放更多鍵值，扇出更高、樹更矮。
5. **葉節點以鏈結串接**：找到起點後，沿著鏈結往右掃描，就可處理範圍查詢（如 \`Name BETWEEN 'Chen' AND 'Lin'\`）與排序輸出，不必每次回到根節點。
6. **自動維持平衡**：新增、刪除資料時，以節點分裂（split）與合併（merge）維持平衡，並保證節點至少半滿，效能不會因資料變動而退化。

\`\`\`json
[
  {
    "No": "1",
    "Name": "張三",
    "Children": ["John", "Mary"]
  },
  {
    "No": "2",
    "Name": "李四",
    "Children": ["John", "Tom", "Sandy"]
  }
]
\`\`\`

若以文件型資料庫（如 MongoDB）實際建立這個集合，寫法如下：

\`\`\`javascript
db.customers.insertMany([
  { "No": "1", "Name": "張三", "Children": ["John", "Mary"] },
  { "No": "2", "Name": "李四", "Children": ["John", "Tom", "Sandy"] }
]);
\`\`\`

**(二) 寫法說明**

| 元素 | 寫法 | 本題的對應 |
|---|---|---|
| 文件 | 以大括號 \`{ }\` 包住，內含多組「鍵: 值」，以逗號分隔 | 每位顧客一個 \`{ ... }\` |
| 鍵（key） | 一律用雙引號的字串 | \`"No"\`、\`"Name"\`、\`"Children"\` |
| 字串值 | 用雙引號 | \`"1"\`、\`"張三"\` |
| 陣列 | 以中括號 \`[ ]\` 包住，元素以逗號分隔 | \`"Children": ["John", "Mary"]\` |
| 集合 | 文件的集合；以陣列 \`[ ]\` 列出所有文件即可表示 | \`customers\` 內含 2 個文件 |

**重點**：

1. 題目指定顧客編號 No 為**字串型態**，所以值要寫成 \`"1"\`（有雙引號）。寫成 \`1\` 就變成數字型態，不符合題意。

| No | Name |
|---|---|
| 1 | 張三 |
| 2 | 李四 |

**CHILD**

| No | ChildName |
|---|---|
| 1 | John |
| 1 | Mary |
| 2 | John |
| 2 | Tom |
| 2 | Sandy |

**(三) 超類型／子類型（OO 觀念）**

| 超類型 | 子類型 | 完整性 | 不相交性 | 說明 |
|---|---|---|---|---|
| PERSON（人員） | PASSENGER（旅客）、PILOT（駕駛） | 部分（partial） | 重疊（overlapping） | 人員不一定是旅客或駕駛；同一人可同時是駕駛與旅客（例如搭乘他人航班） |
| AIRCRAFT（飛行器） | PASSENGER_AIRCRAFT（載客飛行器） | 部分（partial） | 互斥（disjoint） | 載客數只有載客飛行器才有，共用的出廠日期、型號、所屬航空公司放在超類型 |

子類型的主鍵同時是外來鍵，指向超類型的主鍵（如 PASSENGER.person_id → PERSON.person_id）。

|---|---|---|---|
| 製造 | MANUFACTURER (1,N) | AIRCRAFT_MODEL (1,1) | 一個型號只屬一家製造商；製造商至少有一個型號 |
| 屬於型號 | AIRCRAFT_MODEL (0,N) | AIRCRAFT (1,1) | 一台飛行器只有一個型號 |
| 擁有 | AIRLINE (0,N) | AIRCRAFT (1,1) | 一台飛行器只隸屬一家航空公司（題目假設） |

| 行駛航線 | FLIGHT (1,1) | ROUTE (0,N) | 一個航班對應一條航線（起點＋終點） |

**(五) 對應的關聯表（均符合 BCNF）**

| 資料表 | 欄位（<u>底線</u>＝主鍵） | 外來鍵 | 備註 |
|---|---|---|---|
| AIRLINE | <u>airline_id</u>, name, reg_date, nation | — | 航空公司；nation＝國籍、reg_date＝註冊日期 |
| MANUFACTURER | <u>manufacturer_id</u>, name, nation | — | 製造商；nation＝製造商國籍 |
| AIRCRAFT_MODEL | <u>model_id</u>, model_name, manufacturer_id | manufacturer_id → MANUFACTURER | 製造商由型號決定 |
| AIRCRAFT | <u>aircraft_id</u>, model_id, airline_id, manufacture_date, scrap_date | model_id → AIRCRAFT_MODEL；airline_id → AIRLINE | 超類型；scrap_date＝銷毀日期，未銷毀為 NULL |
| PASSENGER_AIRCRAFT | <u>aircraft_id</u>, capacity | aircraft_id → AIRCRAFT | 子類型；capacity＝載客數 |
| AIRPORT | <u>airport_id</u>, name, nation | — | 機場；nation＝所在國家 |
| ROUTE | <u>origin_id</u>, <u>dest_id</u>, distance | origin_id → AIRPORT；dest_id → AIRPORT | 起訖組合決定飛行旅程數 |
| FLIGHT | <u>flight_no</u>, airline_id, origin_id, dest_id | airline_id → AIRLINE；(origin_id, dest_id) → ROUTE | 航班（班表） |
| FLIGHT_TRIP | <u>trip_id</u>, flight_no, depart_time, arrive_time, aircraft_id, captain_id, copilot_id | flight_no → FLIGHT；aircraft_id → PASSENGER_AIRCRAFT；captain_id、copilot_id → PILOT | 班次（某天實際飛一次） |
| PERSON | <u>person_id</u>, name, gender, birth_date, nation | — | 超類型；年齡由 birth_date 計算 |
| PASSENGER | <u>person_id</u>, phone, email | person_id → PERSON | 子類型 |
| PILOT | <u>person_id</u> | person_id → PERSON | 子類型 |
| TICKET | <u>trip_id</u>, <u>passenger_id</u>, seat_row, seat_col, fare | trip_id → FLIGHT_TRIP；passenger_id → PASSENGER | 候選鍵另有 (trip_id, seat_row, seat_col)：同班次同座位只能一人 |
| BAGGAGE | <u>trip_id</u>, <u>passenger_id</u>, <u>baggage_no</u> | (trip_id, passenger_id) → TICKET | 行李數＝COUNT |
| CAROUSEL | <u>airport_id</u>, <u>carousel_no</u> | airport_id → AIRPORT | 行李轉盤 |
| CAROUSEL_UNLOAD | <u>trip_id</u>, airport_id, carousel_no | trip_id → FLIGHT_TRIP；(airport_id, carousel_no) → CAROUSEL | 「卸載於」關聯；轉盤須在該航班的抵達機場 |

**(六) 六項查詢需求如何被滿足**

| 需求 | 使用的資料表與連接路徑 |
|---|---|
| 旅客的飛行紀錄 | PERSON／PASSENGER → TICKET（fare）→ FLIGHT_TRIP（日期區間）→ FLIGHT（航班編號）→ AIRLINE（國籍、名稱、註冊日期）；FLIGHT → ROUTE（起降地、distance）；FLIGHT_TRIP → PASSENGER_AIRCRAFT → AIRCRAFT → AIRCRAFT_MODEL → MANUFACTURER（製造商、型號） |
| 特定國家機場起飛、座位前後三排旅客 | FLIGHT → ROUTE.origin_id → AIRPORT.nation；TICKET.seat_row BETWEEN 目標排−3 AND 目標排+3；PASSENGER 與 PERSON 取姓名、phone、email |
| 甲地到乙地的臺籍航班 | FLIGHT.origin_id／dest_id ＋ AIRLINE.nation；載客比例＝COUNT(TICKET)／capacity；本國籍旅客比例、男女比例由 PERSON.nation、gender 統計；未滿兩歲、八十歲以上由 birth_date 與起飛日期計算 |
| 特定機場轉盤卸載的航班 | CAROUSEL_UNLOAD → FLIGHT_TRIP（起降時間）→ FLIGHT → ROUTE（起降機場）；行李數＝COUNT(BAGGAGE) |
| 航空公司擁有的載客飛行器 | AIRLINE → AIRCRAFT → PASSENGER_AIRCRAFT（capacity）、AIRCRAFT_MODEL → MANUFACTURER；FLIGHT_TRIP（日期區間）→ captain_id、copilot_id → PILOT → PERSON（國籍、姓名、性別、年齡） |
| 製造商各型號統計 | AIRCRAFT（manufacture_date～scrap_date 算年限）；FLIGHT_TRIP（arrive_time − depart_time 加總為總飛行時間）；ROUTE.distance 加總；COUNT(TICKET) 為總載客數；依 MANUFACTURER.nation 分組 |

**(七) 為什麼符合 BCNF**

1. 每個資料表中，所有函數相依的左邊都是該表的候選鍵：如 FLIGHT 只有 flight_no → 其餘欄位；ROUTE 只有 (origin_id, dest_id) → distance。
2. 會造成非鍵相依的欄位都已分離出去：型號 → 製造商（放在 AIRCRAFT_MODEL）、(起點, 終點) → 旅程數（放在 ROUTE）、人員基本資料 → PERSON。
3. TICKET 有兩個候選鍵 (trip_id, passenger_id) 與 (trip_id, seat_row, seat_col)，兩者左邊都是候選鍵，所以不違反 BCNF。
4. 衍生值不儲存，避免冗餘與不一致。

**(一) 2023 年點播次數最高的前兩首英文歌（5 分）**

\`\`\`sql
SELECT S.name         AS song_name,
       P.name         AS publisher_name,
       S.publish_year AS publish_year,
       COUNT(*)       AS play_count
FROM OnDemand_Record R
JOIN Song S      ON R.song_ID = S.song_ID
JOIN Publisher P ON S.nation = P.nation AND S.publisher_ID = P.company_ID
WHERE S.language = 'English'
  AND R.date_time >= '2023-01-01'
  AND R.date_time <  '2024-01-01'
GROUP BY S.song_ID, S.name, P.name, S.publish_year
ORDER BY play_count DESC
LIMIT 2;
\`\`\`

- **點播率最高**＝一首歌被點播的次數最多，所以以歌曲分組後 \`COUNT(*)\`。
- **2023 年**：用「大於等於 2023-01-01 且小於 2024-01-01」的半開區間，不會漏掉 12/31 當天的時間。
- **分組鍵含 \`S.song_ID\`**：避免不同歌曲同名被合併。
- **只取前兩名**：MySQL／PostgreSQL 用 \`LIMIT 2\`；SQL Server 用 \`SELECT TOP 2\`；Oracle／標準 SQL 用 \`FETCH FIRST 2 ROWS ONLY\`。若要含並列第二名可用 \`FETCH FIRST 2 ROWS WITH TIES\`。
- 語言欄位的值（如 \`'English'\`）依實際資料而定，題目未說明，這裡假設為 \`'English'\`。

**(二) Universal 發行的歌曲（5 分）**

「2023 年第四季到 2024 年第三季」＝ 2023-10-01 至 2024-09-30。「同一發行年份點播歌曲數 > 1」解讀為：在這段期間內，同一個發行年份被點播過的**不同歌曲**超過一首，只留下這些年份的歌曲。

\`\`\`sql
WITH played AS (
  SELECT DISTINCT S.song_ID,
         S.name         AS song_name,
         S.type         AS song_type,
         S.publish_year AS publish_year
  FROM OnDemand_Record R
  JOIN Song S      ON R.song_ID = S.song_ID
  JOIN Publisher P ON S.nation = P.nation AND S.publisher_ID = P.company_ID
  WHERE P.name = 'Universal'
    AND R.date_time >= '2023-10-01'
    AND R.date_time <  '2024-10-01'
)
SELECT song_name, song_type, publish_year
FROM played
WHERE publish_year IN (SELECT publish_year
                       FROM played
                       GROUP BY publish_year
                       HAVING COUNT(*) > 1)
ORDER BY publish_year DESC;
\`\`\`

1. \`played\`：先求出期間內被點播過的 Universal 歌曲（每首只出現一次）。
2. 子查詢：依發行年份分組，用 \`HAVING COUNT(*) > 1\` 找出「不同歌曲數超過 1」的年份。
3. 外層：只顯示屬於這些年份的歌曲，並以 \`ORDER BY publish_year DESC\` 由近至遠排列。
4. \`HAVING\` 是對分組後的結果篩選；單純的 \`WHERE\` 無法判斷「同一年份有幾首」。

SELECT S.type   AS song_type,

       COUNT(*) AS play_count
FROM OnDemand_Record R
JOIN Song   S ON R.song_ID   = S.song_ID
JOIN Member M ON R.member_ID = M.mobile
WHERE R.date_time >= '2024-02-14'
  AND R.date_time <  '2024-02-15'
GROUP BY S.type, M.gender;

（汽車保修紀錄表見下方）`,
      answer: `**(一) 找出函數相依（以資料實際判斷，不能只看欄位名稱）**

為方便書寫，欄位使用下列英文名稱：技工編號 mechanic_id、技工姓名 mechanic_name、客戶姓名 customer_name、客戶電話 customer_phone、車號 car_no、日期 repair_date、時間 repair_time、金額 amount、保修內容 repair_item。

**成立的函數相依**：

| 編號 | 函數相依 | 資料依據 |
|---|---|---|
| F1 | mechanic_id → mechanic_name | M001＝Tom、M002＝Mark、M003＝Mark，每個編號只對應一個姓名 |
| F2 | customer_phone → customer_name | 90001＝Lisa、90002＝Janny、90003＝Janny，每個電話只對應一個姓名 |
| F3 | (car_no, repair_date, repair_time) → mechanic_id, customer_phone, amount, repair_item | 同一台車同一時間只會有一筆保修；這是候選鍵 |
| F4 | (mechanic_id, repair_date, repair_time) → car_no, customer_phone, amount, repair_item | 同一技工同一時間只會修一台車；這是另一個候選鍵 |

**不成立的相依（容易誤判的陷阱）**：

| 看似成立的相依 | 反例 | 結論 |
|---|---|---|
| mechanic_name → mechanic_id | Mark 同時對應 M002、M003 | 姓名不能識別技工，要用技工編號 |
| customer_name → customer_phone | Janny 同時對應 90002、90003 | 姓名不能識別客戶，要用客戶電話 |
| car_no → customer_phone | C001 分別由 90001、90002、90003 送修 | 客戶不屬於車輛，是「每次送修」的屬性，不能放進車輛表 |
| repair_item → amount | Wheel 為 8000 與 12000；Paint 為 30000 與 5000 | 金額是每筆保修的屬性 |

**(二) 原表為何不符合 BCNF**

F1 的左邊 mechanic_id、F2 的左邊 customer_phone 都**不是候選鍵**，卻決定了其他屬性，違反 BCNF。造成的問題：Tom、Lisa 等姓名在多列重複儲存（冗餘），修改一位技工的姓名要改多列（更新異常），沒有保修紀錄就無法單獨記錄一位新技工或新客戶（新增異常）。

**(三) 正規化步驟**

1. 依 F1 拆出技工：MECHANIC(mechanic_id, mechanic_name)。
2. 依 F2 拆出客戶：CUSTOMER(customer_phone, customer_name)。
3. 剩下的屬性組成保修紀錄 REPAIR(car_no, repair_date, repair_time, mechanic_id, customer_phone, amount, repair_item)，其中唯二的決定者 (car_no, repair_date, repair_time) 與 (mechanic_id, repair_date, repair_time) 都是候選鍵，符合 BCNF。
4. 為了讓 REPAIR 的 car_no 有可參照的父表，另建 CAR(car_no)。

**拆解是無損的**：拆出的 MECHANIC、CUSTOMER 以其主鍵與 REPAIR 連接，連接後可還原原表；所有函數相依都保留在各表內。

**(四) 正規化後的資料表（BCNF）**

| 資料表 | 欄位（<u>底線</u>＝主鍵） | 外來鍵 |
|---|---|---|
| MECHANIC | <u>mechanic_id</u>, mechanic_name | — |
| CUSTOMER | <u>customer_phone</u>, customer_name | — |
| CAR | <u>car_no</u> | — |
| REPAIR | <u>car_no</u>, <u>repair_date</u>, <u>repair_time</u>, mechanic_id, customer_phone, amount, repair_item | car_no → CAR；mechanic_id → MECHANIC；customer_phone → CUSTOMER |

| Partial＋Disjoint | 可以不屬於任何子類型，若屬於則只能一個 | 交通工具：部分是「汽車」或「機車」，其餘不屬於這兩類 | 超類型表＋子類型表，子類型的主鍵同時是外來鍵 |
| Partial＋Overlapping | 可不屬於任何子類型，若屬於可有多個 | 人員中部分是「學生」「員工」，可同時是兩者，也可都不是 | 超類型表＋子類型表，子類型的主鍵同時是外來鍵 |

      score: 30,
      question: `在關聯式資料庫（Relational Database）的正規化理論（Normalization Theory）中，決定者（Determinant）與候選鍵（Candidate Key）的定義分別為何？決定者與候選鍵之間的關係為何？（30 分）`,
      answer: `**(一) 決定者（Determinant）**

在關聯表 R 中，若屬性（或屬性組）X 的值能**唯一決定**屬性 Y 的值，即存在函數相依 **X → Y**，則 X 稱為 Y 的決定者。換句話說：只要 X 的值相同，Y 的值就一定相同。

例：學生表中 **學號 → 姓名**，學號是姓名的決定者；**系所 → 系主任**，系所是系主任的決定者。

**(二) 候選鍵（Candidate Key）**

候選鍵是能唯一識別表格中每一列的**最小屬性集合**，須同時符合兩個條件：

1. **唯一性（超鍵）**：K 的封閉集合 K⁺ 包含 R 的**全部**屬性，即 K → R 中所有屬性。
2. **最小性**：把 K 中任何一個屬性拿掉，就不再具有唯一性。

一個表格可以有多個候選鍵，從中選一個作為主鍵（primary key），其餘稱為替代鍵（alternate key）。

**(三) 兩者的關係**

| 項目 | 說明 |
|---|---|
| 候選鍵一定是決定者 | 候選鍵決定整個表格的所有屬性（K → R 的全部屬性） |
| 決定者不一定是候選鍵 | 決定者只需決定「某些」屬性，不必決定全部屬性 |
| 決定者是候選鍵的條件 | 決定者 X 的封閉集合 X⁺ 包含全部屬性（X 是超鍵），且 X 最小時才是候選鍵 |
| 與正規化的關係 | **BCNF 要求：每個非平凡函數相依 X → Y 的決定者 X 都必須是（超）鍵**；若有決定者不是候選鍵，就違反 BCNF，並造成資料冗餘與異常 |

**(四) 實例：判斷決定者是否為候選鍵**

關聯表 STUDENT(學號, 姓名, 系所, 系主任)，函數相依 F = { 學號 → 姓名, 系所；系所 → 系主任 }。

| 屬性集合 | 封閉集合 | 是否為決定者 | 是否為候選鍵 |
|---|---|---|---|
| 學號 | 學號、姓名、系所、系主任（全部） | 是 | **是**（唯一的候選鍵） |
| 系所 | 系所、系主任 | 是 | 否（無法決定學號、姓名） |

結論：系所是決定者，但**不是候選鍵**，所以 STUDENT 違反 BCNF（也違反 3NF，因為系主任傳遞相依於學號）。同一系所的每位學生都重複儲存「系主任」，更換系主任時要修改多列。

**正規化後（符合 BCNF）**：

| 資料表 | 欄位（<u>底線</u>＝主鍵） | 外來鍵 | 決定者是否皆為候選鍵 |
|---|---|---|---|
| STUDENT | <u>學號</u>, 姓名, 系所 | 系所 → DEPARTMENT | 是（學號） |
| DEPARTMENT | <u>系所</u>, 系主任 | — | 是（系所） |

**(五) 重點整理**

1. 決定者是「能決定其他屬性的屬性（組）」；候選鍵是「能決定所有屬性的最小屬性組」。
2. **候選鍵 ⊂ 決定者**：候選鍵一定是決定者，但決定者不一定是候選鍵。
3. 判斷一個決定者是否為候選鍵，用**屬性封閉集合**計算：X⁺ 是否涵蓋全部屬性。
4. BCNF 的精神就是「所有決定者都必須是候選鍵（超鍵）」，因此兩者的關係是判斷表格是否符合 BCNF 的核心。`

| 事實表（Fact Table） | 位於中心，記錄可度量的數值（量值，measure），以及指向各維度表的外來鍵；列數最多 | SALES_FACT：銷售金額、數量 |

      score: 30,
      question: `某圖書館所建立的關聯式資料庫系統（Relational database system）中，定義了三個表格，其中 MEMBER 表格記錄會員基本資料，包含會員編號（Mid）、姓名（Name）和連絡電話（Telephone）；BOOK 表格記錄書本基本資料，包含國際標準書號（ISBN）、書名（Title）和出版社（Publisher）；BORROWER 表格記錄借閱資料，包含借書者（Mid）、書號（ISBN）和借閱日期（Date）。除了日期之外，其餘屬性皆為字串型態。此三個表格的綱要簡列如下，且每個表格的主鍵以底線標註：
MEMBER（<u>Mid</u>, Name, Telephone）
BOOK（<u>ISBN</u>, Title, Publisher）
BORROWER（<u>Mid, ISBN,</u> Date）
請利用 SQL 查詢指令，分別回答下列子題：
㈠找出那些會員曾經借閱過"全華"出版社出版的書籍，列出其會員編號、姓名和聯絡電話。（10 分）
㈡針對每個出版社，找出那些會員曾經借閱過 3 本以上（含）該出版社出版的書籍，每一筆輸出包含出版社和符合條件的會員編號。（10 分）
㈢定義一個名為 TimeBookCount 的檢視表（view），輸出每個會員（以 Mid 代表）所借閱由"時報"出版社出版書籍的總數，並將檢視表的第一個屬性命名為"Mid"，第二個屬性命名為"BookCount"。（10 分）`,
      answer: `**先看表格關係**

| 表格 | 主鍵 | 連接方式 |
|---|---|---|
| MEMBER | Mid | 以 Mid 連到 BORROWER.Mid |
| BOOK | ISBN | 以 ISBN 連到 BORROWER.ISBN |
| BORROWER | (Mid, ISBN, Date) | 一列＝某會員在某天借了某本書；同一會員可在不同日期重複借同一本書 |

**(一) 曾借閱「全華」出版社書籍的會員（10 分）**

出版社在 BOOK、會員資料在 MEMBER，需透過 BORROWER 把兩者連起來。

\`\`\`sql
SELECT DISTINCT M.Mid, M.Name, M.Telephone
FROM MEMBER M
JOIN BORROWER BR ON M.Mid = BR.Mid
JOIN BOOK B      ON BR.ISBN = B.ISBN
WHERE B.Publisher = '全華';
\`\`\`

- 一位會員可能借過多本全華的書、或同一本借多次，連接後會產生多列，所以要用 **\`DISTINCT\`** 讓每位會員只出現一次。
- 等價寫法（用 \`EXISTS\`，免去 \`DISTINCT\`）：

\`\`\`sql
SELECT M.Mid, M.Name, M.Telephone
FROM MEMBER M
WHERE EXISTS (SELECT 1
              FROM BORROWER BR
              JOIN BOOK B ON BR.ISBN = B.ISBN
              WHERE BR.Mid = M.Mid
                AND B.Publisher = '全華');
\`\`\`

**(二) 對每個出版社，借閱過 3 本以上（含）的會員（10 分）**

以「出版社＋會員」為一組，計算組內借過幾本**不同**的書，再用 \`HAVING\` 篩選。

\`\`\`sql
SELECT B.Publisher, BR.Mid
FROM BORROWER BR
JOIN BOOK B ON BR.ISBN = B.ISBN
GROUP BY B.Publisher, BR.Mid
HAVING COUNT(DISTINCT B.ISBN) >= 3;
\`\`\`

1. \`GROUP BY B.Publisher, BR.Mid\`：每個（出版社, 會員）組合是一組。
2. \`COUNT(DISTINCT B.ISBN)\`：題目是「借閱過 3 本以上的書」，同一本書借多次只能算一本，所以要對 ISBN 去重複。
3. \`>= 3\`：題目寫「3 本以上（含）」，所以包含 3 本。
4. 若題意改為「借閱次數」，把 \`COUNT(DISTINCT B.ISBN)\` 換成 \`COUNT(*)\` 即可。

**(三) 建立檢視表 TimeBookCount（10 分）**

\`\`\`sql
CREATE VIEW TimeBookCount (Mid, BookCount) AS
SELECT BR.Mid, COUNT(*)
FROM BORROWER BR
JOIN BOOK B ON BR.ISBN = B.ISBN
WHERE B.Publisher = '時報'
GROUP BY BR.Mid;
\`\`\`

- \`CREATE VIEW 名稱 (欄位1, 欄位2)\`：用括號指定檢視表的欄位名稱，第一個是 \`Mid\`、第二個是 \`BookCount\`。也可改在 SELECT 中使用別名：\`SELECT BR.Mid AS Mid, COUNT(*) AS BookCount\`。
- 「借閱的總數」使用 \`COUNT(*)\` 計算借閱筆數；若要算不同的書本數，改為 \`COUNT(DISTINCT BR.ISBN)\`。
- 沒有借過時報出版書籍的會員不會出現在檢視表中。若希望他們顯示為 0，可改成以 MEMBER 為主的外連接：

\`\`\`sql
CREATE VIEW TimeBookCount (Mid, BookCount) AS
SELECT M.Mid, COUNT(T.ISBN)
FROM MEMBER M
LEFT JOIN (SELECT BR.Mid, BR.ISBN
           FROM BORROWER BR
           JOIN BOOK B ON BR.ISBN = B.ISBN
           WHERE B.Publisher = '時報') T
       ON M.Mid = T.Mid
GROUP BY M.Mid;
\`\`\`

- 使用方式：\`SELECT BookCount FROM TimeBookCount WHERE Mid = 'M001';\``

\`\`\`

**節點種類與內容**

| 節點 | 內容 | 作用 |
|---|---|---|
| 根節點（root） | 分隔鍵值 M003、M005、M007 與 4 個子節點指標 | 搜尋的起點，決定往哪一個子樹走 |
| 內部節點（internal） | 只存分隔鍵值與子節點指標，**不存資料列指標** | 導引搜尋方向；範例中只有根節點一層內部節點，資料量更大時會有多層 |
| 葉節點（leaf） | 全部 Mid 值（有序），每個 Mid 附一個指向 MEMBER 資料列的指標 | 真正找到鍵值與資料位置的地方 |
| 葉節點之間的鏈結 | 每個葉節點有指標指向下一個葉節點 | 支援範圍查詢（如 \`Mid BETWEEN 'M002' AND 'M005'\`）與順序掃描 |

**走向規則**：Mid 小於 M003 走第 1 個指標；M003 ≤ Mid < M005 走第 2 個；M005 ≤ Mid < M007 走第 3 個；Mid ≥ M007 走第 4 個。

**(三) B+ 樹的結構特性**

1. **高度平衡**：所有葉節點在同一層，根到任一葉節點的路徑長度相同，查詢成本穩定。
2. **高扇出（fan-out）**：每個節點是磁碟的一個區塊，能放數十到數百個鍵值，所以樹很矮。例如每個節點約 300 個指標，3 層就能涵蓋約 2,700 萬個鍵值。
3. **鍵值有序**：節點內與葉節點間的鍵值都依序排列，可用比較快速決定走向。
4. **資料指標只在葉節點**：內部節點只放鍵值，能容納更多分隔鍵值，使樹更矮。
5. **節點至少半滿**：除根節點外，每個節點至少填滿一半，空間利用率高，並限制樹的高度。
6. **自動維持平衡**：新增或刪除資料造成節點過滿或過空時，以分裂（split）、合併（merge）、重新分配調整，不需人工重整。

**(四) 資料庫系統如何利用索引加速 \`select Name from MEMBER where Mid = 'M001'\`**

| 步驟 | 動作 | 說明 |
|---|---|---|
| 1 | 查詢最佳化器發現 WHERE 條件是 **Mid 的等值比較**，且 Mid 上有 MyIndex | 決定使用索引搜尋，而不是全表掃描 |
| 2 | 讀入根節點 | M001 < M003，走第 1 個指標 |
| 3 | 讀入最左的葉節點 | 在 [M001, M002] 中找到 M001，取得它的資料列指標（R1） |
| 4 | 依指標讀入 R1 所在的資料區塊 | 取出 Name，查詢結束 |

**效能比較**：

| 方式 | 讀取內容 | 成本 |
|---|---|---|
| 沒有索引（全表掃描） | 逐列檢查整個 MEMBER 表，找出 Mid = 'M001' | O(N)，N 為會員數，需讀完所有資料區塊 |
| 使用 MyIndex | 讀 1 個根節點＋1 個葉節點＋1 個資料區塊（共 3 次 I/O） | O(log_f N)，f 為扇出，只讀樹高度＋1 個區塊 |

**重點**：

- Mid 是會員編號，值不重複，所以最多只會找到一筆，找到後即可停止，不需繼續搜尋。
- 磁碟 I/O 是查詢成本的主要來源，B+ 樹把 I/O 次數壓到「樹的高度＋1」，會員數越多，與全表掃描的差距越大。
- 若查詢常需要同時取得 Name，可建立複合索引 (Mid, Name)，讓答案直接從索引取得，不必回表讀資料列（覆蓋索引）。
- 代價：索引占用額外空間，且新增、修改、刪除會員時要同步維護索引。`

    {
      id: "cs3-db-111-3", no: "三", topic: "db", topicName: "資料庫應用",
      title: "交易（Transaction）的 ACID 四特性 — 以 P 帳戶轉 1000 元到 Q 帳戶說明",
      score: 20,
      question: `關聯式資料庫系統在實作異動處理（Transaction Processing）時，大多希望能符合 ACID 四個特性以確保資料庫內容的正確性。假設一個異動欲從 P 帳戶轉 1000 元到 Q 帳戶，其中包含的六個指令如下表所示。請以該異動具體說明 ACID 所代表的四個要求分別為何？若沒有達到該要求會造成什麼不良的影響？（20 分）
1. read(P)
2. P := P − 1000
3. write(P)
4. read(Q)
5. Q := Q + 1000
6. write(Q)`,
      answer: `**先看這六個指令的執行過程**（假設 P = 5000、Q = 3000，P + Q = 8000）

| 步驟 | 指令 | 記憶體中的值 | 資料庫中的 P | 資料庫中的 Q | 資料庫中 P＋Q |
|---|---|---|---|---|---|
| 開始 | — | — | 5000 | 3000 | 8000 |
| 1 | read(P) | P = 5000 | 5000 | 3000 | 8000 |
| 2 | P := P − 1000 | P = 4000 | 5000 | 3000 | 8000 |
| 3 | write(P) | P = 4000 | **4000** | 3000 | **7000** |
| 4 | read(Q) | Q = 3000 | 4000 | 3000 | 7000 |
| 5 | Q := Q + 1000 | Q = 4000 | 4000 | 3000 | 7000 |
| 6 | write(Q) | Q = 4000 | 4000 | **4000** | **8000** |

第 3 步到第 6 步之間，資料庫處於「P 已扣款、Q 尚未入帳」的中間狀態，總額暫時少了 1000 元。ACID 就是要處理這類問題。

**(一) A — 原子性（Atomicity）**

- **要求**：一個交易的所有操作是不可分割的整體，**要麼全部完成，要麼全部不做**。
- **本例**：6 個指令必須一起成功；若中途失敗，已執行的步驟必須回復（rollback）。
- **若沒有達到**：若系統在步驟 3 之後、步驟 6 之前當機，P 已被扣 1000 但 Q 沒有增加，這 1000 元憑空消失。
- **實作方式**：使用交易日誌（log）記錄修改前的值，失敗時以 undo 還原。

**(二) C — 一致性（Consistency）**

- **要求**：交易執行前後，資料庫都必須符合所有完整性限制與業務規則，從一個一致的狀態轉到另一個一致的狀態。
- **本例**：轉帳前後 **P ＋ Q 的總額必須不變**（8000），且餘額不能為負（P 轉出後需 ≥ 0）。
- **若沒有達到**：總額改變會讓銀行帳目對不起來（錢憑空增加或消失）；餘額為負則違反業務規則。
- **實作方式**：由應用程式正確撰寫交易邏輯，加上資料庫的完整性限制（CHECK、主外鍵等）共同確保。

**(三) I — 隔離性（Isolation）**

- **要求**：多個交易同時執行時，每個交易都**感覺不到**其他交易的存在，結果必須與它們一個接一個（循序）執行的結果相同。
- **本例**：
  1. 若另一個查詢交易在步驟 3 與步驟 6 之間計算 P ＋ Q，會讀到 7000（少了 1000），得到錯誤的總額（不一致的讀取）。
  2. 若兩筆「從 P 轉出 1000」同時執行，都讀到 P = 5000，各自寫回 4000，P 只被扣一次，但 Q 收到兩次，銀行少了 1000 元（遺失更新，lost update）。
- **若沒有達到**：讀到不一致的中間資料、更新互相覆蓋，造成金額錯誤。
- **實作方式**：鎖定（兩階段鎖定 2PL）、時間標記（timestamp）、多版本並行控制（MVCC）。

**(四) D — 持久性（Durability）**

- **要求**：交易**一旦提交（commit）**，其結果就是永久的，即使之後系統當機、斷電，也不會遺失。
- **本例**：銀行已告訴客戶「轉帳成功」之後，即使系統立刻當機，重新啟動後 P = 4000、Q = 4000 仍必須保留。
- **若沒有達到**：客戶已收到成功通知，但重啟後轉帳紀錄消失，P、Q 回到轉帳前的金額，造成糾紛與信任問題。
- **實作方式**：先寫日誌（write-ahead logging），交易提交前確保日誌已寫入非揮發性儲存裝置；當機後以 redo 重做已提交的交易。

**(五) 四個特性整理**

| 特性 | 一句話 | 本例的重點 | 沒做到的後果 |
|---|---|---|---|
| 原子性 A | 全做或全不做 | 6 個指令不能只做一半 | 錢憑空消失 |
| 一致性 C | 前後都符合規則 | P ＋ Q 總額不變、餘額不為負 | 帳目不平、出現負餘額 |
| 隔離性 I | 並行如同循序 | 別人看不到步驟 3～6 的中間狀態 | 讀到錯誤總額、更新互相覆蓋 |
| 持久性 D | 提交後永久保存 | 轉帳成功後當機也不會消失 | 已成功的轉帳憑空消失 |`

      answer: `**(一) 設計符合第一正規化（1NF）的關聯式表格**

**1NF 的要求**：每個欄位的值都必須是**不可再分割的單一值（atomic）**，不能有陣列、集合或重複群組。原資料的 Authors 是陣列（一本書有多位作者），屬於多值屬性，違反 1NF，必須拆開。

**設計：把「書籍」與「書籍的作者」分成兩個表格**

| 資料表 | 欄位（<u>底線</u>＝主鍵） | 外來鍵 | 說明 |
|---|---|---|---|
| BOOK | <u>No</u>, Title | — | 每本書一列；題目說明每本書的編號不重複，所以 No 是主鍵 |
| BOOK_AUTHOR | <u>No</u>, <u>Author</u> | No → BOOK(No) | 每本書的每位作者一列；(No, Author) 組合成主鍵 |

**BOOK**

| No | Title |
|---|---|
| 1 | 計概 |
| 2 | 資料庫 |

**BOOK_AUTHOR**

| No | Author |
|---|---|
| 1 | 趙先生 |
| 1 | 張小姐 |
| 2 | Silbers |
| 2 | Korth |
| 2 | Sudar |

**說明**：

1. 每個欄位都是單一值，符合 1NF。同時，BOOK 的非主鍵欄位 Title 完全相依於 No；BOOK_AUTHOR 沒有非主鍵欄位，不會有部分相依，因此符合 2NF、3NF 與 BCNF。
2. **另一種也符合 1NF 的做法**是單一表格 BOOK(<u>No</u>, <u>Author</u>, Title)，每位作者一列，但 Title 會在同一本書的每一列重複，造成冗餘，且 Title 只相依於 No（主鍵的一部分），不符合 2NF，因此不建議。
3. 陣列有「順序」（如第一作者），關聯表的列沒有固定順序；若順序重要，可在 BOOK_AUTHOR 增加欄位 Seq（作者順序）。

\`\`\`

- \`{ }\` 是一個文件，一本書一個；\`[ ]\` 是陣列，作者名單放在 Authors 內。
- No 為字串型態，所以寫成 \`"1"\`。
- 一個文件就包含這本書的所有資料，不需要另外的作者表格。

**(三) 結構化（關聯式）資料與半結構化（JSON）資料表示法的差異**

| 比較面向 | 結構化：關聯式資料 | 半結構化：JSON 資料 |
|---|---|---|
| 綱要（Schema） | **先定義綱要**（欄位名稱、型態、主外鍵），資料必須符合；綱要變更需 ALTER TABLE | **綱要隨資料自我描述**（鍵名就在資料中），不強制事先定義，每個文件可有不同欄位 |
| 資料組織 | 以二維表格（列與欄）表示，每個欄位為單一值 | 以巢狀的物件與陣列表示，可直接放入多值與階層結構 |
| 多值屬性（如多位作者） | 必須拆成另一個表格（BOOK_AUTHOR）並以外來鍵關聯 | 直接用陣列放在同一個文件內 |
| 一筆完整資料 | 分散在多個表格，讀取時需要 JOIN | 集中在一個文件，一次讀取，不需 JOIN |
| 資料重複與一致性 | 透過正規化消除冗餘，一致性高 | 內嵌資料可能重複（如同一作者出現在多本書），需由應用程式維護一致性 |
| 完整性限制 | 主鍵、外來鍵、型態、CHECK 等由資料庫強制 | 限制較少，多數由應用程式或選用的 JSON Schema 驗證 |
| 彈性與擴充 | 較低，新增屬性需修改綱要 | 較高，新增屬性只要在文件中加鍵值對 |
| 查詢語言 | SQL（標準化、功能完整，支援複雜 JOIN 與彙總） | 依系統而異（如 MongoDB 的查詢語法、JSON 路徑運算式），複雜彙總較不便 |
| 交易與一致性 | 完整的 ACID 交易支援 | 多半以單一文件為交易單位，跨文件的交易支援因系統而異 |
| 適合情境 | 結構穩定、資料間關係複雜、重視一致性（如銀行、訂單） | 結構多變、層次深、讀取量大、快速迭代（如內容管理、行動應用、日誌） |

**結論**：關聯式資料以「事先定義的綱要＋正規化」換取一致性與強大的查詢能力；JSON 半結構化資料以「自我描述與巢狀結構」換取彈性與讀取效率。以本題為例，關聯式需兩個表格加一次連接才能取得一本書及其所有作者，JSON 的一個文件就包含全部內容，但同一位作者出現在多本書時，JSON 會重複儲存。`

      question: `T（<u>A</u>, B, C, D, <u>E</u>, F, G）是一個關聯式資料庫表格的綱要，其中 T 為表格名稱，A、B、C、D、E、F、G 為表格的七個屬性，（A, E）為表格的組合主鍵（Composite Primary Key），同時也是該表格唯一的候選鍵（Candidate Key）。另外，該表格有下列功能相依（Functional Dependency）：
A → B, C, D
C → D
E → F
（A, E）→ G
㈠請問表格 T 符合第幾正規型式（Normal Form）？請說明理由。（10 分）
㈡表格 T 應該要正規化到第幾正規型式才適當？請將表格 T 正規化到適當的正規型式，寫出正規化之後每一個表格的綱要，包括表格名稱、屬性、主鍵、以及外來鍵（如果有外來鍵的話）。（15 分）`,
      answer: `**先確認候選鍵**

| 屬性集合 | 封閉集合 | 是否為鍵 |
|---|---|---|
| A | A → B, C, D（再由 C → D）→ {A, B, C, D} | 否（缺 E、F、G） |
| E | E → F → {E, F} | 否 |
| (A, E) | A 得 B, C, D；E 得 F；(A, E) 得 G → {A, B, C, D, E, F, G}（全部） | **是**，也是唯一候選鍵（與題目相符） |

主屬性：A、E；非主屬性：B、C、D、F、G。

**(一) 表格 T 符合第幾正規型式：第一正規型式（1NF）**

**逐一檢查各正規型式**：

| 函數相依 | 相依型態 | 結果 |
|---|---|---|
| A → B, C, D | **部分相依**：非主屬性 B、C、D 只相依於主鍵的一部分（A） | 違反 2NF |
| E → F | **部分相依**：非主屬性 F 只相依於主鍵的一部分（E） | 違反 2NF |
| C → D | **傳遞相依**：A → C 且 C → D，非主屬性 D 透過非主屬性 C 相依於 A | 違反 3NF |
| (A, E) → G | 完全相依：G 相依於整個主鍵 | 符合 |

**理由**：

1. **符合 1NF**：所有屬性都是單一、不可再分的值，並有主鍵 (A, E)。
2. **不符合 2NF**：2NF 要求所有非主屬性都「完全」函數相依於候選鍵，但 B、C、D 只相依於 A、F 只相依於 E，是部分相依。
3. 既然不符合 2NF，更不可能符合 3NF 與 BCNF。因此 T 只符合 **1NF**。

**(二) 應正規化到哪一個正規型式：至少 3NF，並可達到 BCNF**

2NF 還留有 C → D 的傳遞相依，所以至少要正規化到 **3NF**。本題分解後的所有表格，其決定者都是各表的鍵，同時也符合 **BCNF**，因此建議正規化到 BCNF。

**正規化過程**

**步驟 1：消除部分相依（達到 2NF）**

| 資料表 | 屬性 | 主鍵 | 依據 |
|---|---|---|---|
| T1 | A, B, C, D | A | A → B, C, D |
| T2 | E, F | E | E → F |
| T3 | A, E, G | (A, E) | (A, E) → G |

**步驟 2：消除傳遞相依（達到 3NF）**——T1 中 A → C → D，把 C → D 拆出：

| 資料表 | 屬性 | 主鍵 | 依據 |
|---|---|---|---|
| T1a | A, B, C | A | A → B, C |
| T1b | C, D | C | C → D |

**最終綱要（3NF，同時符合 BCNF）**

| 表格名稱 | 屬性 | 主鍵 | 外來鍵 |
|---|---|---|---|
| T_ABC | A, B, C | A | C → T_CD(C) |
| T_CD | C, D | C | 無 |
| T_EF | E, F | E | 無 |
| T_AEG | A, E, G | (A, E) | A → T_ABC(A)；E → T_EF(E) |

**驗證**

| 表格 | 成立的函數相依 | 決定者是否為鍵 |
|---|---|---|
| T_ABC | A → B, C | 是（A） |
| T_CD | C → D | 是（C） |
| T_EF | E → F | 是（E） |
| T_AEG | (A, E) → G | 是（(A, E)） |

1. **符合 BCNF**：每個表格的決定者都是該表的鍵。
2. **無損連接**：T_ABC ⋈ T_CD（以 C 連接，C 是 T_CD 的鍵），再與 T_AEG（以 A 連接）及 T_EF（以 E 連接）連接，可還原原表 T。
3. **保持函數相依**：A → B, C、C → D、E → F、(A, E) → G 都在各表中直接保留；A → D 可由 A → C 與 C → D 推得。`

      answer: `**多維度資料模型的構件**：以**事實表（Fact Table）**存放可度量的數值（如銷售額、數量）與指向維度的外來鍵；以**維度表（Dimension Table）**描述觀察角度（時間、商品、商店、顧客），用於篩選、分組與彙總。三種綱要差別在於事實表與維度表的連接方式。

**三種綱要摘要**

| 綱要 | 事實表 | 維度表 | 特色 |
|---|---|---|---|
| 星狀 | 1 個 | 每個維度一張、反正規化 | 結構最簡單，查詢最快 |
| 雪花狀 | 1 個 | 維度表正規化成多層 | 節省儲存、減少冗餘，但需更多連接 |
| 事實星座 | 2 個以上 | 多個事實表共用維度 | 整合多個主題，支援跨主題分析 |

**(四) 星狀綱要與雪花狀綱要的比較**

| 比較項目 | 星狀綱要 | 雪花狀綱要 |
|---|---|---|
| 維度表 | 反正規化，單層 | 正規化，多層 |
| 連接（JOIN）數量 | 少，事實表到維度表只需一層 | 多，取得完整維度資訊需經過多層連接 |
| 查詢效能 | **較快**、查詢語句簡單 | 較慢，查詢語句較複雜 |
| 儲存空間 | 較大，維度表有重複的階層資料 | **較小**，階層資料不重複 |
| 資料冗餘與一致性 | 冗餘較多，更新維度資料（如城市名稱）要改多列 | 冗餘少，更新只改一處，資料一致性較高 |
| 維護與 ETL | 較簡單，載入一張維度表即可 | 較複雜，需要維護多個關聯表與外來鍵 |
| 易理解性 | **直觀**，業務人員容易理解 | 結構較複雜，不易理解 |
| 適用情境 | 重視查詢速度與簡單性，維度屬性相對單純 | 維度階層複雜或龐大、儲存空間有限、需要嚴格一致性 |

**優缺點整理**

- **星狀綱要的優點**：查詢快、語句簡單、容易理解與使用，與多數 BI 工具相容性高。**缺點**：維度表有冗餘，占用較多空間，維度資料更新不易維持一致。

|---|---|---|---|
| 位於 | COUNTY (0,N) | HEALTH_FACILITY (1,1) | 一家機構位於一個縣市 |
| 開放時段 | HEALTH_FACILITY (1,N) | FACILITY_OPEN_SLOT (1,1) | 配合機構至少有一個開放時段（弱實體） |
| 居住於 | COUNTY (0,N) | PERSON (1,1) | 一個人居住在一個縣市 |
| ISA（人員→確診者） | PERSON | CONFIRMED_CASE | 部分、非必然；子類型的主鍵同時是外來鍵 |
| 收治 | HEALTH_FACILITY (0,N) | CONFIRMED_CASE (0,1) | 一位確診者同時至多由一家機構收治 |
| 症狀 | CONFIRMED_CASE (0,N) | CASE_SYMPTOM (1,1) | 一位確診者可有多種症狀，也可無症狀 |
| 感染源（遞迴） | CONFIRMED_CASE (0,N) | CONFIRMED_CASE (0,1) | 一個案例至多有一個感染源案例；一個案例可成為多人的感染源 |
| 受檢 | PERSON (0,N) | TEST_RECORD (1,1) | 一次受檢紀錄屬於一個人 |
| 採檢 | HEALTH_FACILITY (0,N) | TEST_RECORD (1,1) | 一次受檢在一家機構完成 |
| 被追蹤 | PERSON (0,N) | TRACKING (1,1) | 一筆追蹤紀錄屬於一個人 |

**(四) 對應的關聯表（BCNF）與鍵**

| 資料表 | 欄位（<u>底線</u>＝主鍵） | 外來鍵 | 候選鍵／備註 |
|---|---|---|---|
| COUNTY | <u>county_code</u>, county_name | — | county_name 為候選鍵 |
| HEALTH_FACILITY | <u>facility_id</u>, name, address, phone, county_code | county_code → COUNTY | 候選鍵：(name, address) |
| FACILITY_OPEN_SLOT | <u>facility_id</u>, <u>weekday</u>, <u>period</u> | facility_id → HEALTH_FACILITY | period：上午／下午／晚上 |
| PERSON | <u>person_id</u>, name, gender, birth_date, mobile, residence_county, residence_address | residence_county → COUNTY | person_id 為身分證字號 |
| CONFIRMED_CASE | <u>person_id</u>, infection_type, source_case_id, admit_facility_id, confirm_date | person_id → PERSON；source_case_id → CONFIRMED_CASE(person_id)；admit_facility_id → HEALTH_FACILITY | infection_type：本土、境外、不明 |
| CASE_SYMPTOM | <u>person_id</u>, <u>symptom</u> | person_id → CONFIRMED_CASE | 多值屬性 |
| TEST_RECORD | <u>person_id</u>, <u>test_time</u>, facility_id, result | person_id → PERSON；facility_id → HEALTH_FACILITY | result：陽性、陰性 |
| TRACKING | <u>person_id</u>, <u>start_date</u>, reason_type, end_date | person_id → PERSON | reason_type：檢疫、隔離、自主健康管理 |

**BCNF 檢查**：每個資料表的決定者都是鍵。縣市名稱、機構資訊、人員資料各自獨立成表，沒有「非鍵決定非鍵」的相依。

**(五) 七項查詢的滿足方式**

| 需求 | 查詢路徑 |

      answer: `**(一) 建立資料表（DDL）**

\`\`\`sql
CREATE TABLE Person (
  personID     VARCHAR(12)  PRIMARY KEY,
  name         VARCHAR(50)  NOT NULL,
  nationality  VARCHAR(10),
  gender       CHAR(1)
);

CREATE TABLE Flight (
  flightID      VARCHAR(10)  NOT NULL,
  flight_date   DATE         NOT NULL,
  flightNation  VARCHAR(10),
  takeoff       VARCHAR(30),
  arrival       VARCHAR(30),
  PRIMARY KEY (flightID, flight_date)
);

CREATE TABLE TravelRecord (
  personID     VARCHAR(12)  NOT NULL,
  flightID     VARCHAR(10)  NOT NULL,
  flight_date  DATE         NOT NULL,
  seat         VARCHAR(4),
  PRIMARY KEY (personID, flightID, flight_date),
  FOREIGN KEY (personID) REFERENCES Person (personID),
  FOREIGN KEY (flightID, flight_date) REFERENCES Flight (flightID, flight_date)
);
\`\`\`

- \`date\` 在多數資料庫是保留字或型態名稱，實作時將欄位改名為 \`flight_date\`（或加引號）；以下查詢沿用此名稱，對應題目中的 \`date\`。
- Flight 的主鍵是兩個欄位的組合，所以 TravelRecord 參照它時，外來鍵也必須是**兩個欄位一起**的複合外來鍵 \`(flightID, flight_date)\`。
- TravelRecord 的主鍵 (personID, flightID, flight_date) 保證同一人同一班次不會重複訂位。

**(二) 2020 年 5 月自 USA New York 出發的班機，依國籍及性別的搭機人數（5 分）**

\`\`\`sql
SELECT P.nationality, P.gender, COUNT(*) AS passenger_count
FROM TravelRecord T
JOIN Flight F ON T.flightID = F.flightID AND T.flight_date = F.flight_date
JOIN Person P ON T.personID = P.personID
WHERE F.takeoff = 'USA New York'
  AND F.flight_date >= '2020-05-01'
  AND F.flight_date <  '2020-06-01'
GROUP BY P.nationality, P.gender;
\`\`\`

- TravelRecord 與 Flight 連接時，**兩個欄位都要比對**（flightID 與 flight_date）。
- 一列 TravelRecord 就是一位旅客搭乘一個班次，所以 \`COUNT(*)\` 就是搭機人數。

**(三) 2020 年 5 月搭機人數 >= 100 的航班（5 分）**

\`\`\`sql
SELECT F.flightID, F.flightNation, F.takeoff, F.arrival, F.flight_date
FROM Flight F
JOIN TravelRecord T ON T.flightID = F.flightID AND T.flight_date = F.flight_date
WHERE F.flight_date >= '2020-05-01'
  AND F.flight_date <  '2020-06-01'
GROUP BY F.flightID, F.flightNation, F.takeoff, F.arrival, F.flight_date
HAVING COUNT(*) >= 100
ORDER BY F.flight_date DESC;
\`\`\`

1. 題目假設「每一航班每天最多飛一次」，所以 (flightID, flight_date) 就是一個班次，各班次分別計算人數。
2. 人數是聚合結果，要用 \`HAVING COUNT(*) >= 100\`，不能寫在 \`WHERE\`。
3. SELECT 中的非聚合欄位都放進 \`GROUP BY\`。
4. \`ORDER BY flight_date DESC\` 由近至遠。
5. 若題意是「同一航班代號在整個 5 月的總人數」，則改成只依 flightID（以及航班固定屬性）分組，並移除日期欄位。

      question: `假設現有下列兩個 transactions 同步存取資料 X, Y，請繪製表格說明，不同時間標記點，如果讀寫動作被允許進行，系統對資料 X, Y 所記錄的 R_TS（讀取的時間標記）及 W_TS（寫入的時間標記）為何？如果讀寫動作不被允許進行，請說明原因及系統會作出的回應為何？
註：系統進行時序如下列左圖，解答表格參考下列右圖。（20 分）`,
      answer: `**(一) 時間標記排序（Timestamp Ordering）的規則**

每個交易在 Begin 時取得時間標記 TS（越早開始，TS 越小）；每個資料項記錄兩個時間標記：**R_TS**（讀過它的所有交易中最大的 TS）與 **W_TS**（寫過它的所有交易中最大的 TS）。初始值皆為 0。

| 操作 | 允許的條件 | 允許時的更新 | 不允許時的處理 |
|---|---|---|---|
| Read(Q)，交易 T | TS(T) ≥ W_TS(Q)（沒有比 T 更「新」的交易已寫過 Q） | R_TS(Q) = max(R_TS(Q), TS(T)) | 中止（abort）T，以新的 TS 重新開始 |
| Write(Q)，交易 T | TS(T) ≥ R_TS(Q) 且 TS(T) ≥ W_TS(Q)（沒有更新的交易已讀或寫過 Q） | W_TS(Q) = TS(T) | 中止（abort）並回復 T，以新的 TS 重新開始 |

**(二) 決定時間標記**：T1 在時間 1 開始，TS(T1) = **1**；T2 在時間 3 開始，TS(T2) = **3**（T1 較舊，T2 較新）。

**(三) 逐時間點的結果**

| 時間 | 動作 | 是否允許 | X（R_TS／W_TS） | Y（R_TS／W_TS） | 說明 |
|---|---|---|---|---|---|
| 1 | T1 Begin | — | 0／0 | 0／0 | TS(T1) = 1 |
| 2 | T1 Read(Y) | 允許 | 0／0 | **1**／0 | 1 ≥ W_TS(Y)=0，R_TS(Y) = 1 |
| 3 | T1 Read(X)；T2 Begin | 允許 | **1**／0 | 1／0 | R_TS(X) = 1；TS(T2) = 3 |
| 4 | T2 Read(X) | 允許 | **3**／0 | 1／0 | 3 ≥ W_TS(X)=0，R_TS(X) = max(1, 3) = 3 |
| 5 | T2 Write(X) | 允許 | 3／**3** | 1／0 | 3 ≥ R_TS(X)=3 且 3 ≥ W_TS(X)=0，W_TS(X) = 3 |
| 6 | T2 Commit | — | 3／3 | 1／0 | T2 完成 |
| 7 | T1 Write(X) | **不允許** | 3／3 | 1／0 | TS(T1)=1 < R_TS(X)=3，見下方說明 |
| 8 | T1 Write(Y) | 未執行 | 3／3 | 1／0 | T1 已被中止 |
| 9 | T1 Commit | 未執行 | 3／3 | 1／0 | T1 已被中止 |

**(四) 時間 7 被拒絕的原因與系統的回應**

- **原因**：T1 要寫 X，但 X 的 R_TS = 3 表示**比 T1 更新的交易 T2（TS=3）已經讀過 X**。若允許 T1 寫入，就等於 T1「在過去」改了 X，T2 之前讀到的值就不是在 T1 之前的序列中應看到的值，違反以時間標記決定的序列順序（T1 應排在 T2 之前）。同時 W_TS(X) = 3 也大於 TS(T1) = 1，同樣不可寫。
- **系統回應**：**中止並回復（rollback）T1**，撤銷 T1 已做的動作；之後讓 T1 以**新的、較大的時間標記**重新開始執行。時間 8、9 的 Write(Y)、Commit 在這一輪不會執行。

**(五) T1 重新開始後的結果**（假設新時間標記 TS(T1)＝10）

| 動作 | 檢查 | X（R_TS／W_TS） | Y（R_TS／W_TS） |
|---|---|---|---|
| Read(Y) | 10 ≥ W_TS(Y)=0，允許 | 3／3 | 10／0 |
| Read(X) | 10 ≥ W_TS(X)=3，允許 | 10／3 | 10／0 |
| Write(X) | 10 ≥ R_TS(X)=10 且 ≥ W_TS(X)=3，允許 | 10／10 | 10／0 |
| Write(Y) | 10 ≥ R_TS(Y)=10 且 ≥ W_TS(Y)=0，允許 | 10／10 | 10／10 |
| Commit | — | 10／10 | 10／10 |

結果相當於先執行 T2、再執行 T1 的循序排程，符合時間標記排序的順序。

**重點**：時間標記法不使用鎖，不會有死結，但衝突時會以「中止並重啟」解決；被中止的交易重啟後會取得更大的時間標記，所以最終能順利完成。`
    }
  ]
},

運作流程：

1. **OLTP 產生資料**：企業的營運系統（訂單、會員、庫存）持續產生交易資料，是主要資料來源之一。大數據平台還會接入日誌、感測器、社群與外部資料。
2. **ETL 匯集並整理**：ETL 定期（或近即時）把各來源資料**擷取**出來，**轉換**成一致、乾淨的格式，**載入**資料倉儲。這一步讓分析不必直接查詢營運系統，避免拖慢交易。
3. **資料倉儲儲存整合資料**：保存長期歷史、整合後的資料，是 OLAP 與資料探勘共同的基礎。
4. **OLAP 做描述性分析**：分析人員在倉儲上做多維度彙總與下鑽，快速得到趨勢、比較與例外，產生報表與儀表板。
5. **資料探勘做深入的預測與發現**：以倉儲資料訓練模型，找出 OLAP 難以直接看出的規律（如哪些客戶可能流失）。OLAP 發現的現象也可引導探勘的方向，探勘發現的模式再用 OLAP 驗證。
6. **回饋營運**：分析與探勘的結果（推薦、動態定價、風險警示）回到 OLTP 營運系統，形成閉環，最終**提供大數據服務**。

**一句話總結**：OLTP 產生資料 → ETL 整合 → 資料倉儲儲存 → OLAP 與資料探勘分析 → 決策與服務回饋 OLTP。

**補充：OLTP 與 OLAP／資料倉儲的比較**

| 比較項目 | OLTP | OLAP／資料倉儲 |
|---|---|---|
| 目的 | 日常營運 | 分析決策 |
| 資料 | 最新、明細、正規化 | 歷史、彙總、反正規化 |
| 操作 | 大量短交易（增刪改查） | 少量複雜查詢（掃描與彙總） |
| 使用者 | 第一線人員、顧客 | 分析人員、管理者 |`

      question: `某一資料庫系統內有以下資料表（實底線欄位為主鍵）：

試說明此資料表為何符合 BCNF 正規化形式、但不符合第四階正規化形式？（15 分）應如何修改使之符合第四階正規化形式？（10 分）`,
      answer: `**(一) 為何符合 BCNF**

**主鍵與函數相依**：題目指出主鍵是全部三個欄位 (課程, 教師, 課本)。檢查資料可知：同一門課程有多位教師、多本課本；同一位教師在不同課程出現；同一課本在不同課程出現，**沒有任何一個欄位（或欄位組合）能決定其他欄位的值**，所以表中沒有非平凡的函數相依（FD）。

- BCNF 的要求是：每個非平凡函數相依的左邊都必須是超鍵。
- 本表沒有任何非平凡函數相依，因此條件自然成立，**符合 BCNF**（也符合 3NF、2NF 與 1NF）。

**(二) 為何不符合第四正規化型式（4NF）：存在多值相依（MVD）**

**多值相依的定義**：X →→ Y 表示對於 X 的每個值，所對應的一組 Y 值，**與其餘屬性（Z）的值無關**。也就是只要 (x, y1, z1)、(x, y2, z2) 在表中，則 (x, y1, z2)、(x, y2, z1) 也必須在表中。

**本表的多值相依**：

- **課程 →→ 教師**，且 **課程 →→ 課本**：每門課程的教師集合與課本集合是**互相獨立**的。

驗證：

| 課程 | 教師集合 | 課本集合 | 應有的組合數 | 實際列數 |

每門課「教師與課本的所有組合」都完整出現，表示教師與課本彼此獨立，這是典型的多值相依（沒有任何一位教師只配某些課本）。

**4NF 的要求**：對每個非平凡的多值相依 X →→ Y，X 必須是超鍵。這裡 **課程不是超鍵**（課程不能決定教師或課本，主鍵是三個欄位全部），所以違反 4NF。

**造成的問題**

| 更新異常 | 修改一本課本的名稱，要改多列 |

      score: 25,
      question: `當資料庫系統發生故障時，回復處理常採用交易記錄回復處理（Log-based Recovery）。試說明此種回復處理方式的原理以及運作過程。（25 分）`,
      answer: `**(一) 原理**

資料庫修改資料時，先在**穩定儲存裝置（磁碟）上的交易記錄（log，又稱日誌）**中，依序記錄每一筆更新的內容；發生故障後，以 log 為依據，把資料庫恢復到**一致的狀態**：已提交（commit）的交易結果要保留（redo），未提交的交易結果要撤銷（undo），以維持交易的**原子性（Atomicity）與持久性（Durability）**。

**核心規則：預寫日誌（Write-Ahead Logging, WAL）**

1. 更新資料庫（寫回磁碟）**之前**，對應的 log 紀錄必須先寫到穩定儲存。
2. 交易提交（commit）之前，它的所有 log 紀錄（含 \`<Ti commit>\`）必須已寫入穩定儲存。

因為 log 一定比資料庫先寫入，系統才有辦法在故障後知道「做了什麼、該還原什麼」。

**(二) Log 的內容**

| 紀錄 | 意義 |
|---|---|
| \`<Ti, start>\` | 交易 Ti 開始 |
| \`<Ti, X, V1, V2>\` | Ti 把資料項 X 的值從 V1（**舊值／before image**）改成 V2（**新值／after image**） |
| \`<Ti, commit>\` | Ti 已成功提交 |
| \`<Ti, abort>\` | Ti 已中止（並已回復） |
| \`<checkpoint, 活動交易清單>\` | 檢查點：此刻之前的更新都已寫回磁碟，並記錄當時尚未結束的交易 |

**(三) 兩種更新方式**

| 方式 | 更新資料庫的時機 | log 紀錄 | 故障後的處理 |
|---|---|---|---|
| **延遲更新（Deferred Update）** | 交易**提交後**才寫入資料庫 | 只需記錄新值 | 只需 **redo** 已提交的交易；未提交者因尚未改資料庫，直接忽略 |
| **即時更新（Immediate Update）** | 交易**執行中**就可寫入資料庫 | 需記錄舊值與新值 | 已提交者 **redo**、未提交者 **undo** |

**(四) 運作過程**

**1. 正常執行時**

1. 交易開始時寫入 \`<Ti, start>\`。
2. 每次更新，先寫入 \`<Ti, X, 舊值, 新值>\`（WAL），再修改記憶體緩衝區中的資料。
3. 提交時寫入 \`<Ti, commit>\` 並強制寫到磁碟，此後交易即視為成功。
4. 系統定期做**檢查點**：暫停新交易，把 log 與緩衝區中已修改的資料頁寫入磁碟，並寫入檢查點紀錄，以縮短日後回復的範圍。

**2. 發生故障後的回復**

1. **找到最近的檢查點**，從該點開始往後讀 log（檢查點之前已確定寫回磁碟的交易不需處理）。
2. 依 log 把交易分成兩類：
   - **有 \`<Ti, commit>\`**（提交）→ 放入 **redo 清單**。
   - **有 \`<Ti, start>\` 但沒有 commit 或 abort**（故障時未完成）→ 放入 **undo 清單**。
3. **Undo**：依 log **由後往前**，把 undo 清單中交易的更新，以**舊值**還原。
4. **Redo**：依 log **由前往後**，把 redo 清單中交易的更新，以**新值**重做。
5. 回復完成後，資料庫只含已提交交易的結果；未完成的交易視為從未執行，可重新執行。

**範例**（即時更新）

| 順序 | Log 紀錄 | 說明 |
|---|---|---|
| 1 | \`<T1, start>\` | |
| 2 | \`<T1, A, 100, 150>\` | T1 把 A 由 100 改為 150 |
| 3 | \`<T2, start>\` | |
| 4 | \`<T2, B, 20, 30>\` | T2 把 B 由 20 改為 30 |
| 5 | \`<T1, commit>\` | T1 已提交 |
| 6 | **系統故障** | T2 尚未提交 |

| 交易 | 狀態 | 回復動作 | 結果 |
|---|---|---|---|
| T1 | 已提交 | **Redo**：A 重設為 150（避免緩衝區未寫回而遺失） | A = 150 |
| T2 | 未提交 | **Undo**：B 還原為舊值 20 | B = 20 |

**(五) 重點整理**

1. Log 是回復的依據，必須先於資料庫寫入（WAL）。
2. Redo 保證**持久性**（已提交的不會消失），Undo 保證**原子性**（未完成的不留痕跡）。
3. 檢查點縮短了 redo／undo 的範圍，不必從 log 的開頭重新處理。
4. Undo 必須由後往前、Redo 必須由前往後，才能正確還原順序。`

d><td style="border:1px solid #d8d0bf;padding:.28rem .8rem">S6186</td><td style="border:1px solid #d8d0bf;padding:.28rem .8rem">A226</td><td style="border:1px solid #d8d0bf;padding:.28rem .8rem">14:30</td><td style="border:1px solid #d8d0bf;padding:.28rem .8rem">80</td></tr></tbody></table></div>`,
      question: `某一資料庫系統內有以下三個資料表：
（教師資料表、課程資料表、修課資料表見下方，皆以實底線欄位為主鍵）
㈠試寫出一個 SQL 指令，建立一個視界（View），以顯示每位教師的開課資料以及修習這些課程的學生資料。（10 分）
㈡試寫出一個 SQL 指令，建立一個統計性摘要視界（View），以顯示每位教師的開課數以及開課總學分數。（15 分）`,
      answer: `**先看三個表格的關係**

| 表格 | 主鍵 | 連接方式 |
|---|---|---|
| 教師資料表 | 教師編號 | 以「教師編號」連到修課資料表 |
| 課程資料表 | 課程編號 | 以「課程編號」連到修課資料表 |
| 修課資料表 | (教師編號, 課程編號, 學生編號) | 一列代表「某教師開的某課程，有某位學生修讀」，是連接三者的關聯表 |

「教師開了哪些課」只記錄在修課資料表中（教師編號＋課程編號），因此需透過它連接。以下以中文欄位名稱撰寫；若資料庫不支援中文識別字，可改用英文別名。

**(一) 建立「開課與修課學生」視界（10 分）**

\`\`\`sql
CREATE VIEW 教師開課修課明細 AS
SELECT T.教師編號, T.姓名, T.科系,
       C.課程編號, C.名稱 AS 課程名稱, C.學分數,
       E.學生編號, E.教室, E.時間, E.成績
FROM 教師資料表 T
JOIN 修課資料表 E ON T.教師編號 = E.教師編號
JOIN 課程資料表 C ON E.課程編號 = C.課程編號;
\`\`\`

- 以修課資料表為橋梁，連接教師與課程，取得「每位教師的開課資料」與「修習這些課程的學生資料」。
- 結果有 3 列（與修課資料表的列數相同）：

| 教師編號 | 姓名 | 科系 | 課程編號 | 課程名稱 | 學分數 | 學生編號 | 教室 | 時間 | 成績 |
|---|---|---|---|---|---|---|---|---|---|
| P001 | 王大明 | CS | C101 | 資料庫應用 | 3 | S2003 | A513 | 13:30 | 86 |
| P002 | 李大華 | BA | C103 | 多媒體導論 | 4 | S6121 | A226 | 14:30 | 72 |
| P002 | 李大華 | BA | C103 | 多媒體導論 | 4 | S6186 | A226 | 14:30 | 80 |

**(二) 建立「每位教師開課數與開課總學分數」統計摘要視界（15 分）**

\`\`\`sql
CREATE VIEW 教師開課統計 (教師編號, 姓名, 開課數, 開課總學分數) AS
SELECT T.教師編號, T.姓名,
       COUNT(*)        AS 開課數,
       SUM(C.學分數)   AS 開課總學分數
FROM 教師資料表 T
JOIN (SELECT DISTINCT 教師編號, 課程編號
      FROM 修課資料表) O ON T.教師編號 = O.教師編號
JOIN 課程資料表 C ON O.課程編號 = C.課程編號
GROUP BY T.教師編號, T.姓名;
\`\`\`

**為什麼要先 \`SELECT DISTINCT 教師編號, 課程編號\`（關鍵）**

修課資料表是以**學生**為單位，同一位教師的同一門課有幾位學生就有幾列。若直接連接後 \`COUNT(*)\`、\`SUM(學分數)\`，會把一門課重複計算：

| 計算方式 | P001 王大明 | P002 李大華 | 是否正確 |
|---|---|---|---|
| 未去除重複，直接連接加總 | 開課數 1、學分 3 | 開課數 **2**、學分 **8**（C103 被 2 位學生重複計） | **錯誤** |
| 先取 DISTINCT（教師, 課程） | 開課數 1、學分 3 | 開課數 **1**、學分 **4** | **正確** |

**視界結果**

| 教師編號 | 姓名 | 開課數 | 開課總學分數 |
|---|---|---|---|
| P001 | 王大明 | 1 | 3 |
| P002 | 李大華 | 1 | 4 |

**說明**

1. 這是**統計性摘要視界**：視界中的每一列是彙總出來的值（含聚合函數與 \`GROUP BY\`），因此是**不可更新視界**，只適合查詢。
2. \`CREATE VIEW 名稱 (欄位1, 欄位2, ...)\` 以括號指定視界欄位名稱；也可以改在 SELECT 中使用 \`AS\` 別名。
3. 開課總學分數是「該教師所開的每門不同課程學分的加總」，同一門課只算一次。
4. 若希望沒有開課的教師也出現（開課數為 0），把教師資料表改成 \`LEFT JOIN\` 並用 \`COUNT(O.課程編號)\`、\`COALESCE(SUM(C.學分數), 0)\`。`

      question: `據悉行政院農業委員會欲建立一個全國養殖場、肉品交易、販售的資料庫。目前已確定的資料如下：
⒈國內各養殖場的資料需要建立起來。養殖場資料有負責人姓名、他的身分證號碼、養殖場容量、地址。
⒉目前有些養殖場有排泄物淨化處理廠，有些養殖場沒有。如果有排泄物淨化處理廠的，則要儲存的資料有廠名、具有的設施、淨化程度。其中各處理廠的廠名，都各不相同。
⒊各養殖場所飼養的，可能是禽類的（如雞、鴨、鵝等），也可能是牲畜類的（如牛、豬等）。我們統稱之為「禽畜」。其中，每一隻禽畜（例如，一隻豬，或一隻雞）都有一個全國唯一的編號，以方便我們將來做追蹤。並且我們還要儲存每一隻禽畜的種類、重量和防疫資料。其中，防疫資料包括以下三項：疫苗種類、注射日期與審核單位。
⒋養殖場所產出的禽畜，會被賣到全國數個肉品交易市場。我們要儲存每個肉品交易市場的市場名稱和交易金額。其中市場名稱，是具有全國唯一性的資料。
⒌我們需要建立養殖場、禽畜和肉品交易市場，三者之間的關係，以便將來追蹤每一隻禽畜是來自那一個養殖場，以及是從那一個肉品交易市場交易出去的。並且，在這三者的關係裡，我們要儲存出貨日期和批號。
⒍此外，我們還有販售商店的資料要儲存，它們包括商店的店名和地址。其中店名是全國唯一的，而同一家的販售商店的地址可能不只一處。例如，臺北、臺中和高雄，都有某一家販售商店。
⒎養殖場不能把禽畜直接賣給販售商店，販售商店必須去肉品交易市場購買禽畜肉品。
根據以上的敘述，請用實體-關係模型（Entity-Relationship Model）來建立此資料庫，繪製出其綱目圖（Schema diagram）。（20 分）`,
      answer: `**(一) 逐條分析需求**

| 需求 | 對應的 ER 元件 | 設計重點 |
|---|---|---|
| ⒈ 養殖場 | 實體 FARM | 屬性：負責人姓名、負責人身分證號、容量、地址。題目沒有指定養殖場的識別，所以另設養殖場編號 farm_id 當主鍵（負責人可能不只經營一家） |
| ⒉ 排泄物淨化處理廠 | 實體 TREATMENT_PLANT ＋ 關聯 HAS（FARM—PLANT） | 廠名唯一 → 主鍵；「具有的設施」可有多項 → **多值屬性**（以 { } 表示）；有些養殖場沒有 → 養殖場端是**部分參與 (0,1)**，處理廠端是**全部參與 (1,1)** |
| ⒊ 禽畜 | 實體 ANIMAL ＋ 子類型 POULTRY／LIVESTOCK ＋ 弱實體 VACCINATION | 全國唯一編號 → 主鍵 animal_id；禽類、牲畜類為**子類型，互斥（d）**，統稱禽畜；防疫資料可有多筆（疫苗種類、注射日期、審核單位）→ 獨立成**弱實體**，部分鍵為 (疫苗種類, 注射日期) |
| ⒋ 肉品交易市場 | 實體 MARKET | 市場名稱全國唯一 → 主鍵；屬性：交易金額 |
| ⒌ 三者的關係 | **三元關聯 SHIP（出貨）**：FARM—ANIMAL—MARKET | 關聯上有屬性：出貨日期、批號；一隻禽畜只會來自一個養殖場、只賣到一個市場 → ANIMAL 端為 1 |
| ⒍ 販售商店 | 實體 STORE ＋ 弱實體 STORE_ADDRESS | 店名唯一 → 主鍵；地址有多處 → **多值屬性**，以弱實體 STORE_ADDRESS 表示 |
| ⒎ 養殖場不能直接賣給商店 | **FARM 與 STORE 之間不建立任何關聯** | 商店透過關聯 BUY 向 MARKET 購買；禽畜的流向只能是「養殖場 → 市場 → 商店」 |

㈡問此關連是否符合第三正規化的要求？若是，說明原因。若否，如何作第三正規化？`,
      answer: `**(一) 先解讀題目與找出候選鍵**

題目中的 A、B、C、D、E 各代表「一個或一組欄位」，而 **E ⊆ B** 表示 E 是 B 的一部分（E 所包含的欄位都屬於 B），所以 B 能決定 E（平凡相依 B → E）。函數相依集合為：

| 函數相依 | 說明 |
|---|---|
| B → E（因 E ⊆ B） | 平凡相依，E 隨著 B 而定 |
| C → D | |
| AB → C | |

**求候選鍵**：A 不在任何相依的右邊，所以 A 必在鍵中；B 也沒有在任何非平凡相依的右邊出現，所以 B 也必在鍵中。計算 (AB)⁺：

1. AB → C，得 ABC。
2. C → D，得 ABCD。
3. E ⊆ B，故 E 也被 B 決定，得 ABCDE（全部屬性）。

所以 **AB 是唯一的候選鍵（主鍵）**。主屬性是 A、B（E 是 B 的一部分，也屬於鍵的一部分）；非主屬性是 C、D。

**(二) 是否符合第二正規化（2NF）：符合**

2NF 的要求是：每個**非主屬性**都必須**完全**函數相依於候選鍵，不能只相依於鍵的一部分（不能有部分相依）。

| 非主屬性 | 相依情形 | 是否部分相依 |
|---|---|---|
| C | AB → C；C 沒有只由 A 或只由 B 決定 | 否，完全相依於 AB |
| D | AB → C → D，D 透過 C 相依於 AB；沒有只由 A 或 B 決定 | 否，沒有部分相依 |

沒有任何非主屬性只相依於鍵的一部分（A 或 B），因此 **R 符合 2NF**，不需要做第二正規化。

**(三) 是否符合第三正規化（3NF）：不符合**

3NF 的要求是：對每個非平凡函數相依 X → Y，X 是超鍵，或 Y 是主屬性（不能有非主屬性對非主屬性的**傳遞相依**）。

| 函數相依 | X 是超鍵？ | Y 是主屬性？ | 是否違反 3NF |
|---|---|---|---|
| AB → C | 是 | — | 否 |
| C → D | **否**（C 不是超鍵） | **否**（D 是非主屬性） | **違反** |

違反的原因是**傳遞相依**：AB → C，且 C → D（C 不是鍵），所以 D 透過非主屬性 C 傳遞相依於主鍵 AB。因此 **R 不符合 3NF**。

造成的問題：相同的 C 值在多列出現時，D 會被重複儲存（冗餘）；修改某個 C 對應的 D，要改多列（更新異常）；沒有 AB 資料時，無法單獨記錄「C 對應 D」（新增異常）。

**(四) 如何做第三正規化：消除傳遞相依**

把造成傳遞相依的 C → D 獨立成一個表格，其餘留在原表：

| 資料表 | 欄位（<u>底線</u>＝主鍵） | 外來鍵 | 決定者是否為鍵 |
|---|---|---|---|
| R1 | <u>A</u>, <u>B</u>, C, E | C → R2(C) | AB → C，AB 是鍵 ✓（B → E 的 E 為 B 的一部分，屬於同一表格的鍵屬性） |
| R2 | <u>C</u>, D | — | C → D，C 是鍵 ✓ |

**驗證**

1. **無損分解**：R1 ∩ R2 = {C}，而 C 是 R2 的鍵，所以 R1 ⋈ R2 可還原 R。
2. **保持相依**：AB → C 在 R1、C → D 在 R2，原有相依都保留；AB → D 可由兩者推得。
3. R1、R2 都符合 3NF，也符合 BCNF。`
    },

| 資料表 | 主鍵 | 連接方式 |

| 設計團隊 | 團隊名稱 | 以 團隊名稱 = 執行.設計團隊名稱 |

| 軟體系統 | 系統名 | 以 系統名 = 執行.軟體系統名 |
| 執行 | (設計團隊名稱, 政府單位名稱, 軟體系統名) | 連接三者，另有安裝日期 |

**關連式代數符號**：σ 選擇、π 投影、⋈ 自然（或條件）連接、γ 分組與聚合（擴充運算，用於 SUM、AVG 等）。

**(一) 2016 年各政府單位安裝的軟體系統售價總和（10 分）**

**關連式代數**：

\`\`\`
R1 = σ 20160101 ≤ 安裝日期 ≤ 20161231 (執行)
R2 = π 政府單位名稱, 軟體系統名 (R1)                 -- 去除同一單位同一系統的重複
R3 = R2 ⋈ 軟體系統名 = 系統名 (軟體系統)
結果 = γ 政府單位名稱 ; SUM(售價) → 售價總和 (R3)
\`\`\`

也可寫成單一式子：

\`γ 政府單位名稱 ; SUM(售價) (π 政府單位名稱, 軟體系統名, 售價 (σ 20160101 ≤ 安裝日期 ≤ 20161231 (執行 ⋈ 軟體系統名 = 系統名 軟體系統)))\`

說明：

1. 先以 σ 選出去年的安裝紀錄。
2. 與軟體系統連接，取得每個系統的售價。
3. 先投影 (政府單位, 系統, 售價)，利用集合運算去除重複，使「同一單位的同一個系統」只計一次，避免因為不同設計團隊重複執行而重複加總。
4. 最後依政府單位分組，對售價求和。只安裝一個系統的單位，總和就是該系統的售價。

**(二) 開發過不低於一千萬元軟體系統的設計團隊（10 分）**

\`\`\`
π 設計團隊名稱 ( 執行 ⋈ 軟體系統名 = 系統名 ( σ 售價 ≥ 10000000 (軟體系統) ) )
\`\`\`

說明：先選出售價大於等於 1000 萬元的系統，再與「執行」連接找出開發它們的團隊，最後投影團隊名稱（投影會自動去除重複的團隊）。

**(三) SQL：所在地為臺北、或購置過「資料探勘系統」的政府單位（10 分）**

\`\`\`sql
SELECT 單位名稱
FROM 政府單位
WHERE 單位所在地 = '臺北'
UNION
SELECT 政府單位名稱
FROM 執行
WHERE 軟體系統名 = '資料探勘系統';
\`\`\`

- \`UNION\` 合併兩組結果並**自動去除重複**，同時符合兩個條件的單位只出現一次。兩個 SELECT 的欄位數與型態必須相容。
- 等價寫法（用 \`OR\` 與 \`EXISTS\`）：

\`\`\`sql
SELECT G.單位名稱
FROM 政府單位 G
WHERE G.單位所在地 = '臺北'
   OR EXISTS (SELECT 1
              FROM 執行 E
              WHERE E.政府單位名稱 = G.單位名稱
                AND E.軟體系統名 = '資料探勘系統');
\`\`\`

**(四) SQL：每個設計團隊為政府單位製作過的軟體系統平均售價（10 分）**

\`\`\`sql
SELECT D.團隊名稱, AVG(S.售價) AS 平均售價
FROM 設計團隊 D
JOIN (SELECT DISTINCT 設計團隊名稱, 軟體系統名
      FROM 執行) E ON D.團隊名稱 = E.設計團隊名稱
JOIN 軟體系統 S ON E.軟體系統名 = S.系統名
GROUP BY D.團隊名稱;
\`\`\`

說明：

1. 同一團隊可能把同一個系統安裝在多個政府單位，直接連接會讓該系統被重複計入平均，所以先以 \`SELECT DISTINCT 設計團隊名稱, 軟體系統名\` 取得每個團隊「做過的不同系統」，再取平均。
2. 若題意是「依每次安裝（每筆執行紀錄）計算」，可省略 DISTINCT 子查詢，直接連接執行與軟體系統即可。
3. 從沒有製作過系統的團隊不會出現；若要列出，改用 \`LEFT JOIN\`。`

le="border:1px solid #d8d0bf;padding:.28rem .8rem"></td><td style="border:1px solid #d8d0bf;padding:.28rem .8rem">Write (X)</td></tr><tr><td style="border:1px solid #d8d0bf;padding:.28rem .8rem">9</td><td style="border:1px solid #d8d0bf;padding:.28rem .8rem"></td><td style="border:1px solid #d8d0bf;padding:.28rem .8rem">End (B)</td></tr></tbody></table>`,
      question: `有一個交易執行程序（Transaction execution schedule），記錄了二筆交易（transactions）的執行步驟如下：（每小題 10 分，共 20 分）
（交易執行程序見下方）
㈠請問這執行會導致怎樣的資料更新問題（update anomaly），並說明問題是在那個時間點，如何發生的？
㈡什麼是二階段鎖定協定（Two-Phase Locking Protocol）？若使用二階段鎖定協定，會怎樣執行這二個交易？`,
      answer: `**(一) 會導致「遺失更新（Lost Update）」**

**範例**：假設 X 的初始值是 100；交易 B 要在 X 上做自己的修改（如 X = X + 10）。

| 時間 | 動作 | 記憶體中的值 | 資料庫中的 X | 說明 |
|---|---|---|---|---|
| 1 | A Begin | | 100 | |
| 2 | B Begin | | 100 | |
| 3 | **B Read(X)** | B 讀到 100 | 100 | B 取得 X 的舊值 |
| 4 | A Read(X) | A 讀到 100 | 100 | |
| 5 | A：X = X + 5 | A 算出 105 | 100 | |
| 6 | **A Write(X)** | | **105** | A 的更新寫入 |
| 7 | A End | | 105 | A 提交 |
| 8 | **B Write(X)** | B 以舊值 100 算得 110 | **110** | B 用時間 3 讀到的舊值算出結果並寫入 |
| 9 | B End | | 110 | B 提交 |

**問題發生的時間點與原因**：

- **問題發生在時間 8**：B 在時間 3 讀到 X = 100 之後，A 在時間 6 已經把 X 更新為 105 並在時間 7 提交，但 B 沒有重新讀取，仍以舊值 100 計算並在時間 8 寫入，**覆蓋了 A 的更新**。
- 結果：X = 110，而正確的循序結果應為 115（100 + 5 + 10）。**A 加的 5 憑空遺失**，卻沒有任何錯誤訊息，這就是遺失更新（也屬於「更新異常」）。
- 根本原因：兩個交易在**沒有並行控制**的情況下，交錯地「讀取—修改—寫入」同一個資料項，違反了**隔離性**。

**(二) 二階段鎖定協定（Two-Phase Locking, 2PL）**

**定義**：每個交易對資料項的加鎖與解鎖分為兩個階段：

| 階段 | 規則 |
|---|---|
| **成長階段（Growing）** | 只能取得（加）鎖，不能釋放任何鎖 |
| **收縮階段（Shrinking）** | 一旦釋放第一個鎖，就只能釋放鎖，**不能再取得新的鎖** |

鎖的種類：**共享鎖（S, 讀鎖）**，多個交易可同時持有；**互斥鎖（X, 寫鎖）**，與任何其他鎖都不相容。若要求交易持有鎖到結束才一次釋放，稱為**嚴格 2PL**，可避免連鎖回復。**2PL 保證衝突可序列化。**

**使用 2PL 時，這兩個交易的執行**

**情形一：讀取時即取得互斥鎖（交易預先知道會寫入）**

| 時間 | 動作 | 說明 |
|---|---|---|
| 1、2 | A Begin、B Begin | |
| 3 | B：Lock-X(X)，Read(X) | B 取得 X 的互斥鎖 |
| 4 | A：要 Lock-X(X) | **衝突，A 等待** |
| 8 | B：Write(X) | |
| 9 | B：End，**釋放鎖** | B 提交 |
| 9 之後 | A 取得鎖 → Read(X)（讀到 B 的結果）→ X = X + 5 → Write(X) → End | A 在 B 之後執行 |

等價於**先執行 B、再執行 A** 的循序排程，**沒有任何更新遺失**（X 先加 10 再加 5，得 115）。

**情形二：讀取先加共享鎖、寫入時升級為互斥鎖**

| 時間 | 動作 | 結果 |
|---|---|---|
| 3 | B：Lock-S(X)，Read(X) | 成功 |
| 4 | A：Lock-S(X)，Read(X) | 成功（共享鎖相容） |
| 6 | A：要升級為 Lock-X(X) 以寫入 | 與 B 的 S 鎖衝突，**A 等待 B** |
| 8 | B：要升級為 Lock-X(X) 以寫入 | 與 A 的 S 鎖衝突，**B 等待 A** |
| — | A、B 互相等待 | **死結（Deadlock）** |

2PL 不會讓遺失更新發生，但可能產生死結。DBMS 偵測到死結後，會**選擇一個交易為犧牲者（victim）中止並回復**（如中止 A），讓另一個交易（B）繼續完成，被中止的交易之後重新執行。

**重點**：沒有並行控制時，排程會產生遺失更新；2PL 以「先加鎖、後解鎖，且解鎖後不再加鎖」迫使衝突的交易**排隊**，保證結果等價於某個循序執行，代價是可能等待與死結。`

| 位置 | 軟體 | 主要責任 |
|---|---|---|
| **Client Side（顧客端）** | **應用程式／使用者介面**（表單、報表、程式） | 與使用者互動、組合並送出 SQL、顯示查詢結果；**應用邏輯主要在顧客端** |
| | **ODBC Driver Manager 與 ODBC 驅動程式**（顧客端的資料庫存取軟體） | 提供統一的存取介面，把 ODBC 呼叫轉成特定 DBMS 能理解的通訊協定與 SQL |
| **Server Side（伺服器端）** | **DBMS 伺服器軟體** | 接收 SQL，進行**剖析、查詢最佳化、執行**；負責**交易管理、並行控制（鎖定）、回復、安全與權限檢查** |
| | **資料庫與資料字典** | 實際儲存資料、索引與系統目錄，由伺服器管理與保護 |

**劃分原則**：與使用者互動及應用邏輯放在顧客端；資料的儲存、完整性、並行與安全等資料管理功能集中在伺服器端。

**(二) 何謂 ODBC（5 分）**

**ODBC（Open Database Connectivity，開放資料庫連結）** 是一套**標準的資料庫存取應用程式介面（API）**，由 Microsoft 等廠商提出，提供應用程式以**一致的方式**存取不同廠商、不同種類的關聯式資料庫。

- 應用程式只需呼叫標準的 ODBC 函式，**不必針對每一種 DBMS 撰寫專屬的存取程式碼**。
- 各 DBMS 廠商提供自己的 **ODBC 驅動程式**，負責把標準呼叫轉換成該 DBMS 的專屬協定與 SQL 方言。
- 好處：**應用程式與 DBMS 獨立**，更換資料庫時不必（或只需少量）修改程式；一個應用程式可同時連到不同的資料庫。

**(三) 以一個查詢請求為例，ODBC 如何運作（10 分）**

範例：應用程式要執行 \`SELECT Name FROM Student WHERE ID = 'S01'\`。

| 步驟 | 發生位置 | 動作 | 對應的 ODBC 呼叫 |
|---|---|---|---|
| 1 | Client：應用程式 | 配置環境與連線控制代碼，並**連線**到資料來源（DSN、帳號、密碼） | \`SQLAllocHandle\`、\`SQLConnect\` |
| 2 | Client：Driver Manager | 依資料來源名稱找出並**載入對應的驅動程式** | （由 Driver Manager 處理） |
| 3 | Client：應用程式 | 送出 SQL 查詢請求 | \`SQLExecDirect\` |
| 4 | Client：驅動程式 | 把標準 ODBC 呼叫與 SQL **轉換成該 DBMS 的協定**（必要時調整方言），經網路傳送 | |
| 5 | Server：DBMS | 檢查權限，**剖析並最佳化**查詢，**執行**並產生結果集合 | |
| 6 | Server → Client | 結果（資料列與欄位描述）經網路回傳 | |
| 7 | Client：驅動程式 | 把結果轉成標準的 ODBC 格式，交給 Driver Manager 與應用程式 | |
| 8 | Client：應用程式 | **逐列取回**結果並顯示 | \`SQLFetch\`、\`SQLGetData\` |
| 9 | Client | 釋放陳述式並**中斷連線** | \`SQLFreeHandle\`、\`SQLDisconnect\` |

**重點**：SQL 在顧客端組成、在伺服器端執行；ODBC 位於中間，負責**標準化介面與協定轉換**，使應用程式與具體的 DBMS 解耦。`
