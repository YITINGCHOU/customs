<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>關務人員三等考試｜資訊處理・非選擇題 考古題詳解</title>
<style>/* ===== 關務三等考古題複習系統 — 樣式 ===== */

@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --ink:        #1a1f2c;
  --ink-soft:   #3d4456;
  --paper:      #f4f1ea;
  --paper-warm: #ece6d8;
  --card:       #fffdf8;
  --line:       #d8d0bf;
  --accent:     #8a3324;   /* 朱紅 — 印章色 */
  --accent-2:   #1f5673;   /* 靛藍 */
  --gold:       #a07e2c;
  --shadow:     rgba(40,32,20,0.13);

  /* 主題分類色 */
  --t-db:   #1f5673;
  --t-ds:   #6a4c93;
  --t-prog: #2d6a4f;
  --t-sec:  #8a3324;
  --t-net-c:#b5651d;
  --t-mis:  #4a5859;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--paper);
  color: var(--ink);
  line-height: 1.85;
  -webkit-font-smoothing: antialiased;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(138,51,36,0.025) 31px, rgba(138,51,36,0.025) 32px);
}

/* ===== 頁首 ===== */
.site-header {
  background: var(--ink);
  color: var(--paper);
  padding: 2.4rem 1.5rem 2rem;
  text-align: center;
  border-bottom: 4px solid var(--accent);
  position: relative;
}
.site-header .kicker {
  font-size: .78rem; letter-spacing: .55em; text-indent: .55em;
  color: var(--gold); font-weight: 700; margin-bottom: .7rem;
}
.site-header h1 {
  font-family: 'Noto Serif TC', serif;
  font-weight: 900; font-size: clamp(1.6rem, 4.4vw, 2.7rem);
  letter-spacing: .06em; line-height: 1.3;
}
.site-header h1 .stamp {
  display: inline-block; border: 2.5px solid var(--accent);
  color: var(--accent); padding: .05em .3em; border-radius: 6px;
  transform: rotate(-4deg); margin: 0 .15em;
  font-size: .82em; background: rgba(244,241,234,0.06);
}
.site-header .sub {
  margin-top: .8rem; font-size: .9rem; color: #b8bcca; font-weight: 400;
  letter-spacing: .04em;
}

/* ===== 統計列 ===== */
.stat-bar {
  display: flex; justify-content: center; gap: 2.5rem; flex-wrap: wrap;
  background: var(--paper-warm); padding: 1rem 1.5rem;
  border-bottom: 1px solid var(--line);
}
.stat-bar .stat { text-align: center; }
.stat-bar .num {
  font-family: 'Noto Serif TC', serif; font-weight: 900;
  font-size: 1.7rem; color: var(--accent); line-height: 1;
}
.stat-bar .lbl {
  font-size: .72rem; color: var(--ink-soft); letter-spacing: .15em;
  margin-top: .25rem;
}

/* ===== 控制列 ===== */
.controls {
  position: sticky; top: 0; z-index: 50;
  background: rgb(244,241,234);
  border-bottom: 1.5px solid var(--line);
  padding: .9rem 1.5rem;
  box-shadow: 0 3px 14px var(--shadow);
}
.controls-inner {
  max-width: 1080px; margin: 0 auto;
  display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
}
.mode-switch {
  display: flex; border: 2px solid var(--ink); border-radius: 8px;
  overflow: hidden;
}
.mode-switch button {
  font-family: 'Noto Sans TC', sans-serif;
  border: none; background: transparent; cursor: pointer;
  padding: .5rem 1.1rem; font-size: .88rem; font-weight: 700;
  color: var(--ink); transition: all .18s;
}
.mode-switch button.active { background: var(--ink); color: var(--paper); }

.search-box {
  flex: 1; min-width: 180px; position: relative;
}
.search-box input {
  width: 100%; font-family: 'Noto Sans TC', sans-serif;
  padding: .55rem .9rem .55rem 2.2rem; font-size: .9rem;
  border: 1.5px solid var(--line); border-radius: 8px;
  background: var(--card); color: var(--ink);
}
.search-box input:focus { outline: 2px solid var(--accent-2); border-color: transparent; }
.search-box::before {
  content: '🔍'; position: absolute; left: .7rem; top: 50%;
  transform: translateY(-50%); font-size: .85rem; opacity: .5;
}
.btn-expand {
  font-family: 'Noto Sans TC', sans-serif;
  border: 1.5px solid var(--ink-soft); background: var(--card);
  color: var(--ink-soft); cursor: pointer; border-radius: 8px;
  padding: .5rem .9rem; font-size: .82rem; font-weight: 500;
  white-space: nowrap; transition: all .15s;
}
.btn-expand:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* ===== 篩選晶片 ===== */
.filter-row {
  max-width: 1080px; margin: .7rem auto 0;
  display: flex; gap: .45rem; flex-wrap: wrap;
}
.chip {
  font-family: 'Noto Sans TC', sans-serif;
  border: 1.5px solid var(--line); background: var(--card);
  color: var(--ink-soft); cursor: pointer; border-radius: 20px;
  padding: .3rem .85rem; font-size: .8rem; font-weight: 500;
  transition: all .15s;
}
.chip:hover { border-color: var(--ink-soft); }
.chip.active {
  background: var(--ink); color: var(--paper); border-color: var(--ink);
}
.chip .c-count { opacity: .6; font-size: .92em; margin-left: .2em; }

/* ===== 主內容 ===== */
.wrap { max-width: 1080px; margin: 0 auto; padding: 2rem 1.5rem 5rem; }

/* 群組標題（年度 / 主題） */
.group {
  margin-bottom: 2.6rem;
}
.group-head {
  display: flex; align-items: center; gap: .9rem;
  margin-bottom: 1.1rem; padding-bottom: .6rem;
  border-bottom: 2.5px solid var(--ink);
}
.group-head .g-badge {
  font-family: 'Noto Serif TC', serif; font-weight: 900;
  background: var(--ink); color: var(--paper);
  padding: .35rem .8rem; border-radius: 6px; font-size: 1.05rem;
  white-space: nowrap;
}
.group-head .g-title {
  font-family: 'Noto Serif TC', serif; font-weight: 700;
  font-size: 1.15rem; color: var(--ink);
}
.group-head .g-meta {
  margin-left: auto; font-size: .76rem; color: var(--ink-soft);
  text-align: right; line-height: 1.5;
}
.group-note {
  font-size: .8rem; color: var(--accent-2); font-style: italic;
  margin: -.5rem 0 1rem; padding-left: .2rem;
}

/* ===== 題目卡 ===== */
.q-card {
  background: var(--card); border: 1.5px solid var(--line);
  border-radius: 10px; margin-bottom: .9rem;
  box-shadow: 0 2px 8px var(--shadow);
  overflow: hidden; transition: box-shadow .2s;
}
.q-card:hover { box-shadow: 0 4px 16px var(--shadow); }

.q-header {
  display: flex; align-items: flex-start; gap: .8rem;
  padding: 1rem 1.2rem; cursor: pointer;
  border-left: 5px solid var(--line);
  transition: background .15s;
}
.q-card.t-db   .q-header { border-left-color: var(--t-db); }
.q-card.t-ds   .q-header { border-left-color: var(--t-ds); }
.q-card.t-prog .q-header { border-left-color: var(--t-prog); }
.q-card.t-sec  .q-header { border-left-color: var(--t-sec); }
.q-card.t-net  .q-header { border-left-color: var(--t-net-c); }
.q-card.t-mis  .q-header { border-left-color: var(--t-mis); }
.q-header:hover { background: var(--paper-warm); }

.q-no {
  font-family: 'Noto Serif TC', serif; font-weight: 900;
  font-size: 1rem; color: var(--paper); background: var(--ink-soft);
  min-width: 2.4rem; height: 2.4rem; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.q-headmain { flex: 1; min-width: 0; }
.q-title {
  font-family: 'Noto Serif TC', serif; font-weight: 700;
  font-size: 1.02rem; color: var(--ink); line-height: 1.5;
}
.q-tags {
  display: flex; gap: .45rem; flex-wrap: wrap; margin-top: .4rem;
  align-items: center;
}
.tag {
  font-size: .7rem; font-weight: 700; padding: .12rem .55rem;
  border-radius: 4px; letter-spacing: .03em;
}
.tag-topic { color: #fff; }
.t-db   .tag-topic, .tag.topic-db   { background: var(--t-db); }
.t-ds   .tag-topic, .tag.topic-ds   { background: var(--t-ds); }
.t-prog .tag-topic, .tag.topic-prog { background: var(--t-prog); }
.t-sec  .tag-topic, .tag.topic-sec  { background: var(--t-sec); }
.t-net  .tag-topic, .tag.topic-net  { background: var(--t-net-c); }
.t-mis  .tag-topic, .tag.topic-mis  { background: var(--t-mis); }
.tag-year {
  background: var(--paper-warm); color: var(--ink-soft);
  border: 1px solid var(--line);
}
.tag-score {
  background: transparent; color: var(--gold);
  border: 1px solid var(--gold);
}
.tag-part {
  background: var(--accent-2); color: #fff;
  font-weight: 500;
}
.q-toggle {
  flex-shrink: 0; font-size: 1.3rem; color: var(--ink-soft);
  transition: transform .25s; line-height: 1; margin-top: .4rem;
}
.q-card.open .q-toggle { transform: rotate(45deg); }

/* ===== 題目展開內容 ===== */
.q-body { display: none; padding: 0 1.2rem 1.4rem; }
.q-card.open .q-body { display: block; animation: fadeIn .25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

.section-label {
  display: inline-block; font-family: 'Noto Serif TC', serif;
  font-weight: 700; font-size: .82rem; letter-spacing: .1em;
  padding: .25rem .8rem; border-radius: 4px; margin: 1.1rem 0 .6rem;
}
.section-label.q { background: var(--ink); color: var(--paper); }
.section-label.a { background: var(--accent); color: var(--paper); }

.q-question {
  background: var(--paper-warm); border-left: 3px solid var(--ink-soft);
  padding: .9rem 1.1rem; border-radius: 0 6px 6px 0;
  font-size: .93rem; white-space: pre-wrap; color: var(--ink-soft);
  font-feature-settings: "tnum";
}
.q-answer {
  font-size: .95rem; color: var(--ink);
}
.q-answer h4 {
  font-family: 'Noto Serif TC', serif; color: var(--accent);
  font-size: 1rem; margin: 1.1rem 0 .4rem;
  border-bottom: 1px dashed var(--line); padding-bottom: .2rem;
}
.q-answer p { margin: .55rem 0; }
.q-answer ul, .q-answer ol { margin: .5rem 0 .5rem 1.4rem; }
.q-answer li { margin: .3rem 0; }
.q-answer strong { color: var(--accent-2); font-weight: 700; }
.q-answer code {
  font-family: 'JetBrains Mono', monospace; font-size: .86em;
  background: var(--paper-warm); padding: .1em .35em;
  border-radius: 3px; color: var(--accent);
}
.q-answer table {
  border-collapse: collapse; width: 100%; margin: .8rem 0;
  font-size: .86rem;
  display: block; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch;  /* MOBILE_TABLE：手機寬度下表格可左右捲動 */
}
.q-figure { max-width: 100%; overflow-x: auto; }
.q-answer th, .q-answer td {
  border: 1px solid var(--line); padding: .4rem .6rem;
  text-align: left;
}
.q-answer th {
  background: var(--ink); color: var(--paper); font-weight: 700;
}
.q-answer tr:nth-child(even) td { background: var(--paper-warm); }

/* 程式碼/ASCII 區塊 */
.q-answer pre {
  background: #2b303b; color: #f2f0e9;
  font-family: 'JetBrains Mono', monospace; font-size: .85rem;
  line-height: 1.7; padding: 1rem 1.2rem; border-radius: 8px;
  overflow-x: auto; margin: .8rem 0;
  border-left: 3px solid var(--gold);
}
.q-answer pre code { background: none; color: inherit; padding: 0; }

/* 獨立程式碼區（code 欄位） */
.code-block {
  margin: 1rem 0; border-radius: 8px; overflow: hidden;
  border: 1px solid var(--ink);
}
.code-head {
  background: var(--ink); color: var(--gold);
  font-family: 'JetBrains Mono', monospace; font-size: .76rem;
  padding: .4rem .9rem; font-weight: 500;
  display: flex; justify-content: space-between; align-items: center;
}
.code-head .dots { display: flex; gap: .3rem; }
.code-head .dots span {
  width: .6rem; height: .6rem; border-radius: 50%; display: block;
}
.code-head .dots span:nth-child(1) { background: #d4554a; }
.code-head .dots span:nth-child(2) { background: #d9a441; }
.code-head .dots span:nth-child(3) { background: #5a9e6f; }
.code-block pre {
  margin: 0; border-radius: 0; border-left: none;
  background: #2b303b;            /* 提亮背景，降低與文字的明度落差刺眼感 */
  color: #f2f0e9;                 /* 預設文字（變數、標點）改為近白，清楚可見 */
  font-size: .86rem; line-height: 1.7;
  padding: 1.1rem 1.3rem 1.1rem 1.7rem;   /* 左側多留白，程式碼不貼邊、不壓迫 */
}
/* 語法highlight — 高對比配色，深背景下皆清晰 */
.tok-kw  { color: #ff9d6f; font-weight: 700; }   /* 關鍵字：亮橘，最醒目 */
.tok-str { color: #b8e986; }                      /* 字串：亮綠 */
.tok-com { color: #9aa6b8; font-style: italic; }  /* 註解：提亮的灰藍，不再灰到看不見 */
.tok-num { color: #f7d56e; }                      /* 數字：亮黃 */
.tok-fn  { color: #82c8ff; }                      /* 函式：亮藍 */
.tok-typ { color: #ffd166; }                      /* 型別：金黃 */

/* ===== HTML 圖表（取代易跑版的 ASCII 圖）===== */
.html-diagram {
  margin: 1.1rem 0; padding: 1.3rem 1rem;
  background: var(--paper-warm);
  border: 1.5px solid var(--line); border-radius: 10px;
  overflow-x: auto;
}
/* 通用方框節點 */
.dg-box {
  display: inline-flex; flex-direction: column; align-items: center;
  justify-content: center; text-align: center;
  border: 2px solid var(--ink); border-radius: 8px;
  background: var(--card); padding: .55rem .9rem;
  font-size: .86rem; line-height: 1.5; font-weight: 500;
  min-width: 5.5rem;
}
.dg-box .dg-sub { font-size: .73rem; color: var(--ink-soft); font-weight: 400; }
.dg-box.accent { border-color: var(--accent); background: #fbf3f0; }
.dg-box.blue   { border-color: var(--accent-2); background: #eef4f7; }
.dg-box.gold   { border-color: var(--gold); background: #faf5e6; }
.dg-box.ink    { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.dg-box.ink .dg-sub { color: #b8bcca; }

/* 排列容器 */
.dg-row { display: flex; align-items: center; justify-content: center;
  gap: .5rem; flex-wrap: wrap; }
.dg-col { display: flex; flex-direction: column; align-items: center;
  gap: .5rem; }
.dg-center { justify-content: center; }

/* 箭頭 */
.dg-arrow { font-size: 1.3rem; color: var(--accent); font-weight: 700;
  line-height: 1; padding: 0 .15rem; }
.dg-arrow.v { transform: rotate(90deg); margin: .1rem 0; }
.dg-arrow.bi::before { content: '◀▶'; }
.dg-arrow.down::before { content: '▼'; }
.dg-arrow.right::before { content: '▶'; }

/* 流程圖專用 */
.flow { display: flex; flex-direction: column; align-items: center; gap: 0; }
.flow-node {
  border: 2px solid var(--ink); background: var(--card);
  padding: .55rem 1.1rem; font-size: .86rem; text-align: center;
  font-weight: 500; max-width: 32rem; line-height: 1.55;
}
.flow-node.start, .flow-node.end {
  border-radius: 22px; background: var(--ink); color: var(--paper);
  font-weight: 700;
}
.flow-node.process { border-radius: 6px; }
.flow-node.io {
  border-radius: 6px; background: var(--paper-warm);
  border-style: dashed;
}
.flow-node.decision {
  background: #faf5e6; border-color: var(--gold);
  border-radius: 6px; font-weight: 700;
}
/* 連接線（直線 + 箭頭） */
.flow-conn { width: 2px; height: 1.6rem; background: var(--ink-soft);
  position: relative; }
.flow-conn::after {
  content: '▼'; position: absolute; bottom: -.3rem; left: 50%;
  transform: translateX(-50%); color: var(--ink-soft); font-size: .68rem;
}
/* 連接線旁的小標籤（如「否」「未出貨訂單」） */
.flow-edge {
  display: flex; flex-direction: column; align-items: center; gap: 0;
}
.flow-edge .lbl {
  font-size: .74rem; font-weight: 700; padding: .08rem .55rem;
  border-radius: 4px; position: relative; z-index: 1;
}
.flow-edge .lbl.yes { background: #2d6a4f; color: #fff; }
.flow-edge .lbl.no  { background: var(--accent); color: #fff; }
.flow-edge .lbl.plain {
  background: var(--card); color: var(--accent-2);
  border: 1px solid var(--line);
}
.flow-conn.short { height: .7rem; }
.flow-conn.short::after { display: none; }

/* 迴圈返回標記 —— 掛在決策節點下方，明確標示「往回」 */
.flow-loop {
  display: inline-flex; align-items: center; gap: .4rem;
  font-size: .76rem; font-weight: 700;
  background: #eef4f7; color: var(--accent-2);
  border: 1.5px dashed var(--accent-2); border-radius: 20px;
  padding: .25rem .8rem; margin: .35rem 0;
}
.flow-loop::before { content: '⟲'; font-size: 1.05rem; }

.flow-label {
  font-size: .73rem; color: var(--accent-2); font-weight: 600;
  background: var(--card); padding: 0 .4rem; margin: .15rem 0;
}
/* 舊版分支樣式（保留相容，僅用於少數真正左右並排的場景） */
.flow-branch { display: flex; align-items: flex-start; gap: 2.5rem;
  justify-content: center; }
.flow-branch-arm { display: flex; flex-direction: column;
  align-items: center; gap: 0; }
.flow-yes, .flow-no {
  font-size: .76rem; font-weight: 700; padding: .1rem .5rem;
  border-radius: 4px; margin: .2rem 0;
}
.flow-yes { background: #2d6a4f; color: #fff; }
.flow-no  { background: var(--accent); color: #fff; }

/* ERD 專用形狀 */
.erd-entity {
  border: 2px solid var(--ink); background: var(--card);
  padding: .5rem 1.1rem; font-weight: 700; font-size: .9rem;
  border-radius: 4px; text-align: center;
}
.erd-rel {
  display: inline-flex; align-items: center; justify-content: center;
  width: 7rem; height: 4rem; background: #faf5e6;
  border: 2px solid var(--gold);
  transform: rotate(45deg); margin: 1rem;
}
.erd-rel > span {
  transform: rotate(-45deg); font-size: .8rem; font-weight: 700;
  text-align: center; line-height: 1.3;
}
.erd-attr {
  display: inline-block; border: 1.5px solid var(--accent-2);
  background: #eef4f7; border-radius: 50%;
  padding: .35rem .8rem; font-size: .76rem; text-align: center;
  color: var(--accent-2);
}
.empty .big { font-size: 2.5rem; margin-bottom: .5rem; }

/* 回頂部 */
.to-top {
  position: fixed; right: 1.5rem; bottom: 1.5rem;
  width: 3rem; height: 3rem; border-radius: 50%;
  background: var(--accent); color: #fff; border: none;
  font-size: 1.2rem; cursor: pointer; box-shadow: 0 4px 14px var(--shadow);
  opacity: 0; pointer-events: none; transition: opacity .25s;
  z-index: 60;
}
.to-top.show { opacity: 1; pointer-events: auto; }

/* 頁尾 */
.site-footer {
  background: var(--ink); color: #9aa0b0;
  text-align: center; padding: 2rem 1.5rem;
  font-size: .8rem; line-height: 1.8;
}
.site-footer strong { color: var(--gold); }

/* 手機 */
@media (max-width: 640px) {
  .stat-bar { gap: 1.4rem; }
  .controls-inner { gap: .6rem; }
  .search-box { order: 3; flex-basis: 100%; }
  .group-head { flex-wrap: wrap; }
  .group-head .g-meta { margin-left: 0; flex-basis: 100%; text-align: left; }
  .q-answer table { font-size: .78rem; }
  .q-answer pre, .code-block pre { font-size: .74rem; }
}

/* ===== 搜尋強化 / 跳轉面板（新增） ===== */
.search-box input { padding-right: 2.2rem; }
.search-clear {
  position: absolute; right: .35rem; top: 50%; transform: translateY(-50%);
  border: none; background: transparent; color: var(--ink-soft);
  font-size: 1.05rem; line-height: 1; cursor: pointer;
  padding: .25rem .45rem; border-radius: 50%; display: none;
}
.search-clear.show { display: block; }
.search-clear:hover { background: var(--paper-warm); }
.search-info {
  max-width: 1100px; margin: .55rem auto 0;
  font-size: .8rem; color: var(--ink-soft); display: none;
}
.search-info.show { display: block; }
.search-info b { color: var(--accent); }

      score: 25,
      question: `小華買了一台新的筆記型電腦，興奮地插上房間的網路線準備參加線上課程。這台電腦必須透過家中的路由器（Router）取得正確的網路參數才能連上網際網路。請回答下列問題：
㈠當小華的新電腦接上有線網路時，通常會透過路由器內建的那一種服務（協定）來自動取得 IP 位址？其目的為何？（15 分）
㈡若小華發現電腦右下角顯示「黃色驚嘆號」，檢查後發現 IP 位址竟是 169.254.1.5，且無法開啟網頁。請描述這代表電腦在與路由器溝通時發生了什麼問題？其理由為何？（10 分）`,
      answer: `**(一) 使用的服務：DHCP（Dynamic Host Configuration Protocol，動態主機設定協定）（15 分）**

家用路由器通常內建 **DHCP 伺服器**。電腦的網路設定若為「自動取得 IP 位址」，開機或接上網路線後就會以 DHCP 向路由器索取網路參數。DHCP 使用 **UDP**：伺服器端口 **67**、客戶端端口 **68**。

**運作流程（DORA 四步驟）**

\`\`\`htmldiagram
<div style="text-align:center"><svg viewBox="0 0 510 286" width="510" height="286" xmlns="http://www.w3.org/2000/svg" style="font-family:'Noto Sans TC',sans-serif;max-width:100%;min-width:640px;">

<text x="255.0" y="18" font-size="12.5" font-weight="700" text-anchor="middle" fill="#3d4456">DHCP 取得 IP 位址的四個步驟（DORA）</text>
<rect x="38" y="42" width="104" height="30" rx="5" fill="#1a1f2c"/>
<text x="90" y="62" font-size="12.5" font-weight="700" text-anchor="middle" fill="#fffdf8">小華的電腦</text>

<line x1="90" y1="100" x2="418" y2="100" stroke="#1a1f2c" stroke-width="1.8" marker-end="url(#sq-a)"/>
<text x="255.0" y="93" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1f2c" paint-order="stroke" stroke="#ece6d8" stroke-width="3">1. DHCPDISCOVER（廣播：誰能給我 IP？）</text>
<line x1="420" y1="144" x2="92" y2="144" stroke="#1a1f2c" stroke-width="1.8" marker-end="url(#sq-a)"/>

<line x1="90" y1="188" x2="418" y2="188" stroke="#1a1f2c" stroke-width="1.8" marker-end="url(#sq-a)"/>
<text x="255.0" y="181" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1f2c" paint-order="stroke" stroke="#ece6d8" stroke-width="3">3. DHCPREQUEST（我要使用這組設定）</text>
<line x1="420" y1="232" x2="92" y2="232" stroke="#1a1f2c" stroke-width="1.8" marker-end="url(#sq-a)"/>
<text x="255.0" y="225" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1f2c" paint-order="stroke" stroke="#ece6d8" stroke-width="3">4. DHCPACK（確認，開始租約）</text>

| 步驟 | 訊息 | 說明 |
|---|---|---|
| 1 | **Discover**（探索） | 新電腦還沒有 IP，以來源 0.0.0.0、目的 255.255.255.255 **廣播**，尋找 DHCP 伺服器 |
| 2 | **Offer**（提供） | 伺服器從位址池挑一個未使用的 IP，連同遮罩、預設閘道、DNS、租期一起提供給客戶端 |
| 3 | **Request**（請求） | 客戶端選定一個 Offer，**廣播**表示「我要用這一組」（若有多台 DHCP 伺服器，也讓其他伺服器知道不用保留給它） |
| 4 | **Acknowledge**（確認） | 伺服器確認，租約開始；客戶端才正式設定這個 IP |

**DHCP 的目的**

| 目的 | 說明 |
|---|---|
| **自動設定，免手動輸入** | 一次取得 **IP 位址、子網路遮罩、預設閘道（路由器）、DNS 伺服器**等所有必要參數，使用者不必懂網路設定 |
| **避免位址衝突** | 由伺服器統一管理位址池，不會把同一個 IP 給兩台設備 |
| **集中管理與有效利用位址** | 位址採**租約（lease）** 方式出租，設備離線後位址可被回收再利用，適合行動裝置經常進出的環境 |
| **便於變更網路設定** | 要更換 DNS 或閘道，只需在伺服器改一次 |

租約到一半（T1 = 50%）時，客戶端會向原伺服器單播續約。

**(二) 169.254.1.5 代表的問題（10 分）**

**169.254.0.0/16** 是**鏈路本地位址（Link-Local Address）**，Windows 稱為 **APIPA（Automatic Private IP Addressing，自動私有 IP 定址）**。

**代表的意思**：電腦的網路介面設定為自動取得（DHCP），但是送出 **DHCPDISCOVER 之後，沒有收到任何 DHCPOFFER／DHCPACK**，於是作業系統**自己**在 169.254.0.0/16 中隨機挑一個位址（並以 ARP 檢查沒有人使用），讓同一個區域網路內的設備仍然可以互相通訊。

**理由與可能原因**

| 原因 | 說明 |
|---|---|
| 路由器的 DHCP 服務**沒有啟用或當機** | 沒有人回應 Discover |
| **位址池已用完** | 沒有可分配的 IP，伺服器不回應 Offer |
| 實體連線問題 | 網路線鬆脫、孔位或交換器故障，使廣播封包到不了路由器 |
| 防火牆、VLAN、MAC 過濾 | 路由器或交換器擋住了 DHCP 封包或這台電腦的 MAC |
| 驅動程式或網卡問題 | 網卡無法正常收發 |

**為什麼無法開啟網頁**

| 缺少的參數 | 影響 |
|---|---|
| 沒有**預設閘道** | 封包只能送到同一個鏈路上的設備，**無法離開本地網路**到網際網路；路由器也不會轉送來自 169.254 位址的封包（此範圍不可路由） |
| 沒有 **DNS 伺服器** | 無法把網域名稱解析成 IP |
| IP 位址與路由器（如 192.168.1.x）**不在同一個子網路** | 與路由器不能互相通訊 |

**排除方法**：檢查網路線與孔位；重新啟動路由器；確認路由器 DHCP 已啟用、位址池未滿；在電腦執行 \`ipconfig /release\`、\`ipconfig /renew\`（Linux 用 \`dhclient\`）重新向 DHCP 要位址；必要時暫時手動設定固定 IP 驗證。`

| 元件 | 全名 | 作用 |
|---|---|---|
| **MSC** | 移動交換中心 | 行動網路的**交換核心**：負責**呼叫的建立、路由與轉接**（行動網路內及與固網 PSTN 之間）、**換手（handover）** 的控制、計費資料蒐集，並與 VLR、HLR 配合處理**位置管理**與簡訊 |
| **HLR** | 本籍註冊資料庫 | 儲存**每位用戶的永久資料**（用戶識別 IMSI、電話號碼、申請的服務、計費資料）以及**目前所在位置（目前由哪個 VLR／MSC 服務）**；收到來電時用來**找到用戶現在在哪裡** |
| **VLR** | 客籍註冊資料庫 | 暫存**目前在某個 MSC 服務範圍內的所有用戶**（含漫遊進來的）的資料：從 HLR 複製來的用戶資料、目前所在的**位置區（LA）**、臨時識別碼 TMSI；用戶離開後資料就刪除。讓 MSC 不必每次都問遠方的 HLR |

**簡單的區分**：HLR 管「**你是誰、現在在哪**」（永久資料＋最新位置）；VLR 管「**目前在我這裡的人**」（暫時資料）；AUC 管「**你是不是本人**」（驗證）；EIR 管「**你的手機合不合法**」（設備）；MSC 管「**電話怎麼接**」（交換）。

**(二) 手機移動到註冊區域之外：漫遊與位置更新（Location Update）（15 分）**

小明的 HLR 在**本籍地**；出差到其他城市（另一個位置區／MSC 範圍）後，手機會自動做**位置更新**，網路才知道他在哪，來電與通話才能繼續。

| 步驟 | 手機（MS）與基地台（BS）及網路的動作 |
|---|---|
| **1. 偵測到換區** | 手機持續監聽當地基地台廣播的**廣播控制通道（BCCH）**，其中帶有**位置區識別碼（LAI）**。發現 LAI 與自己儲存的不同，表示**進入新的位置區** |
| **2. 要求通道並送出位置更新請求** | 手機先透過隨機存取通道向基地台要求**專用通道**，再送出 **Location Update Request**，內含自己的識別（原 TMSI 或 IMSI）以及**舊的 LAI**；基地台（BS／BSC）把請求轉給當地的 **MSC／VLR** |
| **3. 取得用戶資料** | 新的 VLR 無法識別這位用戶，就依 IMSI **向 HLR 查詢**：取得用戶的**服務資料（Profile）**；如果是舊 VLR 仍保有資料，也可向舊 VLR 取得 |
| **4. 身分驗證** | HLR／AUC 產生**驗證三元組**交給 VLR；VLR 送出 **RAND（挑戰亂數）** 給手機；手機用 SIM 卡內的 Ki 與演算法算出 **SRES** 回傳；VLR 比對相同才通過（**Ki 從不在空中傳送**） |
| **5. 設備檢查（選用）** | MSC 向 **EIR** 查詢手機的 **IMEI**，確認不在黑名單 |
| **6. 啟用加密** | 依 Kc 對空中介面的通話加密 |
| **7. 更新位置** | VLR 建立小明的**暫時紀錄**並指定新的 **TMSI**；VLR 通知 **HLR**：「他目前在我這個 VLR／MSC」，HLR **更新位置資訊**，並通知**舊的 VLR 刪除**舊紀錄 |
| **8. 回覆完成** | VLR／MSC 送 **Location Update Accept**（含新的 TMSI）給手機；手機儲存新的 TMSI 與新的 LAI。此後待機時會**定期位置更新** |

| 情況 | 做法 |
|---|---|
| **別人打給小明** | 來電先到小明**本籍的 GMSC**，向 **HLR** 查詢 ⇒ HLR 向現在服務他的 **VLR** 取得**漫遊號碼（MSRN）** ⇒ 依 MSRN 把電話**路由到當地 MSC** ⇒ MSC 在位置區內**傳呼（paging）** 小明 ⇒ 手機回應後建立通話 |
| **小明打出去** | 直接由當地 MSC 處理，經 VLR 確認他是合法漫遊用戶即可 |
| **通話中移動** | 由 MSC 控制**換手（handover）**，在基地台之間無縫切換 |

**重點**：漫遊的關鍵是 **HLR 永遠知道「小明現在歸哪個 VLR 管」**，VLR 暫存資料，而 AUC／EIR 負責驗證用戶與設備。`

**(二) 保證的三大特性（15 分）**

驗證通過時，保證了：

| 特性 | 英文 | 為什麼能保證（原因） |
|---|---|---|
| **完整性** | Integrity | 雜湊函數具有**雪崩效應與抗碰撞性**：文件只要被改動**任何一個位元**，計算出的摘要 H1 就會完全不同，與簽章還原的 H2 對不上。所以 H1 = H2 代表**文件在傳送過程中沒有被竄改** |
| **鑑別性（身分驗證）** | Authentication | 簽章是用**小明的私鑰**產生的，而**私鑰只有小明持有**。能用**小明的公鑰**成功解開並得到正確摘要，就證明這個簽章**確實由持有私鑰的小明產生**，可以確認寄件者身分 |
| **不可否認性（不可抵賴）** | Non-repudiation | 只有小明有私鑰，**別人無法偽造**他的簽章；因此小明事後**無法否認**自己簽過這份文件，小美可以拿「文件＋簽章＋公鑰憑證」向第三方證明 |

**不保證什麼：機密性（Confidentiality）**

- 原始文件是以**明文**寄出，任何人攔截都能讀到內容；數位簽章**只證明「是誰簽的」與「有沒有被改」，不隱藏內容**。
- 若需要保密，要**另外加密文件**：例如先用小美的公鑰（或對稱的會談金鑰）加密整份文件。

| **保密傳輸** | 接收者的**公鑰** | 接收者的**私鑰** |

另外，驗證過程仍要確認**公鑰屬於小明本人**（透過 CA 簽發的憑證），否則攻擊者可以拿自己的金鑰對冒充小明。`

      question: `小明正在使用有線網路觀看高畫質串流影片。為了確保影片檔案在傳輸過程中不會因為網路訊號干擾而出現畫面破損或缺漏，播放軟體採用了 TCP（傳輸控制協定）。請回答下列問題：

      answer: `**(一) 三向交握（15 分）**

TCP 是**連線導向**協定，資料傳送前要先建立連線。

\`\`\`htmldiagram
<svg viewBox="0 0 520 286" width="520" height="286" xmlns="http://www.w3.org/2000/svg" style="font-family:'Noto Sans TC',sans-serif;max-width:100%;min-width:660px;">

<text x="260.0" y="18" font-size="12.5" font-weight="700" text-anchor="middle" fill="#3d4456">TCP 三向交握（Three-way Handshake）</text>
<rect x="38" y="42" width="104" height="30" rx="5" fill="#1a1f2c"/>
<text x="90" y="62" font-size="12.5" font-weight="700" text-anchor="middle" fill="#fffdf8">客戶端（小明）</text>
<line x1="90" y1="72" x2="90" y2="276" stroke="#8a8f9c" stroke-width="1.4" stroke-dasharray="5,4"/>
<rect x="378" y="42" width="104" height="30" rx="5" fill="#1a1f2c"/>
<text x="430" y="62" font-size="12.5" font-weight="700" text-anchor="middle" fill="#fffdf8">串流伺服器</text>
<line x1="430" y1="72" x2="430" y2="276" stroke="#8a8f9c" stroke-width="1.4" stroke-dasharray="5,4"/>
<line x1="90" y1="100" x2="428" y2="100" stroke="#1a1f2c" stroke-width="1.8" marker-end="url(#sq-a)"/>
<text x="260.0" y="93" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1f2c" paint-order="stroke" stroke="#ece6d8" stroke-width="3">1. SYN（seq = x）</text>
<line x1="430" y1="144" x2="92" y2="144" stroke="#1a1f2c" stroke-width="1.8" marker-end="url(#sq-a)"/>
<text x="260.0" y="137" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1f2c" paint-order="stroke" stroke="#ece6d8" stroke-width="3">2. SYN + ACK（seq = y, ack = x + 1）</text>
<line x1="90" y1="188" x2="428" y2="188" stroke="#1a1f2c" stroke-width="1.8" marker-end="url(#sq-a)"/>
<text x="260.0" y="181" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1f2c" paint-order="stroke" stroke="#ece6d8" stroke-width="3">3. ACK（seq = x + 1, ack = y + 1）</text>
<line x1="90" y1="232" x2="428" y2="232" stroke="#1a1f2c" stroke-width="1.8" marker-end="url(#sq-a)"/>
<text x="260.0" y="225" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1f2c" paint-order="stroke" stroke="#ece6d8" stroke-width="3">4. （連線建立，開始傳送資料）</text>
</svg>
\`\`\`

| 步驟 | 方向 | 標頭旗標與內容 | 說明 |
|---|---|---|---|
| **1. SYN** | 客戶端 → 伺服器 | **SYN = 1**，初始序號 **seq = x**（隨機） | 客戶端說：「我想連線，我的起始序號是 x」；進入 SYN-SENT 狀態 |
| **2. SYN + ACK** | 伺服器 → 客戶端 | **SYN = 1、ACK = 1**，**seq = y**（伺服器的初始序號），**ack = x + 1** | 伺服器說：「我收到你的 x 了（期待 x + 1），我的起始序號是 y」；進入 SYN-RECEIVED |
| **3. ACK** | 客戶端 → 伺服器 | **ACK = 1**，seq = x + 1，**ack = y + 1** | 客戶端說：「我也收到你的 y 了」；雙方進入 **ESTABLISHED**，可以開始傳資料（第三個封包本身也可以帶資料） |

**目的**

| 目的 | 說明 |
|---|---|
| **確認雙方都能收、能送** | 第 1 步證明客戶端能送；第 2 步證明伺服器能收且能送；第 3 步證明客戶端能收。**只有三次**才能同時驗證**雙向**通道都通 |
| **同步（協商）初始序號** | 雙方各自選定自己的**初始序號（ISN）** 並讓對方知道，之後的序號與確認號才有共同的基準，才能**可靠、依序**傳送與偵測遺失 |
| **協商連線參數** | 交換**最大區段大小（MSS）、視窗縮放、SACK 支援、時間戳**等 TCP 選項，並通告接收視窗（流量控制） |
| **避免舊的重複封包造成誤連線** | 隨機的初始序號與雙方確認，可以辨識並丟棄網路中延遲到達的舊封包 |
| **配置資源** | 伺服器在確認客戶端真的存在後，才配置連線資源（緩衝區等） |

**為什麼不是兩次？** 只有兩次的話，伺服器**不知道客戶端是否收到自己的 SYN + ACK**，也無法確認舊的（延遲的）SYN 請求是否已失效，會造成誤建連線並浪費資源。（SYN 洪水攻擊就是利用「伺服器等不到第三步」而耗盡半開連線資源。）

**(二) 資料遺失，傳送端逾時沒收到 ACK（10 分）**

TCP 提供**可靠傳輸**：每送出一個資料段，傳送端就**啟動重傳計時器（RTO，Retransmission Timeout）**，在收到對應的 ACK 之前會保留該資料段的副本。

**傳送端的動作**

| 動作 | 說明 |
|---|---|
| **1. 逾時（Timeout）重傳** | 計時器**到期仍沒收到 ACK**，傳送端判定該資料段**遺失（或 ACK 遺失）**，**重新傳送**那個資料段（只重傳最早未被確認的那一個，通常是從該序號開始） |
| **2. 計時器加倍（指數退避）** | 重傳後把 **RTO 加倍**（如 1 s → 2 s → 4 s），避免網路已經壅塞時還連續猛送 |
| **3. 降低傳送速率（壅塞控制）** | 因為逾時被視為壅塞的訊號：把 **ssthresh 設為目前 cwnd 的一半**，並把 **cwnd 重設為 1 個 MSS**，重新進入**慢啟動（slow start）**，之後再逐步增加 |
| **4. 持續重傳直到成功或放棄** | 收到 ACK 即確認；若重傳多次（如 15 次）仍失敗，才通知應用程式連線失敗 |

**另一種更快的偵測：快速重傳（Fast Retransmit）**：若接收端收到後面的資料段，會對**同一個序號重複送 ACK（重複 ACK）**。傳送端收到 **3 個重複 ACK** 就**不等逾時**，立即重傳遺失的資料段，並進行快速恢復（cwnd 減半而不是歸 1）。

**目的**

| 目的 | 說明 |
|---|---|
| **確保資料不遺失（可靠傳輸）** | 影片資料因干擾而遺失，TCP 靠**重傳**補回，使接收端最後取得**完整、正確**的資料，畫面才不會缺漏、破損 |
| **確保依序交付** | 接收端依序號排序，缺少的片段補齊後才交給應用程式 |
| **避免加重壅塞** | 以退避與降速避免繼續灌爆已經有問題的網路，保持整體網路穩定 |

**補充**：串流影片若對延遲很敏感，TCP 的重傳會造成**緩衝與延遲**，因此即時影音（直播、視訊會議）常改用 UDP（加上應用層的容錯機制）；但「高畫質影片檔案觀看」可先緩衝，TCP 的可靠性更重要。`

      answer: `**(一) 客戶端的處理：延遲確認（Delayed ACK）（15 分）**

**判斷事件類型**：預期的序號是 3001，收到的封包序號**剛好是 3001**，所以是**按順序到達（in-order）** 的資料；而且**上一個封包已經確認過**，沒有任何缺口。依 RFC 1122／RFC 5681 的 ACK 產生規則，這是「**按序到達，所有先前的資料都已確認**」的情況。

| 項目 | 處理 |
|---|---|
| **資料處理** | 把這 400 bytes 放入接收緩衝區並交給應用層；**下一個預期序號更新為 3001 + 400 = 3401** |
| **ACK 的處理** | **不立即回傳 ACK**，而是**延遲確認**：啟動一個延遲 ACK 計時器（**最多等 500 ms**，常見實作為 40 ms～200 ms），等待是否有下一個按序的封包到達 |
| **等待期間的兩種結果** | ① **又收到下一個按序封包**（序號 3401）⇒ **立即送出一個累積 ACK（ack = 3801 或更高，視第二個封包大小）**，同時確認兩個封包；② **計時器到期仍沒有新封包** ⇒ **送出 ACK，確認號 = 3401** |

**為什麼這樣做**

| 理由 | 說明 |
|---|---|
| **減少 ACK 流量與處理負擔** | 每收到一個封包就回一個 ACK 會使網路上多出大量小封包；延遲確認把**兩個封包只回一個 ACK**，降低約一半的 ACK 數量 |
| **有機會「搭便車」（piggyback）** | 如果在等待期間客戶端剛好有資料要回傳，可以把 ACK **放在資料封包的標頭**一起送出，不必單獨送 ACK |
| **不能延遲太久** | 延遲上限避免傳送端的重傳計時器逾時而**誤判封包遺失**，也避免拖慢傳送端的視窗成長；規定**每收到兩個全尺寸封包至少要確認一次** |
| **本題的情況：沒有資料要回傳** | 不能搭便車，所以等到第二個封包到達或計時器逾時，再送出**純 ACK** |

**對照：不同事件的 ACK 規則**

| 事件 | 接收端動作 |
|---|---|
| 按序到達、先前已確認（**本題**） | **延遲 ACK**（最多等 500 ms） |
| 按序到達、前一個按序封包的 ACK 正在延遲 | **立即送累積 ACK**（一次確認兩個） |
| 收到**亂序**的封包（序號比預期大，出現缺口） | **立即送重複 ACK**（確認號仍是缺口的序號），協助傳送端快速偵測遺失 |
| 收到**填補缺口**的封包 | **立即送 ACK**，確認號跳到新的連續位置 |

**(二) cwnd 與 rwnd 的動態調整機制（10 分）**

傳送端實際能送出的**未確認資料量**不得超過：

> **LastByteSent − LastByteAcked ≤ min( cwnd , rwnd )**

**① rwnd（接收視窗，Receiver Window）—— 流量控制（Flow Control）**

目的：**不要讓傳送端送得比接收端處理得快**，避免接收端的緩衝區溢位。

| 機制 | 說明 |
|---|---|
| **由接收端決定、放在 TCP 標頭的「視窗」欄位（16 位元，可用視窗縮放選項放大）** | 接收端在**每個 ACK**中告知傳送端：**我的緩衝區還剩多少空間** |
| 計算方式 | **rwnd = RcvBuffer − (LastByteRcvd − LastByteRead)**（緩衝區總大小減去「已收到但應用程式還沒讀走」的資料量） |
| 動態變化 | 應用程式讀得慢 ⇒ 緩衝區變滿 ⇒ rwnd 變小；讀得快 ⇒ rwnd 變大。傳送端依最新的 rwnd 調整送出量（滑動視窗） |
| rwnd = 0 | 傳送端**停止傳送**，並定期送出 **1 byte 的零視窗探測（window probe）**，等接收端有空間後再通告新的視窗，避免死結 |

**② cwnd（壅塞視窗，Congestion Window）—— 壅塞控制（Congestion Control）**

目的：**不要讓傳送端把網路（路由器的緩衝區）灌爆**。cwnd 由**傳送端自行根據網路狀況**調整（不在標頭中傳送），透過 **AIMD** 與三個階段：

| 階段 | 條件 | cwnd 的變化 |
|---|---|---|
| **慢啟動（Slow Start）** | 連線剛開始，或逾時後；cwnd < ssthresh | 從 **1 MSS** 開始，**每收到一個 ACK 就加 1 MSS**，即每個 RTT **加倍**（指數成長）：1 → 2 → 4 → 8… |
| **壅塞避免（Congestion Avoidance）** | cwnd ≥ ssthresh（慢啟動門檻） | **每個 RTT 加 1 MSS**（線性成長，加法增加 Additive Increase） |
| **偵測到遺失 — 3 個重複 ACK** | 輕度壅塞（封包仍有流動） | **快速重傳**，**ssthresh = cwnd / 2，cwnd = ssthresh（＋3 MSS）**，進入**快速恢復**（乘法減少 Multiplicative Decrease） |
| **偵測到遺失 — 逾時（Timeout）** | 嚴重壅塞 | **ssthresh = cwnd / 2，cwnd 重設為 1 MSS**，**重新慢啟動** |

這種「**慢慢加、遇到問題立刻減半**」的策略稱為 **AIMD（加法增加、乘法減少）**，使多條連線能公平共用頻寬，並讓網路負載維持在接近容量但不崩潰的程度。

**③ 兩者比較**

| 比較項目 | rwnd（流量控制） | cwnd（壅塞控制） |
|---|---|---|
| 保護的對象 | **接收端**的緩衝區 | **網路**（路由器、鏈路） |
| 由誰決定 | **接收端**（放在 ACK 標頭中通告） | **傳送端**（依 ACK 與遺失事件推測） |
| 調整依據 | 接收緩衝區剩餘空間 | ACK 到達、重複 ACK、逾時（遺失訊號） |
| 傳送上限 | 兩者取**較小者**：min(cwnd, rwnd) | |`

      answer: `**(一) 媒介存取控制（MAC）協定比較（15 分）**

| 比較項目 | **WiFi（IEEE 802.11）** | **藍牙（Bluetooth，IEEE 802.15.1）** |
|---|---|---|
| **MAC 協定** | **CSMA/CA**（載波偵測多重存取／碰撞避免），即 **DCF（分散式協調功能）**；**競爭式（contention-based）**、分散式 | **主從式輪詢＋分時多工（TDD/TDMA）**；**無競爭**、集中式（由主裝置排程） |
| **控制方式** | 每個裝置**自行偵測**頻道，沒人使用才傳送；沒有中央排程 | **主裝置（Master）**決定誰何時傳送；從裝置（Slave）**被輪詢才能傳** |
| **時間結構** | 不分固定時槽 | 固定**時槽（slot，625 微秒）**：主裝置在**偶數時槽**傳送，從裝置在**奇數時槽**回應 |
| **跳頻** | 固定頻道（2.4 GHz 或 5 GHz 的一個頻道） | **跳頻展頻（FHSS）**：每秒約 1600 次在 79 個頻道間跳換，抗干擾 |
| **網路組成** | 基礎架構（AP＋用戶端）、Ad hoc | **微網（Piconet）**：1 個主裝置＋最多 7 個活躍從裝置 |
| **典型範圍與速率** | 數十公尺；數十 Mbps ～ Gbps | 約 10 公尺（Class 2）；1～3 Mbps（Classic），低功耗版數百 Kbps |

**WiFi 的基本運作（CSMA/CA）**

| 步驟 | 說明 |
|---|---|
| 1. **載波偵測** | 傳送前先**聽**頻道；若**閒置達 DIFS 時間**，就可傳送；若忙碌就**等待** |
| 2. **隨機退避（Backoff）** | 頻道忙過之後，從**競爭視窗**中隨機選一個退避值，**頻道閒置時倒數**；倒數到 0 才傳送，避免多個站同時開始而碰撞 |
| 3. **傳送資料** | 傳送完整訊框 |
| 4. **等待 ACK** | 接收端成功收到後，等 **SIFS** 就回傳 **ACK**；**沒收到 ACK** 就當作碰撞，**競爭視窗加倍**後重新退避、重傳 |
| 5. **（選用）RTS/CTS** | 傳送端先送 **RTS**，接收端回 **CTS**，周圍聽到的站設定 **NAV（網路配置向量）** 暫時不傳，解決**隱藏節點問題** |

**為什麼是「碰撞避免」而不是「碰撞偵測」**：無線電在傳送時**無法同時聽（自己的訊號太強），無法偵測碰撞**，所以只能**事先避免**，並以 ACK 確認。

**藍牙的基本運作**：主裝置依時槽輪流與各從裝置通訊：主裝置在偶數時槽發送給某個從裝置，被指定的從裝置在**緊接的奇數時槽**回應；沒有被點名的從裝置不可傳送，所以**不會碰撞**。

**半雙工或全雙工：兩者都是半雙工（Half Duplex）**

| 協定 | 理由 |
|---|---|
| **WiFi** | 同一個**射頻頻道**上，**同一時間只能傳或收其中之一**（傳送時自己的訊號會淹沒接收）；CSMA/CA 的「先聽再傳」、收到後才回 ACK，都是**輪流**使用頻道 |
| **藍牙** | 採**分時雙工（TDD）**：主裝置與從裝置在**不同時槽**輪流收發，同一時刻只有一方在傳。雖然切換很快、使用上像雙向通話，**物理上仍是半雙工** |

（全雙工需要**同時傳與收**，例如乙太網路的雙絞線有獨立的傳送對與接收對；無線通訊要做到全雙工，需要特殊的自我干擾消除技術，一般 WiFi 與藍牙並不使用。）

**(二) 提供有時限（time-bounded）服務的機制（10 分）**

**有時限服務**：如語音、視訊，要求資料在**一定時間內送達**，抖動小；CSMA/CA 的隨機退避**不保證延遲**，所以需要額外機制。

**WiFi**

| 機制 | 運作方式 |
|---|---|
| **PCF（Point Coordination Function，點協調功能）** | 由 **AP 擔任協調者**，把時間分成「**無競爭期（CFP）**」與「競爭期（CP）」。在無競爭期，AP **輪詢（polling）** 各站，被輪詢的站才能傳送；因為不用競爭，**延遲可預測**。AP 以 **PIFS（比 DIFS 短）**取得優先權，插在一般競爭站之前 |
| **802.11e／WMM（QoS 增強）** | **EDCA**：把流量分成**四種存取類別（語音 AC_VO、視訊 AC_VI、盡力 AC_BE、背景 AC_BK）**，高優先類別有**較短的 AIFS 與較小的競爭視窗**，更容易搶到頻道；**HCCA**：AP 依流量規格（TSPEC）配置**保證的傳輸機會（TXOP）**，類似預約 |

**藍牙**

| 機制 | 運作方式 |
|---|---|
| **SCO（Synchronous Connection-Oriented）連結** | 主裝置與從裝置之間**預先保留固定的週期性時槽**（例如每 2、4 或 6 個時槽保留一對），專供**語音**使用；**不重傳**，延遲固定、可預測 |
| **eSCO（延伸 SCO）** | 在保留時槽之外，**多一個重傳窗口**，提高可靠度，仍維持時限 |
| **ACL（Asynchronous Connection-Less）** | 資料用的**非同步連結**，盡力而為、可重傳，**不保證時限** |

**比較**：WiFi 是**競爭式為主**，靠 PCF 輪詢或 EDCA 優先權來**改善**時限；藍牙因為本來就是**主裝置排時槽**，只要**預留時槽（SCO）** 就能提供**固定延遲**的服務，語音通話特別適合。`

**NAT 的運作**：內部主機 192.168.1.10 從埠 5000 送封包，NAT 路由器把**來源位址與埠**改寫為 (198.51.100.1, 62001)，並在**對照表**記錄「192.168.1.10:5000 ↔ 198.51.100.1:62001」；回應封包回來時，依對照表**把目的位址與埠改回** 192.168.1.10:5000，轉交給內部主機。

**ARP 的運作**：主機 A 要送封包給同網段的 B（已知 IP）。A **廣播 ARP 請求**（「IP 192.168.1.20 是誰？請告訴我你的 MAC」），B 以**單播 ARP 回應**自己的 MAC；A 將對應存入 **ARP 快取**，之後直接用 MAC 傳送。若目的在**不同網段**，A 查詢的是**預設閘道（路由器）的 MAC**。

**關係**：**IP 位址用來跨網路尋址，MAC 位址用來在同一鏈路上實際遞送**；ARP 負責兩者在**區域網路內**的對應，NAT 則在**網路邊界**重寫 IP 位址。

**運作方式**

| 項目 | **封包過濾防火牆（Packet Filter）** | **代理人防火牆（Proxy／應用層閘道 Application Gateway）** |
|---|---|---|
| **運作層次** | **網路層與傳輸層**（OSI 第 3、4 層） | **應用層**（第 7 層），針對特定應用協定（HTTP、FTP、SMTP…） |
| **檢查內容** | 檢查**每個封包的標頭**：來源／目的 IP、**埠號**、協定（TCP/UDP/ICMP）、TCP 旗標；依**規則表（ACL）** 決定**允許或丟棄**（進階的「狀態檢測」會記錄連線狀態） | 檢查**應用層的內容**：URL、指令、檔案類型、使用者帳號、資料內容 |
| **連線方式** | **直接轉送**封包，內外主機之間**維持一條端到端的連線**（防火牆不終止連線） | **終止並重建連線**：內部用戶端先連到代理人，代理人**代替**用戶端向外部伺服器發出**另一條新的連線**；外部**看不到內部主機**，只看到代理人 |
| **典型位置** | 邊界路由器、硬體防火牆 | 專用的代理伺服器（Squid、郵件閘道、WAF 反向代理） |

\`\`\`
封包過濾：  內部主機 ──────[ 檢查標頭 ]────── 外部伺服器    （單一端到端連線）
代理人：    內部主機 ─── 連線 1 ───[ 代理人（檢查內容）]─── 連線 2 ─── 外部伺服器
\`\`\`

**優缺點**

| | **優點** | **缺點** |
|---|---|---|
| **封包過濾** | ① **速度快、效能高**（只看標頭，處理量大）；② **成本低**，路由器內建；③ 對使用者**透明**，不需修改設定；④ 適合大流量的邊界 | ① **只看標頭，不看內容**，無法偵測應用層的攻擊（如惡意檔案、SQL 注入）；② 規則複雜時**難以管理**，容易設定錯誤；③ 以 IP 與埠為準，**可被偽造 IP（欺騙）或利用動態埠繞過**；④ 缺乏使用者層級的認證與詳細的紀錄 |
| **代理人** | ① **安全性高**：能檢查**應用層內容**、過濾惡意程式與網址、阻擋特定指令；② **隱藏內部網路**，外部無法直接接觸內部主機；③ 可做**使用者認證與詳細日誌**；④ 可**快取**內容（如網頁快取）降低頻寬 | ① **速度較慢、效能瓶頸**：每條連線要處理兩次，需要大量運算與記憶體；② **每種應用協定都需要專屬的代理程式**，支援的服務有限；③ 需要在用戶端**設定使用代理**（非透明模式），較複雜；④ 代理人本身成為**單點故障與攻擊目標** |

**選用建議**：兩者常**搭配使用**——前方以**封包過濾（含狀態檢測）** 擋掉大量明顯不合法的流量，後方再以**代理人**對關鍵服務（網頁、郵件）做深度檢查（縱深防禦）。新一代防火牆（NGFW）則把狀態檢測、應用層辨識與入侵防禦整合在一起。`

      answer: `**(一) 設定子網路遮罩（subnet mask）的目的（5 分）**

IP 位址由「**網路部分**」與「**主機部分**」組成。子網路遮罩是一個 32 位元的數，**1 的位元對應網路部分、0 的位元對應主機部分**。目的：

| 目的 | 說明 |
|---|---|
| **區分網路位址與主機位址** | 把 IP 與遮罩做**位元 AND**，得到**網路位址**，知道這個 IP 屬於哪一個網路 |
| **判斷目的主機是否在同一個網路** | 主機把「自己的 IP AND 遮罩」與「目的 IP AND 遮罩」比較：相同 ⇒ 同網段，直接以 ARP／廣播傳送；不同 ⇒ 送給**預設閘道（路由器）** 轉送 |
| **切割（子網路化）網路** | 向主機部分**借位元**當作子網路位元，把大網段切成多個小網段，**分給不同部門**，限制廣播範圍、提高管理與安全性 |
| **決定網路與主機的數量** | 遮罩越長，網路越小（每個網路的主機數越少） |

**(二) /23 網段共有多少可使用的 IP 位址（5 分）**

> /23：主機部分有 32 − 23 = **9 個位元**
> 總位址數 = 2⁹ = **512 個**
> **可使用（可指派給主機）的位址 = 512 − 2 = 510 個**（扣除**網路位址**（主機位元全 0）與**廣播位址**（主機位元全 1））

**(三) /23 的子網路遮罩（5 分）**

23 個 1 接著 9 個 0：

> 11111111.11111111.**1111111**0.00000000 = **255.255.254.0**

**(四) 切成 8 個子網路後的遮罩（5 分）**

8 = 2³ ⇒ 需向主機部分**借 3 個位元**當子網路位元：

> 新的前綴長度 = 23 + 3 = **/26**
> 11111111.11111111.11111111.**11**000000 = **255.255.255.192**

**(五) 各子網路可使用的 IP 位址數（5 分）**

> 每個子網路的主機位元 = 32 − 26 = **6 位元**
> 總位址 = 2⁶ = **64 個**
> **可使用位址 = 64 − 2 = 62 個**

**驗證與子網路列表**（假設 /23 的網路位址為 W.X.Y.0，Y 為偶數）：

| 項目 | 結果 |
|---|---|
| 8 個子網路 × 64 個位址 | = 512，剛好等於 /23 的全部位址 ✓ |

      score: 25,
      question: `DNS cache poisoning 或稱 DNS spoofing，是污染 DNS 伺服器資料，導致 DNS 查詢回傳錯誤 IP 資訊給客戶端。請說明此種攻擊之攻擊原理與防範方法。（25 分）`,
      answer: `**(一) 背景：DNS 與快取**

**DNS** 把網域名稱（如 www.bank.com）解析成 IP 位址。為了加快回應，**遞迴 DNS 伺服器（如 ISP 的 DNS）會把查詢結果存入快取**，在 **TTL** 期間內，所有向它查詢的用戶都直接得到快取的答案。傳統的 DNS 使用 **UDP（埠 53）**、**沒有身分驗證**，接收者只用幾個欄位判斷回應是否可信。

**(二) 攻擊原理**

| **3. 猜中即成功** | 傳統上 TXID 只有 16 位元（65,536 種）、來源埠固定，攻擊者**發送大量猜測**很容易猜中（**生日攻擊**；**Kaminsky 攻擊**更是用大量不存在的子網域一再重試，並在回應中夾帶**附加紀錄（Additional／Glue）** 污染整個網域的 NS 紀錄） |
| **4. 污染快取** | 伺服器接受偽造回應，把錯誤的 (網域, IP) 存入**快取**；真正的回應晚到而被丟棄 |
| **5. 擴大受害** | 在 TTL 內，所有用戶（甚至整個 ISP）的查詢都得到錯誤的 IP |

**其他污染途徑**：入侵 DNS 伺服器或域名註冊商帳號、修改用戶端的 hosts 檔或路由器 DNS 設定（**DNS 劫持**）、**中間人攻擊（MITM）**直接竄改回應、**ARP 欺騙**後攔截 DNS 查詢。

**危害**：釣魚詐騙（網址正確卻連到假網站）、竊取帳密與個資、散播惡意軟體、流量竊聽、阻斷服務。

| 層面 | 防範措施 | 說明 |
|---|---|---|
| **協定驗證（最根本）** | **DNSSEC（DNS 安全擴充）** | 權威伺服器以**數位簽章**簽署 DNS 紀錄（RRSIG、DNSKEY、DS 形成信任鏈）；遞迴伺服器**驗證簽章**，偽造的紀錄沒有有效簽章就被拒絕 |
| **增加偽造難度** | **隨機化 TXID 與來源埠（Source Port Randomization）** | 讓攻擊者要猜的空間從 2¹⁶ 擴大到約 2³² 甚至更大，大幅降低成功機率 |
| | **0x20 編碼**（隨機大小寫查詢名稱） | 回應必須回傳相同的大小寫組合，再多增加幾位元的熵 |
| | **DNS Cookies**（RFC 7873） | 以伺服器 Cookie 驗證回應來源 |
| **伺服器設定** | 只快取**屬於該區域（bailiwick）內的紀錄**，**忽略回應中不相關的附加紀錄** | 阻擋 Kaminsky 夾帶的污染紀錄 |
| | **限制遞迴查詢**只服務內部用戶（避免成為開放解析器） | 減少被利用的機會 |
| | 及時**修補**軟體（BIND、Unbound、Windows DNS） | 修正已知弱點 |
| **加密傳輸** | **DNS over TLS（DoT）／DNS over HTTPS（DoH）** | 保護**用戶端到遞迴伺服器**之間，避免中途被竄改與竊聽 |
| **架構與管理** | **分離 DNS（Split DNS）**、對外與對內伺服器分開；重要網域設定**較短的 TTL** 以縮短污染影響；**監控與異常偵測**（DNS 回應不符、大量失敗查詢）；**防火牆過濾**偽造來源位址的封包（BCP 38 入口過濾） | 縮小攻擊面並盡快發現 |
| **用戶端** | 使用可信任的 DNS（企業 DNS、公共 DNS）；**瀏覽器以 HTTPS 驗證憑證**——即使 DNS 被污染，連到假網站時**憑證不符**會出現警告；**勿忽略憑證警告**；定期檢查路由器的 DNS 設定、更換預設密碼 | 最後一道防線 |

**重點整理**：攻擊成功依賴「**DNS 回應沒有驗證**」。最完整的防範是 **DNSSEC**（驗證資料來源與完整性）；在尚未全面部署前，以**隨機化 TXID 與埠號**、限制快取範圍、加密傳輸與 HTTPS 憑證驗證多層防禦。`

      title: "距離向量（distance vector）路由演算法與 RIP 的基本運作原理",
      score: 25,
      question: `路由是網路傳輸中重要的服務，路由通訊協定乃用於決定資料如何傳輸至目的端。RIP（Routing Information Protocol）是屬於距離向量（distance vector）的路由演算法。請說明距離向量路由演算法和 RIP 之基本運作原理。（25 分）`,
      answer: `**(一) 距離向量路由演算法**

**基本想法**：每個路由器只知道「**到每個目的網路的距離（成本）與下一跳**」，並**定期把自己的整個距離向量（路由表摘要）告訴直接相鄰的鄰居**；每個路由器用鄰居的資訊，以**貝爾曼—福特（Bellman-Ford）方程式**更新自己的路由表。

> **D_x(y) = min over 鄰居 v { c(x, v) + D_v(y) }**
> 意思：x 到 y 的最短距離，等於「**到某鄰居 v 的距離 c(x, v)**」加上「**v 到 y 的距離**」，在所有鄰居中取最小者。

**演算法特性**

| 特性 | 說明 |
|---|---|
| **分散式** | 每個路由器各自計算，沒有人知道全網的拓撲 |
| **反覆式、非同步** | 重複「收到鄰居的向量 → 重新計算 → 若自己的向量改變就通知鄰居」，直到收斂 |
| **只和鄰居交換資訊**，訊息少 | 但收斂較慢 |
| **「閒話傳播」（routing by rumor）** | 路由器只相信鄰居說的，沒有驗證全網資訊 |

**範例**：A–B 成本 1、B–C 成本 1、A–C 之間沒有直接連線。

| 時刻 | A 的表（目的：成本、下一跳） | B 的表 | C 的表 |
|---|---|---|---|
| 起始（只知道直接鄰居） | B：1、B | A：1、A；C：1、C | B：1、B |
| B 向鄰居交換向量後 | **C：2、B**（B 到 C 是 1，加上 A 到 B 的 1） | 不變 | **A：2、B** |
| 收斂 | A 到 C 成本 2，下一跳 B | | C 到 A 成本 2，下一跳 B |

**(二) RIP（Routing Information Protocol）**

**RIP 是距離向量的實際協定**，用於**自治系統（AS）內部**（IGP），簡單、適合小型網路。

| 項目 | RIP 的規定 |
|---|---|
| **距離（成本）度量** | **躍點數（hop count）**：經過的路由器個數；直接相連的網路為 1（或 0） |
| **最大躍點數** | **15**；**16 代表無限大（不可到達）**，因此 RIP 只適合**直徑不超過 15 個路由器**的網路 |
| **更新週期** | 每 **30 秒**向所有鄰居**廣播（RIPv1）或多播 224.0.0.9（RIPv2）**一次**完整路由表** |
| **傳輸方式** | 使用 **UDP 埠 520** |
| **路由失效計時器** | **180 秒**沒有收到某路由的更新，就視為失效（設為 16）；再經 **120 秒（flush timer）** 後從表中刪除 |
| **訊息類型** | **Request**（要求路由表）與 **Response**（回應／定期更新），內含最多 25 筆路由項目 |
| **版本** | **RIPv1**：有類別（classful），不帶子網路遮罩；**RIPv2**：支援 **CIDR／VLSM**、多播、驗證；**RIPng**：支援 IPv6 |

**RIP 的更新規則**：收到鄰居 n 傳來的「到網路 N 需要 k 個躍點」，則自己到 N 的新成本 = **k + 1**，下一跳為 n；

- 若表中**沒有 N** ⇒ **新增**。
- 若新成本**比現有的小** ⇒ **更新**成新成本與下一跳。
- 若來自**目前的下一跳** ⇒ **一律更新**（即使成本變大，因為那是最新的消息）。

**(三) RIP 的問題與對策**

| 問題 | 說明 | 對策 |
|---|---|---|

| 收斂速度 | 慢 | 快 |
| 訊息負擔與複雜度 | 低、簡單 | 較高、較複雜 |
| 適用 | 小型網路 | 中大型網路 |`

不同網路鏈路有不同的**最大傳輸單元（MTU）**（乙太網路為 1500 bytes）。當 IP 資料報**大於下一條鏈路的 MTU** 時，就要**切成多個較小的片段（fragment）** 才能送過去；**目的主機收到所有片段後再重組（reassembly）** 還原成原本的資料報。

      answer: `**(一) SNMP（Simple Network Management Protocol，簡單網路管理協定）的功能**

**架構（三個元件）**

| 元件 | 說明 |
|---|---|
| **管理者／網管站（Manager／NMS）** | 運行網管軟體的主機，向被管理設備查詢或下達指令、接收告警 |
| **代理者（Agent）** | 執行在被管理設備上的程式，負責**蒐集設備資訊**並回應管理者 |

**主要運作（操作）**

|---|---|---|
| **GET／GETNEXT／GETBULK** | 管理者 → 代理者 | **讀取**設備的狀態與統計（輪詢，polling） |
| **SET** | 管理者 → 代理者 | **修改**設備的設定（如關閉某個介面） |
| **TRAP／INFORM** | 代理者 → 管理者 | **主動通知**重大事件（介面故障、溫度過高、登入失敗），不必等輪詢 |

**傳輸**：**UDP**，代理者埠 **161**，TRAP 送往管理者的埠 **162**。**版本**：SNMPv1、v2c（以明文的 community string 驗證，不安全）、**v3（支援驗證與加密）**。

**(二) ICMP（Internet Control Message Protocol，網際網路控制訊息協定）的功能**

ICMP 是**網路層（與 IP 同層）** 協定，用來**回報 IP 通訊過程中發生的錯誤，並提供診斷與控制**。它**封裝在 IP 封包中**（協定號碼 1），沒有埠號，主要由**路由器與主機的 IP 軟體**使用。

|---|---|

**(三) 兩者比較**

|---|---|---|

| **主要目的** | **網路管理**：蒐集、監控、設定設備資訊 | **錯誤回報與診斷**：告知封包傳送過程的問題、測試連通性 |
| **運作方式** | **管理者與代理者**主從式；**輪詢＋主動 TRAP** | 路由器或主機在**發生錯誤時**產生訊息；或使用者主動發出 Echo 測試 |

        （送出）          （伺服器之間轉送）             （郵件存放在信箱）        （取信）

**SMTP 負責「送」**；**POP3、IMAP 負責「收（取信）」**。三者都是**應用層**協定，使用 **TCP**。

**(二) 三種協定的功能**

| 協定 | 全名 | 功能 | 預設埠 |
|---|---|---|---|
| **SMTP** | Simple Mail Transfer Protocol（簡單郵件傳輸協定） | **把郵件「推送」出去**：**① 用戶端 → 寄件的郵件伺服器**（郵件提交）；**② 郵件伺服器 → 郵件伺服器**（轉送，依收件人網域的 **MX 紀錄**找到目的伺服器）。只負責**傳送**，不負責讀取 | **25**（伺服器之間）、**587**（用戶端提交，STARTTLS）、**465**（SMTPS，隱式 TLS） |
| **POP3** | Post Office Protocol version 3（郵局協定第 3 版） | 用戶端**連到伺服器，把郵件「下載」到本機**，通常下載後**從伺服器刪除**（也可設定保留）；之後在本機端閱讀與管理 | **110**；**995**（POP3S） |
| **IMAP** | Internet Message Access Protocol（網際網路郵件存取協定） | **在伺服器上直接管理信件**：可**只下載標頭或需要的部分**、在伺服器上建立**資料夾**、標示已讀／未讀／星號、**搜尋**、刪除；**多個裝置看到同樣的狀態（同步）** | **143**；**993**（IMAPS） |

**SMTP 的基本指令**：\`HELO／EHLO\`（打招呼）、\`MAIL FROM\`（寄件人）、\`RCPT TO\`（收件人）、\`DATA\`（郵件內容，以單獨一行的 \`.\` 結束）、\`QUIT\`。**只能傳送文字**，附件需先以 **MIME** 編碼（如 Base64）。

**(三) POP3 與 IMAP 的差異比較**

| 比較項目 | **POP3** | **IMAP** |
|---|---|---|
| **信件存放位置** | 下載到**本機**，伺服器上通常**刪除** | 保留在**伺服器**，本機只是顯示（可快取） |

| **離線閱讀** | **容易**（已經全部在本機） | 需要**先同步或快取**才能離線 |
| **伺服器儲存空間** | **佔用少**（下載後刪除） | **佔用多**（信件都在伺服器，要有容量配額） |
| **網路頻寬／連線需求** | 取信時才連線，之後離線 | 通常需要**持續連線**（或同步） |

| **適用情況** | 單一電腦、頻寬有限、希望郵件存在本機 | **現代多裝置使用**（目前最常見） |

**三者的差異總結**

| | SMTP | POP3／IMAP |
|---|---|---|
| **方向** | **送出**（Push）：用戶端→伺服器、伺服器→伺服器 | **取回**（Pull）：伺服器→用戶端 |
| **角色** | 郵件傳送代理（MTA） | 郵件存取協定（用戶端取信） |

| 可能原因 | 說明與檢查方法 |
|---|---|
| **1. 沒有設定 DNS 伺服器，或設定錯誤** | 網路設定中的 DNS 位址空白、輸入錯誤，或 DHCP 沒有提供 DNS。檢查 \`ipconfig /all\`、\`nslookup\` |
| **2. DNS 伺服器故障或無法連線** | ISP 或公司的 DNS 當機、過載；用戶端到 DNS 的路由或防火牆有問題。可改用其他 DNS（如 8.8.8.8、1.1.1.1）測試 |
| **3. 防火牆擋住 DNS 流量** | 擋住 **UDP／TCP 埠 53**（DNS），或擋住 DoT／DoH |
| **4. DNS 快取錯誤或被污染** | 本機或 DNS 伺服器快取了錯誤或過期的紀錄（**DNS 快取污染／劫持**），解析出錯誤的 IP。可 \`ipconfig /flushdns\` 清除快取 |

**(二) DNS 名稱解析的運作原理**

**DNS（Domain Name System，網域名稱系統）**是一個**分散式、階層式的資料庫**，把網域名稱對應到 IP（主要是 **A／AAAA 紀錄**），使用 **UDP 埠 53**（回應過大或區域傳輸使用 TCP）。

**階層結構**：**根（.）→ 頂級網域（TLD：.com、.tw…）→ 次級網域（example.com）→ 主機（www）**。每一層由不同的 DNS 伺服器負責：

| 伺服器 | 角色 |
|---|---|
| **根伺服器（Root）** | 知道每個 **TLD 伺服器**的位置（全球 13 組根伺服器位址，許多鏡像） |
| **TLD 伺服器** | 知道該 TLD 下**各個網域的權威伺服器**位置 |
| **權威 DNS 伺服器（Authoritative）** | 儲存某網域**實際的紀錄**（www.example.com = 93.184.216.34），是最終答案 |
| **本地（遞迴）DNS 伺服器**（ISP 或公司提供） | 代用戶端**去問**其他伺服器並**快取**結果 |

| 步驟 | 說明 |
|---|---|
| **0. 先查本機** | 瀏覽器快取 → 作業系統快取 → **hosts 檔**；找到就直接使用 |
| **1. 遞迴查詢** | 用戶端向**本地 DNS 伺服器**詢問，要求它「**負責問到底**」並回傳最後答案 |
| **2. 向根伺服器查詢（疊代）** | 本地 DNS 問根伺服器；根不知道答案，但回覆「**.com 的 TLD 伺服器位址**」 |
| **3. 向 TLD 伺服器查詢** | 本地 DNS 問 .com TLD 伺服器；回覆「**example.com 的權威 DNS 伺服器位址（NS 紀錄）**」 |
| **4. 向權威伺服器查詢** | 本地 DNS 問 example.com 的權威伺服器；它**直接回覆 www.example.com 的 IP** |
| **5. 回覆並快取** | 本地 DNS 把 IP 回給用戶端，並**依 TTL（存活時間）快取**；之後的查詢直接由快取回答，減少負載與延遲 |
| **6. 連線** | 瀏覽器得到 IP，再以 TCP 連線到網頁伺服器（HTTP／HTTPS） |

**兩種查詢方式**

| 方式 | 說明 | 使用情形 |
|---|---|---|
| **遞迴查詢（Recursive）** | 被問的伺服器**必須負責取得最終答案**，代為查詢後回覆 | 用戶端 → 本地 DNS |
| **疊代查詢（Iterative）** | 被問的伺服器**只回覆它所知道的最佳資訊（或「去問某某伺服器」）**，由詢問者自己繼續問下一個 | 本地 DNS → 根／TLD／權威伺服器 |

**常見的資源紀錄（Resource Record）**

| 類型 | 用途 |
|---|---|
| **A／AAAA** | 網域名稱 → IPv4／IPv6 位址 |
| **CNAME** | 別名（一個名稱指向另一個名稱） |
| **NS** | 該網域的權威名稱伺服器 |
| **MX** | 該網域的郵件伺服器（供 SMTP 使用） |
| **PTR** | IP → 網域名稱（反向解析） |
| **TXT** | 文字資訊（SPF、DKIM 等） |

**重點**：DNS 以**階層分工＋快取**提供全球名稱解析；**任何環節出問題（設定、伺服器、防火牆、快取）都會造成「用 IP 能連、用網址卻不能」**。`

| 步驟 | 說明 |
|---|---|
| **1. 用戶要看影片** | 用戶在 X 的網頁點選連結 \`http://video.X.com/6Y7B23V\`。用戶端必須先把主機名稱 **video.X.com** 解析成 IP，於是向**本地 DNS 伺服器（LDNS）** 送出 DNS 查詢 |
| **2. LDNS 轉問 X 的權威 DNS** | LDNS 照一般的 DNS 解析流程，最後把查詢送到 **X 的權威 DNS 伺服器** |
| **3. X 的 DNS 重新導向** | X 的權威 DNS 發現主機名稱含有 **video**（屬於要交給 CDN 的內容），**不回覆 IP**，而是回覆一個**屬於 Y 網域的主機名稱**，例如 **a1105.Y.com**（以 CNAME 或 NS 紀錄表示：「這個名稱請去問 Y」）。這就是「**攔截並重新導向**」：**X 的 DNS 把解析工作交給 Y** |
| **4. LDNS 向 Y 的 DNS 查詢** | LDNS 收到後，對 **a1105.Y.com** 再發出查詢，這次送到 **Y（CDN 業者）的 DNS 系統** |
| **5. Y 的 DNS 選擇最合適的伺服器** | Y 的 DNS 依照**叢集選擇策略（cluster selection strategy）**，挑出**服務這位用戶最合適的 CDN 伺服器**，回覆它的 **IP 位址** |
| **6. 回覆用戶端** | LDNS 把這個 IP 傳回給用戶端；用戶端並不知道中間經過了重新導向 |
| **7. 取得內容** | 用戶端與 **Y 的 CDN 伺服器**建立 TCP 連線，送出 HTTP GET（URL 內含影片識別碼），伺服器傳回影片（若該伺服器沒有副本，則向 X 的源伺服器取得並快取） |

**Y 如何選擇「最合適的」CDN 伺服器**

| 策略 | 說明 |
|---|---|
| **地理最近** | 依 **LDNS 的 IP 位址**判斷用戶的地理位置，選擇距離最近的叢集（缺點：用戶與其 LDNS 不一定在同一地區） |
| **即時量測** | Y 持續量測各叢集到各 LDNS 的**延遲（RTT、丟包率）**，選擇**目前表現最好**的叢集 |
| **負載平衡** | 避開**負載過高或故障**的伺服器 |
| **IP Anycast** | 多個叢集宣告同一個 IP，由 BGP 路由自動導向最近者 |

**重點**

| 項目 | 說明 |
|---|---|
| **為何用 DNS** | DNS 是所有連線的**第一步**，在這一步就能改變「連到誰」，**不需要修改瀏覽器或網址**，對用戶透明 |
| **攔截者** | 實際上是 **X 的權威 DNS 主動「轉介」** 給 Y 的 DNS，不是攻擊式的竄改 |
| **主要好處** | 內容提供商不必自建全球伺服器；用戶就近取得內容；分散負載 |
| **快取** | LDNS 會依 TTL 快取答案；CDN 常設**較短的 TTL**，以便隨時調整導向 |`

**① 路由器 1d 從哪個協定得知 x：iBGP**

x 位在 AS4（連在 4a）。要到達 x，路徑只能是 **AS1 → AS3 → AS4**（因為 AS2 與 AS4 之間沒有連結，AS2 無法到達 x）。

| 步驟 | 說明 |
|---|---|
| 1 | AS4 的邊界路由器 **4c** 經 **eBGP** 向 AS3 的 3c 通告「x 可由 AS4 到達」 |
| 2 | AS3 內以 **iBGP** 傳遞，邊界路由器 **3a** 再用 **eBGP** 向 AS1 的邊界路由器 **1c** 通告：「x 的 AS 路徑為 **AS3 AS4**」 |
| 3 | **1c 以 eBGP 學到** x 的路由；1c 再以 **iBGP** 把這個資訊傳給 AS1 內的其他路由器（1a、1b、**1d**） |
| 4 | **1d 是 AS1 的內部路由器**，沒有直接連到其他 AS，所以它**不是**從 eBGP（那是邊界路由器之間才有）、也不是從 OSPF／RIP（那些只傳 AS 內部路由，且 AS1 用的是 RIP，AS 內部路由不包含 AS4 的 x）得知，而是由 **iBGP** 學到 |

> **答案：1d 從 iBGP 得知位址 x。**

**② 轉送表項目 (x, I)：I = I₁**

**BGP 路由的「下一跳（next hop）」**是 **1c（的外部連線）**：x 的出口（閘道）路由器是 1c。1d 要把封包送給 x，必須**先送到 AS1 的出口路由器 1c**。「**怎麼送到 1c**」由 **AS 內部繞送協定（RIP）** 的結果決定：

| 到 1c 的路徑 | 經過的路由器 | 躍點數（RIP） | 起始介面 |
|---|---|---|---|
| **1d → 1a → 1c** | 1a | **2** | **I₁**（通往 1a） |
| 1d → 1b → 1a → 1c | 1b、1a | 3 | I₂（通往 1b） |

因為 **1c 只與 1a 相連**（圖中 1c 與 1b 之間沒有連線），**最低成本的路徑是經過 1a** 的路徑，起始介面是 **I₁**。

> **I = I₁**，理由：**x 的路徑經由閘道 1c，而從 1d 到 1c 的 AS 內部最短（最低成本）路徑是 1d → 1a → 1c，路徑的第一段介面是 I₁**。

**運作總結**：**BGP（iBGP）決定「要從哪個出口離開 AS」（目的地 x 的下一跳是 1c）**，**IGP（RIP）決定「怎麼到達那個出口」（介面 I₁）**，轉送表項目 (x, I₁) 就是兩者結合的結果。

**(二) AS2 與 AS4 之間有實體連結（10 分）**

現在 **x 有兩條 AS 路徑**：

| 路徑 | 出口（閘道）路由器 | AS 路徑 | AS 路徑長度 |
|---|---|---|---|
| 經 AS3 | **1c**（接 3a） | AS3 AS4 | 2 |
| 經 AS2 | **1b**（接 2a） | AS2 AS4 | 2 |

1d 透過 iBGP 同時從 1c 與 1b 學到這兩條路由。BGP 的路由選擇依序比較：①本地偏好值（Local Preference）②**最短 AS 路徑**③**最近的出口路由器（熱馬鈴薯路由）**④BGP 識別碼等。

- 本題**沒有指定本地偏好**，兩條路徑的 **AS 路徑長度相同（都是 2）**，所以進入下一個準則：**熱馬鈴薯路由（Hot-Potato Routing）**——選擇**AS 內部成本最低（離自己最近）的出口路由器**，也就是**盡快把封包丟出自己的 AS**。

| 到出口的 AS 內部路徑 | 躍點數 | 起始介面 |
|---|---|---|
| 1d → **1b**（直接相連） | **1** | **I₂** |
| 1d → 1a → **1c** | 2 | I₁ |

出口 1b 離 1d **較近（1 個躍點）**，所以選擇經由 **1b → AS2** 的路徑。

> **I = I₂**，理由：**經 AS2 與 AS3 的 AS 路徑長度相同，依熱馬鈴薯路由，選擇 AS 內部成本最低的出口——1b（1 個躍點，比 1c 的 2 個躍點小），而到 1b 的起始介面是 I₂**。

**背景**：各鏈路的**最大傳輸單元（MTU）** 不同（乙太網路 1500 bytes）。封包比 MTU 大時，必須處理。

| 比較項目 | **IPv4** | **IPv6** |
|---|---|---|
| **誰可以分段** | **來源主機**與**沿途的任何路由器**都可以分段 | **只有來源主機**可以分段；**路由器不分段** |
| **路由器遇到太大的封包** | 路由器自行**切成片段**繼續轉送（若 DF = 1 則丟棄並回 ICMP「需要分段」） | **直接丟棄封包**，並回傳 **ICMPv6「封包過大（Packet Too Big）」** 給來源，訊息中帶有該鏈路的 MTU |
| **分段資訊放在哪裡** | **基本標頭**內：**Identification（16 位元）、Flags（DF、MF）、Fragment Offset（13 位元）** | **基本標頭沒有這些欄位**；需要分段時，由來源在**擴充標頭**中加入 **Fragment Header（分段標頭）**（含 Fragment Offset、M 旗標、32 位元 Identification） |
| **最小 MTU** | 68 bytes（實務上多為 576 起） | **1280 bytes**：所有鏈路都必須支援至少 1280 bytes |
| **路徑 MTU 探索（PMTUD）** | **選用**（常設 DF = 1 進行探索） | **必須**：來源以 **PMTUD** 找出路徑最小 MTU，再決定封包大小 |
| **重組在哪裡進行** | **只在目的主機**重組（中途路由器不重組） | **只在目的主機**重組 |
| **路由器負擔** | 路由器要處理分段，**增加負擔**，且標頭檢查碼要重新計算 | **路由器不處理分段**，轉送更快、更簡單 |
| **標頭檢查碼** | 有，分段後要重算 | 已**取消**標頭檢查碼 |

**IPv6 的設計理由**：把分段工作從路由器移到**來源端**，讓**路由器專心轉送、提高效能**；沿途分段會造成效率不佳，且片段遺失就得重傳整個封包。

| 2. 中途鏈路 MTU 較小 | **路由器分段**後轉送 | 路由器**丟棄**並回 ICMPv6「Packet Too Big」 |
| 3. 來源反應 | 無需處理（路由器已處理） | **降低封包大小或加上分段標頭重送** |
| 4. 目的端 | 收齊所有片段（依 Identification、Offset）後**重組** | 同樣在**目的端**重組 |

**(二) 通道方案（Tunneling）（10 分）**

**問題**：IPv6 與 IPv4 不相容，而且全球網路是**逐步**升級，常常出現**兩個 IPv6 網路被一段只支援 IPv4 的網路隔開**的情形。**通道（tunneling）** 就是讓 IPv6 封包**穿過 IPv4 網路**的方法。（嚴格說，通道是讓 IPv6 通過 IPv4 網路，而不是「把 IPv4 轉成 IPv6」；它是**過渡到 IPv6 的技術之一**。）

**殭屍網路（Botnet）**：由攻擊者（稱為 **Botmaster／Bot Herder**）以**惡意程式感染並控制**的大量**網路連線設備**（個人電腦、伺服器、手機、**物聯網（IoT）設備如攝影機、路由器**）所組成的**網路**。被感染的設備稱為**殭屍（Bot／Zombie）**，**使用者通常毫不知情**，攻擊者可**遠端、集中地指揮它們同時執行任務**。

**組成與運作**

| 元件／階段 | 說明 |
|---|---|
| **感染** | 利用漏洞、釣魚郵件、惡意下載、弱密碼（如 IoT 預設密碼，Mirai）把惡意程式植入設備 |
| **指揮與控制伺服器（C&C／C2）** | 攻擊者透過 **C&C 伺服器**（IRC、HTTP、P2P 或加密通道）向所有殭屍下達命令；進階的殭屍網路會用 DNS 動態產生網域（DGA）躲避封鎖 |
| **執行任務** | 殭屍依命令同時行動，並常回報資料；攻擊者可**出租**殭屍網路牟利（DDoS 即服務） |

**(二) 常見的殭屍網路攻擊（舉兩個例子）（7 分）**

| 攻擊 | 說明 |
|---|---|
| **1. 分散式阻斷服務攻擊（DDoS）** | 命令成千上萬的殭屍**同時向目標發送大量請求**（SYN 洪水、UDP 洪水、HTTP 洪水、DNS 放大），耗盡目標的頻寬或運算資源，使正常用戶無法使用服務。例：**Mirai 殭屍網路**攻擊 DNS 業者 Dyn（2016），造成大型網站無法連線 |
| **2. 發送垃圾郵件與釣魚郵件（Spam／Phishing）** | 利用殭屍設備**大量寄送垃圾信、詐騙信**，因為來源分散、IP 不斷變動，難以封鎖 |
| 3. 竊取資料（憑證竊取、鍵盤側錄） | 殭屍程式蒐集帳號密碼、信用卡、個資並回傳 |
| 4. 憑證填充（Credential Stuffing）／暴力破解 | 用被竊的帳密大量嘗試登入其他網站 |
| 5. 點擊詐欺（Click Fraud） | 自動點擊廣告騙取廣告費 |
| 6. 挖礦（Cryptojacking） | 偷用設備的運算資源挖掘虛擬貨幣 |
| 7. 散布其他惡意軟體（如勒索軟體）、代理跳板 | 以殭屍作為攻擊跳板，隱藏攻擊者身分 |

**(三) 如何防止殭屍網路的攻擊（舉兩個作為）（7 分）**

| 作為 | 說明 |
|---|---|
| **1. 防止設備被感染：及時更新與修補、安裝防毒（端點防護）、變更預設密碼** | **定期更新作業系統、韌體、應用程式**以修補漏洞；安裝並更新**防毒／EDR**；**更換 IoT 設備的預設帳密**、關閉不必要的服務與遠端管理埠；員工**資安教育**，不開啟可疑郵件附件與連結；使用多因素驗證 |
| **2. 網路層的偵測與阻斷：防火牆、入侵偵測與防禦（IDS／IPS）、DNS 過濾** | **出站（Egress）過濾**：阻擋內部設備連往已知的 **C&C 伺服器**與惡意網域（威脅情資、**DNS Sinkhole**）；監控異常流量（大量對外連線、異常的 DNS 查詢、對外發送大量郵件）；**網路分段（VLAN）** 隔離 IoT 設備，限制感染橫向擴散 |
| 3. 攻擊面的緩解（針對 DDoS） | 使用 **CDN／DDoS 清洗服務**、流量限速與黑洞路由、**BCP 38（入口過濾）** 阻擋偽造來源位址 |
| 4. 發現與清除 | 發現被感染的設備後立即**隔離**、重新安裝或重設；與 ISP、CERT 通報合作取締 C&C |`

**定義**：攻擊者**耗盡目標系統的資源**（頻寬、CPU、記憶體、連線表），或利用漏洞使服務當機，讓**合法用戶無法使用服務**。攻擊來源**通常是單一（或少數）主機**。

| 類型 | 例子 |
|---|---|
| **頻寬耗盡** | 大量 UDP、ICMP 洪水（Ping Flood） |
| **資源耗盡（協定攻擊）** | **SYN 洪水**（半開連線占滿連線表）、片段攻擊 |
| **漏洞攻擊** | Ping of Death、Teardrop 使系統當機 |
| **應用層攻擊** | 大量 HTTP 請求耗盡網頁伺服器 |

**(二) DDoS 攻擊（Distributed DoS，分散式阻斷服務）（5 分）**

**定義**：攻擊者控制**大量分散在各地的被感染設備（殭屍網路）**，**同時**對同一目標發動 DoS 攻擊。

| 與 DoS 的差異 | DoS | DDoS |
|---|---|---|
| 攻擊來源 | **單一**（或少數）主機 | **成千上萬的分散主機（殭屍網路）** |
| 流量大小 | 較小，頻寬受限於攻擊者自己 | **非常大**（可達 Tbps） |
| 防禦難度 | 較容易：封鎖單一來源 IP 即可 | **困難**：來源分散、來自合法用戶的設備，**難以區分正常與攻擊流量** |
| 追查 | 較容易 | 很難追到真正的攻擊者 |

**(三) 防止外來 DDoS 攻擊的作為（舉兩個）（10 分）**

| 作為 | 說明 |
|---|---|
| **1. 使用 DDoS 清洗與分散式防護服務（CDN／Anycast／Scrubbing Center）** | 把網站流量先導向**雲端防護業者**（如 Cloudflare、Akamai、Google Cloud Armor）。業者在**全球多個節點（Anycast）** 吸收並**分散**巨量流量，用**流量清洗**過濾掉攻擊封包，只把乾淨的流量轉給原始伺服器。**優點**：擁有遠大於單一機構的**頻寬與容量**，能承受大流量攻擊；原站 IP 被隱藏 |
| **2. 在網路邊界與伺服器上做流量過濾與限制** | ① **速率限制（Rate Limiting）**：限制單一 IP 的請求速率與連線數；② **SYN Cookies**、縮短半開連線逾時，抵禦 SYN 洪水；③ **入口過濾（BCP 38／反向路徑轉送 uRPF）**：丟棄偽造來源位址的封包；④ 防火牆與 IPS 規則封鎖異常流量；⑤ **黑洞路由（RTBH）**：在最壞情況下把攻擊目標的流量導向黑洞，保護其他服務 |
| 3. 提高容量與彈性（備援與負載平衡） | **多條 ISP 頻寬**、**負載平衡器**與**彈性擴充（雲端自動擴展）**，吸收部分流量 |
| 4. 偵測與應變計畫 | **流量基線與異常偵測**（NetFlow）、攻擊演練與**應變程序**，並與 ISP 聯繫在上游過濾 |
| 5. 減少攻擊面 | 關閉不必要的對外服務與埠、隱藏原始伺服器 IP、修補漏洞、使用 **WAF（Web 應用程式防火牆）** 對付應用層 DDoS |`

㈠假設網路非常穩定不遺失封包，且 SW = 1，請問從傳送端將 100 個 TCP 封包完整地送到接收端，需花多久時間？（5 分）
㈡假設網路非常穩定不遺失封包，且 SW = 20，請問從傳送端將 100 個 TCP 封包完整地送到接收端，需花多久時間？（8 分）
㈢假設網路不穩定，且每兩個封包就會遺失一個封包。然後傳送端經過重傳該遺失封包一次後，才被接收端成功地接收。請問，如果 SW = 10，從傳送端將 100 個 TCP 封包完整地送到接收端，平均需花多久時間？（12 分）`,
      answer: `**(零) 模型假設**

| 項目 | 說明 |
|---|---|
| **RTT = 10 ms** | 傳送端送出封包起，到收到對應 ACK 的時間（封包傳輸時間與處理時間不計） |
| **滑動窗口 SW** | 傳送端在**尚未收到 ACK** 時最多可連續送出的封包數 |
| **完成的定義** | 傳送端收到最後一個封包的 ACK（即「完整送到接收端」並確認） |
| **Go-Back-N** | 接收端只接受**依序到達**的封包，中間缺一個就**丟棄後面的所有封包**；傳送端**逾時（20 ms）後，從遺失的那一個開始，把窗口內的封包全部重送** |

**(一) SW = 1、無遺失（5 分）**

窗口只有 1，表示**每送一個封包就要等 ACK 回來才能送下一個**（停止等待，Stop-and-Wait）。每個封包耗時 1 個 RTT：

> 時間 = 100 個封包 × 10 ms = **1000 ms（= 1 秒）**

**(二) SW = 20、無遺失（8 分）**

一次可以**連續送出 20 個封包**，在一個 RTT（10 ms）內全部確認。每「一輪」處理 20 個封包：

> 輪數 = 100 ÷ 20 = **5 輪**
> 時間 = 5 輪 × 10 ms = **50 ms**

**與 (一) 比較**：窗口放大 20 倍，時間由 1000 ms 縮短到 **50 ms**（速度提升 20 倍），因為把等待 ACK 的時間用來同時傳送更多封包（**管線化**）。

**(三) SW = 10、50% 遺失、重傳一次成功、Go-Back-N（12 分）**

**先看沒有遺失時**：100 ÷ 10 = 10 輪 × 10 ms = **100 ms**。

**有遺失時，每個窗口（10 個封包）的處理過程**

\`\`\`htmldiagram

\`\`\`

| 時間 | 事件 |
|---|---|
| **0 ms** | 傳送端一次送出窗口內的 10 個封包。「每兩個封包就遺失一個」，所以窗口開頭兩個封包中就有一個遺失（例如第 2 個遺失） |
| **約 10 ms** | 第 1 個封包的 ACK 回來；接收端因為缺第 2 個，依 **Go-Back-N 丟棄後面的所有封包**，不會再送出新的有效 ACK |
| **20 ms** | **傳送端的計時器逾時（Timeout = 20 ms）**：從遺失的封包開始，**把窗口內的封包全部重傳**。因為「重傳一次後即成功」，所以這一輪**全部成功** |
| **30 ms** | 重傳的封包經過 1 個 RTT（10 ms）後，ACK 全部回來，**這個窗口完成** |

**每個窗口花費** = 逾時等待 20 ms（原本的傳送與等待 ACK 失敗） + 重傳一個 RTT 10 ms = **30 ms**

**總時間**：

> 100 個封包 ÷ 窗口 10 = **10 個窗口**
> 總時間 = 10 × 30 ms = **300 ms**

> **平均約需 300 ms**

**說明與比較**

| 情形 | 窗口數 | 每窗口時間 | 總時間 |
|---|---|---|---|
| (一) SW = 1，無遺失 | 100 | 10 ms | **1000 ms** |
| (二) SW = 20，無遺失 | 5 | 10 ms | **50 ms** |
| SW = 10，**無遺失**（對照用） | 10 | 10 ms | 100 ms |
| (三) SW = 10，**每 2 個遺失 1 個** | 10 | **30 ms**（含 Timeout 20 ms） | **300 ms** |

- 有遺失的時間（300 ms）是無遺失（100 ms）的 **3 倍**：因為每個窗口都要多等一次 **Timeout（20 ms）**。
- 題目要「平均」是因為遺失的位置不固定（可能是窗口中的第 1 個或第 2 個）；遺失的位置只會讓某一窗口的前面少數封包先被確認，**對每個窗口約 30 ms 的結論沒有影響**，因此可取每窗口 30 ms 為平均值。
- 若 Timeout 設得比 RTT（10 ms）小很多，會造成不必要的重傳；Timeout 太大則在遺失時等太久。**Go-Back-N** 的缺點是**一個封包遺失就要重傳整個窗口**，在高遺失率下效率很低（改用 **Selective Repeat／SACK** 可以只重傳遺失的封包）。

**作答注意**：(三) 對「遺失」的細節（遺失發生時機、是否在重傳時再次遺失、ACK 是否累積）有多種解讀；本解依題意採用最直接的模型——每個窗口恰好經歷一次逾時重傳——得到 300 ms。`

      answer: `**(一) TCP/IP 四層架構（由上而下）**

|---|---|---|---|
| 4 | **Application Layer（應用層）** | 提供使用者與應用程式的網路服務 | 應用、表達、會議層 |
| 3 | **Transport Layer（傳輸層）** | 端點到端點（process-to-process）的資料傳送、可靠性與流量控制 | 傳輸層 |
| 2 | **Internet Layer（網際層，也稱 Network Layer）** | 邏輯位址（IP）、路由與封包轉送 | 網路層 |

**(二) 各協定所屬的層**

| 協定 | 所屬層 | 說明 |
|---|---|---|
| **DHCP** | **Application** | 動態主機設定協定，自動配發 IP、遮罩、閘道、DNS（使用 UDP 67／68） |
| **MQTT** | **Application** | 訊息佇列遙測傳輸，物聯網常用的發佈／訂閱協定（使用 TCP 1883／8883） |
| **SSH** | **Application** | 安全殼層，加密的遠端登入與檔案傳輸（TCP 22） |
| **TCP** | **Transport** | 連線導向、可靠傳輸 |
| **UDP** | **Transport** | 無連線、盡力而為 |
| **IP** | **Internet** | 邏輯定址與路由 |
| **ICMP** | **Internet** | 網際網路控制訊息（錯誤回報、ping），封裝在 IP 內 |
| **IPsec** | **Internet** | 在 IP 層提供認證與加密（AH、ESP） |
| **OSPF** | **Internet** | 開放最短路徑優先，鏈路狀態路由協定，**直接封裝在 IP 內（協定號碼 89）**，屬於路由（網路層）功能 |
| **ARP** | **Internet（與 Network Access 之間）** | 把 IP 位址解析成 MAC 位址；多數教材放在網際層（也有放在鏈結層的說法） |
| **PPP** | **Network Access** | 點對點協定，屬於資料鏈結層，用在撥接、DSL 等 |

**補充**：OSPF 與 ARP 的歸類在不同教科書略有差異（OSPF 有時被歸為應用層，因為它是一個路由「應用」；ARP 有時歸鏈結層），作答時可註明依據。`

    {
      id: "cs3-net-109-2", no: "二", topic: "net", topicName: "資通網路",
      title: "雙協定堆疊（Dual Stack）：IPv4 與 IPv6 客戶端如何與同時支援兩種協定的伺服器交換資料（概要圖與 OSI 模型）",
      score: 20,
      question: `雙堆疊已廣泛使用於不同協定堆疊的網路中。請說明，分別使用 IPv4 與 IPv6 的客戶端，如何透過使用雙協定可同時支持 IPv4 與 IPv6 的伺服器，進行資料交換，請以概要圖並配合 OSI 架構模型說明之。（20 分）`,
      answer: `**(一) 雙堆疊（Dual Stack）的概念**

**雙堆疊**：主機（伺服器）**同時安裝並執行兩套網路層協定——IPv4 與 IPv6**，各有自己的位址（一個 IPv4 位址、一個 IPv6 位址）；**應用層與傳輸層（TCP／UDP）共用**。這是 IPv4 過渡到 IPv6 最簡單、最常用的方式。

\`\`\`

**(二) 配合 OSI 模型的分層說明**

| OSI 層 | 雙堆疊伺服器的處理 | 說明 |
|---|---|---|
| **7 應用層** | **同一個應用程式**（如網頁伺服器） | 應用程式用**一個 socket** 同時接受 IPv4 與 IPv6 連線（例如綁定到 \`::\` 並允許 IPv4-mapped 位址） |
| **4 傳輸層** | **同一套 TCP／UDP** | TCP／UDP 與 IP 版本無關，**共用同一份實作與埠號** |
| **3 網路層** | **兩套協定並存：IPv4 協定與 IPv6 協定** | 兩個 IP 協定各自處理自己的標頭、位址、路由；依收到的**封包版本欄位（4 或 6）** 交給對應協定 |
| **2 資料鏈結層** | **同一個網路介面**；乙太網路以 **EtherType** 區分：IPv4 = 0x0800、IPv6 = 0x86DD | 同一張網卡同時收兩種封包 |
| **1 實體層** | 同一個實體連線 | 完全共用 |

**(三) 資料交換過程**

| 步驟 | IPv4 客戶端 | IPv6 客戶端 |
|---|---|---|
| **1. 名稱解析** | DNS 查詢 **A 紀錄**，得到伺服器的 IPv4 位址 | DNS 查詢 **AAAA 紀錄**，得到伺服器的 IPv6 位址 |
| **2. 建立連線** | 以 IPv4 位址發出 TCP SYN（IPv4 封包） | 以 IPv6 位址發出 TCP SYN（IPv6 封包） |
| **3. 伺服器接收** | 網路層看封包版本為 4，交給 **IPv4 協定**，往上交給 TCP | 版本為 6，交給 **IPv6 協定**，往上交給 TCP |
| **4. 應用處理** | **同一個應用程式**處理請求，產生回應 | 同樣由同一個應用程式處理 |
| **5. 回覆** | 回應以 **IPv4** 封裝送回 | 回應以 **IPv6** 封裝送回 |

**雙協定客戶端**（本身也是 Dual Stack）會**兩種都查**：優先採用 IPv6（Happy Eyeballs 演算法同時嘗試，選先成功者），失敗時退回 IPv4。

**(四) 優缺點**

| 優點 | 缺點 |
|---|---|
| 簡單、相容，不需轉換；效能好；新舊用戶都能服務 | 要維護**兩套位址、路由、防火牆與安全規則**；仍需要 IPv4 位址（無法節省 IPv4）；兩套協定的設定錯誤風險 |

**與其他過渡技術的比較**：**通道（tunneling）** 讓 IPv6 封包穿越 IPv4 網路；**協定轉換（NAT64／DNS64）** 讓純 IPv6 與純 IPv4 互通；**雙堆疊**則是讓**一台主機同時會兩種語言**。`

      answer: `**(一) OSPF 簡介**

**OSPF** 是**鏈路狀態（link-state）** 內部閘道路由協定（IGP），在**同一個自治系統（AS）** 內使用：每個路由器**洪泛**自己的鏈路狀態（LSA），全部路由器取得相同的**拓撲資料庫**，再用 **Dijkstra 演算法**計算最短路徑樹。為了縮小資料庫與減少流量，OSPF 把 AS 分成多個**區域（Area）**，其中 **Area 0 稱為骨幹區域**，其他區域必須與骨幹相連。依在階層中的位置，路由器分為四類：

**(二) 四種路由器類型**

| 類型 | 英文 | 位置與特性 | 作用 |
|---|---|---|---|
| **1. 內部路由器** | **Internal Router** | 所有介面都在**同一個區域**內 | 只維護**該區域**的鏈路狀態資料庫，執行 OSPF 計算；不與其他區域直接交換資料 |
| **2. 區域邊界路由器** | **Area Border Router（ABR）** | **連接兩個以上的區域**（通常一邊是骨幹、一邊是其他區域），每個所屬區域各維護一份資料庫 | **在區域之間交換並摘要（summarize）路由資訊**，把本區域的網路摘要後通告給骨幹，也把其他區域的摘要告訴本區域，減少路由表大小與 LSA 洪泛範圍 |
| **3. 骨幹路由器** | **Backbone Router** | **至少有一個介面在骨幹區域（Area 0）** 的路由器（ABR 一定是骨幹路由器；Area 0 內的內部路由器也算） | 負責**不同區域之間的資料傳輸**：區域間的流量必須經由骨幹轉送 |
| **4. AS 邊界路由器** | **AS Boundary Router（ASBR）** | **連接到其他自治系統**的路由器，把**外部路由**（來自 BGP、RIP、靜態路由）**重新分送（redistribute）** 進 OSPF | 把外部網路的路由資訊以**外部 LSA（Type 5）** 通告給整個 AS 內的路由器，使 AS 內的主機能到達外部網路 |

**重點整理**

| 觀察 | 說明 |
|---|---|
| 分類角度 | 前三類依**區域**（內部／邊界／骨幹）；ASBR 依**是否連到外部 AS** |
| 可以同時是多種 | 一台路由器可同時是 **ABR 與骨幹路由器**，或 **ASBR 與內部路由器** |
| 階層設計的好處 | **縮小鏈路狀態資料庫**、**減少 SPF 計算與洪泛範圍**、拓撲變動只影響所屬區域、可做路由摘要 |`

    {
      id: "cs3-net-109-4", no: "四", topic: "net", topicName: "資通網路",
      title: "L2CAP（Logical Link Control and Adaptation Protocol）的三種邏輯通道",
      score: 15,
      question: `邏輯鏈路控制與適應協定（logical link control and adaptation protocol, L2CAP）是資料鏈路控制協定，此協定在基頻層的上一層運作，且運作方式與鏈路管理者協定相同。請描述其三種不同類型的邏輯通道並敘述之。（15 分）`,
      answer: `**(一) L2CAP 在藍牙協定堆疊中的位置與功能**

藍牙協定堆疊由下而上：**射頻（Radio）→ 基頻（Baseband）→ 鏈路管理協定（LMP）→ L2CAP → 上層協定（RFCOMM、SDP、TCS…）**。**L2CAP** 在基頻層之上，提供：

| 功能 | 說明 |
|---|---|
| **多工** | 讓多個上層協定與應用**共用同一條基頻連結** |
| **分段與重組（SAR）** | 上層送來的資料封包可能比基頻封包大（最大 64 KB），L2CAP 把它**切成小片**傳送，接收端**重組** |
| **服務品質（QoS）** | 協商並維持每個通道的服務品質參數 |
| **群組抽象** | 支援**群組（多播）**通訊 |

**(二) 三種邏輯通道（Logical Channel）**

| 通道類型 | 英文 | 說明 | 用途 |
|---|---|---|---|
| **1. 無連線通道** | **Connectionless Channel** | **單向**的廣播式通道，**不需要事先建立連線**，用 **CID = 0x0002**；可**傳送給一群裝置（群組）** | 對微網（piconet）內多個從裝置**廣播資料**（如廣播訊息）；不保證可靠 |
| **2. 連線導向通道** | **Connection-Oriented Channel** | **雙向**的**點對點**通道：先經過**連線建立程序**（Connection Request／Response、組態協商），再傳送資料；每一端用**通道識別碼（CID）** 標示；可依 QoS 設定 | **傳送使用者資料的主要通道**（如 RFCOMM 的序列埠、SDP 服務搜尋、BNEP 網路） |
| **3. 信令通道** | **Signaling Channel** | **固定**的專用通道（**CID = 0x0001**），用來**傳遞 L2CAP 的控制訊息**：**建立、組態、釋放通道**、回應與回報錯誤 | 管理所有其他邏輯通道；每條 ACL 連結上都存在，不需要建立 |

**(三) 補充：CID（通道識別碼）**

| CID | 用途 |
|---|---|
| 0x0000 | 保留（空） |
| **0x0001** | **信令通道** |
| **0x0002** | **無連線通道** |
| 0x0040 以上 | **動態配置**給連線導向通道使用 |

**總結**：信令通道**管理**、連線導向通道**傳資料（點對點、可靠）**、無連線通道**廣播資料（群組、單向）**。`
    },
    {
      id: "cs3-net-109-5", no: "五", topic: "net", topicName: "資通網路",
      title: "封包大於目的地網路訊框大小上限（MTU）時的術語與處理方式（分段與重組）",
      score: 15,
      question: `當封包大小在大於目的地接取網路的訊框大小的上限時，這個上限的術語稱為什麼？並請詳細說明目的地閘道器該如何處理這一個問題。（15 分）`,
      answer: `**(一) 術語：最大傳輸單元（MTU, Maximum Transmission Unit）**

**MTU**：某條鏈路（網路接取技術）**一個訊框所能攜帶的最大 IP 封包長度**。例如：**乙太網路 1500 bytes**、PPPoE 1492 bytes、IPv6 最小 1280 bytes、FDDI 4352 bytes。

**(二) 處理方式：分段（Fragmentation）與重組（Reassembly）**

當封包長度（含 IP 標頭）**大於下一段鏈路的 MTU**，**目的地網路的閘道器（路由器）** 無法把整個封包放進一個訊框，依 IPv4 規定：

| 步驟 | 說明 |
|---|---|
| **1. 檢查 DF 旗標** | 若標頭的 **DF（Don't Fragment）= 0**，可以分段；若 **DF = 1**，**不可分段**，路由器**丟棄封包**並回傳 **ICMP「目的地不可達：需要分段但 DF 已設定」**（含該鏈路的 MTU），供來源調整（路徑 MTU 探索） |
| **2. 分段** | 路由器把資料部分切成多個片段，**每個片段的資料長度必須是 8 的倍數**（最後一個除外），每個片段有**自己的 IP 標頭**（複製來源、目的位址與 Identification） |
| **3. 設定標頭欄位** | **Identification**：同一個原始封包的所有片段**相同**；**MF（More Fragments）**：除最後一片外都設為 1；**Fragment Offset**：該片資料在原封包中的起始位置（**以 8 位元組為單位**）；**Total Length**、**檢查碼**重新計算 |
| **4. 轉送** | 各片段**獨立**傳送到目的地 |
| **5. 目的主機重組** | **只在最終的目的主機重組**（中間路由器不重組）：以（來源、目的、協定、Identification）識別同一組，依 Offset 排序，收到 **MF = 0 的最後片段**且無缺口後還原；**重組計時器**逾時就丟棄已收到的片段 |

**範例**：資料 3000 bytes（IP 標頭 20）送進 MTU = 1500 的鏈路，每片最多資料 1480：

| 片段 | 資料長度 | Offset | MF |
|---|---|---|---|
| 1 | 1480 | 0 | 1 |
| 2 | 1480 | 185（1480 ÷ 8） | 1 |
| 3 | 40 | 370（2960 ÷ 8） | 0 |

**IPv6 的差異**：**路由器不分段**；封包過大就**丟棄**並回傳 **ICMPv6「Packet Too Big」**，由**來源端**調整大小或在來源分段（分段標頭）。

      answer: `**(一) 概念：非對稱（公開金鑰）加密**

**RSA**（Rivest、Shamir、Adleman，1977）使用**一對金鑰**：

| 金鑰 | 公開與否 | 作用 |
|---|---|---|
| **公鑰（Public Key）(e, n)** | **公開**給所有人 | 用來**加密**（或驗證簽章） |
| **私鑰（Private Key）(d, n)** | **只有擁有者保管，絕不公開** | 用來**解密**（或產生簽章） |

**關鍵性質**：**用公鑰加密的資料，只有對應的私鑰能解開**；而**從公鑰無法（在可行時間內）推出私鑰**（安全性基於**大整數分解的困難**：已知 n = p × q，要分解出 p、q 很難）。因此**不需要事先私下交換金鑰**，解決了對稱加密的金鑰配發問題。

**(二) 金鑰產生（步驟）**

| 步驟 | 內容 | 範例 |
|---|---|---|
| 1 | 選兩個**大質數 p、q** | p = 3，q = 11 |
| 2 | 計算 **n = p × q** | n = 33 |
| 3 | 計算 **φ(n) = (p − 1)(q − 1)** | φ = 2 × 10 = 20 |
| 4 | 選 **e**，使 1 < e < φ 且 **gcd(e, φ) = 1** | e = 7 |
| 5 | 求 **d**，使 **e × d ≡ 1 (mod φ)** | 7 × 3 = 21 ≡ 1 (mod 20) ⇒ d = 3 |
| 結果 | **公鑰 (e, n) = (7, 33)**；**私鑰 (d, n) = (3, 33)** | |

**(三) 加密與解密**

> **加密**：**C = Mᵉ mod n**（用接收者的公鑰）
> **解密**：**M = Cᵈ mod n**（用接收者的私鑰）

**範例**：M = 4：C = 4⁷ mod 33 = 16384 mod 33 = **16**（16384 = 33 × 496 + 16）；解密 M = 16³ mod 33 = 4096 mod 33 = **4**（4096 = 33 × 124 + 4）✓。

      answer: `**(一) 什麼是 SNMP（5 分）**

**SNMP（Simple Network Management Protocol，簡單網路管理協定）**是**應用層**協定，用來**集中監控與管理網路設備**（路由器、交換器、伺服器、印表機）。

| 元件 | 說明 |
|---|---|
| **管理者（Manager／NMS）** | 運行網管軟體的主機，向設備查詢或下達指令 |
| **代理者（Agent）** | 在被管理設備上蒐集並回應資訊 |
| **MIB（Management Information Base）** | 以樹狀結構定義的**可管理物件**，每個物件有 **OID** |
| **操作** | **GET／GETNEXT／GETBULK**（讀取）、**SET**（修改）、**TRAP／INFORM**（代理者主動通報事件） |

**(二) 傳輸層使用的協定：UDP（5 分）**

> SNMP 使用 **UDP**：代理者埠 **161**（接收查詢）、管理者接收 TRAP 的埠 **162**。

**(三) 為什麼用 UDP 而不是 TCP（10 分）**

| 原因 | 說明 |
|---|---|
| **1. 輕量、負擔小** | UDP **沒有連線建立（三向交握）、確認、重傳、壅塞控制**的成本。網管要**對數百、數千台設備輪詢**，若每次都建立 TCP 連線，**設備的 CPU 與記憶體負擔很大**（網路設備資源有限） |
| **2. 訊息短、一問一答** | SNMP 的**請求／回應都很小**，單一 UDP 資料報就裝得下，不需要 TCP 的串流功能 |
| **3. 網路出問題時仍能運作** | **正是網路壅塞或故障時最需要管理**。UDP 不受壅塞控制限制，可以**立刻送出**；TCP 在網路狀況差時會不斷退避、重傳，反而更慢或連線失敗 |
| **4. 由應用層自己處理可靠性** | 管理者**逾時未收到回應就自己重送請求**，因為輪詢本來就是週期性的，**偶爾遺失一筆不影響**監控；TRAP 則可用 INFORM（需確認）加強 |
| **5. 能支援大量設備與廣播式探索** | 無連線，不需為每台設備維持連線狀態，適合**同時監控大量設備** |
| **6. 設計簡單（Simple）** | 符合 SNMP「簡單」的設計目標 |

**缺點與對策**：UDP **不保證送達、不保證順序**，且易被偽造（SNMPv1/v2c 的社群字串是明文）。對策：**逾時重送**、使用 **SNMPv3**（驗證與加密）、重要告警搭配 **INFORM**。`

| 層級 | 服務模式 | 全名 |

| 最下層 | **IaaS** | Infrastructure as a Service（基礎設施即服務） |

**(二) 三種模式的比較**

| 比較項目 | **IaaS** | **PaaS** | **SaaS** |
|---|---|---|---|
| **提供的內容** | **虛擬化的運算、儲存、網路資源**（虛擬主機、磁碟、頻寬） | **應用程式開發與執行平台**（作業系統、執行環境、資料庫、開發工具） | **完整的應用軟體**，透過網頁或 App 使用 |

| **目標用戶** | **系統管理者、IT 部門** | **軟體開發人員** | **一般終端使用者、企業用戶** |
| **彈性與控制權** | **最高**（可自由安裝與設定） | 中等 | **最低**（僅限軟體提供的功能） |
| **使用難度／技術門檻** | 高 | 中 | **低** |
| **計價方式** | 依資源使用量（CPU 時數、儲存量、流量） | 依平台使用量／開發者人數 | 依使用者數／月費訂閱 |

**(三) 哪一種投資報酬率（ROI）最高：SaaS**

| **風險低** | 不合用可停止訂閱，沒有沉沒成本 |

**對照**：IaaS 雖省下硬體，但仍需自行安裝、設定、維護作業系統與應用程式，投入較多人力；PaaS 要自行開發應用程式，需要開發成本與時間。因此**越往上層（SaaS），用戶投入越少、見效越快，ROI 越高**；但相對地**客製化彈性與控制權最低**，且受限於供應商（鎖定、資料所在地與隱私顧慮）。`

      title: "衰減（Attenuation）的成因與解決方法",
      score: 20,
      question: `「Attenuation」是造成通訊網路錯誤的重要因素之一，請問產生「Attenuation」之關鍵的原因為何？（5 分）以及提出如何解決此項問題？（15 分）`,
      answer: `**(一) 什麼是衰減，及其成因（5 分）**

**衰減（Attenuation）**：訊號在傳輸媒介上傳遞時，**能量隨距離增加而逐漸減弱**，到達接收端時振幅太小，**接收端無法正確判讀**，造成位元錯誤。

> 衰減通常以**分貝（dB）** 表示：**dB = 10 log₁₀(P₂ / P₁)**（P₁ 為輸入功率、P₂ 為輸出功率，衰減時為負值）。

**關鍵原因**

| 原因 | 說明 |
|---|---|
| **1. 媒介本身的電阻（有線）** | 銅線有電阻，訊號能量轉為熱能而損耗；**距離越長損耗越大** |
| **2. 距離** | 無線電波以**距離平方成反比**擴散（自由空間損耗）；光纖也隨距離吸收與散射 |
| **3. 訊號頻率** | **頻率越高，衰減越大**（集膚效應、輻射損耗），所以高頻成分衰減較多，造成訊號**失真** |
| **4. 媒介吸收與散射** | 光纖的材質吸收與瑞利散射；無線訊號被**牆壁、雨、障礙物**吸收、反射、繞射 |
| **5. 連接器與接頭品質** | 接頭、熔接點、彎折造成額外損耗 |

**(二) 解決方法（15 分）**

| 方法 | 說明 |
|---|---|
| **1. 縮短傳輸距離／控制線路長度** | 遵守標準的**最大線長**（如乙太網路雙絞線 100 公尺），超過就要中繼 |
| **2. 使用中繼設備：放大器（Amplifier）與再生器／中繼器（Repeater）** | **類比訊號**用**放大器**把訊號放大（但連同雜訊一起放大）；**數位訊號**用**中繼器**（再生器）**重新整形、再生出乾淨的訊號**，不會累積雜訊。長途光纖每隔一段距離就設置光放大器（如 EDFA）或再生器 |
| **3. 提高發射功率** | 提高傳送端的功率（受法規與裝置限制；無線需考慮干擾） |
| **4. 使用低損耗的傳輸媒介** | 以**光纖**取代銅線（損耗遠低）、使用較粗或品質較好的線材（如更高等級的雙絞線、同軸電纜）、選擇低損耗的光纖波長（1310、1550 nm） |
| **5. 等化（Equalization）** | 對高頻衰減較大造成的失真，在接收端或傳送端以**等化器**補償各頻率的增益差異 |
| **6. 使用較低的頻率或適當的編碼與調變** | 低頻衰減較小；選擇抗衰減的調變，並加入**錯誤偵測與更正碼（FEC）** 容忍少量錯誤 |
| **7. 改善連接與安裝** | 使用良好的接頭、避免過度彎折與劣質熔接 |
| **8. 無線系統：增加基地台／存取點、使用方向性天線、調整位置避開障礙物、使用 MIMO** | 縮短實際距離與減少遮蔽 |

**重點**：衰減使訊號**變小**；**放大器/中繼器**重新補充能量，**更好的媒介與較短距離**從根本減少損耗；數位傳輸的**再生**可以消除累積的雜訊。

**與其他傳輸損傷的區別**：**失真（Distortion）**是各頻率衰減不同造成波形變形；**雜訊（Noise）**是外來干擾（熱雜訊、串音、脈衝雜訊）。三者合稱傳輸損傷。`
    },
    {
      id: "cs3-net-108-5", no: "五", topic: "net", topicName: "資通網路",
      title: "Client/Server 架構中的中介軟體（Middleware）是什麼，以及已有 TCP/IP 為何還需要中介軟體",
      score: 20,
      question: `於 Client/Server 應用架構中，什麼是「中介軟體」（Middleware）？（10 分）此外，我們已有標準的 TCP/IP 通訊協定，為什麼還需要中介軟體，請說明其原因？（10 分）`,
      answer: `**(一) 什麼是中介軟體（10 分）**

**中介軟體（Middleware）**是位於**應用程式與作業系統（或網路）之間**的**軟體層**，為分散式應用程式提供**共同的、標準化的服務與介面**，**隱藏底層的異質性**（不同硬體、作業系統、網路、資料庫與程式語言），使**用戶端與伺服器端的程式能夠更容易地互相溝通與整合**。

\`\`\`
   用戶端應用程式                     伺服器端應用程式
  ┌────────────┐                    ┌────────────┐
  │ 應用程式   │                    │ 應用程式   │
  ├────────────┤   中介軟體服務    ├────────────┤
  │ 中介軟體   │ ←───────────────→ │ 中介軟體   │
  ├────────────┤                    ├────────────┤
  │ 作業系統／網路（TCP/IP）  ←──→  作業系統／網路 │
  └────────────┘                    └────────────┘
\`\`\`

**常見類型與例子**

| 類型 | 例子 |
|---|---|
| **遠端程序呼叫（RPC）／物件請求代理** | Sun RPC、**CORBA**、Java **RMI**、DCOM |
| **資料庫中介軟體** | **ODBC、JDBC** |
| **訊息導向中介軟體（MOM）** | IBM MQ、RabbitMQ、Kafka、JMS |
| **交易處理監視器** | Tuxedo、CICS |
| **應用伺服器／Web 服務** | Tomcat、.NET、**Web Services（SOAP、REST）**、**ESB（企業服務匯流排）** |

**(二) 已有 TCP/IP，為什麼還需要中介軟體（10 分）**

**TCP/IP 只負責「把位元組可靠地搬運到對方」**，屬於**通訊層（傳輸與網路）**；但分散式應用還有許多**TCP/IP 沒有處理的問題**：

| TCP/IP 的限制 | 中介軟體的補強 |
|---|---|
| **只提供位元組串流（socket）**，程式設計師要自己處理連線、封包切割、錯誤處理 | 提供**高階的程式介面**（如「呼叫遠端函式就像呼叫本機函式」的 **RPC／RMI**），**大幅簡化分散式應用程式的撰寫** |
| **不處理資料表示的差異**（位元組順序、整數大小、字元編碼、資料結構不同） | **資料編組與解編組（marshalling）**、標準資料格式（XDR、XML、JSON），**隱藏異質性** |
| **不提供名稱與服務尋找**（只認 IP 與埠號） | **名稱服務、目錄服務、服務登錄與探索**，用名稱找服務而不是固定位址 |
| **不提供交易、安全、負載平衡、容錯等企業需求** | 提供**分散式交易（兩階段提交）**、**認證與授權**、**負載平衡與容錯**、**事件與訊息佇列** |
| **同步、緊耦合**：雙方必須同時在線 | **訊息佇列**提供**非同步、鬆耦合**通訊，一方暫時離線也不遺失訊息 |
| **不管不同平台與語言的互通** | 讓 **Windows／Unix、Java／C／.NET** 等異質系統**互通與整合既有系統（legacy）** |
| **不處理資料庫連線差異** | **ODBC／JDBC** 以統一介面存取不同廠牌的資料庫 |

**結論**：**TCP/IP 解決「資料怎麼送到」**，**中介軟體解決「分散式應用如何簡單、可靠、安全、可擴充地協同工作」**——兩者分屬不同層次，互相補足；有了中介軟體，開發者**專注在業務邏輯**，不必重複解決通訊細節。`
    }
  ]
},

什麼是 VPN？（8 分）`,
      answer: `**(一) P-A-D 模式（12 分）**

**P-A-D 模式**是把一個**應用系統**拆成三個**功能元件**，用來描述「這三部分分別放在哪裡執行」：

| 元件 | 英文 | 功能 |
|---|---|---|
| **P** | **Presentation（表現／展示）** | **使用者介面**：顯示畫面、接收輸入（瀏覽器、App 畫面） |
| **A** | **Application（應用／處理邏輯）** | **商業邏輯與運算處理**（程式、規則、計算） |
| **D** | **Data（資料）** | **資料的儲存與管理**（資料庫、檔案） |

**不同的運算架構，差別就在 P、A、D 各放在哪一端（用戶端／組織內部伺服器／雲端）**：

| 架構 | P（表現） | A（應用） | D（資料） | 說明 |
|---|---|---|---|---|
| **Intranet Computing（企業內部網路運算）** | **用戶端**（使用者電腦的瀏覽器） | **組織內部**的應用伺服器 | **組織內部**的資料庫伺服器 | A、D 都在**企業自己擁有、管理的主機與內部網路**上，用戶透過 Intranet 使用 |
| **Cloud Computing（雲端運算）** | **用戶端**（瀏覽器／行動 App） | **雲端供應商**的資料中心（共享資源池） | **雲端**資料中心的儲存 | A、D 都在**供應商以虛擬化提供、經網際網路存取**的雲端；用戶端只負責顯示 |

**簡單說**：兩者的 **P 都在用戶端**；差別在 **A 與 D 由誰擁有、放在哪裡**——Intranet Computing 放在**組織內部**，Cloud Computing 放在**雲端供應商**，用戶向外**租用**。

（延伸：傳統**單機運算**是 P-A-D 全在本機；**Client/Server** 則把 D（甚至 A）放到伺服器。）

**(二) VPN（8 分）**

**VPN（Virtual Private Network，虛擬私有網路）**：利用**公用網路（如網際網路）**，透過**加密與通道（tunneling）** 技術，建立**像專線一樣安全、私密**的**邏輯連線**，使遠端使用者或分公司能**安全地連回企業內部網路**，而不必租用昂貴的實體專線。

| 項目 | 說明 |
|---|---|
| **核心技術** | **通道（Tunneling）**：把私有封包封裝在公用網路的封包內傳送（如 GRE、L2TP、IPsec）；**加密**確保機密性；**認證**確認身分；**完整性檢查** |
| **常見協定** | **IPsec**、**SSL/TLS VPN**、**OpenVPN**、**WireGuard**、PPTP（已不安全）、L2TP/IPsec |
| **類型** | **遠端存取 VPN**（員工用筆電連回公司）、**站台對站台 VPN**（分公司之間連接） |
| **優點** | **成本低**（利用現有網際網路）、**安全**（加密）、**彈性**（隨時隨地）、可存取內部資源、隱藏真實位址 |
| **缺點** | 效能受網際網路品質影響、加解密增加延遲、設定與金鑰管理較複雜 |
| **與雲端的關係** | 企業常以 VPN 連接**私有雲與公有雲**（混合雲） |`
    },
    {

      title: "Intranet Computing 與 Cloud Computing 的定義與比較；雲端運算的四種佈署模式",

      question: `試回答下列問題：（每小題 10 分，共 20 分）
㈠試定義 Intranet Computing 與 Cloud Computing，並比較其差異性。
㈡試列出 Cloud Computing 之四種主要的佈署模式（Deployment Models）。`,
      answer: `**(一) 定義與比較（10 分）**

**Intranet Computing（企業內部網路運算）**：企業**自行建置並管理**伺服器、軟體與資料，透過**組織內部網路（Intranet）** 提供員工使用的運算模式；資源**專屬於該組織**。

**Cloud Computing（雲端運算）**：透過**網際網路**，以**服務**的形式向用戶提供**可隨需取得、可彈性伸縮、依用量計費的共享運算資源**（伺服器、儲存、應用軟體），資源由**雲端供應商的資料中心**以**虛擬化**技術集中管理。

| 比較項目 | **Intranet Computing** | **Cloud Computing** |
|---|---|---|
| **資源擁有與管理** | **企業自己**購買、建置、維護 | **雲端供應商**擁有與維護，用戶**租用** |
| **存取方式** | **內部網路**（或 VPN）；範圍限於組織內 | **網際網路**，**隨時隨地**以任何裝置存取 |
| **成本模式** | **資本支出（CAPEX）高**：先投入硬體、軟體、機房、人力 | **營運支出（OPEX）**：**依使用量付費（pay-as-you-go）**，初期投入低 |
| **擴充彈性** | **有限**：擴充要採購、安裝、需時間 | **高度彈性、快速伸縮**（幾分鐘增減資源） |
| **資源利用率** | 為尖峰預留容量，**平時閒置浪費** | 多用戶**共享資源池**，利用率高 |
| **維運責任** | 企業 IT 團隊負責更新、備份、資安 | 供應商負責基礎設施維運 |
| **控制權與客製化** | **完全控制**，可高度客製 | 受供應商服務限制 |
| **資料安全與隱私** | 資料在**企業內部**，自行掌控 | 資料在**第三方**，需考慮隱私、法規、**供應商鎖定** |
| **可用性與容錯** | 取決於企業自己的備援能力 | 供應商提供多地備援，通常較高 |
| **適用** | 高度機密、有嚴格法規要求的系統 | 需要彈性、快速上線、成本敏感的應用 |

**(二) 雲端運算的四種佈署模式（10 分）**

| 佈署模式 | 英文 | 說明 | 例子／適用 |
|---|---|---|---|
| **1. 私有雲** | **Private Cloud** | **專供單一組織使用**的雲端，可由組織自己或第三方代管，位於組織內部或專屬機房 | 政府機關、銀行等對安全、法規要求高者；資料與控制權在組織手中 |
| **2. 公有雲** | **Public Cloud** | 由**第三方供應商**擁有並**開放給一般大眾或眾多企業共用**，透過網際網路存取 | AWS、Microsoft Azure、Google Cloud；成本低、彈性高 |
| **3. 社群雲** | **Community Cloud** | **由具有共同關切事項**（任務、安全需求、法規）的**數個組織共同使用與分攤**成本 | 多個政府機關或同業聯盟（如醫療、金融業聯盟）共用 |
| **4. 混合雲** | **Hybrid Cloud** | **結合兩種以上**（通常是**私有雲＋公有雲**）的雲端，彼此以標準技術連結，資料與應用可在其間移動 | 敏感資料放私有雲，尖峰時的運算或一般服務使用公有雲（**雲端爆發 cloud bursting**） |

**選擇的考量**：安全與法規、成本、彈性、資料主權、現有投資。`
    },
    {
      id: "cs3-net-106-3", no: "三", topic: "net", topicName: "資通網路",
      title: "IEEE 802.11 的 AP 與 CSMA/CA 的運作",
      score: 20,
      question: `於 IEEE 802.11 無線區域網路（Wi-Fi）中，什麼是 AP？此外，試定義並說明 CSMA/CA 通訊協定如何運作？（20 分）`,
      answer: `**(一) AP（Access Point，存取點／無線基地台）**

**AP**：802.11 無線區域網路中的**中心設備**，作為**無線用戶端（STA）與有線網路之間的橋接器**。

| 功能 | 說明 |
|---|---|
| **無線與有線的橋接** | 把無線訊框與乙太網路訊框互相轉換，使用戶端能連到區網與網際網路 |
| **提供連線與管理** | 以 **SSID** 廣播（Beacon）、處理用戶的**關聯（Association）、驗證、加密（WPA2／WPA3）**、漫遊 |
| **協調媒介存取** | 在基礎架構模式下，所有資料經過 AP 轉送；也可作為 PCF 的協調者 |
| **架構** | 一個 AP 與其範圍內的用戶構成 **BSS**；多個 AP 以分散系統連接成 **ESS** |

**(二) CSMA/CA（Carrier Sense Multiple Access with Collision Avoidance）**

**定義**：**載波偵測多重存取／碰撞避免**，802.11 的 MAC 協定（**DCF，分散式協調功能**）。**傳送前先偵測頻道是否閒置**，並以**隨機退避**等機制**避免**多個站同時傳送造成碰撞。

**為什麼是「碰撞避免」而非「碰撞偵測（CSMA/CD）」**：無線電**傳送時自己的訊號太強，無法同時聽到別人的訊號**，所以**無法即時偵測碰撞**，只能**事先避免**，並靠 **ACK** 事後確認。另外還有**隱藏節點**問題。

**運作流程**

| 步驟 | 說明 |
|---|---|
| **1. 載波偵測** | 站想傳送時，先**聽頻道**（實體偵測＋虛擬偵測 NAV） |
| **2. 頻道閒置** | 若頻道**閒置達 DIFS（分散式框間間隔）**，可以傳送；若**忙碌**，等到頻道閒置，再等 DIFS |
| **3. 隨機退避（Backoff）** | 頻道由忙變閒後，從**競爭視窗 [0, CW]** 隨機選一個**退避計數值**；**每個空閒時槽倒數 1**，頻道被別人占用時**暫停倒數**；**倒數到 0 才傳送** |
| **4. 傳送訊框** | 傳送資料訊框 |
| **5. 等待 ACK** | 接收端成功收到後，等 **SIFS（短框間間隔，比 DIFS 短）** 立刻回傳 **ACK** |

      question: `網際網路中傳輸層（Transport Layer）之二項主要的通訊協定為何？並說明此二項主要的通訊協定之差異性。（20 分）`,
      answer: `**(一) 兩項主要協定**

> **TCP（Transmission Control Protocol，傳輸控制協定）** 與 **UDP（User Datagram Protocol，使用者資料包協定）**

兩者都提供**端點到端點（process-to-process）** 的通訊，以**埠號（port）** 識別應用程式，位於 **IP 之上**。

**(二) 差異比較**

| 比較項目 | **TCP** | **UDP** |
|---|---|---|
| **連線方式** | **連線導向**：傳資料前要**三向交握**建立連線，結束時**四次揮手**釋放 | **無連線**：不需建立連線，**直接送出資料報** |
| **可靠性** | **可靠**：**序號、確認（ACK）、逾時重傳**，保證資料**不遺失、不重複、依序** | **不可靠**：**盡力而為**，不保證送達、不保證順序，遺失不重傳 |
| **資料單位** | **位元組串流（byte stream）**，沒有訊息邊界 | **資料報（datagram）**，保留訊息邊界 |
| **流量控制** | **有**：滑動視窗（接收視窗 rwnd） | **無** |
| **壅塞控制** | **有**：慢啟動、壅塞避免、快速重傳／恢復（cwnd） | **無**（可能加重壅塞） |
| **標頭大小** | **20 bytes 以上**（序號、確認號、視窗、旗標…） | **8 bytes**（來源埠、目的埠、長度、檢查碼） |
| **速度與負擔** | **較慢、負擔大**（狀態維護、重傳） | **快、負擔小**、延遲低 |
| **傳輸模式** | 只支援**單播（一對一）** | 支援**單播、廣播、多播** |
| **連線狀態** | 兩端必須**維護連線狀態** | **無狀態** |
| **資料順序** | 依序交付（亂序會重組） | 不保證，到達順序可能不同 |
| **典型應用** | **HTTP／HTTPS、FTP、SMTP、SSH、資料庫**等要求完整正確的應用 | **DNS、DHCP、SNMP、VoIP、視訊串流、線上遊戲、TFTP** 等重視**即時性**、可容忍少量遺失的應用 |

**選擇原則**：**要求資料完整正確 ⇒ TCP**；**要求低延遲、短訊息、可自行處理錯誤 ⇒ UDP**（如 QUIC 就是在 UDP 上自建可靠機制）。`

      answer: `**(一) 支援極大數目的主機（4 分）**

| 項目 | IPv4 | IPv6 |
|---|---|---|
| **位址長度** | **32 位元** | **128 位元**（4 倍長） |
| **位址總數** | 2³² ≈ **43 億** | 2¹²⁸ ≈ **3.4 × 10³⁸**（約 340 澗） |

> 即使位址分配**很浪費**（例如每個子網路都用 /64、保留大量空間給未來），仍然綽綽有餘：地球每平方公尺可分到約 **6.7 × 10²³** 個位址。標準的子網路是 **/64**（64 位元的介面識別碼），一個家庭網路就有 2⁶⁴ 個位址。這樣的設計**不必再像 IPv4 一樣精打細算，也不需要 NAT** 來節省位址。

**(二) 降低路由器繞送表的大小（6 分）**

| 改變 | 說明 |
|---|---|
| **階層式位址結構（可聚合的全球單播位址）** | IPv6 位址依**階層**配置：**全球路由字首（ISP 取得）＋子網路 ID＋介面識別碼**。ISP 取得一個大區塊，把其中**較小的區塊分給客戶**，客戶位址都在 ISP 的字首內 |
| **路由聚合（Route Aggregation）** | 外部路由器只需要**一筆代表整個 ISP 的字首**，不必知道每個客戶，**大幅減少骨幹路由表項目數**（IPv4 的路由表有數十萬筆，因為位址分配不連貫） |
| **嚴格的 CIDR 式分配** | 一開始就按聚合原則規劃，避免 IPv4 因零散分配造成的路由表膨脹 |
| **改用 ISP 配發位址**（提供者相依位址） | 有利聚合；換 ISP 要重新編號，IPv6 以**自動重新編號（SLAAC、RA）** 輔助 |

**(三) 簡化標頭，使路由器處理更快（10 分）**

| IPv4 標頭（20 bytes 起，可變長，**12 個基本欄位**＋選項） | IPv6 標頭（**固定 40 bytes**，**8 個欄位**） |
|---|---|
| 版本、**IHL**、服務類型、總長度、**識別碼、旗標、片段偏移**、TTL、協定、**標頭檢查碼**、來源位址、目的位址、**選項（可變）** | 版本、**流量類別（Traffic Class）**、**流標籤（Flow Label）**、**酬載長度**、**下一個標頭（Next Header）**、**跳數限制（Hop Limit）**、來源位址、目的位址 |

**具體的簡化**

| 項目 | IPv4 | IPv6 | 對路由器的好處 |
|---|---|---|---|
| **標頭長度** | **可變**（20～60 bytes，需讀 IHL 才知道） | **固定 40 bytes** | 不必計算標頭長度，**硬體解析更快** |
| **標頭檢查碼（Header Checksum）** | **有**，每經過一個路由器 TTL 變動，**要重新計算** | **取消** | **省去每一跳的計算**（錯誤偵測交給資料鏈結層與傳輸層） |
| **分段（Fragmentation）欄位** | 標頭含識別碼、旗標、片段偏移，**路由器可分段** | **移除**；分段資訊改放在**擴充標頭**，且**只有來源端分段** | **路由器不分段**，處理更簡單 |
| **選項（Options）** | 在基本標頭中，**長度可變** | 改成**擴充標頭（Extension Headers）**，以 **Next Header** 串接，**中間路由器大多不需處理**（只有 Hop-by-Hop 選項要處理） | 路由器只看固定的基本標頭，**略過不相干的資訊** |
| **欄位對齊** | 32 位元對齊但不完全規則 | 以 **64 位元**邊界對齊 | 適合 64 位元處理器 |
| **服務品質** | 服務類型（ToS） | **流量類別＋流標籤**，可**不看內層**就識別同一個流，加速 QoS 處理 | 快速分類 |
| **位址欄位** | 32 位元×2 | 128 位元×2（變大，但整體仍固定、簡單） | — |

**結論**：IPv6 標頭**欄位數少、長度固定、沒有檢查碼、沒有分段**，所以**路由器的轉送處理更快、更容易用硬體實現**；進階功能（IPsec、路由、分段等）放在**擴充標頭**，只在需要時才由終端或特定節點處理。`

      score: 20,
      question: `ping 和 traceroute 常用來檢視主機的網路連線狀態。
㈠請說明 ping 的功能。（4 分）
㈡請說明 ping 如何利用 ICMP（Internet Control Message Protocol）訊息交換達到其功能。（4 分）
㈢請說明 traceroute 的功能。（4 分）
㈣請說明 traceroute 如何利用 ICMP 訊息交換達到其功能。（8 分）`,
      answer: `**(一) ping 的功能（4 分）**

**ping** 用來**測試某台主機是否可以到達（連通性），並量測往返時間（RTT）與封包遺失率**。

| 得到的資訊 | 說明 |
|---|---|
| **可達性** | 有回應表示目的主機在線上，且**路徑雙向都通** |
| **往返延遲（RTT）** | 每個封包的來回時間（最小、平均、最大） |
| **封包遺失率** | 送出與收到的封包數差異，反映線路品質 |
| **TTL 值** | 可推測對方作業系統與大約的跳數 |

**(二) ping 如何利用 ICMP（4 分）**

使用 **ICMP Echo 訊息**（封裝在 IP 封包中）：

| 步驟 | 說明 |
|---|---|
| 1 | 來源主機送出 **ICMP Echo Request（Type 8）**，內含**識別碼、序號、資料**，並記錄送出時間 |
| 2 | 目的主機收到後，立即回傳 **ICMP Echo Reply（Type 0）**，**複製請求的識別碼、序號與資料** |
| 3 | 來源主機收到 Echo Reply，依序號對應請求，**以現在時間減去送出時間 = RTT** |
| 4 | **逾時沒收到** ⇒ 顯示「Request timed out」（遺失）；若路由器回傳 **Destination Unreachable（Type 3）**，表示該目的地或網路不可達 |

**(三) traceroute 的功能（4 分）**

**traceroute**（Windows 為 **tracert**）用來**找出封包從來源到目的地所經過的每一個路由器（路徑）**，並量測**到每一跳的延遲**。

| 用途 | 說明 |
|---|---|
| **顯示完整路徑** | 依序列出每個中繼路由器的 IP 與名稱 |
| **找出瓶頸或故障點** | 看哪一跳延遲突然變大或開始失敗 |
| **了解路由與跨 ISP 的路徑** | 診斷路由迴圈與繞路 |

**(四) traceroute 如何利用 ICMP（8 分）**

**利用 IP 標頭的 TTL（Time To Live）欄位**：每經過一個路由器 TTL 減 1，**減到 0 時路由器丟棄封包並回傳 ICMP Time Exceeded（Type 11）給來源**。

| 步驟 | 說明 |
|---|---|
| **1. TTL = 1** | 來源送出探測封包（UDP 到高埠號，或 ICMP Echo Request），**TTL = 1**。**第 1 個路由器**收到後 TTL 變 0，**丟棄並回傳 ICMP Time Exceeded** ⇒ 來源從回覆的**來源 IP 得知第 1 跳路由器的位址**，並量測 RTT |
| **2. TTL = 2** | 再送 TTL = 2 的封包，**第 2 個路由器**回傳 Time Exceeded ⇒ 得知第 2 跳 |
| **3. 依此類推** | **每次 TTL 加 1**（每個 TTL 通常送 3 個探測封包），逐跳找出所有路由器 |
| **4. 抵達目的地** | 封包終於到達目的主機：若用 **UDP**（埠號是不太可能有服務的高埠號），目的主機回 **ICMP Destination Unreachable（Port Unreachable，Type 3 Code 3）**；若用 **ICMP Echo**，目的主機回 **Echo Reply**。來源收到就知道**已到達目的地**，結束 |
| **5. 逾時** | 某跳沒有回應（防火牆擋掉 ICMP）顯示 \`* * *\`，繼續下一跳 |

**範例**：A → 目的 D，路徑 A → R1 → R2 → R3 → D。TTL=1：R1 回 Time Exceeded；TTL=2：R2 回；TTL=3：R3 回；TTL=4：封包到 D，D 回 Port Unreachable（或 Echo Reply）⇒ 完整路徑為 R1、R2、R3、D。`
    },

      question: `如下圖所示：一路由器（R1）和兩台 Ethernet 交換器（S1 和 S2），連接 4 台主機（A, B, C, D），A 和 B 位於 140.118.17.0/24 子網路，其對外閘道為 140.118.17.1；C 和 D 位於 140.118.30.0/24 子網路，其對外閘道為 140.118.30.1。假設各主機已知其他主機之 IP 地址，但各主機之 ARP 快取都是空的。（圖：A、B 接 S1，S1 接 R1 的 140.118.17.1；R1 的 140.118.30.1 接 S2，S2 接 C、D。A = 140.118.17.5，B = 140.118.17.9，C = 140.118.30.6，D = 140.118.30.8。）
